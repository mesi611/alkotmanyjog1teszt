szubszidiaritás: XIII. Leó pápa","A szubszidiaritást a Quadragesimo anno fogalmazta meg (XI. Piusz)."],["Gerrymandering: Arend Lijphart; szubszidiaritás: XI. Piusz pápa","Lijphart a többségi és konszenzuális demokrácia modelljeiről ismert."],["Gerrymandering: Montesquieu; szubszidiaritás: Johannes Althusius","Nem."]],0],[8,"C","F4. Nevek","Kik képviselték a tankönyv szerint az SZDSZ-t és a KDNP-t a rendszerváltás kerekasztal-tárgyalásain?",[["Tölgyessy Péter (SZDSZ) és Salamon László (KDNP, később alkotmánybíró)","Helyes."],["Tölgyessy Péter (SZDSZ) és Antall József (KDNP, később miniszterelnök)","Antall József az MDF-et képviselte."],["Sólyom László (SZDSZ) és Tölgyessy Péter (KDNP, később alkotmánybíró)","Nem."],["Pozsgay Imre (SZDSZ) és Salamon László (MDF, később alkotmánybíró)","Nem."]],0],[8,"C","F4. Nevek","Mit mondott Deák Ferenc, és mit foglalt össze Nagy Ernő?",[["Deák: a történeti alkotmány a nemzet életéből fejlődött ki; Nagy Ernő: összefoglalta a biztosítékait","Helyes. Deák: „Alkotmányunk történelmi alkotmány, nem egyszerre készült, hanem a nemzet életéből fejlett ki.” Nagy Ernő a biztosítékokat gyűjtötte össze: koronázási hitlevél, adómegállapítási jog, miniszteri felelősség, bírói függetlenség, sajtószabadság."],["Deák: az alkotmányt egyszerre, írásban kell megalkotni; Nagy Ernő: az áprilisi törvények szövegét fogalmazta","Nem."],["Deák: a történeti alkotmányt el kell vetni; Nagy Ernő: a Tripartitum szerzője volt","A Tripartitum Werbőczy műve."],["Deák: a kiegyezés a nemzeti alkotmány sérelme; Nagy Ernő: a koronázási eskü újrafogalmazója","Nem."]],0],[8,"C","F4. Nevek","Kihez kapcsolódik a közjog–magánjog elhatárolás kezdete?",[["Ulpianus, akire Justinianus is hivatkozott az Institúciókban","Helyes. Később Grotius és Althusius is hangsúlyozta az elválasztás szükségességét."],["Papinianus, akit Justinianus a jogi hivatkozások mintaképének tekintett","Nem."],["Hans Kelsen, akire a kontinentális jogtudomány a hierarchiánál hivatkozik","Kelsen a normapiramis elméletéhez kapcsolódik."],["Montesquieu, akinek A törvények szelleméről című műve választotta el a két ágat","Nem."]],0],[9,"T","Történeti alkotmányosság","A magyar alkotmánytörténet tárgyalását a vizsgán célszerű a rendszerváltással kezdeni, mert a korábbi korszakok már nem relevánsak.",false,"Hamis. Az előadó kifejezetten kiemelte, hogy ez gyakori vizsgahiba: a magyar alkotmányosság több mint ezeréves történetéből mintegy 950 évet a történeti alkotmányosság kora tesz ki, és az Alaptörvény is utal rá. A korábbi korszakok jogintézményei megalapozzák a mai működést, ezért legalább vázlatosan érdemes őket bemutatni."],[9,"T","Történeti alkotmányosság","Az 1848-as áprilisi törvények hozták létre az Országgyűlésnek felelős kormányzatot, az első felelős magyar kormány a Batthyány-kormány volt.",true,"Igaz. 1848 áprilisában jött létre az Országgyűlésnek felelős, testületi kormányzat önálló, felelős minisztériumokkal, amelyek beszámolnak az Országgyűlésnek, onnan kerülnek pozícióba, és el is mozdíthatók. Ez a modell lényegében a mai napig él."],[9,"T","Történeti alkotmányosság","Az áprilisi törvények óta az Országgyűlés nem rendi küldöttgyűlés, hanem a nép által választott országgyűlés.",true,"Igaz. Az áprilisi törvények hozták az első választójogi szabályokat, és megszüntették az Országgyűlés rendi küldöttgyűlés jellegét. Ez a feudális alapokról a polgári társadalom és a modern demokrácia felé vezető út mérföldköve."],[9,"T","Történeti alkotmányosság","Az 1867-es kiegyezés után az Osztrák–Magyar Monarchiában közös uralkodó és három közös ügy (a külügy, a hadügy és az ezek finanszírozására szolgáló pénzügy) volt; minden más a két országban függetlenül működött.",true,"Igaz. A Monarchia sajátos államszerkezetet hozott létre: közös uralkodó, három közös ügy, de minden egyéb ügyben a két ország saját felelős kormányzattal és országgyűléssel működött."],[9,"T","Történeti alkotmányosság","A kiegyezés után az Osztrák–Magyar Monarchiában a két országnak közös kormánya és közös országgyűlése volt, amely minden ügyben döntött.",false,"Hamis. Csak az uralkodó és három ügy (külügy, hadügy, ezek pénzügye) volt közös. Minden más ügyben a két ország önálló felelős kormányzattal és országgyűléssel működött."],[9,"T","Történeti alkotmányosság","Az 1222-es Aranybulla, az 1351-es, az ősiség szabályait rögzítő törvény és az 1514-es Werbőczy-féle Hármaskönyv (Tripartitum) a történeti alkotmányosság kiemelt állomásai.",true,"Igaz. Az előadó szerint a vizsgán és a záróvizsgán elég ilyen vázlatosan felsorolni a legfontosabb lépéseket (Szent István Intelmei, Aranybulla, 1351, Hármaskönyv, Rákóczi-szabadságharc, a Habsburg-ház trónfosztása)."],[9,"T","Történeti alkotmányosság","Az Aranybulla ellenállási joga mai továbbélő maradványa például a petíciós jog.",true,"Igaz. Az előadó szerint a középkori ellenállási jognak a mai napig vannak továbbélő maradványai, például a petíciós jogban."],[9,"T","Honosítás","A honosítás nyolcéves magyarországi tartózkodási feltétele minden esetben kötelező, belőle semmilyen esetben nem lehet engedni.",false,"Hamis. A nyolc év csökkenhet öt évre (Magyarországon született vagy kiskorúként került ide), három évre (menekült, magyar állampolgár házastársa, örökbefogadás) és nulla évre (állami érdekből, illetve kedvezményes honosítás)."],[9,"T","Honosítás","A kedvezményes honosításhoz a kérelmezőnek nem kell Magyarországon laknia, elegendő a magyar származás és a nyelvtudás igazolása.",true,"Igaz. A kedvezményes honosítás esetében nincs szükség a magyarországi tartózkodásra és lakóhelyre sem; a magyar származás és a magyar nyelvtudás igazolása elég."],[9,"T","Honosítás","A honosítás feltételei közül a nemzetbiztonsági és közbiztonsági kockázat hiánya, valamint a büntetlen előélet alól felmentés adható, ha a kérelmező indokolja.",false,"Hamis. Az előadó külön hangsúlyozta, hogy a 3. és 4. feltétel (nemzetbiztonság–közbiztonság, illetve büntetlen előélet és büntetőeljárás hiánya) az a kettő, amely alól nem adható felmentés; ezeknek mindig teljesülniük kell."],[9,"T","Honosítás","A honosítás büntetlen előélet feltételénél a magyar jog szerinti büntetlenség számít: ha valakit külföldön olyan cselekmény miatt ítéltek el, amely a magyar Btk. szerint nem bűncselekmény (pl. házasságtörés), az nem akadálya a honosításnak.",true,"Igaz. Nem magyar bíróság ítélete, hanem az számít, hogy a világ bármely pontján olyan cselekmény miatt ítélték-e el, amely a magyar Btk. szerint is bűncselekmény. A házasságtörés nem az, az emberölés viszont igen."],[9,"T","Honosítás","Ha a kérelmezővel szemben külföldön büntetőeljárás folyik, az kizárja a honosítást, mert az eljárás tárgyától függetlenül minden büntetőeljárás akadály.",false,"Hamis. A feltétel a magyar jog szerinti büntetőeljárás alatt állást jelenti: a külföldi eljárás önmagában nem kizáró ok, a Magyarországon folyó viszont az."],[9,"T","Honosítás","Ha a kérelmező a honosítás összes törvényi feltételének megfelel, a köztársasági elnök akkor is megtagadhatja a honosítást.",true,"Igaz. A feltételek teljesítése nem jogot, hanem csak lehetőséget keletkeztet; az állampolgárság szuverenitási kérdés, az állam szabadon dönt, és nincs jogorvoslat. Ha a feltételek nem teljesülnek, biztosan nem lehet honosítani, még akkor sem, ha a köztársasági elnök akarná."],[9,"T","Honosítás","A honosítási kérelmet az Országos Idegenrendészeti Főigazgatósághoz kell benyújtani, a honosításról a végső szót a köztársasági elnök mondja ki.",true,"Igaz. A kérelmet az Országos Idegenrendészeti Főigazgatóságnál kell előterjeszteni; ha a feltételek teljesülnek, a köztársasági elnök dönt a honosításról."],[9,"T","Honosítás","Honosítani csak olyan személyt lehet, aki soha nem volt magyar állampolgár; aki korábban az volt, azt visszahonosítják.",true,"Igaz. A honosításnál nagyon fontos kitétel, hogy a kérelmező nem magyar állampolgár, és soha nem is volt az. Aki korábban az volt, az a visszahonosítás körébe tartozik."],[9,"T","Honosítás","A Magyarországon született külföldi szülők gyermeke a születéssel automatikusan magyar állampolgár lesz.",false,"Hamis. Főszabály a ius sanguinis (vérségi elv): a gyermek a szülei állampolgárságát kapja. A Magyarországon születés csupán azt eredményezi, hogy a honosításnál a várakozási idő nyolcról öt évre csökken (példa: a kecskeméti Mercedes-gyárban dolgozó német szülők gyermeke)."],[9,"T","Honosítás","Az állampolgársági vizsga alól mentesül a kiskorú, a 65 év feletti személy, aki magyar nyelvű felsőoktatási végzettséggel rendelkezik, valamint a házastársi jogcímen honosított személy.",true,"Igaz. Mind a négy csoport mentesül az állampolgársági vizsga alól (a magyar nyelvű felsőoktatási végzettséget akár külföldön is megszerezhették)."],[9,"T","Honosítás","Az állampolgársági vizsgát magyar nyelven kell letenni állampolgársági ismeretekből (pl. nemzeti jelképek, Himnusz, alapvető történeti események).",true,"Igaz. Az előadó szerint nagyjából az a szint, mint amit a hallgatóktól várnak a félév végén, talán kevesebb anyagból."],[9,"T","Állampolgárság","A nemzetközi elvek szerint senkit nem lehet megfosztani az állampolgárságától, és a hontalanság visszaszorítandó.",true,"Igaz. Ez két alapvető nemzetközi elv. Az előadó példaként említette, hogy Szlovákia egy időben megfosztotta állampolgárságától azt, aki magyar állampolgárságot is szerzett, ami ellentétes a nemzetközi elvvel."],[9,"T","Állampolgárság","A nemzetközi jog szempontjából a többes állampolgárság súlyosabb probléma, mint a hontalanság, ezért azt kell elsősorban visszaszorítani.",false,"Hamis. Az előadó szerint a többes állampolgárság a legkevésbé zavaró; az a baj, ha valaki egy államhoz sem tartozik. Ezért a hontalanság ellen kell küzdeni."],[9,"T","Állampolgárság","A családegység elve szerint arra kell törekedni, hogy egy család tagjainak közös állampolgársága legyen; ez a nemzeti állampolgársági szabályozás kialakítását is befolyásolja.",true,"Igaz. A családegység elve nemzetközi kötelezettség, amely az állampolgársági szabályozásra is hatással van."],[9,"T","Állampolgárság","Az inkubátorban talált gyermek alkotmányjogi szempontból magyar állampolgárnak minősül, de ez megdönthető vélelem: ha kiderül, hogy a vérségi elv alapján nem illetné meg, az állampolgárságot elveszíti.",true,"Igaz. A talált gyermek magyar állampolgársága vélelem; ha utóbb kiderülnek a szülők, és a vérségi elv szerint a gyermek nem lenne magyar állampolgár, a vélelem megdől."],[9,"T","Állampolgárság","A menekült egyéni elbírálás alapján, tartós védelmet kap, a menedékes védelme viszont kollektív és ideiglenes.",true,"Igaz. A menekült egyéni és tartós, a menedékes kollektív és ideiglenes jogállás. A migráns nem jogi kategória, és nincs alanyi jog a befogadására."],[9,"T","Jogforrás és hierarchia","A jog fogalma azonos azzal, hogy minden ember számára kötelező magatartási szabály.",false,"Hamis. Ez a norma fogalma. A klasszikus meghatározás szerint a jog a jó és a méltányos művészete, a jogászság pedig mérlegelés eredményeként megvalósuló döntéshozatal."],[9,"T","Jogforrás és hierarchia","A sarkalatos törvény a jogforrási hierarchiában az egyszerű törvény felett áll, mert elfogadásához nagyobb többség kell.",false,"Hamis. A sarkalatos törvény elfogadásához nagyobb többség kell, de hierarchiában nem áll az egyszerű törvény fölött. Nincs olyan, hogy a sarkalatos törvény erősebb a sima törvénynél."],[9,"T","Jogforrás és hierarchia","Az Alaptörvény nem sarkalatos törvényekről, hanem sarkalatos tárgykörökről beszél, ezért előfordulhat, hogy egy törvénynek csak egy része igényel sarkalatos többséget.",true,"Igaz. Vannak teljes egészében sarkalatos törvények (pl. a választójogi törvény, az Alkotmánybíróságról szóló törvény), de a salátatörvényeknél gyakori, hogy csak egy rész sarkalatos."],[9,"T","Jogforrás és hierarchia","A sarkalatos törvény elfogadásához a jelen lévő országgyűlési képviselők kétharmadának szavazata szükséges.",true,"Igaz. A sarkalatos többséghez a jelen lévő képviselők kétharmada kell. Az alkotmányos többség ennél erősebb: az összes képviselő kétharmada."],[9,"T","Jogforrás és hierarchia","A legtöbb rendelet ma Magyarországon miniszteri rendelet; a miniszterelnöki rendelet elméletileg létezik, és a miniszteri rendelettel egy szinten áll.",true,"Igaz. Az Alaptörvény T) cikke szerint a kormányrendeletek után a miniszteri és a miniszterelnöki rendeletek következnek, ugyanazon a szinten."],[9,"T","Jogforrás és hierarchia","Egy kormányrendeletet miniszteri rendelet is módosíthat, ha tartalmilag nem ellentétes vele.",false,"Hamis. Jogszabályt csak azonos vagy magasabb szintű jogszabály módosíthat vagy helyezhet hatályon kívül. Kormányrendeletet tehát csak kormányrendelet vagy törvény módosíthat, miniszteri rendelet nem."],[9,"T","Jogforrás és hierarchia","Törvénnyel hatályon kívül lehet helyezni miniszteri rendeletet.",true,"Igaz. A törvény a hierarchiában magasabb szinten áll, ezért miniszteri rendeletet is módosíthat vagy hatályon kívül helyezhet."],[9,"T","Jogforrás és hierarchia","Alacsonyabb szintű jogszabály megismételheti a magasabb szintű jogszabály magatartási szabályát, mert ezzel erősíti annak érvényesülését.",false,"Hamis. A hierarchiából fakadó követelmény (amelyet a Jat., a 2010. évi CXXX. törvény is megerősít): alacsonyabb szintű normában nem lehet megismételni a magasabb szintű normában megjelenő magatartási szabályt."],[9,"T","Érvényesség","A norma érvényességének négy követelménye: a felhatalmazott szerv alkotta meg, az előírt eljárásban született, illeszkedik a jogforrási hierarchiába, és kihirdették.",true,"Igaz. Az előadó szerint ez az a rész, amit tényleg tudni kell: aki nem tudja, azt egészen biztosan megbuktatják."],[9,"T","Érvényesség","Ha a miniszteri rendeletet nem az a miniszter adta ki, aki a felhatalmazást kapta, a rendelet ettől automatikusan érvénytelen, az Alkotmánybíróság döntésére nincs szükség.",false,"Hamis. Az érvényesség mellett vélelem szól. A hibás rendelet addig érvényesnek tekintendő, amíg az Alkotmánybíróság ki nem mondja az érvénytelenségét. Ez a tartalmi érvénytelenségre (hierarchiába illeszkedés) is igaz."],[9,"T","Érvényesség","A jogszabályok nyilvánosságra hozatala érvényességi követelmény, ezért ezt kihirdetésnek nevezzük; a többi norma (pl. jogegységi határozat, közjogi szervezetszabályozó eszköz) nyilvánosságra hozatala közzététel.",true,"Igaz. Mindkettő a jogbiztonságot szolgálja, de a kihirdetés hiánya a jogszabályt érvénytelenné teszi, a közzététel hiánya a többi normát nem."],[9,"T","Érvényesség","Az önkormányzati rendeletet a Magyar Közlönyben kell kihirdetni, más módon nem lehet.",false,"Hamis. Az önkormányzati rendeletet helyben szokásos módon hirdetik ki (hirdetőtábla, hivatalos honlap, akár kidoboltatás). A Magyar Közlöny a központi jogszabályoké."],[9,"T","Érvényesség","Ha az eljárási szabályokat megsértve fogadnak el egy normát (pl. sarkalatos törvényt egyszerű többséggel), az közjogi érvénytelenséget eredményez.",true,"Igaz. Az eljárási szabály megsértése alapból érvénytelenséget okoz; ezt hívjuk közjogi érvénytelenségnek."],[9,"T","Jelképek","A nemzeti jelképek, azaz a Himnusz, a zászló és a címer, az Alaptörvény Alapvetés fejezetében szerepelnek; használatukat törvény szabályozza, és büntetőjogi védelem alatt állnak.",true,"Igaz. A nemzeti jelképek a jellineki triász kapcsán kerültek elő; az előadó kiemelte, hogy ez általános iskolai tananyag, ezért a vizsgán nem szabad belekeveredni ilyen hibákba."],[9,"R","Történeti alkotmányosság","A kiegyezés közös ügyei a külügy, a hadügy és ezek finanszírozására szolgáló pénzügy voltak.","Az áprilisi törvények óta Magyarországon az Országgyűlésnek felelős kormányzat működik.","B","Igaz.","Igaz.","Mindkét állítás igaz, de egymással nincs ok-okozati kapcsolatban: az egyik az 1867-es államszerkezetről, a másik az 1848-as kormányzati modellről szól."],[9,"R","Történeti alkotmányosság","Az 1848-as áprilisi törvényekkel jött létre az első felelős magyar kormány, a Batthyány-kormány.","A Batthyány-kormány nem az Országgyűlésnek, hanem az uralkodónak tartozott beszámolási kötelezettséggel.","C","Igaz.","Hamis. A felelős kormányzat lényege, hogy az Országgyűlésnek számol be, onnan kerül pozícióba, és el is mozdítható.","Az első állítás igaz, a második hamis, ezért C."],[9,"R","Történeti alkotmányosság","Az Aranybulla 1514-ben született.","A Werbőczy-féle Hármaskönyv (Tripartitum) 1514-ben született.","D","Hamis. Az Aranybulla 1222-ből való.","Igaz.","Az első állítás hamis (1222), a második igaz, ezért D."],[9,"R","Történeti alkotmányosság","A magyar alkotmánytörténetet a rendszerváltással kell kezdeni a vizsgán.","A történeti alkotmányosság kora nagyjából 950 évet tesz ki a magyar alkotmányosság ezeréves történetéből.","D","Hamis. Pont ezt a hibát emelte ki az előadó: nem a rendszerváltással kell kezdeni.","Igaz.","Az első állítás hamis, a második igaz, ezért D. (A második állítás éppen azt mutatja, miért hiba a rendszerváltással kezdeni.)"],[9,"R","Történeti alkotmányosság","Az Aranybulla (1222) rögzítette az ellenállási jogot.","Az ősiség szabályait az 1351-es törvény rögzítette.","B","Igaz.","Igaz.","Mindkettő igaz, de két különböző történeti állomásról szólnak, ok-okozati kapcsolat nélkül."],[9,"R","Honosítás","A köztársasági elnök a honosítást akkor is megtagadhatja, ha a kérelmező minden feltételnek megfelel.","Az állampolgárság megszerzése nem alanyi jog, hanem csak lehetőség, az államok szabadon, szuverén módon döntenek róla.","A","Igaz.","Igaz.","A második állítás magyarázza az elsőt: mivel a feltételek teljesítése nem jogot keletkeztet, és az állampolgárság szuverenitási kérdés, a köztársasági elnök megtagadhatja a honosítást. Ezért A."],[9,"R","Honosítás","A honosítás nemzetbiztonsági feltétele alól nem adható felmentés.","Az állampolgársági vizsga alól a 65 év feletti személy mentesül.","B","Igaz.","Igaz.","Mindkét állítás igaz, de egymással nincs ok-okozati kapcsolatban: az egyik a nem mellőzhető feltételekről, a másik a vizsgamentességről szól."],[9,"R","Honosítás","A honosítás büntetlenségi feltétele a magyar jog szerinti büntetlenséget jelenti.","Akit külföldön házasságtörés miatt ítéltek el, az emiatt nem honosítható.","C","Igaz.","Hamis. A házasságtörés a magyar jog szerint nem bűncselekmény, ezért nem akadálya a honosításnak.","Az első állítás igaz, a második hamis, ezért C."],[9,"R","Honosítás","A honosítás nyolcéves várakozási ideje semmilyen esetben nem csökkenhet.","Állami érdekből történő honosításnál legalább három év szükséges.","E","Hamis. Csökkenhet öt, három, sőt nulla évre is.","Hamis. Állami érdekből (pl. sportolónál) a várakozási idő nulla év.","Mindkét állítás hamis, ezért E."],[9,"R","Honosítás","A Magyarországon született külföldi szülők gyermeke nem lesz automatikusan magyar állampolgár.","Magyarországon születés esetén a honosításhoz elég öt év, a nyolc helyett.","B","Igaz. Főszabály a ius sanguinis.","Igaz.","Mindkét állítás igaz, de nem ok-okozati kapcsolat áll közöttük: az első az állampolgárság keletkezéséről, a második a honosítási várakozási időről szól."],[9,"R","Állampolgárság","A családegység elve szerint arra kell törekedni, hogy a család tagjai különböző állampolgárságúak legyenek.","A menekült jogállása kollektív és ideiglenes.","E","Hamis. A családegység elve éppen a közös állampolgárságra törekvést jelenti.","Hamis. Ez a menedékesre jellemző; a menekült egyéni és tartós védelmet kap.","Mindkét állítás hamis, ezért E."],[9,"R","Állampolgárság","A menekült egyéni elbírálás alapján tartós védelmet kap.","A migráns jogi kategória, ezért az állam köteles befogadni.","C","Igaz.","Hamis. A migráns nem jogi kategória, és nincs alanyi jog a befogadásra.","Az első állítás igaz, a második hamis, ezért C."],[9,"R","Állampolgárság","A nemzetközi elvek szerint senkit nem lehet megfosztani az állampolgárságától.","Szlovákia egy időszakban megfosztotta állampolgárságától azt, aki magyar állampolgárságot is szerzett.","B","Igaz.","Igaz. Ez sértette a nemzetközi elvet.","Mindkét állítás igaz, de a második nem következménye az elsőnek, hanem éppen azt sértő példa. Ok-okozati kapcsolat nincs közöttük, ezért B."],[9,"R","Jogforrás és hierarchia","A kormányrendeletet miniszteri rendelet nem módosíthatja és nem helyezheti hatályon kívül.","Jogszabályt csak azonos vagy magasabb szintű jogszabály módosíthat vagy helyezhet hatályon kívül.","A","Igaz.","Igaz.","A második állítás a hierarchiából fakadó általános szabály, amelyből az első közvetlenül következik: a miniszteri rendelet alacsonyabb szintű, mint a kormányrendelet. Ezért A."],[9,"R","Jogforrás és hierarchia","A sarkalatos törvény a jogforrási hierarchiában az egyszerű törvény felett áll.","A sarkalatos törvény elfogadásához a jelen lévő képviselők kétharmadának szavazata szükséges.","D","Hamis. A sarkalatos törvény nincs hierarchiában az egyszerű törvény felett.","Igaz.","Az első állítás hamis, a második igaz, ezért D."],[9,"R","Jogforrás és hierarchia","A legtöbb rendelet ma Magyarországon miniszteri rendelet.","A miniszterelnöki rendelet elméletileg nem létezik.","C","Igaz.","Hamis. A miniszterelnöki rendelet elméletileg létezik, és a miniszteri rendelettel egy szinten áll (a gyakorlatban alig használt).","Az első állítás igaz, a második hamis, ezért C."],[9,"R","Jogforrás és hierarchia","Az Alaptörvény sarkalatos tárgykörökről rendelkezik, nem sarkalatos törvényekről.","Egy törvénynek lehet csak egy része sarkalatos.","A","Igaz.","Igaz.","Mivel az Alaptörvény tárgykörökhöz köti a sarkalatosságot, ezért fordulhat elő, hogy egy törvénynek csak az a rendelkezése sarkalatos, amely ilyen tárgykört szabályoz. Ezért A."],[9,"R","Érvényesség","A jogszabályok nyilvánosságra hozatala érvényességi követelmény.","Ezért nevezzük a jogszabályok nyilvánosságra hozatalát kihirdetésnek, a többi norma esetén pedig közzétételnek.","A","Igaz.","Igaz.","Az előadó szerint éppen azért van két külön fogalom, mert a jogszabályoknál a nyilvánosságra hozatal érvényességi feltétel (kihirdetés), a többi normánál nem (közzététel). Ezért A."],[9,"R","Érvényesség","Ha a belügyminiszter adja ki az igazságügyi miniszter felhatalmazása alapján készült rendeletet, az automatikusan, bírói vagy alkotmánybírósági döntés nélkül is érvénytelen.","Az érvényesség vélelmét az Alkotmánybíróság döntheti meg.","D","Hamis. Az érvényesség mellett vélelem szól, ezért addig érvényes, amíg az Alkotmánybíróság ki nem mondja az érvénytelenséget.","Igaz.","Az első állítás hamis, a második igaz, ezért D."],[9,"R","Érvényesség","A jogszabályokat kihirdetni nem kötelező, elegendő, ha közzéteszik őket.","A közjogi szervezetszabályozó eszközöket kihirdetik, mert érvényességi követelmény.","E","Hamis. A jogszabályoknál a kihirdetés érvényességi követelmény.","Hamis. A közjogi szervezetszabályozó eszközöket közzéteszik, mert ott a nyilvánosságra hozatal nem érvényességi követelmény.","Mindkét állítás hamis, ezért E."],[9,"R","Érvényesség","Az eljárási szabály megsértése közjogi érvénytelenséget eredményez.","Az érvényesség négy követelménye közül a felhatalmazott szerv általi megalkotás az első.","B","Igaz.","Igaz.","Mindkét állítás igaz, de nem ok-okozati kapcsolatban, hanem két különböző követelményről szólnak."],[9,"C","Honosítás","Melyik esetben csökken a honosítás várakozási ideje háromévre?",[["Ha a kérelmező menekült, házastársa magyar állampolgár, vagy magyar állampolgár örökbefogadási kapcsolatban áll vele","Helyes. Ezekben az esetekben három évre csökken a nyolc év."],["Ha a kérelmező Magyarországon született, vagy legalább az egyik nagyszülője magyar állampolgár volt","Magyarországon születés esetén öt évre csökken a nyolc év."],["Ha a kérelmező állami érdekből honosítandó, például nemzetközileg elismert sportoló vagy tudós","Állami érdekből történő honosításnál nulla évre csökken a várakozási idő."],["Ha a kérelmező elmúlt 65 éves, vagy magyar nyelvű felsőoktatási végzettséget szerzett","Ezek az állampolgársági vizsga alóli mentességhez kapcsolódnak, nem a tartózkodási időhöz."]],0],[9,"C","Honosítás","Melyik két honosítási feltétel alól NEM adható felmentés?",[["A büntetlen előélet és büntetőeljárás hiánya, valamint a nemzetbiztonsági–közbiztonsági kockázat hiánya","Helyes. Ezeknek mindig teljesülniük kell."],["A magyarországi tartózkodási idő és a megélhetés biztosítottságának igazolása","Ezek alól van kivétel (pl. kedvezményes és állami érdekből történő honosítás)."],["A megélhetés biztosítottságának igazolása és az állampolgársági vizsga letétele","Mindkét feltétel alól vannak kivételek."],["Az állampolgársági vizsga letétele és a magyarországi tartózkodási idő teljesítése","Mindkettő alól van kivétel."]],0],[9,"C","Honosítás","Ki NEM mentesül az állampolgársági vizsga alól?",[["A 40 éves kérelmező, aki nem végzett magyar nyelvű felsőoktatásban, és nem házastársi jogcímen kér honosítást","Helyes. Neki vizsgáznia kell."],["A 16 éves kiskorú kérelmező, akinek a honosítását a szülei is együtt kérik mellette","A kiskorú mentesül."],["A 70 éves kérelmező, aki nyolc éve megszakítás nélkül Magyarországon él, és megélhetését igazolja","A 65 év feletti mentesül."],["A 35 éves kérelmező, aki külföldön szerzett magyar nyelvű felsőfokú egyetemi diplomát","Akinek magyar nyelvű felsőoktatási végzettsége van, akár külföldön szerezte, mentesül."]],0],[9,"C","Állampolgárság","Mi a különbség a honosítás és a visszahonosítás között?",[["Honosítást az kérhet, aki korábban nem volt magyar állampolgár; visszahonosítást az, aki korábban az volt","Helyes. Az előélet (volt-e korábban állampolgár) számít."],["A honosítást a köztársasági elnök, a visszahonosítást a belügyminiszter engedélyezi az eljárásban","Mindkettőnél ugyanaz a döntési rend: az állampolgárságot a köztársasági elnök adja."],["A honosítás csak külföldről, a visszahonosítás csak Magyarországról nyújtható be a hatóságnál","Nem a benyújtás helye a különbség."],["A honosítás a kiskorúakra, a visszahonosítás pedig kizárólag a nagykorúakra vonatkozik","Nem a kor a különbség."]],0],[9,"C","Történeti alkotmányosság","Melyik NEM a kiegyezés (1867) három közös ügye közül?",[["Az igazságügy és a bírósági szervezet működtetése","Helyes: ez nem volt közös ügy."],["A külügy, vagyis a diplomácia és a külképviseletek","Közös ügy volt."],["A hadügy, vagyis a közös hadsereg fenntartása","Közös ügy volt."],["A külügy és hadügy költségeit fedező pénzügy","Közös ügy volt."]],0],[9,"C","Jogforrás és hierarchia","Melyik NEM tartozik a norma érvényességének négy követelménye közé?",[["A tartalmát a lakosság többsége népszerűnek tartsa","Helyes: a népszerűség nem érvényességi követelmény."],["A norma megalkotására felhatalmazott szerv alkossa meg","Érvényességi követelmény."],["A megalkotás során az előírt eljárást be kell tartani","Érvényességi követelmény."],["A norma illeszkedjen a jogforrási hierarchiába","Érvényességi követelmény."]],0],[9,"C","Érvényesség","Mit jelent az, hogy az érvényesség mellett vélelem szól?",[["A kihirdetett jogszabályt érvényesnek kell tekinteni, amíg az Alkotmánybíróság az érvénytelenségét ki nem mondja","Helyes."],["A jogszabályt csak akkor lehet alkalmazni, ha a bíróság előzetesen megállapította az érvényességét","Nem: alkalmazható, amíg az Alkotmánybíróság nem dönt másképp."],["A hibás eljárásban elfogadott jogszabály a megalkotásának pillanatától kezdve automatikusan érvénytelen","Nem: a vélelmet meg kell dönteni."],["A vélelem csak a törvényekre vonatkozik, a rendeletek érvényességét mindig vizsgálni kell","Nem: minden jogszabályra vonatkozik."]],0],[9,"C","Jogforrás és hierarchia","Mi a klasszikus meghatározás szerint a jog?",[["A jó és a méltányos művészete, ahogy Celsus meghatározta","Helyes."],["A legfőbb államhatalom által kikényszerített parancsok összessége","Nem a klasszikus meghatározás."],["Az általános érvényű magatartási szabályok rendszere","Ez inkább a norma fogalma."],["A társadalmi együttélés alapvető erkölcsi szabályainak összessége","Ez az erkölcs meghatározása."]],0],[9,"C","Állampolgárság","Mit jelent a menedékes jogállás?",[["Tömeges beáramláskor adott kollektív és ideiglenes védelem","Helyes."],["Egyéni elbírálás alapján, tartósan nyújtott védelem","Ez a menekült."],["Automatikus magyar állampolgárság három év után","Nem."],["Alanyi jog a befogadásra bármely migránsnak","Migránsnak nincs ilyen joga."]],0],[9,"C","Állampolgárság","Mi igaz a Magyarországon talált, inkubátorban elhelyezett gyermek állampolgárságára?",[["Magyar állampolgárnak minősül, de ez megdönthető vélelem","Helyes."],["Hontalan marad, amíg a származását nem tisztázzák","Nem: a hontalanságot vissza kell szorítani."],["Csak a gyámhatóság kérelmére honosítható később","Nem."],["A szülei külföldi állampolgársága mindig megilleti","A szülők ismeretlenek."]],0]];

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var Q = RAW.map(function (a) {
    var q = { ch: a[0], t: a[1], sec: a[2] };
    if (q.t === "C") { q.text = a[3]; q.opts = a[4]; q.ans = a[5]; }
    else if (q.t === "T") { q.text = a[3]; q.ans = a[4]; q.ex = a[5]; }
    else { q.s1 = a[3]; q.s2 = a[4]; q.ans = a[5]; q.e1 = a[6]; q.e2 = a[7]; q.er = a[8]; }
    q.key = hash(q.t + (q.text || q.s1) + (q.s2 || ""));
    return q;
  });

  /* tárolás: csak kényelmi funkció, hiányában is működik */
  var store = { prog: {}, hist: [] };
  function load() { try { var s = JSON.parse(localStorage.getItem("alk-zh-v1")); if (s && s.prog) store = s; } catch (e) {} }
  function save() { try { localStorage.setItem("alk-zh-v1", JSON.stringify(store)); } catch (e) {} }
  load();
  function record(q, ok) {
    var p = store.prog[q.key] || { ok: 0, bad: 0, last: "" };
    if (ok) p.ok++; else p.bad++;
    p.last = ok ? "ok" : "bad";
    store.prog[q.key] = p; save();
  }

  var app = document.getElementById("app");
  var S = null; // futó munkamenet
  var filt = { ch: {}, t: { C: true, T: true, R: true }, st: "all", n: "all" };
  var confirmReset = false;

  function isCorrect(item) {
    var q = item.q, a = item.answer;
    if (a === null || a === undefined) return false;
    if (q.t === "C") return item.order[a] === q.ans;
    return a === q.ans;
  }

  /* ---------- kezdőlap ---------- */
  function pool() {
    return Q.filter(function (q) {
      if (!filt.t[q.t]) return false;
      var anyCh = Object.keys(filt.ch).some(function (k) { return filt.ch[k]; });
      if (anyCh && !filt.ch[q.ch]) return false;
      var p = store.prog[q.key];
      if (filt.st === "new" && p) return false;
      if (filt.st === "bad" && !(p && p.last === "bad")) return false;
      return true;
    });
  }
  function home() {
    S = null;
    var seen = 0, okc = 0, badc = 0;
    Q.forEach(function (q) { var p = store.prog[q.key]; if (p) { seen++; if (p.last === "ok") okc++; else badc++; } });
    var cnt = { C: 0, T: 0, R: 0 }; Q.forEach(function (q) { cnt[q.t]++; });
    var p = pool();
    var h = '<header><div class="eyebrow">Alkotmányjog I. · PPKE</div><h1>ZH-gyakorló</h1>' +
      '<p class="muted ui">' + Q.length + ' kérdés a tankönyvből és az előadásokból: ' + cnt.C + ' karikázós, ' + cnt.T + ' igaz–hamis, ' + cnt.R + ' relációanalízis. Minden válasz után megmagyarázza, miért jó vagy rossz.</p></header>';

    h += '<section class="box"><h2>ZH-szimuláció</h2>' +
      '<p>' + ZH.total + ' kérdés vegyesen (' + ZH.mix.C + ' karikázós, ' + ZH.mix.T + ' igaz–hamis, ' + ZH.mix.R + ' relációanalízis), kérdésenként 1 pont. A magyarázatot csak a beadás után látod, mint élesben.</p>' +
      '<div class="passline"><span>Összesen <b>' + ZH.total + ' pont</b></span><span>Ponthatár: <b>' + ZH.pass + ' pont</b> (70%)</span></div>' +
      '<div class="row"><button class="btn" id="startZh">ZH indítása</button></div>' +
      lastScores() + '</section>';

    h += '<section class="box"><h2>Gyakorlás azonnali magyarázattal</h2>' +
      '<div class="fieldline"><span class="cap">Témakör</span><div class="chips" id="chChips">';
    Object.keys(CH).forEach(function (k) {
      h += '<button class="chip" data-ch="' + k + '" aria-pressed="' + (!!filt.ch[k]) + '">' + k + '. ' + esc(CH[k]) + '</button>';
    });
    h += '</div><span class="muted small ui">Ha egyiket sem jelölöd, minden témakör szerepel.</span></div>' +
      '<div class="fieldline"><span class="cap">Kérdéstípus</span><div class="chips">';
    ["C", "T", "R"].forEach(function (t) { h += '<button class="chip" data-t="' + t + '" aria-pressed="' + filt.t[t] + '">' + TYPE[t] + '</button>'; });
    h += '</div></div><div class="row">' +
      '<div class="fieldline"><label class="cap" for="stSel">Melyek jöjjenek</label><select id="stSel">' +
      opt("all", "Mind", filt.st) + opt("new", "Csak amit még nem láttam", filt.st) + opt("bad", "Csak amit utoljára elrontottam", filt.st) + '</select></div>' +
      '<div class="fieldline"><label class="cap" for="nSel">Hány kérdés</label><select id="nSel">' +
      opt("all", "Az összes", filt.n) + opt("20", "20", filt.n) + opt("50", "50", filt.n) + '</select></div></div>' +
      '<div class="row"><button class="btn" id="startPr"' + (p.length ? "" : " disabled") + '>Gyakorlás indítása (' + p.length + ' kérdés)</button></div></section>';

    h += '<section class="box"><h2>Haladásod</h2><div class="stats">' +
      '<div class="stat"><b>' + seen + ' / ' + Q.length + '</b><span class="muted ui small">kérdést láttál</span></div>' +
      '<div class="stat"><b>' + okc + '</b><span class="muted ui small">utoljára jó volt</span></div>' +
      '<div class="stat"><b>' + badc + '</b><span class="muted ui small">utoljára rossz volt</span></div></div>' +
      '<p class="muted small ui">A haladás csak ebben a böngészőben marad meg.</p>' +
      (confirmReset ? '<div class="row"><span class="ui">Biztosan törlöd a haladásodat?</span><button class="btn" id="resetYes">Igen, törlöm</button><button class="btn ghost" id="resetNo">Mégsem</button></div>'
        : '<div><button class="link" id="resetBtn">Haladás törlése</button></div>') + '</section>';
    app.innerHTML = h;

    document.getElementById("startZh").onclick = startZh;
    var sp = document.getElementById("startPr"); sp.onclick = startPractice;
    app.querySelectorAll("[data-ch]").forEach(function (b) { b.onclick = function () { filt.ch[b.dataset.ch] = !filt.ch[b.dataset.ch]; home(); }; });
    app.querySelectorAll("[data-t]").forEach(function (b) { b.onclick = function () { filt.t[b.dataset.t] = !filt.t[b.dataset.t]; home(); }; });
    document.getElementById("stSel").onchange = function (e) { filt.st = e.target.value; home(); };
    document.getElementById("nSel").onchange = function (e) { filt.n = e.target.value; home(); };
    var rb = document.getElementById("resetBtn"); if (rb) rb.onclick = function () { confirmReset = true; home(); };
    var ry = document.getElementById("resetYes"); if (ry) ry.onclick = function () { store = { prog: {}, hist: [] }; save(); confirmReset = false; home(); };
    var rn = document.getElementById("resetNo"); if (rn) rn.onclick = function () { confirmReset = false; home(); };
  }
  function opt(v, label, cur) { return '<option value="' + v + '"' + (cur === v ? " selected" : "") + '>' + label + '</option>'; }
  function lastScores() {
    if (!store.hist.length) return "";
    var s = store.hist.slice(-5).reverse().map(function (r) { return '<span class="pill ' + (r.s >= ZH.pass ? "ok" : "bad") + '">' + r.s + ' / ' + ZH.total + '</span>'; }).join(" ");
    return '<div class="row"><span class="muted ui small">Utolsó ZH-d:</span> ' + s + '</div>';
  }

  /* ---------- munkamenet ---------- */
  function makeItem(q) {
    var it = { q: q, answer: null, revealed: false };
    if (q.t === "C") it.order = shuffle([0, 1, 2, 3]);
    return it;
  }
  function pick(type, n, exclude) {
    return shuffle(Q.filter(function (q) { return q.t === type; })).slice(0, n);
  }
  function startZh() {
    var qs = pick("C", ZH.mix.C).concat(pick("T", ZH.mix.T), pick("R", ZH.mix.R));
    S = { mode: "zh", items: shuffle(qs).map(makeItem), i: 0, done: false };
    render();
  }
  function startPractice() {
    var p = shuffle(pool());
    if (filt.n !== "all") p = p.slice(0, parseInt(filt.n, 10));
    if (!p.length) return;
    S = { mode: "pr", items: p.map(makeItem), i: 0, done: false };
    render();
  }
  function startRetry(qs) {
    S = { mode: "pr", items: shuffle(qs).map(makeItem), i: 0, done: false };
    render();
  }

  function render() {
    if (!S) return home();
    if (S.done) return result();
    quiz();
    window.scrollTo(0, 0);
  }

  function quiz() {
    var it = S.items[S.i], q = it.q, n = S.items.length;
    var zh = S.mode === "zh";
    var answered = S.items.filter(function (x) { return x.answer !== null; }).length;
    var h = '<div class="topbar"><div class="row between"><span class="ui"><b>' + (S.i + 1) + ' / ' + n + '</b> · ' + (zh ? "ZH-szimuláció" : "Gyakorlás") + '</span>' +
      '<button class="link" id="quit">Kilépés</button></div>' +
      '<div class="bar"><i style="width:' + Math.round(((zh ? answered : S.i + (it.revealed ? 1 : 0)) / n) * 100) + '%"></i></div></div>';

    h += '<section class="box"><div class="qmeta"><span class="tag ' + q.t + '">' + TYPE[q.t] + '</span><span class="muted small">' + q.ch + '. ' + esc(CH[q.ch]) + ' · ' + esc(q.sec) + '</span></div>';
    if (q.t === "R") {
      h += '<p class="muted ui small">Olvasd el a két állítást, és válaszd ki, melyik összefüggés igaz rájuk.</p>' +
        '<div class="stmt"><span class="lab">1. ÁLLÍTÁS</span><p class="qtext">' + esc(q.s1) + '</p></div>' +
        '<div class="stmt"><span class="lab">2. ÁLLÍTÁS</span><p class="qtext">' + esc(q.s2) + '</p></div>';
    } else if (q.t === "T") {
      h += '<p class="qtext">' + esc(q.text) + '</p>';
    } else {
      h += '<p class="qtext">' + esc(q.text) + '</p>';
    }
    h += '<div class="opts" id="opts">' + optionsHtml(it, zh) + '</div>';
    if (!zh && it.revealed) h += explainHtml(it);
    h += '</section>';

    h += '<div class="nav">';
    if (zh) {
      h += '<button class="btn ghost" id="prev"' + (S.i === 0 ? " disabled" : "") + '>Előző</button>' +
        '<button class="btn ghost" id="next"' + (S.i === n - 1 ? " disabled" : "") + '>Következő</button><span class="spacer"></span>' +
        '<button class="btn" id="submit">Beadom (' + answered + ' / ' + n + ' kitöltve)</button>';
      h += '</div><div class="grid" id="grid">';
      S.items.forEach(function (x, k) { h += '<button class="dot' + (x.answer !== null ? " done" : "") + (k === S.i ? " cur" : "") + '" data-k="' + k + '" aria-label="' + (k + 1) + '. kérdés">' + (k + 1) + '</button>'; });
      h += '</div>';
    } else {
      h += '<span class="spacer"></span><button class="btn" id="next"' + (it.revealed ? "" : " disabled") + '>' + (S.i === n - 1 ? "Eredmény" : "Tovább") + '</button></div>';
    }
    app.innerHTML = h;

    document.getElementById("quit").onclick = function () { S = null; home(); };
    app.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { answer(parseInt(b.dataset.v, 10) , b.dataset.l); }; });
    var nx = document.getElementById("next");
    if (nx) nx.onclick = function () { if (zh) { S.i++; render(); } else { if (S.i === n - 1) finish(); else { S.i++; render(); } } };
    var pv = document.getElementById("prev"); if (pv) pv.onclick = function () { S.i--; render(); };
    var sb = document.getElementById("submit"); if (sb) sb.onclick = function () { finish(); };
    app.querySelectorAll(".dot").forEach(function (d) { d.onclick = function () { S.i = parseInt(d.dataset.k, 10); render(); }; });
  }

  function optionsHtml(it, zh) {
    var q = it.q, h = "", rev = !zh && it.revealed;
    if (q.t === "C") {
      it.order.forEach(function (orig, d) {
        var cls = "opt", mark = String.fromCharCode(65 + d) + ")";
        if (rev) { if (orig === q.ans) cls += " right"; else if (it.answer === d) cls += " wrong"; }
        else if (it.answer === d) cls += " sel";
        h += '<button class="' + cls + '" data-v="' + d + '"' + (rev ? " disabled" : "") + '><span class="t"><span class="mark">' + mark + '</span><span>' + esc(q.opts[orig][0]) + '</span></span>' +
          (rev ? '<span class="ex ui">' + (orig === q.ans ? (/^Helyes/i.test(q.opts[orig][1]) ? "" : "<b>Helyes. </b>") : (it.answer === d ? "<b>Ezt választottad. </b>" : "")) + esc(q.opts[orig][1]) + '</span>' : "") + '</button>';
      });
    } else if (q.t === "T") {
      [[true, "Igaz"], [false, "Hamis"]].forEach(function (p) {
        var v = p[0] ? 1 : 0, cls = "opt";
        if (rev) { if (q.ans === p[0]) cls += " right"; else if (it.answer === p[0]) cls += " wrong"; }
        else if (it.answer === p[0]) cls += " sel";
        h += '<button class="' + cls + '" data-v="' + v + '"' + (rev ? " disabled" : "") + '><span class="t"><span class="mark"></span><span class="ui"><b>' + p[1] + '</b></span></span></button>';
      });
    } else {
      ["A", "B", "C", "D", "E"].forEach(function (l) {
        var cls = "opt";
        if (rev) { if (q.ans === l) cls += " right"; else if (it.answer === l) cls += " wrong"; }
        else if (it.answer === l) cls += " sel";
        h += '<button class="' + cls + '" data-l="' + l + '" data-v="0"' + (rev ? " disabled" : "") + '><span class="t"><span class="mark">' + l + ')</span><span>' + REL[l] + '</span></span></button>';
      });
    }
    return h;
  }

  function answer(v, l) {
    var it = S.items[S.i], q = it.q, zh = S.mode === "zh";
    if (!zh && it.revealed) return;
    if (q.t === "C") it.answer = v;
    else if (q.t === "T") it.answer = v === 1;
    else it.answer = l;
    if (!zh) { it.revealed = true; record(q, isCorrect(it)); }
    render();
    if (!zh) { var ex = document.getElementById("explain"); if (ex && ex.scrollIntoView) ex.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  }

  /* magyarázat: jó és rossz válasz után egyaránt */
  function truth(l) { return { A: [1, 1], B: [1, 1], C: [1, 0], D: [0, 1], E: [0, 0] }[l]; }
  function explainBody(q, chosenText) {
    var h = "";
    if (q.t === "T") {
      h += '<p class="tv">A helyes válasz: ' + (q.ans ? "Igaz" : "Hamis") + '.</p><p>' + esc(q.ex) + '</p>';
    } else if (q.t === "R") {
      var t = truth(q.ans);
      h += '<p class="tv">A helyes válasz: ' + q.ans + ') ' + REL[q.ans] + '</p>' +
        '<p><b>1. állítás: ' + (t[0] ? "igaz" : "hamis") + '.</b> ' + esc(q.e1) + '</p>' +
        '<p><b>2. állítás: ' + (t[1] ? "igaz" : "hamis") + '.</b> ' + esc(q.e2) + '</p>' +
        '<p><b>Az összefüggés:</b> ' + esc(q.er) + '</p>';
    }
    return h;
  }
  function explainHtml(it) {
    var q = it.q, ok = isCorrect(it);
    var h = '<div class="explain ' + (ok ? "ok" : "bad") + '" id="explain"><div class="verdict ' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ Jó válasz" : "✗ Nem jó válasz") + '</div>';
    if (q.t === "C") {
      h += '<p>A magyarázatot minden válaszlehetőség alatt olvashatod.</p>';
    } else {
      h += explainBody(q);
    }
    return h + '</div>';
  }

  /* ---------- eredmény ---------- */
  function finish() {
    S.done = true;
    if (S.mode === "zh") {
      var s = S.items.filter(isCorrect).length;
      S.items.forEach(function (x) { record(x.q, isCorrect(x)); });
      store.hist.push({ s: s, d: Date.now() }); store.hist = store.hist.slice(-20); save();
    }
    render();
  }
  function result() {
    var n = S.items.length, zh = S.mode === "zh";
    var good = S.items.filter(isCorrect);
    var s = good.length;
    var h = '<section class="box">';
    if (zh) {
      var passed = s >= ZH.pass;
      h += '<div class="eyebrow">ZH-szimuláció eredménye</div><div class="row"><span class="score">' + s + ' / ' + ZH.total + '</span><span class="pill ' + (passed ? "ok" : "bad") + '">' + (passed ? "Megvan a ponthatár" : "Még " + (ZH.pass - s) + " pont hiányzik") + '</span></div>' +
        '<div class="meter"><i style="width:' + Math.round(s / ZH.total * 100) + '%"></i><b style="left:' + (ZH.pass / ZH.total * 100) + '%"></b><span style="left:' + (ZH.pass / ZH.total * 100) + '%">ponthatár: ' + ZH.pass + '</span></div>' +
        '<p class="muted ui small">A megajánlott jegy lehetőségéhez legalább ' + ZH.pass + ' pont (70%) kell. Ez a gyakorló kérdésenként 1 pontot számol.</p>';
    } else {
      h += '<div class="eyebrow">Gyakorlás vége</div><div class="row"><span class="score">' + s + ' / ' + n + '</span><span class="pill ' + (s / n >= 0.7 ? "ok" : "bad") + '">' + Math.round(s / n * 100) + '%</span></div>';
    }
    var by = { C: [0, 0], T: [0, 0], R: [0, 0] };
    S.items.forEach(function (x) { by[x.q.t][1]++; if (isCorrect(x)) by[x.q.t][0]++; });
    h += '<div class="stats">';
    ["C", "T", "R"].forEach(function (t) { if (by[t][1]) h += '<div class="stat"><b>' + by[t][0] + ' / ' + by[t][1] + '</b><span class="muted ui small">' + TYPE[t] + '</span></div>'; });
    h += '</div><div class="row">';
    var wrong = S.items.filter(function (x) { return !isCorrect(x); });
    if (wrong.length) h += '<button class="btn" id="again">A ' + wrong.length + ' hibás újra</button>';
    h += '<button class="btn ghost" id="newZh">Új ZH</button><button class="btn ghost" id="homeBtn">Kezdőlap</button></div></section>';

    h += '<h2>Kérdésenként</h2><p class="muted ui small">A rosszul megválaszoltak elöl vannak. Nyisd ki őket a magyarázatért; a jók magyarázata is megvan.</p>';
    wrong.concat(good).forEach(function (x) { h += review(x); });
    app.innerHTML = h;
    var ag = document.getElementById("again"); if (ag) ag.onclick = function () { startRetry(wrong.map(function (x) { return x.q; })); };
    document.getElementById("newZh").onclick = startZh;
    document.getElementById("homeBtn").onclick = function () { S = null; home(); };
    window.scrollTo(0, 0);
  }
  function review(x) {
    var q = x.q, ok = isCorrect(x);
    var title = q.t === "R" ? q.s1 + " / " + q.s2 : q.text;
    var h = '<details class="rev"><summary><span class="ico ' + (ok ? "ok" : "bad") + '">' + (ok ? "✓" : "✗") + '</span><span>' + esc(title.length > 170 ? title.slice(0, 170) + "…" : title) + '</span></summary><div class="body">';
    h += '<div class="qmeta"><span class="tag ' + q.t + '">' + TYPE[q.t] + '</span><span class="muted small">' + q.ch + '. ' + esc(CH[q.ch]) + '</span></div>';
    if (q.t === "R") h += '<div class="stmt"><span class="lab">1. ÁLLÍTÁS</span><p>' + esc(q.s1) + '</p></div><div class="stmt"><span class="lab">2. ÁLLÍTÁS</span><p>' + esc(q.s2) + '</p></div>';
    else h += '<p>' + esc(q.text) + '</p>';
    var given;
    if (x.answer === null) given = "nem válaszoltál";
    else if (q.t === "C") given = esc(q.opts[x.order[x.answer]][0]);
    else if (q.t === "T") given = x.answer ? "Igaz" : "Hamis";
    else given = x.answer + ") " + REL[x.answer];
    h += '<p><b>Válaszod:</b> ' + given + '</p>';
    if (q.t === "C") {
      q.opts.forEach(function (o, k) {
        var mine = x.answer !== null && x.order[x.answer] === k;
        h += '<div class="stmt"><span class="lab">' + (k === q.ans ? "HELYES VÁLASZ" : (mine ? "AMIT VÁLASZTOTTÁL" : "TÉVES VÁLASZ")) + '</span><p>' + esc(o[0]) + '</p><p class="muted ui small">' + esc(o[1]) + '</p></div>';
      });
    } else {
      h += '<div class="explain ' + (ok ? "ok" : "bad") + '">' + explainBody(q) + '</div>';
    }
    return h + '</div></details>';
  }

  document.addEventListener("keydown", function (e) {
    if (!S || S.done || S.mode !== "pr") return;
    if ((e.key === "Enter" || e.key === "ArrowRight") && S.items[S.i].revealed && e.target.tagName !== "BUTTON") { var n = document.getElementById("next"); if (n) n.click(); }
  });

  home();

  /* világos / sötét téma: kézi választás, alapból a rendszerbeállítást követi */
  (function () {
    var btn = document.getElementById("themeBtn"), root = document.documentElement;
    var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
    function isDark() {
      var t = root.getAttribute("data-theme");
      if (t) return t === "dark";
      return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    }
    function paint() {
      var d = isDark();
      btn.innerHTML = d ? SUN : MOON;
      btn.setAttribute("aria-label", d ? "Váltás világos (nappali) megjelenésre" : "Váltás sötét (éjszakai) megjelenésre");
      btn.title = d ? "Nappali mód" : "Éjszakai mód";
    }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("alk-theme", next); } catch (e) {}
      paint();
    });
    paint();
  })();
})();
</script>

</body></html>
