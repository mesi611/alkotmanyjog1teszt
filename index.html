<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Alkotmányjog ZH-gyakorló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: egy keskeny munkaasztal. Kezdőlapon a ZH-szimuláció és a gyakorlás két külön doboza,
   kérdés közben egyetlen kártya, alatta a magyarázat. Színek és betűk a tanulókártyák oldaláról. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #172030;
  --muted: #566274;
  --line: #d3dae5;
  --accent: #00508c;
  --on-accent: #ffffff;
  --accent-soft: #e2eef7;
  --ok: #17704f;
  --ok-soft: #e1f2ea;
  --bad: #b4234f;
  --bad-soft: #fbe6ec;
  --warn: #8a6411;
  --warn-soft: #faf4e2;

  --font-ui: "Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  --font-body: "Caladea", Cambria, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141d;
    --surface: #141d29;
    --ink: #e6ecf3;
    --muted: #9aa8ba;
    --line: #2a3748;
    --accent: #5aaae8;
    --on-accent: #06121d;
    --accent-soft: #12283d;
    --ok: #62cba0;
    --ok-soft: #10291f;
    --bad: #f27aa0;
    --bad-soft: #3a1523;
    --warn: #dcb455;
    --warn-soft: #2e2610;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141d;
  --surface: #141d29;
  --ink: #e6ecf3;
  --muted: #9aa8ba;
  --line: #2a3748;
  --accent: #5aaae8;
  --on-accent: #06121d;
  --accent-soft: #12283d;
  --ok: #62cba0;
  --ok-soft: #10291f;
  --bad: #f27aa0;
  --bad-soft: #3a1523;
  --warn: #dcb455;
  --warn-soft: #2e2610;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 60px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-ui); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.2rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.ui { font-family: var(--font-ui); }
.small { font-size: 0.9rem; }
.eyebrow { font-family: var(--font-ui); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn { font-family: var(--font-ui); font-size: 1.05rem; font-weight: 700; border-radius: 6px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

/* kezdőlap */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-ui); font-size: 0.95rem; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.fieldline { display: flex; flex-direction: column; gap: 8px; }
.fieldline label.cap { font-family: var(--font-ui); font-weight: 700; font-size: 0.95rem; }
select { font-family: var(--font-ui); font-size: 1rem; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-ui); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.passline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-ui); }
.link { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; font-family: var(--font-ui); font-size: 0.95rem; }

/* kérdés */
.topbar { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--font-ui); }
.tag { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; padding: 3px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.T { background: var(--warn-soft); color: var(--warn); }
.tag.R { background: var(--ok-soft); color: var(--ok); }
.qtext { font-size: 1.15rem; line-height: 1.5; }
.stmt { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }
.stmt .lab { font-family: var(--font-ui); font-weight: 700; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.06em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; width: 100%; min-width: 0; }
.opt .t { display: flex; gap: 10px; align-items: baseline; }
.opt .mark { font-family: var(--font-ui); font-weight: 700; flex: none; width: 1.4em; color: var(--muted); }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .ex { font-size: 0.97rem; color: var(--muted); padding-left: calc(1.4em + 10px); }
.opt.right .ex, .opt.wrong .ex { color: var(--ink); }
.verdict { font-family: var(--font-ui); font-weight: 700; font-size: 1.1rem; display: flex; gap: 8px; align-items: center; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.explain { border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--warn-soft); border: 1px solid var(--line); }
.explain.ok { background: var(--ok-soft); }
.explain.bad { background: var(--bad-soft); }
.explain .tv { font-family: var(--font-ui); font-weight: 700; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { font-family: var(--font-ui); font-variant-numeric: tabular-nums; width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 0.9rem; }
.dot.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

/* eredmény */
.score { font-family: var(--font-ui); font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.pill { font-family: var(--font-ui); font-weight: 700; padding: 4px 12px; border-radius: 999px; font-size: 0.95rem; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.meter { position: relative; height: 14px; background: var(--line); border-radius: 7px; margin-top: 14px; }
.meter > i { display: block; height: 100%; border-radius: 7px; background: var(--accent); }
.meter > b { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
.meter > span { position: absolute; top: -26px; transform: translateX(-50%); font-family: var(--font-ui); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
details.rev { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.rev > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: baseline; font-family: var(--font-ui); }
details.rev > summary::-webkit-details-marker { display: none; }
details.rev .ico { flex: none; font-weight: 700; width: 1.2em; }
details.rev .ico.ok { color: var(--ok); }
details.rev .ico.bad { color: var(--bad); }
details.rev .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.toolbar { display: flex; justify-content: flex-end; }
@media (prefers-reduced-motion: no-preference) { .bar > i, .meter > i { transition: width 0.25s ease; } }

.theme-btn { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 50; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
<script>(function(){try{var t=localStorage.getItem('alk-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<button class="theme-btn" id="themeBtn" type="button"></button>
<div class="wrap" id="app"></div>

<script>
var RAW = [[1,"C","I. Közjog és alkotmányjog","Melyik NEM tekinthető a közjog és a magánjog elhatárolásának önálló, megbízható szempontjának?",[["A felek egymáshoz való viszonya (alá-fölé rendeltség / mellérendeltség)","Ez valódi szempont: a közjogban alá-fölé rendeltség, a magánjogban mellérendeltség van."],["A jogviszony alanya, vagyis hogy szerepel-e benne az állam","Helyes. Az állam magánjogi jogviszonyban is részt vehet (pl. ingatlant ad el), ott viszont mellérendelt szereplő. Az számít, milyen minőségben lép fel, nem az, hogy ki ő."],["A szabályozás jellege (kógens / diszpozitív)","Ez valódi szempont: a közjogban főszabályként kógens, a magánjogban diszpozitív a szabályozás."],["A jogsértés következménye (közvetlen kikényszerítés / bírói út)","Ez valódi szempont: a közjogban az állam közvetlenül érvényesíti a követelést (letiltás, végrehajtás), a magánjogban bírósághoz kell fordulni."]],1],[1,"T","I. Közjog és alkotmányjog","Ha egy jogviszonyban az állam (pl. önkormányzat) az egyik fél, akkor az a jogviszony szükségképpen közjogi.",false,"Hamis. Ha az önkormányzat feleslegessé vált ingatlanát eladja, magánjogi jogviszony jön létre: az önkormányzatnak itt nincs imperiuma, nem erősebb a vevőnél, nem írhatja elő egyoldalúan a vételárat. Az állam a magánjogi jogviszonyban elveszíti közhatalmi jellegét."],[1,"C","I. Közjog és alkotmányjog","Egy önkormányzat feleslegessé vált ingatlanát eladja egy magánszemélynek. Milyen jogviszony ez, és miért?",[["Közjogi, mert az egyik fél közhatalmat gyakorló önkormányzat, ezért fölérendelt szereplő","Az alany személye nem dönt: az önkormányzat itt nem közhatalmat gyakorol, hanem ingatlant értékesít."],["Magánjogi, mert az önkormányzat itt nem gyakorol imperiumot, mellérendelt félként lép fel","Helyes. A vevő bárki lehet, az önkormányzat nem határozhatja meg egyoldalúan a vételárat, nincsenek többletjogosítványai."],["Vegyes jellegű, mert az ingatlan közvagyon, ezért közjogi korlátok is érvényesülnek","A közvagyon jellege nem teszi vegyessé a jogviszonyt; a felek viszonya a döntő, az pedig mellérendelt."],["Közigazgatási jogi, mert az önkormányzat a helyi közügyek intézésére jött létre","A közigazgatási jog a közjog része; a viszony jellegét nem a szerv feladata, hanem a felek helyzete dönti el."]],1],[1,"T","I. Közjog és alkotmányjog","A közjogban főszabályként a kógencia, a magánjogban a diszpozitivitás érvényesül.",true,"Igaz. A közjogi norma megmondja, hogyan van, és ezen a felek egyetértése sem változtat; a magánjogban a felek a törvény adta kereten belül szabadon alakíthatják a jogviszony tartalmát. Ez főszabály, nem kizárólagos viszony."],[1,"T","I. Közjog és alkotmányjog","A közjogban soha nincs diszpozitív szabály, a magánjogban pedig soha nincs kógens szabály.",false,"Hamis, túlfogalmazás. A viszony nem kizárólagos: a magánjogban is vannak kógens, a közjogban is vannak diszpozitív szabályok. A vizsgán a főszabályt kell tudni (közjog: kógencia, magánjog: diszpozitivitás)."],[1,"C","I. Közjog és alkotmányjog","Melyik állítás igaz az érdekviszonyokra?",[["A magánjogban érdekazonosság, a közjogban érdekellentét a kiinduló helyzet","Fordítva igaz."],["Mindkét területen alapvetően érdekellentét jellemző a felek között","A közjogban az állam működése mindannyiunk közös érdeke, ezért nem érdekellentét a kiindulópont."],["A magánjogban érdekellentét, a közjogban érdekazonosság a kiinduló helyzet","Helyes. A magánjogban az eladó drágán, a vevő olcsón akar adni, illetve venni; az érdekazonosság csak az eredmény (a felek engednek). A közjogban a társadalmi szerződés miatt azt akarjuk, hogy az állam működjön."],["A magánjogban és a közjogban is érdekazonosság a kiinduló helyzet","A magánjogban a felek érdekei ellentétesek, csak a megállapodásban találkoznak."]],2],[1,"R","I. Közjog és alkotmányjog","A közjogban az állam az adótartozást közvetlenül, bírósági eljárás nélkül is behajthatja (pl. a bankszámla letiltásával).","Az állam a közjogi jogviszonyban fölérendelt helyzetben van, és többletjogosítványokkal rendelkezik.","A","Igaz: közjogban az állam közvetlenül kikényszerítheti a kötelezettséget (letiltás, végrehajtó, lefoglalás, árverés).","Igaz: a közjogi jogviszony alá-fölé rendeltségen alapul, az állam fölérendelt szereplő, többletjogosítványokkal.","A közvetlen kikényszeríthetőség éppen a fölérendelt helyzet és a többletjogosítványok következménye, ezért van ok-okozati összefüggés."],[1,"C","I. Közjog és alkotmányjog","Miért nem jön létre a közjogi jogviszony „a felek akaratából” az építési engedély esetében, noha az ügyfél maga kérelmezi az engedélyt?",[["Mert az építési hatóság az ügyfél kérelmét minden esetben elutasítja","Ennek semmi köze a kérdéshez; a hatóság engedélyezhet is."],["Mert a kérelem kötelesség, a tartalmat pedig a jogszabály, nem a felek akarata határozza meg","Helyes. A jogviszony megindítása és tartalma két külön dolog. Ha nem kérek engedélyt, szankció (bírság, bontási kötelezettség) következik, ezért a kérelem nem szabad akarati döntés."],["Mert az építési engedély magánjogi aktus, ezért a felek mellérendeltek","Az építési engedély közhatalmi aktus, ezért a viszony közjogi, alá-fölé rendeltséggel."],["Mert az ügyfél és a hatóság között a jogviszony tartalmát szerződés rögzíti","Közjogi viszonyban a tartalmat jogszabály rögzíti, nem szerződés."]],1],[1,"C","I. Közjog és alkotmányjog","Hová sorolható a munkajog a jogágak rendszerében?",[["A közjoghoz, mert a munkavédelmi szabályok kógensek","A munkajogban a felek szerződése magánjogi elem, ezért nem tisztán közjogi."],["A magánjoghoz, mert a munkaviszony szerződéssel jön létre","A munkavédelem és a felmondási korlátok közjogias elemek, ezért nem tisztán magánjogi."],["Vegyes jogág, mert szerződéses és közjogias elemeket egyaránt hordoz","Helyes. A felek szerződéses viszonyát közjogias védelmi szabályokkal ötvözi."],["A büntetőjoghoz, mert a munkáltatói jogsértéseket szankcionálja","A munkajog nem a büntetőjog része; a szankciók csak egy elemét adják."]],2],[1,"C","I. Közjog és alkotmányjog","Mi a büntetőjog helye a jogágak rendszerében?",[["A közjog része, mert az állam büntetőhatalmat gyakorol","Közjogias jellege kétségtelen, a tankönyv mégsem sorolja a közjog és a magánjog egyikéhez sem."],["A magánjog része, mert a bűncselekmény két ember viszonyában valósul meg","A büntetőjog nem magánjog: a bűncselekmény miatt az állam lép fel."],["Külön kategória: a jogrendszer záróköve, az állam végső eszköze (ultima ratio)","Helyes. Az a pont, ahol az állam a végső eszközéhez, a büntetőhatalomhoz nyúl."],["Az alkotmányjog alágazata, mert az állam büntetőhatalmának kereteit az Alaptörvény adja","A büntetőjog önálló jogág; az alkotmány csak a kereteit adja."]],2],[1,"C","I. Közjog és alkotmányjog","Hogyan viszonyul egymáshoz az alkotmányjog és a közigazgatási jog?",[["Az alkotmányjog a statikus keret, a közigazgatási jog a tényleges működés","Helyes. Az államszervezet felépítése, a hatalommegosztás alkotmányjogi kérdés; a kormány és az igazgatási ágazatok tényleges működése közigazgatási jogi."],["Az alkotmányjog a dinamikus működés, a közigazgatási jog a statikus keret","Fordítva igaz."],["Az alkotmányjog a magánjog, a közigazgatási jog a közjog része","Mindkettő a közjog része."],["Az alkotmányjog csak elnevezésében különbözik a közigazgatási jogtól","Van tartalmi különbség a kettő között."]],0],[1,"C","I. Közjog és alkotmányjog","Mi a különbség az alkotmány és az alkotmányjog között?",[["Az alkotmányjog szűkebb fogalom, mert csak az Alaptörvény szövegét és módosításait jelenti","Fordítva: az alkotmányjog a tágabb fogalom."],["Az alkotmány az alapdokumentum, az alkotmányjog a hozzá kapcsolódó normák és gyakorlat összessége","Helyes. Ide tartozik a törvények, rendeletek, az AB és a bírói gyakorlat, a nemzetközi fórumok döntései is."],["Az alkotmány a jogtudomány kutatási tárgya, az alkotmányjog pedig maga a jogalkotási folyamat","Nem erről szól a megkülönböztetés."],["Az alkotmányjog kizárólag az Alkotmánybíróság döntéseinek és indokolásainak összessége","Az AB-gyakorlat csak egy eleme az alkotmányjognak."]],1],[1,"T","I. Közjog és alkotmányjog","A gyülekezési jog példája jól mutatja az alkotmány és az alkotmányjog különbségét: az Alaptörvény egyetlen mondatot ad, az alkotmányjog viszont ehhez törvényt, AB-gyakorlatot és strasbourgi gyakorlatot is magában foglal.",true,"Igaz. A VIII. cikk (1) bekezdése egy mondat (mindenkinek joga van a békés gyülekezéshez). Az alkotmányjog része a gyülekezési törvény, az AB gyakorlata (konkuráló gyűlések, spontán és bejelentett gyűlés elhatárolása, tiltási okok) és az EJEB gyakorlata."],[1,"C","I. Közjog és alkotmányjog","Melyik NEM tiszta, hanem vegyes alkotmányjogi norma?",[["Az Országgyűlésre vonatkozó szabályok","Tiszta alkotmányjogi norma: csak az alkotmányjog szabályozza."],["A köztársasági elnökre vonatkozó szabályok","Tiszta alkotmányjogi norma."],["Az ártatlanság vélelme","Helyes. A büntető eljárásjogot is közvetlenül érinti, ezért vegyes norma. Ugyanígy a tulajdonhoz való jog (polgári jog)."],["Az Alkotmánybíróságra vonatkozó szabályok","Tiszta alkotmányjogi norma."]],2],[1,"C","I. Közjog és alkotmányjog","Mit jelent a „láthatatlan alkotmány” koncepciója, és ki fogalmazta meg?",[["Az íratlan angol alkotmány két pillére, a parlamenti szuverenitás és a rule of law; Dicey","Dicey az angol alkotmány két pillérét írta le, de nem ezt a koncepciót."],["Az alkotmány alapjogi elveinek koherens rendszere, amely a napi módosítások fölött is mérce; Sólyom László","Helyes. Sólyom, az AB első elnöke párhuzamos véleményében fogalmazta meg; kritikusai szerint túlzott bírói aktivizmushoz vezethet."],["Az alkotmányos szokások nem nyilvános, íratlan gyűjteménye, amely a normák fölött áll; Kelsen","Kelsen a normahierarchia kapcsán fontos, de nem ez a koncepció fűződik hozzá."],["A történeti alkotmány íratlan elemeinek rendszere, amelyet a Hármaskönyv foglalt össze; Werbőczy","Werbőczy a Hármaskönyv szerzője, de a láthatatlan alkotmány nem az ő koncepciója."]],1],[1,"C","I. Közjog és alkotmányjog","Mi a különbség a pozitivista és a normativista módszer között az alkotmányjog-tudományban?",[["A pozitivista a szöveget értéktartalom nélkül, a normativista az alkotmányos értékeket is figyelembe véve vizsgálja","Helyes. A normativista azt is vizsgálja, hogy a norma megfelel-e az alkotmányos elveknek."],["A pozitivista az értéktartalmat vizsgálja, a normativista csak a nyelvtani szöveget és annak szerkezetét","Fordítva igaz."],["A pozitivista a történeti, a normativista a kartális alkotmányokat vizsgálja, külön-külön","A két módszer nem alkotmánytípusokhoz kötődik."],["A pozitivista a jogalkotót, a normativista a jogalkalmazót vizsgálja szereplőként","A különbség a vizsgálati módszerben van, nem a vizsgált szereplőben."]],0],[1,"T","I. Közjog és alkotmányjog","A költségvetési jog részletszabályai az alkotmányjog forrásai, mert a költségvetés elfogadása alkotmányos hatáskör.",false,"Hamis. A költségvetés elfogadása alkotmányos hatáskör, de a költségvetési jog részletszabályai a pénzügyi jog területéhez tartoznak. Nem minden, az alkotmányban érintett tárgykör szabálya az alkotmányjog forrása."],[1,"C","I. Közjog és alkotmányjog","Mit jelent, hogy az alkotmányos szokás nem lehet contra legem?",[["Nem mondhat ellent az írott jogszabálynak","Helyes. Az alkotmányos szokás kiegészíthet, de nem írhatja felül a jogszabályt. Klasszikus példa: az Egyesült Királyságban a bizalmát vesztett miniszterelnök lemond, bár írott szabály nincs rá."],["Csak írásban létezhet","A szokás lényege éppen az, hogy gyakorlatból fakad."],["Csak az Alkotmánybíróság állapíthatja meg","Az alkotmányos szokás nem AB-hatáskör."],["Kizárólag nemzetközi szerződésből eredhet","A szokás belső gyakorlat."]],0],[1,"T","I. Közjog és alkotmányjog","Az alkotmányértelmező alkotmánybírósági határozatok Magyarországon erga omnes hatályú, hiteles értelmezésnek minősülnek, a jogtudományi (doktrinális) értelmezések viszont nem kötelezőek.",true,"Igaz. Az AB alkotmányértelmezése mindenkire kötelező (erga omnes), a doktrinális értelmezés csak szakmai vélemény."],[1,"C","II. Az alkotmány","Mit jelent pontosan, hogy a történeti alkotmány „íratlan”?",[["Hogy az elemei sehol sincsenek leírva, csak a szokásokban élnek","Ez a félreértés. Az elemek le vannak írva."],["Hogy az elemei nincsenek egyetlen dokumentumba foglalva","Helyes. Az „íratlan” elnevezés félrevezető."],["Hogy kizárólag szokásjogból áll, írott törvény nincs benne","Írott törvények (Magna Charta, Habeas Corpus Act) is részei."],["Hogy már nem lehet módosítani, mert az elemei lezárultak","Folyamatosan épül, módosítása nem tiltott."]],1],[1,"T","II. Az alkotmány","A történeti alkotmány organikusan épül: a korábbi elemek akkor is az alapot jelentik, ha közvetlenül már nem alkalmazzák őket.",true,"Igaz. A ház-hasonlat: az alap a kész házban nem látszik, de nélküle összeomlana. Az 1215-ös Magna Charta ma már nem alkalmazott, mégis a történeti alkotmány része, és a rá épülő elemek (Habeas Corpus, parlamenti szuverenitás) rajta nyugszanak."],[1,"C","II. Az alkotmány","Az Aranybulla (1222) ellenállási jogának modern továbbélése:",[["A népszavazás","A népszavazás nem az ellenállási jogból ered."],["A petíciós jog","Helyes. Középkori kiváltságból lett modern alapjog."],["A gyülekezési jog","Ez nem az ellenállási jog továbbélése."],["A tulajdonhoz való jog","Nincs közvetlen kapcsolat."]],1],[1,"R","II. Az alkotmány","Angliában nincs alkotmánybíróság.","A parlamenti szuverenitás elve szerint a parlament döntéseit semmilyen szerv nem bírálhatja felül.","A","Igaz: az angol alkotmányos berendezkedésben nincs alkotmánybíróság.","Igaz: a parlamenti szuverenitás a történeti angol alkotmány alapelve.","Ha a parlament szuverén, nincs olyan szerv, amely a törvényhozást kontrollálhatná, ezért nincs alkotmánybíróság: ok-okozati kapcsolat."],[1,"C","II. Az alkotmány","Mi jellemző kizárólag a kartális alkotmányra?",[["Az alkotmányozói pillanat léte","Helyes. Alkotmányozói pillanat (forradalom, rendszerváltás) csak kartális alkotmányozásnál van; a történeti alkotmánynál folyamatos építkezés zajlik."],["Hogy a régi elemek alapul szolgálnak","Ez a történeti alkotmány jellemzője."],["Hogy nincs egyetlen dokumentuma","Ez a történeti alkotmány jellemzője."],["Hogy mindig organikusan változik","Ez a történeti alkotmány jellemzője."]],0],[1,"T","II. Az alkotmány","A kartális alkotmány módosításakor a korábbi szabály kikerül belőle, jogtörténetté válik, és mindig a hatályos állapot az irányadó.",true,"Igaz. Ez a különbség a történeti alkotmánytól, ahol a régi elem alapként megmarad."],[1,"T","II. Az alkotmány","Magyarország 1949-ig történeti, 1949-től kartális alkotmánnyal rendelkezett.",true,"Igaz. Az 1949. évi XX. törvény az első magyar kartális alkotmány, amely a mintegy 950 éves történeti alkotmányossággal szakított."],[1,"C","II. Az alkotmány","Mi a formai értelemben vett merevség kritériuma?",[["A módosításhoz szükséges képviselői többség mértéke, például a kétharmad","Ez a tartalmi merevség kérdése."],["Hogy van-e olyan része, amely egyáltalán nem módosítható (örökkévalósági klauzula)","Helyes. Ha van ilyen, merev, ha nincs, rugalmas. Pl. a német alaptörvény: Németország szövetségi köztársaság."],["Hogy az alkotmány egyetlen dokumentumban, írott formában létezik-e","Az írottság más szempont."],["Hogy az alkotmány terjedelme és cikkeinek száma meghaladja-e a törvényekét","A terjedelem nem számít."]],1],[1,"C","II. Az alkotmány","Mi jellemzi a dán, illetve svéd típusú alkotmánymódosítási eljárást?",[["Az egyszerű többség elegendő, de a módosítást két egymást követő ülésszakon kell elfogadni","Ez nem a dán–svéd modell."],["Kétharmad, a parlament feloszlatása, az új parlament újabb kétharmada, majd népszavazás","Helyes. Ez a legnehezebb eljárás, óriási politikai kockázattal: a parlament a saját mandátumát teszi kockára."],["Kizárólag népszavazás dönt, a parlament csak előkészíti a szöveget","A parlament szerepe megmarad, és a népszavazás csak az utolsó lépés."],["Az államfő és a kormány közös döntése, a parlament utólagos jóváhagyásával","Nem ilyen a modell: a döntés a parlamenté."]],1],[1,"T","II. Az alkotmány","A magyar Alaptörvény módosításához az összes képviselő kétharmadának szavazata kell, ezért az alkotmány a gyakorlatban is mindig merev.",false,"Hamis. Papíron merev, de a gyakorlati rugalmasság a politikai erőviszonyoktól függ: ha tartósan van kétharmados többség, sorra születnek a módosítások. A magyar alkotmány rugalmasságát végső soron a választási rendszer határozza meg."],[1,"R","II. Az alkotmány","Egy alkotmányozásnál az a fő kérdés, hogy a szöveg elfogadottságot nyer-e a társadalom egészében.","Az alkotmányozásnál az a döntő, hogy jogilag megvan-e a szükséges többség.","C","Igaz: a legitimáció, az elfogadottság a kulcskérdés, nem a puszta formális többség.","Hamis: a szükséges többség megléte nem elég; egy alkotmány csak akkor tölti be a szerepét, ha nem egyetlen politikai közösség dokumentumaként tekintenek rá.","Az első állítás igaz, a második hamis."],[1,"C","II. Az alkotmány","Miért problémás az alkotmányozás népszavazással történő megerősítése?",[["Mert népszavazással alkotmányt jogilag nem lehet elfogadni vagy megerősíteni","Nem kizárt, csak problémás."],["Az igen–nem csapda és a részvétel kockázata: gyenge eredmény utólag megkérdőjelezi az alkotmányt","Helyes. A szöveg egy részével egyet lehet érteni, mással nem, de csak igen vagy nem szavazat adható."],["Mert a népszavazás eredménye mindig a kormánypártok javára dől el","Nem mindig; magas részvétel és nagy többség erős legitimációt ad."],["Mert a népszavazás a szöveg minden elemére külön szavazást követel, ezért túl hosszú","Nem ez a probléma."]],1],[1,"C","II. Az alkotmány","Mi a deliberatív (részvételi) alkotmányozás tanulsága a chilei és izlandi kísérlet alapján?",[["Mindkét kísérlet sikeres volt, ezért a módszer más országokban is másolható","Mindkettő kudarccal végződött."],["Részvételi alkotmányozás gyakorlatilag nem megvalósítható egy politikai cikluson belül","Helyes. Úgy alkotmányt alkotni, hogy mindenki elmondhassa és érdemben figyelembe is vegyék a véleményét, aligha teljesíthető."],["A módszer csak monarchiákban működik, köztársaságban nem alkalmazható","Ilyen megkötés nincs."],["A részvételi alkotmányozás fölöslegessé teszi a végső népszavazást is, mert a nép már véleményezett","Nem erről szól a tanulság."]],1],[1,"T","II. Az alkotmány","A magyar alkotmányozói pillanatok közül az 1994–1998 közötti alkotmányozási folyamat az MSZP–SZDSZ kétharmados többsége ellenére sem zárult le egy cikluson belül, 2010 után viszont eredményes lett.",true,"Igaz. 1994–1998-ban belső viták és szakmai-politikai problémák miatt bukott el, 2010-ben a kétharmados győzelem újabb alkotmányozói pillanatot teremtett, ennek eredménye az Alaptörvény."],[1,"C","III. Alkotmányfejlődési irányok","Dicey szerint az angol alkotmány két alappillére:",[["A parlamenti szuverenitás és a rule of law","Helyes. A parlament korlátlanul alkothat és módosíthat törvényt; a jog uralma mindenkire, a hatalom gyakorlóira is egyformán vonatkozik."],["A hatalommegosztás és az alkotmánybíráskodás","Angliában nincs alkotmánybíráskodás."],["A kartális alkotmány és az örökkévalósági klauzula","Az angol alkotmány történeti."],["A népszavazás és a köztársasági elnök","Nem ezek a pillérek."]],0],[1,"C","III. Alkotmányfejlődési irányok","Melyik alkotmányfejlődési irányhoz tartozik a Roe kontra Wade-példa?",[["Angol: organikus fejlődés, íratlan szokásokkal és bírói gyakorlattal","Az angol modellre nem ez a példa."],["Amerikai: a szöveg érintetlen, a tartalmat a Legfelsőbb Bíróság értelmezése változtatja","Helyes. Ugyanabból az alkotmányszövegből ellentétes tartalmat vezettek le, ezért mondjuk, hogy az USA alkotmánya a legrugalmasabb."],["Francia: az új hatalom tabula rasát hoz létre, és új alkotmányt alkot","Nem erre szolgál példaként."],["Német: kompromisszumos fejlődés, a korábbi rendszerre építve","Nem erre szolgál példaként."]],1],[1,"R","III. Alkotmányfejlődési irányok","Az amerikai alkotmány a világ legrugalmasabb alkotmánya.","A szöveget gyakorlatilag nem lehet megváltoztatni, csak kiegészíteni (amendment), ám a Supreme Court értelmezése változtat a tartalmon.","A","Igaz a tankönyvi állítás szerint: a rugalmasság az értelmezésből fakad.","Igaz: nincs klasszikus értelemben vett módosítás, csak kiegészítés, a tartalmi változás az értelmezésen keresztül zajlik.","A rugalmasságot éppen az értelmezés adja, tehát a második állítás magyarázza az elsőt."],[1,"C","III. Alkotmányfejlődési irányok","Mi a forradalmi (francia típusú) alkotmányozás lényege?",[["Az új hatalom tabula rasát nyom: nincs kötődés a korábbi rendszerhez","Helyes. Nincs örökkévalósági klauzula sem."],["A régi rendszerre építkezik, kompromisszumokat kötve a korábbi hatalommal","Ez a német és közép-európai modell."],["A bírói értelmezés változtatja a tartalmat, a szöveg érinthetetlen marad","Ez az amerikai modell."],["Folyamatos, organikus építkezés íratlan szokásokra és történeti elemekre","Ez az angol modell."]],0],[1,"T","III. Alkotmányfejlődési irányok","Az 1958-as francia alkotmány az V. Köztársaság alkotmánya, de Gaulle nevéhez fűződik, és félprezidenciális rendszert hozott létre.",true,"Igaz. Azóta viszonylagos stabilitás jellemzi a francia alkotmányos berendezkedést."],[1,"C","III. Alkotmányfejlődési irányok","Mi a bonni alaptörvény elnevezésének oka, és mi történt az egyesüléskor?",[["Ideiglenesnek szánták; az egyesüléskor kiterjesztették hatályát a keleti területekre","Helyes. Alkotmánya csak egységes országnak lehet; az egyesüléskor nem alkottak új alkotmányt."],["Végleges alkotmánynak szánták; az egyesüléskor új alkotmányt fogadtak el helyette","Nem alkottak új alkotmányt."],["Mert Németország akkor monarchia volt, és az alaptörvény a császári hagyományra épült","Nincs köze a királysághoz."],["A weimari alkotmányt élesztették újjá, és az egyesüléskor is azt léptették hatályba","Nem a weimarit élesztették újjá."]],0],[1,"C","III. Alkotmányfejlődési irányok","Mit fejez ki Antall József mondata („tetszettek volna forradalmat csinálni”), és mi volt a közép-európai kompromisszumos átmenet ára?",[["A békés, kompromisszumos átmenetet; ára az elmaradt felelősségre vonás","Helyes. Ára az is, hogy nem derült ki, miként mentette át hatalmát az állampárt. Cserébe az addigi hatalom átadta pozícióit, és a pártállami parlament fogadta el az átmenet alkotmányát."],["A francia típusú tabula rasát; ára a polgárháborús helyzet és az instabilitás","Nem forradalmi, hanem kompromisszumos átmenet volt."],["Az amerikai típusú bírói értelmezést; ára az alkotmány tartalmi bizonytalansága","Nem erről szól a mondat."],["Az angol organikus fejlődést; ára a monarchikus államforma megőrzése","Nem erről szól a mondat."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik a történeti sorrend helyes?",[["Aranybulla (1222) → Tripartitum (1514) → áprilisi törvények (1848) → kiegyezés (1867)","Helyes."],["Tripartitum (1514) → Aranybulla (1222) → kiegyezés (1867) → áprilisi törvények (1848)","Az Aranybulla régebbi, és 1848 megelőzi 1867-et."],["Kiegyezés (1867) → Aranybulla (1222) → áprilisi törvények (1848) → Tripartitum (1514)","Nem ez a sorrend."],["Áprilisi törvények (1848) → Tripartitum (1514) → Aranybulla (1222) → kiegyezés (1867)","Nem ez a sorrend."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Mi az 1848-as áprilisi törvények legfontosabb vívmánya, amely szerkezetében ma is él?",[["Az első felelős magyar kormány (Batthyány-kormány), amely az Országgyűlésnek felelős","Helyes. Az Országgyűlésnek felelős testületi kormány modellje él ma is."],["A Szent Korona felsőbbrendűségének és birtokainak rögzítése a hűbérrendszerben","Ez az Aranybullához kötődik."],["A rendi alapú kétkamarás országgyűlés megerősítése, a nemesi kiváltságok megtartásával","Az áprilisi törvények éppen a rendi küldöttgyűlés helyett népképviseleti országgyűlést hoztak."],["A köztársasági államforma kikiáltása és a Habsburg-ház trónfosztása","A köztársasági államformát az 1946. évi I. törvény hozta létre."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyek voltak a kiegyezés (1867) három közös ügye?",[["Külügy, hadügy, és ezek finanszírozására szolgáló pénzügy","Helyes. Minden más (felelős kormányzat, országgyűlés) a két államban egymástól függetlenül működött."],["Külügy, belügy, és ezek finanszírozására szolgáló pénzügy","A belügy nem volt közös ügy."],["Hadügy, vám- és kereskedelmi ügy, valamint az igazságügy","Nem ezek a közös ügyek."],["Pénzügy, igazságügy és az oktatásügy közös igazgatása","Nem ezek a közös ügyek."]],0],[1,"T","IV. Magyar alkotmányfejlődés","Az 1949. évi XX. törvény a szovjet alkotmány mintáját követte, és valódi normatív érvényesülés nélkül pártos politikai dokumentum volt.",true,"Igaz. Elnöki Tanács, tanácsrendszer, az alapjogok (valódi egyesülési jog, sztrájkjog) hiánya jellemezte. Az első magyar kartális alkotmány volt, de nem alkotmányos."],[1,"C","IV. Magyar alkotmányfejlődés","Mit mondott ki először az 1987. évi XI. törvény (jogalkotási törvény)?",[["A törvényt az Országgyűlés alkotja, nem az Elnöki Tanács törvényerejű rendelete","Helyes. Addig a valóságban az Elnöki Tanács alkotta a legfontosabb normákat törvényerejű rendeletekben, demokratikus legitimáció nélkül."],["A köztársaság az ország államformája, a népköztársaság megszűnik","Ez az 1989-es változás."],["Létrehozza az Alkotmánybíróságot az alkotmányossági felügyelet ellátására","Ez 1989-hez kötődik."],["Bevezeti a többpártrendszert, és szabaddá teszi a pártalapítást","Nem ez a törvény tartalma."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik törvény melyik jogot szabályozta 1989-ben?",[["1989. évi II. törvény: egyesülési jog; 1989. évi III. törvény: gyülekezési jog","Helyes. Logikai sorrend: előbb létre kell jönni (egyesülés), azután lehet az utcára vonulni (gyülekezés)."],["1989. évi II. törvény: gyülekezési jog; 1989. évi III. törvény: egyesülési jog","Felcserélték (gyakori vizsgahiba)."],["Mindkettő az Alkotmánybíróság szervezetéről és hatásköréről szól","Nem erről szólnak."],["Mindkettő a szabad választójogról és a pártok működéséről szól","Nem erről szólnak."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Kik vettek részt a Nemzeti (háromoldalú) Kerekasztalon?",[["Az Ellenzéki Kerekasztal, az MSZMP és a harmadik oldal (civil, vállalkozói szereplők)","Helyes. A harmadik oldal érdemi szerep nélkül vett részt."],["Kizárólag az MSZMP és a szakszervezetek képviselői, az ellenzék nélkül","Nem csak ők; az ellenzék is ott volt."],["Az Országgyűlés és a Kormány képviselői, az Elnöki Tanács vezetésével","Nem ők voltak a felek."],["A köztársasági elnök és az Alkotmánybíróság bírái, a pártok képviselői nélkül","Ezek akkor még nem is léteztek."]],0],[1,"R","IV. Magyar alkotmányfejlődés","Az 1989. évi XXXI. törvény a preambulumában ideiglenesnek nevezte magát.","Az átmenet alkotmányát még a pártállami parlament fogadta el, így nem lehetett rá modern demokráciát alapozni.","A","Igaz: az 1949-es alkotmány átfogó módosítása meghagyta az 1949. évi XX. törvény számozását és elnevezését, ugyanakkor ideiglenesnek mondta ki magát.","Igaz: a végleges alkotmányt majd a szabadon választott Országgyűlés alkotja meg.","A pártállami eredet volt az indok, amellyel az ideiglenességet megmagyarázták."],[1,"C","IV. Magyar alkotmányfejlődés","Mi volt az Antall–Tölgyessy-paktum lényege?",[["A köztársasági elnök SZDSZ-es lehet, cserébe az SZDSZ megszavazza az MDF kétharmados törvényeit","Helyes. A kétharmados törvényekhez ellenzéki szavazatok kellettek."],["Az Alaptörvény előkészítésére közös bizottságot hoznak létre MDF–SZDSZ részvétellel","A paktum 1990-es, az Alaptörvény sokkal későbbi."],["A kétkamarás parlament bevezetése, és a felsőház ellenzéki vezetése","Nem erről szólt."],["Az MSZP–SZDSZ koalíció megalakítása a rendszerváltás utáni első kormányra","Az 1994-es koalíció más."]],0],[1,"T","IV. Magyar alkotmányfejlődés","A köztársaság kikiáltására 1989. október 23-án került sor, és a rendszerváltás közjogi csúcspontja az 1989. évi XXXI. törvény volt.",true,"Igaz. Az 1949-es alkotmány olyan átfogó módosítása, hogy egyetlen szakasza sem maradt változatlan; következménye a köztársaság kikiáltása, a választójogi törvény, az Alkotmánybíróságról szóló törvény."],[1,"C","IV. Magyar alkotmányfejlődés","Mikor fogadták el, írták alá és léptek hatályba az Alaptörvény?",[["Elfogadás: 2011. április 18.; aláírás: 2011. április 25.; hatálybalépés: 2012. január 1.","Helyes."],["Elfogadás: 2010. május 2.; aláírás: 2010. május 9.; hatálybalépés: 2011. január 1.","Nem ezek a dátumok."],["Elfogadás: 2012. január 1.; aláírás: 2011. április 25.; hatálybalépés: 2011. április 18.","Felcserélt dátumok."],["Elfogadás: 2011. április 25.; aláírás: 2011. április 18.; hatálybalépés: 2012. január 1.","Az elfogadás és az aláírás dátuma felcserélt."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Mi az Alaptörvény ellen a legfőbb megfogalmazott kritika az elfogadásával kapcsolatban?",[["Az ellenzék kivonult, így a kormányoldal egyedül szövegezte és fogadta el („nem mindenki alkotmánya”)","Helyes. A kritika logikája visszafelé is működik: ha később a másik oldal alkotmányoz egyedül, ugyanez a hiány terhelné."],["Az alkotmányt az államfő rendelete hozta létre, az Országgyűlés bevonása nélkül","Az Országgyűlés fogadta el."],["Túl kevés alapjogot tartalmaz, és az alapjogi katalógus szűkebb, mint a korábbi alkotmányé","Az alapjogi katalógus a korábbinál szélesebb."],["Nem tartalmaz preambulumot vagy hitvallást, ezért hiányzik az értékalapja","A Nemzeti hitvallás szerepel benne."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik rész melyik számozással szerepel az Alaptörvényben?",[["Alapvetés: betűk; Szabadság és felelősség: római számok; Az állam: arab számok; Záró rész: pontok","Helyes. Pl. a B) cikk az Alapvetésben, a XXIV. cikk a Szabadság és felelősség fejezetben, a 15. cikk Az állam fejezetben."],["Alapvetés: római számok; Szabadság és felelősség: betűk; Az állam: arab számok; Záró rész: pontok","Felcserélt: az Alapvetés betűs számozású."],["Alapvetés: betűk; Szabadság és felelősség: arab számok; Az állam: római számok; Záró rész: cikkek","Felcserélt: a Szabadság és felelősség római, Az állam arab számozású, a záró rész pontokra oszlik."],["Alapvetés: arab számok; Szabadság és felelősség: betűk; Az állam: római számok; Záró rész: pontok","Nem így van, minden rész számozása eltér."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Mi az „Alaptörvény” elnevezés legelfogadottabb magyarázata?",[["A német párhuzam: ideiglenes jelleg, azt sugallva, hogy a végleges dokumentum majd az „alkotmány” lesz","Ez egy versengő magyarázat, de nem a legelfogadottabb."],["Magalkotmány: csak a legalapvetőbb szabályokat tartalmazza, a részleteket sarkalatos törvények adják","Helyes. Az alkotmányosság belső magja."],["Az Alaptörvény a történeti alkotmány folytatása, ezért a Szent Korona-tan alapján nevezték így","Nem ez a legelfogadottabb magyarázat."],["Az uniós csatlakozás követelménye: a tagállamoknak alaptörvénnyel kell rendelkezniük","Nincs köze az elnevezéshez."]],1],[1,"C","IV. Magyar alkotmányfejlődés","Miért vitatott a Nemzeti hitvallás jogi kötőereje, és mi a meggyőzőbb álláspont?",[["Értékvallomás: kötőerővel az 1944–1990 közötti időszak jogai érvénytelenné válnának","Helyes. Ha kötőerejű lenne, az 1944. március 19. és 1990. május 2. közötti időszak jogai érvénytelenné válnának, ezért az értékvallomás-felfogás a meggyőzőbb."],["Teljes jogi kötőerejű, ezért érvénytelen minden, a szocializmus alatt kötött házasság és szerződés","Nem: ez elfogadhatatlan jogbizonytalanságot okozna."],["Teljes jogi kötőerejű, mert az R) cikk szerint az Alaptörvényt vele összhangban kell értelmezni","Az értelmezési szabály nem teszi jogilag kötelező normává."],["Nincs jogi jelentősége, mert az Alkotmánybíróság kizárta az Alaptörvény szövegéből","Nem: értelmezési szerepe van, de a kötőereje vitatott."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik kulcseseményhez kapcsolódik az Alaptörvény negyedik módosítása?",[["Az Átmeneti rendelkezések AB általi megsemmisítése; a módosítás csak eljárásilag vizsgálható","Helyes. Az alkotmánymódosítás tartalmilag nem, csak eljárásilag vizsgálható az AB által."],["Az Alaptörvény elfogadásának eljárása és a köztársasági elnök általi aláírása és kihirdetése","Nem ehhez kapcsolódik."],["A rendszerváltás és a háromoldalú tárgyalások lezárása az alkotmánymódosítással együtt","Nem ehhez kapcsolódik."],["Az uniós csatlakozás miatti szuverenitás-átruházási szabályok bevezetése az Alaptörvénybe","Nem ehhez kapcsolódik."]],0],[1,"T","IV. Magyar alkotmányfejlődés","A felülalkotmányozás azt jelenti, hogy amit az Alkotmánybíróság alkotmányellenesnek mondott ki, azt az alkotmányozó beemeli az Alaptörvénybe, és ezzel „alkotmányossá” teszi.",true,"Igaz. Az Alaptörvény módosításainak legvitatottabb jellemzője éppen ez: az AB-döntések felülalkotmányozása és az AB hatásköreinek szűkítése."],[1,"C","IV. Magyar alkotmányfejlődés","Mit tartalmaz az Alaptörvény a határon kívül élő magyarságról?",[["A határon túli magyarokat a nemzet részének tekinti; eszköze a státusztörvény és a kedvezményes honosítás","Helyes. További eszköz a lakóhelytől független választójog; a státusztörvény a 2001. évi LXII. törvény."],["Csak az állampolgárságot szabályozza, minden határon túli magyar automatikusan állampolgár","Ennél több, és nem automatikus az állampolgárság."],["Nem rendelkezik róluk; a határon túli magyarok kérdése kizárólag nemzetközi jogi ügy","Az Alaptörvény rendelkezik róluk."],["Csak a kisebbségi önkormányzatokat említi, amelyek a szomszédos országokban működnek","Nem csak ezt említi."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Miért nem építették be teljes egészében az EU Alapvető Jogok Kartáját az Alaptörvénybe?",[["A Velencei Bizottság nem javasolta a teljes átvételt, ezért inspirációs forrásként használták","Helyes. A Kartát és az EJEE-t inspirációs forrásként használták."],["Mert Magyarország az Alaptörvény elfogadásakor még nem volt az Unió tagja","Magyarország ekkor már EU-tag volt."],["Mert az Alkotmánybíróság a teljes beemelést alkotmányellenesnek mondta ki","Nem ez történt."],["Mert az Alaptörvény nem tartalmaz alapjogi katalógust, ezért nincs mivel összehangolni","Tartalmaz alapjogi katalógust."]],0],[2,"C","Alkotmányosság fogalma","Miért nem elég az alkotmányosság megállapításához, hogy az államnak van alkotmánya?",[["Mert az alkotmányosság az alapelvek tényleges érvényesülése, alkotmánya a diktatúráknak is van","Helyes."],["Mert csak a kartális alkotmány számít alkotmánynak, a történeti alkotmány nem elegendő","Nem: a történeti alkotmány is alkotmány."],["Mert az alkotmányosság fogalma csak az Európai Unió tagállamaiban értelmezhető jogilag","Nem."],["Mert alkotmányos állam csak köztársasági államformájú és írott alkotmányú ország lehet","Nem: monarchia is lehet alkotmányos."]],0],[2,"C","Alkotmányosság fogalma","Melyik NEM tartozik az alkotmányosság öt alapelve közé?",[["A demokrácia, vagyis a hatalom népi legitimációja","Az alkotmányosság öt alapelvének egyike."],["A pluralizmus, vagyis a politikai és világnézeti sokszínűség védelme","Az alkotmányosság öt alapelvének egyike."],["Az államforma köztársasági jellege, a monarchia kizárásával","Helyes. Az öt alapelv: demokrácia, pluralizmus, jogállamiság, hatalommegosztás, az alapjogok tényleges érvényesülése. Az államforma nem tartozik ide."],["A hatalommegosztás, vagyis a hatalmi ágak egyensúlya","Az alkotmányosság öt alapelvének egyike."]],2],[2,"T","Pluralizmus","A politikai pluralizmus azt jelenti, hogy demokratikus államban minden pártot működni kell hagyni, céljaitól függetlenül.",false,"Hamis. A szabadság nem korlátlan: a párttörvény követelményeket támaszt (külföldi forrás tilalma, elszámolási kötelezettség, az ÁSZ ellenőrzése, a hatalom kizárólagos megszerzésére irányuló tevékenység tilalma). Párt betiltása a követelmények megsértése esetén önmagában nem sérti a pluralizmust."],[2,"C","Pluralizmus","A magyar párttörvény szerint a pártokra az alábbiak közül mi igaz?",[["Külföldi forrásból is kaphatnak támogatást, ha azt bejelentik az ÁSZ-nak","Nem fogadhatnak el külföldi forrást."],["Szigorú elszámolási kötelezettség terheli őket, és az ÁSZ ellenőrzi a működésüket","Helyes."],["Tevékenységük irányulhat a hatalom kizárólagos megszerzésére, ha ezt a programjuk kimondja","Ez tilos."],["Csak a tagdíjbevételükről kell elszámolniuk, a támogatásaikról nem","Szigorú elszámolási kötelezettségük van a támogatásokról is."]],1],[2,"C","Pluralizmus","Miért nem volt demokratikus a kommunista Magyarország a pluralizmus szempontjából?",[["Mert nem volt valódi pártverseny: a választó nem választhatott versengő alternatívák között","Helyes. A pluralizmus lényege a pártok szabad versenye."],["Mert nem működött parlament, a törvényeket kizárólag a minisztertanács alkotta","Volt (formális) országgyűlés."],["Mert nem volt írott alkotmány, csak a pártprogram határozta meg a működést","Volt: az 1949. évi XX. törvény."],["Mert az államforma nem köztársaság volt, és ez a pluralizmust kizárja","Az államforma nem a pluralizmus kérdése."]],0],[2,"R","Pluralizmus","A demokrácia mérésénél a választások megtartása önmagában nem elegendő.","A látszatversenyben a valódi kihívást jelentő pártokat a szavazás előtt kizárják, így formálisan van pártverseny, valójában nincs.","A","Igaz: a döntő a verseny valódisága.","Igaz: ez a látszatverseny esete (pl. a mai orosz gyakorlat).","A látszatverseny példa arra, miért nem elég a választások megtartása: a második állítás magyarázza az elsőt."],[2,"C","Világnézeti pluralizmus","Mi a világnézeti pluralizmus lényege és határa?",[["Mindenki abban hisz, amiben akar, amíg mást vagy önmagát nem veszélyezteti","Helyes. A korlát meghúzása a nehéz kérdés."],["Az állam előírja az egységes világnézetet, amelyet minden állampolgárnak követnie kell","Ez a pluralizmus tagadása."],["Csak a vallásos meggyőződés védett, a nem vallásos világnézet nem","Nem csak a vallásos nézetek védettek."],["A világnézet gyakorlása korlátlan, mert a meggyőződés szabadsága abszolút jog","A határ a mások veszélyeztetése."]],0],[2,"C","Világnézeti pluralizmus","A kötelező védőoltás példája mit mutat a világnézeti pluralizmus határairól?",[["A meggyőződés szabad, de a cselekvés (az oltás elmulasztása) az életvédelem miatt korlátozható","Helyes. Az oltás elmulasztása rontja a nyájimmunitást, mások egészségét veszélyezteti; az állam életvédelmi kötelezettsége miatt végső soron kényszeroltás alkalmazható."],["A lelkiismereti szabadság kiterjed arra is, hogy az állampolgár megtagadja a kötelező oltást","A döntési szabadságot az állam itt nem biztosítja."],["Az állam nem avatkozhat be az egészségügybe, mert az a magánélet védett része","Az életvédelmi kötelezettség alapján beavatkozhat."],["Az oltás kötelezővé tétele minden esetben alkotmányellenes, mert sérti a testi épséget","A példa éppen azt mutatja, hogy az életvédelem korlátozhatja a cselekvést."]],0],[2,"T","Világnézeti pluralizmus","A romániai kanyarójárvány a példa arra, hogy az oltatlanság mások egészségét is veszélyezteti.",true,"Igaz. A kanyaró elleni oltás nem volt kötelező, sokan nem oltatták be gyermeküket, és járvány tört ki olyan betegségből, amelyet a térség korábban gyakorlatilag felszámolt."],[2,"C","Demokrácia","Ki dolgozta ki elsőként a szuverén fogalmát, és milyen értelemben?",[["Jean Bodin; az uralkodó legitimációját alapozta meg: a király hatalma Istentől ered","Helyes. A koronázási olajozás ennek a szertartási lenyomata."],["Rousseau; a nép szuverenitását fogalmazta meg a társadalmi szerződés alapján","Rousseau a gondolatot megfordította, de nem ő dolgozta ki elsőként."],["Montesquieu; a szuverén hatalmát a hatalmi ágak között osztotta meg","Montesquieu a hatalommegosztás teoretikusa."],["Locke; az uralkodó korlátlan hatalmát védő elméletet dolgozott ki","Locke a nép felől közelített."]],0],[2,"R","Demokrácia","A demokratikus államban a hatalom nem Istentől, hanem a néptől ered.","Locke, Hobbes és Rousseau a szuverenitás gondolatát megfordította, és a társadalmi szerződés eszméjére építette.","A","Igaz: a népszuverenitás a demokrácia alapja.","Igaz: a korábbi, isteni eredetű (Bodin-féle) felfogást ők fordították meg.","A második állítás magyarázza az elsőt: a társadalmi szerződés elmélete teremtette meg a népszuverenitás gondolatát. (A francia Emberi és Polgári Jogok Nyilatkozata és az amerikai függetlenségi nyilatkozat is ezt tükrözi.)"],[2,"C","Demokrácia","Mi a demokratikus legitimáció lényege?",[["Minden közhatalom-gyakorló hatalma megszakítatlan láncon át visszavezethető a népre","Helyes."],["Elegendő, ha a hatalomgyakorló az államtól kap felhatalmazást a feladatához","A lényeg a lánc megszakítatlansága, végül a népig."],["Csak a közvetlenül, népszavazással megválasztott tisztviselők tekinthetők legitimnek","Közvetett láncolat is lehet legitim (pl. a rendőr)."],["A legitimációt a bíróság adja, amely felülvizsgálja a hatalomgyakorlók kinevezését","A legitimáció forrása a nép."]],0],[2,"C","Demokrácia","Mi a helyes legitimációs lánc az igazoltató rendőr esetében?",[["Nép → Országgyűlés → köztársasági elnök és miniszterelnök → belügyminiszter → országos rendőrfőkapitány → rendőr","Helyes. A lánc megszakítatlan, ezért a közhatalom-gyakorlás legitim. A belügyminisztert a köztársasági elnök nevezi ki a miniszterelnök javaslatára."],["Nép → köztársasági elnök → országos rendőrfőkapitány → intézkedő rendőr, a kormány megkerülésével","Kimarad az Országgyűlés és a kormány."],["Nép → bíróság → ügyész → rendőrfőkapitány → intézkedő rendőr, a végrehajtó hatalmon kívül","A bíróság nem része a láncnak."],["Nép → polgármester → helyi rendőrkapitány → intézkedő rendőr, az önkormányzat irányításával","Az országos rendőrség nem a polgármestertől függ."]],0],[2,"T","Demokrácia","A kommunista időszakban a legitimációs láncolat azért szakadt meg, mert a valódi hatalmat a Népköztársaság Elnöki Tanácsa gyakorolta, amelyet nem a nép választott.",true,"Igaz. Ez önmagában kizárja, hogy demokráciáról beszéljünk."],[2,"C","Jogállam","Melyik fogalommal ragadható meg legjobban a jogállamiság lényege?",[["A kiszámíthatóság: a hatalomgyakorlás a jogszabályok által meghatározott rendben zajlik","Helyes. A rule of law a jog uralmát jelenti."],["A gyorsaság: a döntéshozatal a lehető leggyorsabban, hatékonyan történik","A jogállamiság nem a gyorsaságról szól."],["A szigor: a jogsértéseket a lehető legszigorúbb szankciókkal kell elhárítani","A jogállamiság nem a szigorúságról szól."],["Az egyszerűség: a szabályozás rövid, mindenki számára átlátható szövegekből áll","A jogállamiság nem az egyszerűségről szól."]],0],[2,"C","Jogállam","Az AB 1990-es évekbeli meghatározása szerint mikor érvényesül a jogbiztonság?",[["Ha a normák megismerhetők, mindenki számára érthetők, és van idő a felkészülésre","Helyes."],["Ha a normák elsősorban a jogászok számára érthetők, és a szakma képes alkalmazni őket","Mindenki számára érthetőnek kell lenniük."],["Ha a jogszabályok szükség esetén visszamenőleg is hatályosak, így az igazságosság érvényesül","A visszamenőleges hatály sérti a jogbiztonságot."],["Ha a bíróság minden jogkérdésben egyedi mérlegeléssel dönt, jogszabálytól függetlenül","Ez nem a jogbiztonság meghatározása."]],0],[2,"T","Jogállam","A tisztességes eljáráshoz való jog az eljárási jogbiztonság, amelynek hatósági és bírósági ága is van.",true,"Igaz. Az eljárásokban tudnom kell a jogaimat, kötelezettségeimet, hogyan születik döntés, és milyen jogorvoslat áll rendelkezésre."],[2,"C","Jogállam","Melyik eset sérti a jogállamiság kiszámíthatósági követelményét?",[["Az állam a futamidő végéig garantált kamattámogatást utólag megszünteti","Helyes. A szerződéskötéskor mást ígértek, a jogviszony kiszámíthatatlanná válik."],["Az öt évre garantált kamatot az állam ötévente felülvizsgálja, és felül is vizsgálja","A felülvizsgálat lehetősége eleve a konstrukció része volt, számítani lehetett rá."],["A lakás-előtakarékossági támogatást csak az új szerződésekre szüntetik meg","A fennálló jogviszonyokat nem érinti."],["Új adónem bevezetése megfelelő felkészülési idővel, a jövőre nézve","Megfelelő felkészülési idő esetén nem sérti a jogbiztonságot."]],0],[2,"T","Jogállam","A kiszámíthatóság sérelme attól függ, hogy a változtatás kellemetlen-e az érintettnek.",false,"Hamis. A döntő az, hogy az érintett számíthatott-e a változtatásra. Ha a módosítás lehetősége eleve be volt építve a jogviszonyba, a kiszámíthatóság nem sérül."],[2,"T","Jogállam","A hivatalban lévő köztársasági elnök alaptörvény-módosítással való eltávolítása szembemegy a kiszámíthatóság követelményével.",true,"Igaz. A tankönyvi eset: az ilyen beavatkozás a jogállamiság ellen hat."],[2,"C","Jogállam","Mit mond ki a Sólyom-tétel („a jogállamot nem lehet a jogállam ellenében megvalósítani”)?",[["A jogállami átmenethez is jogállami eszközök kellenek, különben a végeredmény sem lesz jogállam","Helyes. Sólyom László az igazságtételi törvényt megsemmisítő döntéshez fűzött párhuzamos indokolásában fogalmazta meg."],["A jogállam csak forradalommal teremthető meg, mert az átmenet jogi eszközei elégtelenek","Éppen ellenkezőleg."],["A jogállam ellen is bármi megtehető, ha az eredmény az igazságosság érvényesülése","Ez a tétel tagadása."],["A jogállam kizárólag az Európai Unió tagállamaiban értelmezhető és kérhető számon","Nincs köze az EU-hoz."]],0],[2,"C","Jogállam","Melyik példa illusztrálja, hogy a jogbiztonság és az igazságosság ütközhet, és ütközés esetén a jogbiztonságnak van elsőbbsége?",[["A 98%-os különadó AB általi megsemmisítése és a visszamenőleges el nem évülés kérdése","Helyes. Az igazságérzet kielégítése nem elsődleges, ha az a jogbiztonság rovására megy."],["A rendőr igazoltatási jogköre és a szabad mozgás korlátozhatósága közötti viszony","Ez a legitimációs lánc példája, nem a jogbiztonság–igazságosság ütközésé."],["A kötelező védőoltás és a lelkiismereti szabadság kölcsönös viszonya a gyakorlatban","Ez a világnézeti pluralizmus határait illusztrálja."],["A pártok betiltásának feltételei és a politikai pluralizmus korlátai a párttörvényben","Ez a pluralizmus határait illusztrálja."]],0],[2,"R","Jogállam","A 98%-os különadó törvényt az Alkotmánybíróság megsemmisítette.","A korábbi munkajogi szabályozás szerint a kifizetések jogszerűek voltak, a visszamenőleges megadóztatás pedig a jogbiztonságot sértette, noha az igazságérzetnek megfelelt.","A","Igaz.","Igaz: nem írt elő minimális időtartamot, a kifizetések jogszerűek voltak.","A megsemmisítés oka éppen a jogbiztonság sérelme volt; az igazságérzet nem elég."],[2,"C","Jogállam","Mit tartalmaz a kényszervallatás tankönyvi esete a jogállamiság szempontjából?",[["A kínzás ilyen esetben sem megengedett, mert a jogállam ára, hogy a jog kényszervallatást nem tűr","Helyes. A kislány megtalálása érdekében sem fér bele a kínzás; a dilemma feloldhatatlan."],["A kínzás ilyen szélsőséges esetben megengedett, mert az emberélet védelme minden tilalmat felülír","A jogállam a kínzást alapkövetelményként tiltja."],["Az igazságosság mindig felülírja a jogbiztonságot, ezért a kényszervallatás indokolható lenne","Ütközéskor a jogbiztonságnak van elsőbbsége."],["A bíróság előzetesen engedélyezheti a kényszervallatást, ha az életmentés érdekében szükséges","Ilyen bírói hatáskör nincs."]],0],[2,"C","Jogállam","Mit jelent a jogállamiság fogalmának „eróziója”?",[["A fogalom gumiszabállyá, gyűjtőfogalommá vált (főleg az EU-gyakorlatban), ezért hitelét veszti","Helyes. A lengyel példa a kettős mércére: kormányváltás után tartalmi változtatás nélkül feloldották a forrásokat."],["A jogállamiság az Unióban megszűnt, mert a tagállamok kiléptek a közös értékrendből","Nem erről van szó."],["A jogállamiság szigorúbbá vált, ezért a tagállamok már nem tudják teljesíteni","Éppen ellenkezőleg: elvesztette az élét."],["A jogállamiságot kizárólag az AB alkalmazza, más szerv nem hivatkozhat rá","Nem erről szól."]],0],[2,"C","Jogállam","A „kormányváltás – rezsimváltás – rendszerváltozás” hármas esetében mit cserélünk le?",[["Kormányváltás: a játékosokat; rezsimváltás: a játékszabályokat; rendszerváltozás: magát a játékot","Helyes. A kétharmados felhatalmazás joggal ad lehetőséget a játékszabályok átírására, de a játék (demokrácia) maga ne változzon."],["Kormányváltás: a játékot; rezsimváltás: a játékosokat; rendszerváltozás: a játékszabályokat","Felcserélt."],["Kormányváltás: a játékszabályokat; rezsimváltás: a játékosokat; rendszerváltozás: a játékot","Felcserélt: a kormányváltás a játékosok cseréje."],["Mindhárom ugyanazt jelenti, csak más-más politikai közegben használják őket","Három különböző mértékű változás."]],0],[2,"C","Hatalommegosztás","Mi jellemző a klasszikus amerikai (checks and balances) hatalommegosztásra?",[["A hatalmi ágak függetlenek egymástól, de kölcsönösen kontrollálhatják és ellensúlyozhatják egymást","Helyes. Elefántcsonttorony-kép."],["A kormány a parlament bizalmából létezik, és a parlament bizalmatlansággal elmozdíthatja","Ez a magyar/európai parlamentáris modell jellemzője."],["A törvényhozás és a végrehajtás szoros összefonódása, kölcsönös függőséggel és közös felelősséggel","Az amerikai rendszerben ez a kapcsolat hiányzik."],["Egyik hatalmi ág sem ellenőrizheti a másikat, így mindegyik teljesen önálló","Éppen az ellenőrzés a lényeg."]],0],[2,"C","Hatalommegosztás","Mi a modern, európai értelemben vett hatalommegosztás lényege a libikóka-hasonlat szerint?",[["Az egymást ellensúlyozni képes hatalmi ágak egyensúlya, akkor is, ha az egyik kiemelkedően fajsúlyos","Helyes. Nem elválasztás, hanem egyensúlyozás."],["A három hatalmi ág szigorú elválasztása és egymástól való teljes függetlensége","Ez a klasszikus amerikai logika."],["Az egyik hatalmi ág tartós alárendelése a másiknak a hatékonyabb kormányzásért","Ez nem hatalommegosztás."],["A hatalmi ágak összeolvadása egyetlen döntéshozó szervben a gyorsabb döntésért","Ez nem hatalommegosztás."]],0],[2,"R","Hatalommegosztás","A magyar rendszerben a kormány a legfőbb törvénykezdeményező, ezért a miniszterelnök szava a döntő.","A magyar államszervezetben a végrehajtó hatalom kiemelkedően erős, mögötte parlamenti többség áll.","A","Igaz: a kormány a fő törvénykezdeményező.","Igaz: a kormány a jogalkotásban és a közigazgatásban meghatározó.","A kiemelkedően erős végrehajtó hatalom és a mögötte álló többség magyarázza a miniszterelnök döntő szerepét."],[2,"C","Hatalommegosztás","Mely szereplők alkotják Magyarországon az erős végrehajtó hatalom ellensúlyát?",[["A parlamenti ellenőrzés (interpelláció, kérdés), az ombudsman, az ügyészség, az AB és a bíróságok","Helyes. További ellenőrző eszköz a bizalmatlansági indítvány."],["Kizárólag a köztársasági elnök, aki a törvényeket minden esetben megvétózhatja, így ellensúlyoz","Nem csak ő."],["Csak a sajtó és a civil szervezetek, mivel intézményi ellensúly nincs a rendszerben","A tankönyv a jogi/intézményi ellensúlyokat sorolja."],["Kizárólag a helyi önkormányzatok, amelyek a végrehajtó hatalmat helyben korlátozzák","Nem ez a felsorolás."]],0],[2,"T","Hatalommegosztás","Ha a magyar berendezkedést a checks and balances logikájával írjuk le, hibás választ adunk, mert nálunk nem elválasztás, hanem egyensúlyozás van, egy eleve erősebb szereplő mellett.",true,"Igaz. A törvényhozás és végrehajtás között szoros összefonódás van: az Országgyűlés választja és mozdíthatja el a miniszterelnököt, a kormány pedig a parlament bizalmából létezik."],[2,"C","Alapjogok","Mit jelent az alkotmányosság ötödik alapelve, az alapjogok tényleges érvényesülése?",[["Nem elég az alapjogok felsorolása, ténylegesen gyakorolhatónak is kell lenniük","Helyes. A kommunista alkotmány is felsorolta az alapjogokat (pl. vallásszabadság), de a gyakorlás hátránnyal járt."],["Elegendő, ha az alapjogok az alkotmányban szerepelnek, a gyakorlás már másodlagos","Ezt a példa éppen cáfolja."],["Csak a politikai jogokra vonatkozik, a gazdasági és szociális jogokra nem","Nem csak azokra."],["Az alapjogok korlátozhatatlanok, ezért gyakorlásuk minden esetben feltétlen és korlátlan","Az alapjogok korlátozhatók, de a tényleges gyakorolhatóság a mérce."]],0],[3,"C","Államforma","Mire ad választ az államforma, és mi a monarchia és a köztársaság közötti elsődleges különbség Max Weber szerint?",[["Az államfői hatalom eredetére; a különbség elsősorban legitimációs","Helyes. A monarchia legitimációja a tradíció és a trónöröklés, a köztársaságé a választás (racionális-jogi legitimáció)."],["A végrehajtó hatalom felelősségére; a különbség elsősorban szervezeti","Ez a kormányforma kérdése."],["A szuverenitás megosztására; a különbség területi","Ez az államszerkezet kérdése."],["A választójogra; a különbség eljárási","Nem erről szól az államforma."]],0],[3,"T","Államforma","A monarchiában a megbízatás élethosszig tart, és az uralkodó kevésbé van kitéve a napi politikának, mint a köztársasági elnök.",true,"Igaz. A köztársasági elnök megbízatása meghatározott időre szól (újraválasztható), és a pártok támogatására szorul."],[3,"T","Államforma","A modern monarchiában a szuverenitás letéteményese a monarcha, nem a nép.",false,"Hamis. A modern államiságban a monarchia sem a monarcha korlátlan szuverenitásán alapul: hatásköre alkotmányosan körülhatárolt, a szuverenitás letéteményese – csakúgy, mint a köztársaságban – a nép."],[3,"C","Államforma","Melyik ország NEM monarchia az alábbiak közül?",[["Hollandia","Monarchia."],["Spanyolország","Monarchia."],["Németország","Helyes. Németország szövetségi köztársaság."],["Dánia","Monarchia."]],2],[3,"C","Kormányforma","Mire ad választ a kormányforma?",[["Arra, hogy a törvényhozás és a végrehajtás milyen viszonyban áll, és felel-e az utóbbi az előbbi előtt","Helyes. A kormányforma az államszervezet dinamikája."],["Arra, hogy az államfői hatalom honnan ered, és az államfő mennyi időre kap megbízatást","Ez az államforma."],["Arra, hogy a szuverenitás megoszlik-e a központi állam és a területi egységei között","Ez az államszerkezet."],["Arra, hogy hány párt működhet az országban, és milyen szabályok szerint választanak","Nincs köze a kormányformához."]],0],[3,"C","Kormányforma","Mi a különbség a politikai és a jogi felelősség között?",[["Politikai: a bizalom indokolás és bizonyítás nélkül megvonható; jogi: csak bizonyított jogsértés esetén","Helyes. A kormány a parlament bizalmán múlva marad hivatalban."],["Politikai: csak bizonyított jogsértés esetén vonható meg; jogi: a parlament bizalmától függ","Felcserélt."],["Mindkettő bizonyított törvénysértést feltételez, csak a szankció mértékében különböznek","A politikai felelősséghez nem kell bizonyítás."],["Mindkettő indokolás nélkül megvonható, mert a parlament bizalma mindkettő alapja","A jogi felelősséghez bizonyított törvénysértés kell."]],0],[3,"C","Kormányforma","Melyik a négy klasszikus kormányforma helyes felsorolása?",[["Prezidenciális, parlamentáris, félprezidenciális, kollegiális","Helyes."],["Prezidenciális, monarchikus, föderális, kollegiális","A monarchia és a föderáció nem kormányforma."],["Parlamentáris, unitárius, regionális, kollegiális","Az unitárius és a regionális államszerkezet."],["Prezidenciális, parlamentáris, konföderális, direktoriális","Nem ez a négy."]],0],[3,"C","Kormányforma","Mi jellemzi a prezidenciális kormányformát?",[["Egyszemélyi elnöki végrehajtás politikai felelősség nélkül; az elnök és a törvényhozás is közvetlen népi legitimációjú","Helyes. Klasszikus példa: USA, „tiszta” hatalommegosztás; kettős legitimáció, az elnök csak jogilag felel."],["A kormány politikailag felel a parlamentnek, és az bizalmatlansággal el is mozdíthatja","Ez a parlamentáris."],["A végrehajtó testület összetétele a parlamenti erőviszonyokat tükrözi, politikai felelősség nélkül","Ez a kollegiális."],["Az elnököt a parlament választja, a kormány pedig az elnöknek tartozik politikai felelősséggel","Nem ez a prezidenciális modell."]],0],[3,"R","Kormányforma","A parlamentáris kormányformában a kormány a parlament bizalmából létezik.","A kormány politikai felelősséggel tartozik a parlamentnek, amely bizalmatlansági indítvánnyal el is mozdíthatja.","A","Igaz.","Igaz.","A politikai felelősség és az elmozdíthatóság éppen azt jelenti, hogy a kormány a parlament bizalmából működik."],[3,"C","Kormányforma","Hogyan jellemzik a parlamentáris kormányformát, amelybe Nagy-Britannia, Németország és Magyarország is tartozik?",[["Erős parlament, közepesen erős kormány, gyenge köztársasági elnök","Helyes."],["Gyenge parlament, erős kormány, közvetlenül választott erős elnök","Ez nem a parlamentáris képlet."],["Erős elnök, gyenge kormány, a parlament csak formális jóváhagyó szerv","A prezidenciális/félprezidenciális modellre hasonlít."],["Egyenlően erős hatalmi ágak, a kölcsönös vétójog rendszerével, mint az USA-ban","Az USA a prezidenciális modell."]],0],[3,"C","Kormányforma","Mi a kancellárelv lényege? (Az AB a 122/2009. (XII. 17.) határozatban fogalmazta meg.)",[["A kormányzati felelősség a miniszterelnökön át érvényesül, ő határozza meg az irányt","Helyes. A miniszterelnök határozza meg a kormány politikájának általános irányát."],["A kancellár vétójoga a törvényekkel szemben: a törvény csak az ő aláírásával lép hatályba","Nem."],["A kormány tagjai közösen kinevezik a bírákat, a kancellár csak a végrehajtásért felel","Nem."],["A miniszterelnököt közvetlenül választják, ezért a parlamentnek nem tartozik felelősséggel","Nem."]],0],[3,"C","Kormányforma","Mi jellemzi a félprezidenciális kormányformát?",[["Közvetlenül választott elnök mellett a parlamentnek felelős kormány; az elnök nem felel a parlamentnek (kettős vezetés)","Helyes. Esetenként cohabitation; példa: Franciaország, V. Köztársaság, 1958."],["Egyetlen személy gyakorolja a végrehajtó hatalmat, és a parlamentnek sem jogilag, sem politikailag nem felel","Ez a prezidenciális."],["A végrehajtó testület a parlamenti erőviszonyokat tükrözi, és politikai felelősség nélkül működik","Ez a kollegiális."],["A monarcha irányítja a kormányt, amely az uralkodó bizalmától függ, nem a parlamentétől","Nem ez a félprezidenciális."]],0],[3,"T","Kormányforma","A politikai társbérlet (cohabitation) akkor áll elő, amikor a közvetlenül választott elnök és a kormányfő eltérő politikai oldalhoz tartozik.",true,"Igaz. A félprezidenciális modell „kettős vezetése” járhat ezzel."],[3,"C","Kormányforma","Mi jellemzi a kollegiális kormányformát, és melyik a tiszta példa?",[["A testület a parlamenti erőviszonyokat tükrözi, és nem felel a parlamentnek; svájci Szövetségi Tanács","Helyes."],["Az elnök egyszemélyi vezetése, közvetlen népi legitimációval, politikai felelősség nélkül; USA","Ez az elnöki kormányforma."],["A kormány bizalmatlansági indítvánnyal elmozdítható, parlamenti többségből alakul; Magyarország","Ez a parlamentáris kormányforma."],["A kormányt a király nevezi ki, és az uralkodónak felel, nem a parlamentnek; Spanyolország","Nem."]],0],[3,"C","Államszerkezet","Mi az államszerkezet szempontjából az unitárius állam lényege?",[["A szuverenitás osztatlan: csak az államnak van, a kisebb egységek csak közigazgatási egységek, nem szakadhatnak ki","Helyes. Magyarország is ide tartozik."],["A szuverenitás megoszlik az állam és a tagállamok között, mindkettőnek van saját alkotmánya","Ez a föderáció."],["A régióknak saját alkotmányuk és törvényhozásuk van, a központ csak a közös ügyeket intézi","Ez a föderáció."],["Az államot nemzetközi szerződés hozta létre, és a tagok szuverenitása teljes marad","Ez a konföderáció."]],0],[3,"C","Államszerkezet","Mi a különbség a centralizált és a decentralizált unitárius állam között?",[["Centralizáltban a központ szervezi a feladatokat (Magyarország), decentralizáltban önálló egységekre bíz (Franciaország)","Helyes."],["Centralizáltban osztott a szuverenitás, decentralizáltban osztatlan, ezért a központ itt gyengébb, mint ott","Unitárius államban a szuverenitás mindkét esetben osztatlan."],["Decentralizáltban az önálló egységek külön állammá válhatnak, centralizáltban erre nincs jogi lehetőség","Nem."],["Nincs különbség, a két elnevezés ugyanazt jelöli, csak a szakirodalom használja őket eltérő módon","Van különbség."]],0],[3,"T","Államszerkezet","A decentralizált unitárius állam helyi testületeinek hatásköre eredeti, és a központ nem vonhatja el.",false,"Hamis. A decentralizált unitárius államban a hatáskör a központi jogalkotótól származtatott, a központ bármikor elvonhatja vagy módosíthatja. A föderáció tagállamának vannak saját, le nem vezetett eredeti hatáskörei."],[3,"C","Államszerkezet","Mit jelent a szubszidiaritás?",[["A feladatot ott kell ellátni, ahol azt a leghatékonyabban és a problémához legközelebb lehet","Helyes. Két szempont metszete; példa: a kiömlött patak gátjának megépítése helyben."],["A feladatokat mindig a központi szintnek kell ellátnia, a helyi szint csak végrehajt","Ez az ellentéte."],["Az Unió és a tagállamok szuverenitásának megosztását, tehát hatáskör-átruházást","Nem erről szól."],["A bíróságok függetlenségét és a bírói hatalom önálló szervezeti szintjeit","Nem erről szól."]],0],[3,"C","Államszerkezet","Mi a dekoncentráció?",[["A központi feladat vertikális tagolása országos, területi és helyi szintre; a feladat központi marad","Helyes. Példa a rendőrség: ORFK, vármegyei és fővárosi, városi kapitányságok, rendőrőrsök."],["A szuverenitás megosztása a központi állam és a tagállamok között, eredeti hatáskörrel","Ez a föderáció."],["Az önkormányzatok önálló döntési joga a saját helyi ügyeikben, eredeti hatáskörrel","Ez a decentralizációhoz/szubszidiaritáshoz kapcsolódik."],["A hatáskörök központosítása a minisztériumokban, a területi szervek megszüntetésével","Ez az ellentéte."]],0],[3,"R","Államszerkezet","A magyar helyi önkormányzatok létezése nem teszi decentralizálttá a magyar államot.","A központi feladatellátás a centralizált államban továbbra is a központban dől el.","A","Igaz: a szubszidiaritás miatt decentralizált egységek centralizált államban is létrejöhetnek.","Igaz.","A feladatellátás súlypontja a központban marad, ezért az önkormányzatok léte nem teszi decentralizálttá az államot."],[3,"C","Államszerkezet","Mi a föderatív állam fő jellemzője?",[["Osztott szuverenitás: a szövetségi államnak és a tagállamoknak is van önálló szuverenitása, saját alkotmánya","Helyes. A tagállamnak saját kormánya, törvényhozása is lehet."],["Osztatlan szuverenitás, a régióknak jelentős mozgástérrel és saját kormánnyal, de saját alkotmány nélkül","Ez a regionális állam."],["A tagállamok nem rendelkezhetnek saját alkotmánnyal, a szuverenitás kizárólag a szövetségi államé","Rendelkezhetnek saját alkotmánnyal."],["Az államot nemzetközi szerződés hozta létre, a tagok teljes szuverenitást megtartva, államiság nélkül","Ez a konföderáció."]],0],[3,"C","Államszerkezet","Mi a különbség az egyesítő és a szétválasztó föderáció között?",[["Egyesítőnél szuverén tagállamok hoznak létre közös államot (USA), szétválasztónál a központ ad át hatalmat (Belgium)","Helyes."],["Az egyesítő centralizáltabb, a szétválasztó decentralizáltabb, ezért a működésükben alapvetően különböznek","Nem ez a különbség alapja."],["Az egyesítő nem tekinthető valódi föderációnak, mert a tagállamok megőrzik teljes szuverenitásukat","Nem."],["A szétválasztónál osztatlan marad a szuverenitás, mert az végig a központi államnál marad","Nem."]],0],[3,"T","Államszerkezet","Elméletileg a föderáció tagállama kiléphetne a szövetségből, mert van szuverenitása; az amerikai alkotmány a gyakorlatban kifejezetten tiltja a kilépést.",true,"Igaz. Szuverenitási szempontból a lehetőség elvi szinten fennállna – ez különbözteti meg a föderációt a regionális államtól –, a gyakorlatban azonban a kilépés tilalma rögzített."],[3,"C","Államszerkezet","Mi a regionális állam?",[["Köztes megoldás: osztatlan szuverenitás, de a régióknak mozgástere és saját kormánya van, alkotmánya nincs","Helyes."],["A szuverenitás osztott, a régióknak saját alkotmányuk és kilépési jogosultságuk is van, mint az államoknak","Ez a föderáció."],["A szuverenitás osztatlan, a régiók kizárólag közigazgatási egységek, önálló döntési jog nélkül","Ez a decentralizált unitárius állam."],["Az Európai Unió tagállamainak szövetsége közös szuverenitással, a régiók részvételével a döntésben","Nem."]],0],[3,"C","Államszerkezet","Mi az autonómia?",[["A központi szuverén hatalom által biztosított önrendelkezés, amelynek terjedelmét ő határozza meg","Helyes."],["A tagállam eredeti, a szövetségi alkotmányból le nem vezetett szuverenitása, amely nem vonható vissza","Ez a föderáció tagállamára jellemző."],["A közösség kiválási joga, ha a központi hatalom a jogait tartósan és súlyosan megsérti","Nem."],["Valamely nemzetközi szervezet hatásköre, amelyet a tagállamok átruháztak rá a szerződésekben","Nem."]],0],[3,"C","Államszerkezet","Mit mutat a katalán függetlenségi népszavazás esete?",[["Szuverenitás nélkül a mozgástér addig terjed, ameddig a központ engedi; népszavazáshoz hozzájárulás kell","Helyes."],["Hogy a régió szuverén állam, ezért a függetlenségéről önállóan is kiírhat népszavazást a területén","Nem."],["Hogy a regionális államban a régió a saját alkotmánya alapján jogszerűen kiléphet, ha a többség akarja","Nem."],["Hogy az Unió megosztja a szuverenitást a régiókkal, és védi azok kiválási jogát a tagállamokkal szemben","Nem."]],0],[3,"C","Államszerkezet","Melyik állítás igaz Magyarországra, Spanyolországra és az USA-ra?",[["Magyarország unitárius állam, Spanyolország regionális állam, az USA föderatív állam","Helyes."],["Magyarország regionális állam, Spanyolország unitárius állam, az USA föderatív állam","Magyarország unitárius, Spanyolország pedig regionális."],["Magyarország unitárius állam, Spanyolország föderatív állam, az USA regionális állam","Spanyolország regionális, az USA pedig föderatív."],["Magyarország föderatív állam, Spanyolország regionális állam, az USA unitárius állam","Magyarország unitárius, az USA föderatív: itt a két szélső eset fel van cserélve."]],0],[3,"C","Államszerkezet","Mi volt az Osztrák–Magyar Monarchia 1867–1918 között államszerkezeti szempontból?",[["Reálunió: közös államfő mellett közösen ellátott ügyek (külügy, hadügy, pénzügy)","Helyes."],["Perszonálunió: a két országot csak a közös uralkodó személye köti össze","A közös ügyek miatt reálunió."],["Konföderáció: nemzetközi szerződésen alapuló szövetség önálló államok között","A konföderáció nemzetközi szerződésen alapuló társulás, ez nem az volt."],["Unitárius állam: egyetlen kormánnyal és egyetlen országgyűléssel Bécs vezetésével","Két külön állam volt."]],0],[3,"R","Európai Unió","Az Európai Unió nem értelmezhető a klasszikus államszerkezeti felosztás (unitárius, regionális, föderatív) keretében.","Az EU nem állam, hanem nemzetközi szerződéssel létrehozott szupranacionális nemzetközi szervezet.","A","Igaz: aki az Uniót föderatív vagy regionális államnak sorolja, fogalmi hibát követ el.","Igaz.","Mivel az EU nem állam, az államszerkezeti kategóriák nem alkalmazhatók rá."],[3,"C","Európai Unió","Mi a kulcstétel az Unió és a szuverenitás viszonyáról?",[["Hatáskörmegosztásról van szó: az Unió nem saját szuverenitása miatt dönt, hanem mert a tagállamok így határoztak","Helyes. Pl. a közös vámpolitika."],["Az Unió szuverén állam, amely a tagállamok fölött önálló, saját szuverenitást gyakorol, szerződés nélkül","Az Unió nem állam."],["A tagállamok teljesen lemondtak szuverenitásukról, ezért az Unió minden kérdésben korlátlanul dönthet","Nem."],["Az Unió és a tagállamok szuverenitása osztott, mint egy föderációban, ahol a tagállamoknak is vannak eredeti hatáskörei","Nem szuverenitás-, hanem hatáskörmegosztás van."]],0],[4,"C","I. Szuverenitás","Mit jelent alkotmányos értelemben a szuverenitás?",[["Népszuverenitást (a népre visszavezethető hatalmat) és államszuverenitást (az állam önállóságát) egyaránt","Helyes."],["Csak a népszuverenitást, vagyis a népre visszavezethető hatalom elvét és annak gyakorlását","Mindkettőt jelenti."],["Csak az államszuverenitást, vagyis az állam önálló döntéshozatali képességét kifelé és befelé","Mindkettőt jelenti."],["A bírói függetlenséget és a hatalommegosztást mint az állami működés két alapelvét együtt","Nem."]],0],[4,"C","I. Szuverenitás","Mi a jellineki triász?",[["Az állam három ismérve: terület
