, népesség, főhatalom; ha bármelyik hiányzik, nem beszélhetünk államról","Helyes. Jellinek az államszuverenitás tanához kapcsolódik."],["A hatalommegosztás három ága: törvényhozó, végrehajtó és bírói hatalom Jellinek szerint","Ez Montesquieu nevéhez fűződik."],["A demokrácia három feltétele: szabad választás, pártverseny és a sajtószabadság","Nem ez a triász."],["Az államforma három típusa: a monarchia, a köztársaság és a diktatúra","Nem ez a triász."]],0],[4,"C","I. Szuverenitás","A jellineki triász mely eleme hiányzik Palesztina és a kurdok esetében?",[["Mindkettőnél a saját államterület hiányzik, van népesség és szervezett vezetés","Helyes. Palesztinának van kormányzata és népessége, de nincs olyan területe, amelyen az államiság ténylegesen megvalósulhatna; a kurdoknak szintén nincs saját területük."],["Palesztinánál a népesség hiányzik, a kurdoknál pedig a szervezett főhatalom","Palesztinának van népessége."],["Mindkettőnél a főhatalom hiányzik, mert nincs nemzetközileg elismert kormányuk","A kurdoknál van szervezett vezetés; a hiányzó elem a terület."],["Egyiknél sem hiányzik a triász eleme, mindössze a nemzetközi elismerés hiányzik","Mindkettőnél a terület hiányzik."]],0],[4,"R","I. Szuverenitás","A jellineki triász szükséges, de nem mindig elégséges feltétele az államiságnak.","Koszovónak elvileg van területe, népessége és főhatalma, nemzetközi elismertsége mégis számos országban vitatott.","A","Igaz: a gyakorlatban a nemzetközi elismerés negyedik, íratlan feltételként szerepel.","Igaz: az alkotmánya nemzetközi szerződés melléklete, a rendet békefenntartók biztosítják.","A koszovói példa azt mutatja, hogy a triász teljesülése mellett is hiányozhat valami: a nemzetközi elismerés."],[4,"C","I. Szuverenitás","Mi az államszuverenitás önkorlátozásának tétele?",[["Az állam szuverenitását csak és kizárólag saját maga korlátozhatja","Helyes. A nemzetközi szerződéshez csatlakozás ezért nem szuverenitássértés."],["Az állam szuverenitását a nála erősebb állam is jogszerűen korlátozhatja","Ha kívülről, más állam akaratából korlátozzák, a szuverenitás megszűnik."],["A szuverenitás az állam szervei által soha, semmilyen módon nem korlátozható","Önkorlátozás lehetséges."],["Az állam szuverenitását kizárólag a nép korlátozhatja, népszavazás útján","Az állam maga korlátozza."]],0],[4,"T","I. Szuverenitás","Ha egy ország csatlakozik az Emberi Jogok Európai Egyezményéhez, és a strasbourgi bíróság kártérítésre kötelezi, ez sérti az állam szuverenitását.",false,"Hamis. Az állam maga tette lehetővé: aláírta a szerződést, belépett a szervezetbe, és ezzel maga korlátozta a szuverenitását. A szuverenitás akkor szűnik meg, ha a korlátozás kívülről, más állam akaratából érkezik."],[4,"C","I. Szuverenitás","Melyek a szuverenitás hagyományos állami jelképei Magyarországon?",[["A Himnusz, a zászló és a címer; az Alaptörvény rögzíti, törvény szabályozza a használatukat","Helyes. Sarkalatos törvény szabályozza a használatot, és büntetőjogi védelem övezi őket; a meggyalázásuk bűncselekmény."],["A Szent Korona és a koronázási palást; az Alaptörvény ezeket nevesíti jelképként","Az Alaptörvény nem ezeket sorolja."],["A Himnusz és a Szózat; mindkettőt az Alaptörvény Nemzeti hitvallása rögzíti","Nem ez a felsorolás."],["Csak a zászló és a címer; a Himnusz nem tekinthető hivatalos jelképnek","Három jelkép van, a Himnusz is közéjük tartozik."]],0],[4,"C","II. Államterület","Hol húzódik a határ hajózható, illetve nem hajózható folyó esetén?",[["Hajózható folyón a sodorvonalon (nem feltétlenül a meder közepén), nem hajózhatón a folyó közepén","Helyes. A hajózhatóság a döntő szempont."],["Hajózható folyón a meder közepén, nem hajózhatón a természetes sodorvonalon","Felcserélt."],["Mindkét esetben a folyó egyik partjának vonalán, a nemzetközi szokás szerint","Nem ez a szabály."],["Mindkét esetben a természetes sodorvonalon, függetlenül attól, hogy a folyó hajózható-e","A nem hajózhatónál a folyó közepe."]],0],[4,"T","II. Államterület","A sodorvonal mindig azonos a meder felezővonalával.",false,"Hamis. A természetes sodorvonal nem feltétlenül a meder közepén húzódik. Ez a vizsgán gyakori tévedés."],[4,"C","II. Államterület","Mi a Kármán-vonal?",[["A világűr kezdete 100 km magasságban, az államterület légterének felső határa","Helyes. Kármán Tódor nevéhez fűződik; a világűrben és az égitesteken egyetlen államnak sincs területe."],["Az állam tengeri határa, a parttól számított tizenkét tengeri mérföldnél","Nem erről van szó."],["A földalatti államterület alsó határa, a Föld magjának közelében","Nem erről van szó."],["A schengeni övezet külső határán húzódó, közös határellenőrzési sáv","Nem erről van szó."]],0],[4,"C","II. Államterület","Mi az államterület „földalatti” része a tankönyv szerint?",[["A határvonalaknak a Föld középpontjával való összekötése által bezárt rész","Helyes. A Föld geoid alakja miatt nem függőlegesen lefelé haladunk. A föld méhének kincsei polgári jogi értelemben állami tulajdonban vannak."],["Függőlegesen lefelé a határvonalak alatti sáv, mintegy a Föld magjáig","A geoid alak miatt ez nem lehetséges."],["A felszíntől számított ezer méter mélységig terjedő, bányászatra nyitott rész","Nincs ilyen szabály."],["A földalatti vizeket és a barlangrendszereket magában foglaló rész","Nem ez a meghatározás."]],0],[4,"T","II. Államterület","A lajstromjelzés (pl. magyar lajstromú gép) csak a nemzetközi térben bír jelentőséggel: egy magyar lajstromjelzésű gépre Budapesten felszállva nem kerülünk másik állam területére.",true,"Igaz. Ha a gép egy állam légterében van, az adott állam területén vagyunk; nemzetközi vizek felett a lajstromjelzés szerinti állam területére kerülünk. Ugyanez a hajókra is érvényes."],[4,"C","II. Államterület","Mi igaz a nagykövetségek területi státuszára?",[["A fogadó állam területének része, de a küldő állam engedélye nélkül a fogadó állam hatóságai nem léphetnek be","Helyes. Diplomáciai mentesség, bécsi egyezmény; Mindszenty József ezért tudott az amerikai nagykövetségre menekülni."],["A küldő állam területe, ott a küldő állam joga érvényesül, és a fogadó állam joga kizárt","Ez a leggyakoribb tévedés."],["Semleges terület, amely senki államához nem tartozik, és a nemzetközi jog uralja","Nem így van."],["A fogadó állam területe, ahol a fogadó állam hatóságai és jogszabályai korlátlanul érvényesek","A küldő állam joghatósága és jogszabályai az irányadók a követségen belül."]],0],[4,"R","II. Államterület","A budapesti amerikai nagykövetség Magyarország területének része.","A bécsi egyezmény szerinti diplomáciai mentesség miatt a fogadó állam hatóságai nem léphetnek be.","B","Igaz: a nagykövetség nem „fehér folt”, a fogadó állam területe.","Igaz: a mentesség tényleg létezik.","Mindkét állítás igaz, de nincs közöttük ok-okozati összefüggés abban az értelemben, hogy a mentesség nem azért van, mert a terület a küldő államé; a terület továbbra is a fogadó államé, a mentesség pedig külön jogcímen (bécsi egyezmény) érvényesül."],[4,"T","Schengen","A schengeni övezet az Európai Unió jogán alapul, ezért minden uniós tagállam automatikusan schengeni tag.",false,"Hamis. A schengeni együttműködés külön nemzetközi egyezményen alapul, a részes államok maguk döntenek a felvételről. Aki uniós tag lesz, nem kerül automatikusan az övezetbe; schengeni tag csak uniós tagállam lehet, de nem minden uniós tagállam schengeni tag."],[4,"C","Schengen","Mi igaz a schengeni együttműködésről?",[["Egy állam egyoldalúan felfüggesztheti egy másikkal szemben, és visszaállíthatja a határellenőrzést","Helyes. Az uniós jog kötelező ereje és a schengeni együttműködés felmondhatósága eltérő jogi természetből fakad."],["Egyoldalúan nem függeszthető fel, mert az uniós jog kötelező ereje védi","Felfüggeszthető."],["Az uniós tagsággal automatikusan jár, külön csatlakozási döntés nélkül","Nem jár automatikusan."],["Harmadik állam uniós tagság nélkül is bármikor csatlakozhat, a részes államok döntése nélkül","Külön egyezmény alapján, a részes államok döntése szerint."]],0],[4,"C","III. A nép","Mi a különbség a magyar alkotmányjog szerinti nép, politikai nemzet és kulturális nemzet között?",[["Nép és politikai nemzet: az állampolgárok, a közhatalom forrása; kulturális nemzet: közös nyelv és identitás","Helyes. A kulturális nemzet az állampolgárságtól függetlenül létezik."],["A nép és a kulturális nemzet azonos, a politikai nemzet pedig csak az állampolgárok egy szűkebb köre","Nem."],["A politikai nemzet a kulturális nemzet része, mert az állampolgárok mind magyar identitásúak","Nem."],["A kulturális nemzet csak az állampolgárokat jelenti, a politikai nemzet pedig a határon túliakat is","Felcserélt."]],0],[4,"T","III. A nép","A politikai és a kulturális nemzet két egymásba ágyazott halmaz, a kulturális nemzet a politikai része.",false,"Hamis. Két metsző halmaz: a metszetben a magyar identitású magyar állampolgárok állnak. A népbe olyan állampolgárok is tartoznak, akik kulturális értelemben nem részei a nemzetnek, a kulturális nemzetbe pedig olyanok, akiknek nincs magyar állampolgárságuk."],[4,"C","III. A nép","Mi az államcél, és mi a példa rá?",[["Nem kikényszeríthető kötelezettség: az állam „törekszik”, „vállal”, de nem teljesítése esetén nem lehet bírósághoz fordulni","Helyes. Példa: a határon túli magyarokért viselt felelősség vagy a megfelelő lakhatás."],["Alanyi jog, amelynek sérelme esetén az állampolgár bírósághoz fordulhat, és az állam kötelezhető","Az államcél nem alanyi jog."],["Kikényszeríthető állami kötelezettség, amelynek teljesítését az Alkotmánybíróság közvetlenül elrendelheti","Ez az államcél ellentéte."],["A kormányprogram, amelyet az Országgyűlés négy évre elfogad, és amely a kormányt köti","Nem ez az államcél."]],0],[4,"T","III. A nép","A megfelelő lakhatás államcél: ha kikényszeríthető alanyi jog volna, minden hajléktalan bíróságon perelhetne ingyenes állami lakást.",true,"Igaz. Ez az államcél tankönyvi indoklása: az állam az ilyen kötelezettséget nyilvánvalóan nem tudná teljesíteni."],[4,"C","III. A nép","Mit biztosít az 2001 óta hatályos státusztörvény?",[["A magyar igazolvány igénylését a határon túli magyarok számára, állampolgárságtól függetlenül","Helyes. Ez jogosít fel a kedvezményekre."],["Automatikus magyar állampolgárságot minden határon túli magyarnak, kérelem és vizsgálat nélkül","Nem ezt biztosítja."],["Szavazati jogot az országgyűlési választáson a határon túli magyarok részére","A státusztörvény nem a választójogról szól."],["Letelepedési engedélyt és munkavállalási jogot a határon túli magyaroknak","Nem ezt biztosítja."]],0],[4,"C","IV. Nemzetiségek","Mi a nemzetiség fogalma?",[["Az országban élő közösség, amely számbeli kisebbségben van, és saját nyelve, kultúrája, hagyománya van","Helyes."],["Minden olyan külföldi állampolgár, aki Magyarországon él, és nem magyar anyanyelvű","A nemzetiségi jogok a más identitású magyar állampolgárokat illetik."],["Az ország minden vallási közössége, amely nem tartozik a többségi egyházak közé","Nem erről van szó."],["A határon túl élő magyarok, akik magyarul beszélnek, de más állam polgárai","Ők a kulturális nemzet részei."]],0],[4,"T","IV. Nemzetiségek","A Kecskeméten élő német állampolgár házaspárnak nemzetiségi jogok járnak.",false,"Hamis. A nemzetiségi jogok azokat a magyar állampolgárokat illetik meg, akik más identitással rendelkeznek, nem az itt élő külföldieket. A magyar állampolgár sváb származású személyeknek viszont járnak."],[4,"C","IV. Nemzetiségek","Melyek a nemzetiségi elismerés együttes feltételei?",[["Legalább százéves magyarországi honosság és saját nyelv, kultúra; az MTA állást foglal, az Országgyűlés dönt","Helyes. A feltételek együttesek."],["Legalább tízezer fős közösség saját településsel, amelyet a Kormány rendeletben elismer","Nincs ilyen feltétel."],["Állami nyelvvizsga és külföldi anyaállam, amely kétoldalú szerződésben vállal védelmet","Nincs ilyen feltétel."],["Százéves honosság vagy saját nyelv; elegendő az egyik, a másikat az MTA pótolja","A két feltétel együttes."]],0],[4,"C","IV. Nemzetiségek","Miért nem nemzetiség a székelység?",[["Asszimilálódtak, hagyományaik a magyar kultúra részévé váltak, így a különbözőség feltétele nem teljesül","Helyes. A székelyek a magyarság részei; a kezdeményezést ezzel az indokkal utasították el."],["Mert nem élnek Magyarországon, és a magyar jog csak a hazai közösségeket ismeri el","Nem ez az indok."],["Mert nincs százéves magyarországi honosságuk, és ezért az elismerés feltétele hiányzik","Nem ez az indok."],["Mert nincs saját nyelvük, és az MTA állásfoglalása a nyelvi különbözőséget nem találta megalapozottnak","Az indok az asszimiláció, nem a nyelv."]],0],[4,"C","IV. Nemzetiségek","Hány elismert nemzetiség van Magyarországon, és melyik NEM tartozik közéjük?",[["13 elismert nemzetiség; az orosz nem tartozik közéjük","Helyes. A listán: bolgár, görög, horvát, lengyel, német, örmény, roma, román, ruszin, szerb, szlovák, szlovén, ukrán."],["13 elismert nemzetiség; a roma nem tartozik közéjük","A roma elismert nemzetiség."],["7 elismert nemzetiség; a német nem tartozik közéjük","Tizenhárom van, a német közöttük van."],["20 elismert nemzetiség; a ruszin nem tartozik közéjük","Tizenhárom van, a ruszin közöttük van."]],0],[4,"T","IV. Nemzetiségek","A ruszinok azonosak az ukránokkal, ezért külön nemzetiségként nem ismerték el őket.",false,"Hamis. A ruszinok nem azonosak az ukránokkal, mindkét közösség külön elismert nemzetiség."],[4,"C","IV. Nemzetiségek","Mit jelent a szabad identitásvállalás?",[["A nemzetiséghez tartozás önbevalláson alapul, senki nem kényszeríthető feltárására, és hatóságilag nem vizsgálható felül","Helyes."],["A hatóság ellenőrzi a nemzetiségi hovatartozást, ha kétség merül fel a vallott identitás valódiságában","Éppen nincs kontroll."],["Csak származással igazolható, amelyet a szülők nemzetiségi bejegyzése alapján állapítanak meg","Önbevallás elég."],["Kizárólag az anyanyelv alapján dönthető el, amelyet nyelvi vizsgálattal kell igazolni","Nem így van."]],0],[4,"R","IV. Nemzetiségek","Európában a nemzetiségi hovatartozás nem vizsgálható felül, és nincs etnikai nyilvántartás.","A náci Németország etnikai listázásainak és a numerus clausus tapasztalata után az etnikai alapú nyilvántartás politikailag és jogilag egyaránt vállalhatatlan.","A","Igaz: az USA-val és Kanadával szemben (ahol az őslakos identitás bíróság előtt is vizsgálható) Európában elképzelhetetlen a kontroll.","Igaz.","A történelmi tapasztalat okozza, hogy Európában nincs ilyen kontroll."],[4,"C","IV. Nemzetiségek","Mi a szabad identitásvállalás gyakorlati kockázata?",[["Valós alap nélkül is választható identitás, pl. nemzetiségi önkormányzati források vagy kedvezmények miatt","Helyes."],["A nemzetiségek eltűnése, mert az önbevallás miatt egyre kevesebben vállalják az identitásukat","Nem."],["Az Alkotmánybíróság hatáskörének bővülése a nemzetiségi ügyek folyamatos felülvizsgálatával","Nem."],["A kétnyelvű táblák és intézménynevek megszűnése a kisebb településeken az önbevallás miatt","Nem."]],0],[4,"C","IV. Nemzetiségek","Melyik a nemzetiség tagját önállóan illető, egyéni jog?",[["A névhasználat és a nyelvhasználat","Helyes. Az eljárásokban a hivatalos nyelv a magyar, de a nemzetiségi nyelv is használható."],["Kétnyelvű helységnévtáblák","Ez kollektív jog."],["Iskola-, óvodaalapítás","Ez kollektív jog."],["Nemzetiségi önkormányzat létrehozása","Ez kollektív jog."]],0],[4,"C","IV. Nemzetiségek","Melyik kollektív nemzetiségi jog, és mi a feltétele a kétnyelvű táblákhoz?",[["Ha egy településen 25%-nál több nemzetiségi él: kétnyelvű táblák és intézménynevek","Helyes."],["Ha egy településen 10%-nál több nemzetiségi él: kétnyelvű táblák és intézménynevek","Nem 10%."],["Ha egy településen 50%-nál több nemzetiségi él: kötelező kétnyelvű táblák","Nem 50%."],["Minden településen kötelező, ahol legalább egy nemzetiségi család él: kétnyelvű táblák","Nem."]],0],[4,"C","IV. Nemzetiségek","Mi a nemzetiségi önkormányzat választásának feltétele?",[["Legalább harmincan vallották magukat anonim módon az adott nemzetiséghez tartozónak a legutóbbi népszámláláson; külön névjegyzék kell","Helyes. A választás maga nem anonim. A megoldás ára: a népszámlálás tízévente zajlik, tíz év alatt a település összetétele jelentősen megváltozhat."],["Minden választás előtt külön jelentkezés a nemzetiségi névjegyzékbe, népszámlálási adat nélkül, a helyi választási iroda előtt","Ez volt a korábbi megoldás, amit a visszaélések miatt váltottak le."],["Legalább ezer fő lakóhelye van a településen, és ők közösen kérik a nemzetiségi önkormányzat választását","Nem ez a feltétel."],["Az Országgyűlés településenként külön határozattal dönt a nemzetiségi önkormányzat létrehozásáról","Nem ez a feltétel."]],0],[4,"T","IV. Nemzetiségek","A nemzetiségi önkormányzatot települési, vármegyei és országos szinten is létre lehet hozni, közvetlen választás útján.",true,"Igaz. Települési szinten az önkormányzati működés segítése és rendezvények szervezése, országos szinten az országos politikai képviselet a feladat."],[4,"C","V. Állampolgárság","Mi az állampolgárság, és ki lehet az alanya?",[["A legszorosabb közjogi kapcsolat állam és természetes személy között; jogi személynek csak honossága lehet","Helyes."],["Az állam és bármely jogalany közötti kapcsolat, természetes és jogi személyek között egyaránt","Csak természetes személy lehet állampolgár."],["Az állam és a természetes személy közötti szerződéses viszony, amely felmondható","Közjogi kapcsolat."],["Az állam és a természetes személy kapcsolata, amely kizárólag jogokat keletkeztet","Mindkét oldalon jogokat és kötelezettségeket is."]],0],[4,"C","V. Állampolgárság","Melyik a két nemzetközi alapelv az állampolgárság kapcsán?",[["Senkit nem lehet megfosztani az állampolgárságától, és a hontalanságot vissza kell szorítani","Helyes. Ideális, ha mindenki legalább egy, lehetőleg egy államhoz kapcsolható."],["Mindenkinek minél több állampolgárságot kell szereznie, és a többes állampolgárságot kell támogatni","Ez nem alapelv."],["Az állampolgárság büntetésként elvehető, ha cserébe másik állampolgárság biztosított","Éppen ellenkező az alapelv."],["A hontalanság nemzetközi jogi szükségszerűség, amelyet az államoknak tiszteletben kell tartani","A hontalanságot vissza kell szorítani."]],0],[4,"C","V. Állampolgárság","Miért problémás a többes állampolgárság a tankönyv szerint?",[["Bonyodalmakat okoz: nem közömbös, melyik állam állampolgárságát veszi figyelembe az eljáró állam; honvédelemnél ütközhet","Helyes. Ezért tiltja számos ország (pl. Ausztria, Ukrajna, Szlovákia)."],["Mert a nemzetközi jog kifejezetten tiltja, ezért minden állam köteles megszüntetni","A nemzetközi jog nem tiltja."],["Mert az adófizetést kettős állampolgárság esetén egyik állam sem tudja beszedni, ezért adóelkerülésre ad lehetőséget","Nem ez az érv."],["Mert csak köztársasági államformájú országokban létezhet, a monarchiákban kizárt","Nincs ilyen megkötés."]],0],[4,"C","V. Állampolgárság","Mi a menekült, a menedékes és a migráns közötti lényeges különbség?",[["Menekült: egyéni, tartós; menedékes: kollektív, ideiglenes; migráns: nem jogi kategória, nincs alanyi jog","Helyes. A migránsnak nincs alanyi joga a befogadásra."],["Menekült: kollektív, ideiglenes; menedékes: egyéni, tartós; migráns: nem jogi kategória, de befogadási joga van","Felcserélt."],["Mindhárom ugyanazt jelöli, csak a menekülés okában különböznek, a jogállásuk teljesen azonos","Nem."],["Menekült: egyéni, tartós; menedékes: kollektív, ideiglenes; migráns: alanyi joga van a befogadásra","A migránsnak nincs alanyi joga."]],0],[4,"C","V. Állampolgárság","Ki minősül menekültnek?",[["Akit a hazájában üldöznek, vagy üldöztetésétől megalapozottan tart faja, vallása, neme vagy politikai nézete miatt","Helyes. Pl. ahol a homoszexualitás halálbüntetéssel fenyegetett."],["Aki gazdasági okból, jobb megélhetés reményében hagyja el az országát, és kérelmet nyújt be","Ő migráns."],["Aki háború miatt, nagyszámú csoportban, ideiglenesen menekül egy biztonságos országba","Ez a menedékes."],["Aki turistaként érkezik, majd a kiutasítás elől védelmet kér az idegenrendészeti hatóságtól","Ő nem menekült, csak ha az üldöztetés feltételei teljesülnek."]],0],[4,"T","V. Állampolgárság","A menekültstátusszal rendelkező személy nem utasítható ki és nem küldhető vissza, és könnyített honosítást kaphat.",true,"Igaz. A menekültnek tartós letelepedés, szabad mozgás, könnyített honosítás jár; a menedékes csak ideiglenesen tartózkodhat az első biztonságos országban, jellemzően táborban, korlátozott mozgással."],[4,"C","V. Állampolgárság","Mi az állampolgárság keletkezése, és miben különbözik a szerzéstől?",[["Keletkezés: külön aktus nélkül (születés, családi kötelék); szerzés: aktív magatartás kell (honosítás, nyilatkozat)","Helyes."],["Keletkezés: aktív magatartást igényel (honosítás, nyilatkozat); szerzés: automatikusan, születéssel jön létre","Felcserélt."],["Nincs különbség, a két szó ugyanazt jelenti, csak a különböző szakirodalom használja eltérően","Van különbség."],["Keletkezés: kizárólag a honosítás útján; szerzés: kizárólag a születés és a házasság útján jöhet létre","Nem."]],0],[4,"C","V. Állampolgárság","Mi a különbség a ius sanguinis és a ius soli között?",[["Ius sanguinis: a szülő állampolgársága számít (Magyarország); ius soli: a születés helye (pl. USA)","Helyes. Ius soli: pl. USA, Ausztrália."],["Ius sanguinis: a születés helye számít (pl. USA); ius soli: a szülő állampolgársága (Magyarország)","Felcserélt."],["Mindkettő a szülők állampolgárságán alapul, a különbség csak a bizonyítás módjában van","Nem."],["Magyarország a ius soli államok közé tartozik, nálunk a születés helye a főszabály, nem a vér","Magyarország vérségi elvet követ."]],0],[4,"C","V. Állampolgárság","Mikor érvényesül a magyar jogban kisegítő jelleggel a területi elv?",[["Hontalan szülők Magyarországon született gyermekénél és a talált gyermeknél","Helyes. A talált gyermek magyar állampolgársága megdönthető vélelem."],["Minden Magyarországon született gyermeknél, a szülők állampolgárságától függetlenül","Magyarország főszabálya a vérségi elv."],["Csak a külföldi diplomaták és a nemzetközi szervezetek alkalmazottainak gyermekénél","Nem."],["Soha, mert Magyarország kizárólag a vérségi elvet alkalmazza kivétel nélkül","Két esetben érvényesül."]],0],[4,"T","V. Állampolgárság","A talált gyermek magyar állampolgársága megdönthető vélelem: ha kiderül, kik a szülei, és a vérségi elv alapján nem illetné meg, elveszíti az állampolgárságot.",true,"Igaz. A vélelem egy valószínű tény valósként való elfogadása."],[4,"R","V. Állampolgárság","Ha egy személy születése után bíróság állapítja meg, hogy az apja magyar állampolgár, magyar állampolgárságot szerez.","Ez az állampolgárság-keletkezés mindig a születésre visszamenőleges hatályú.","A","Igaz: a fennálló rokoni kapcsolat utóbb bebizonyosodott.","Igaz.","Mivel az apa a születéskor is az apja volt, az állampolgárság visszamenőleg keletkezik."],[4,"C","V. Állampolgárság","Hány év a honosítás főszabály szerinti tartózkodási ideje, és mikor csökken 5, illetve 3 évre?",[["8 év; 5 évre, ha itt született vagy kiskorúként került ide; 3 évre, ha menekült vagy házastársa állampolgár","Helyes."],["10 év; 5 évre minden uniós polgárnál, 3 évre magyar állampolgár házastársánál vagy menekültnél","Nem."],["3 év; 8 évre a menekülteknél, 5 évre az itt születetteknél, 0 évre a magyar házastársaknál","Nem."],["5 év; 8 évre a házastársaknál, 3 évre az itt születetteknél, 0 évre a menekülteknél","Nem."]],0],[4,"C","V. Állampolgárság","Mi igaz a honosítás büntetlen előéleti feltételére?",[["A magyar jog szerint értendő: külföldön emberölésért elítélt nem honosítható, házasságtörésért elítélt igen","Helyes. Külföldön folyó büntetőeljárás nem kizáró ok, Magyarországon folyó igen; a házasságtörés a Btk. szerint nem bűncselekmény."],["Bármely külföldi ítélet kizárja a honosítást, a cselekmény minősítésétől függetlenül","Nem, csak ami a magyar jog szerint is bűncselekmény."],["Csak magyar bíróság ítélete számít, a külföldi ítéletek figyelmen kívül maradnak","Bárhol a világon hozott ítélet számít, ha a cselekmény a Btk. szerint is bűncselekmény."],["Nincs büntetlen előéleti feltétel, csak a nemzetbiztonsági kockázatot vizsgálják","Van, és ez alól nincs felmentés."]],0],[4,"C","V. Állampolgárság","Ki mentesül az állampolgársági vizsga alól?",[["A kiskorú, a 65 év feletti, a magyar nyelvű felsőoktatási végzettségű és a házastársi jogcímen honosított személy","Helyes."],["Mindenki, aki legalább öt éve folyamatosan él Magyarországon, és bejelentett lakóhelye van","Nincs ilyen mentesség."],["Csak a kiskorú és a 65 év feletti, a többi kérelmezőnek mindenképp vizsgáznia kell","Több mentességi kör van."],["Senki, a vizsga minden kérelmezőre kötelező, életkortól és végzettségtől függetlenül","Van mentesség."]],0],[4,"C","V. Állampolgárság","Ki dönt a honosítási kérelemről, és megtagadható-e minden feltétel teljesülése esetén?",[["A köztársasági elnök dönt; megtagadhatja, mert a feltételek teljesítése lehetőséget, nem alanyi jogot ad; jogorvoslat nincs","Helyes. Az állampolgárság szuverenitási kérdés."],["A bíróság dönt; nem tagadható meg, ha a kérelmező minden törvényi feltételnek megfelel","Nem a bíróság dönt."],["A belügyminiszter dönt; nem tagadható meg, ha a kérelmező minden feltételnek megfelel","A köztársasági elnök dönt."],["A köztársasági elnök dönt, de nem tagadhatja meg, ha a kérelmező minden feltételt teljesít, és jogorvoslat áll rendelkezésre","Megtagadhatja, és jogorvoslat nincs."]],0],[4,"C","V. Állampolgárság","Hogyan szűnhet meg a magyar állampolgárság?",[["Lemondással vagy visszavonással (csalással szerzett állampolgárság, tíz éven belül); megfosztás nincs","Helyes."],["Megfosztással büntetésként, ha az állampolgár súlyos bűncselekményt követ el, és van másik állampolgársága","A megfosztás nemzetközi alapelv szerint kizárt."],["Automatikusan, ha valaki tartósan külföldre költözik és ott letelepedési engedélyt kap","Nem."],["Kizárólag a halállal szűnik meg, lemondásra és visszavonásra nincs lehetőség","Lemondással és visszavonással is megszűnhet."]],0],[4,"C","V. Állampolgárság","Mi a visszahonosítás tipikus esete?",[["Lemondott a magyar állampolgárságról másik megszerzéséért, de azt nem kapta meg, ezért visszahonosítható","Helyes. Hontalanná válna, ezért visszahonosítható. Ha megszerezte a másikat és utóbb kéri vissza a magyart, az már rendes honosítás."],["Aki sosem volt magyar állampolgár, de magyar származású, és nyelvtudását igazolja","Ő (kedvezményes) honosítással szerezhet állampolgárságot."],["Akit az állampolgárságától bírósági ítélet megfosztott, és később mentesítették","Megfosztás nincs."],["Aki két éve külföldön él, és onnan kéri a magyar állampolgárság újbóli megadását","Ez önmagában nem visszahonosítási eset."]],0],[4,"T","V. Állampolgárság","A nyilatkozattétellel történő állampolgárság-szerzésnél az államnak nincs mérlegelési joga, és nincs köztársasági elnöki vétó.",true,"Igaz. A nyilatkozat megtételével az állampolgárság megszerezhető (a kommunista rendszerben megfosztottak, illetve az 1957 előtti szabály érintettjei)."],[4,"C","V. Állampolgárság","Mi az állampolgárság felfüggesztése, és mi a vitatott benne?",[["Az államot veszélyeztető személy állampolgárságának ideiglenes felfüggesztése; vitatott: nemzetközi egyezményekkel ellentétes, a gyakorlatban nem alkalmazták","Helyes. Az állampolgárság nem szűnik meg, de a jogok nem gyakorolhatók; idegen a jogrendszerünktől, uniós polgárral szemben kizárt."],["Az állampolgárság végleges elvesztése büntetésként; vitatott, mert hontalanságot is okozhat, és a bíróság nem vizsgálja felül","Nem szűnik meg véglegesen."],["A kiskorúak állampolgárságának ideiglenes felfüggesztése a szülői felügyelet megszűnése esetén; vitatott, hogy sérti a gyermek jogait","Nem erről szól."],["Bűncselekmény elkövetésekor automatikusan beálló jogkorlátozás; vitatott, hogy mennyi ideig tarthat, és ki szünteti meg","Nem automatikus."]],0],[4,"C","VI. Európai polgárság","Mi az uniós polgárság viszonya a tagállami állampolgársághoz?",[["Leszármaztatott jogállás: minden tagállami állampolgár uniós polgár is; önálló uniós polgárság nincs","Helyes. A Maastrichti Szerződés (1992) vezette be."],["Önálló jogállás, amelyet az Unió a tagállami állampolgárságtól függetlenül is megadhat","Nem létezik önálló uniós polgárság."],["Az uniós polgárság felváltja a tagállami állampolgárságot, amely fokozatosan megszűnik","Nem helyettesíti."],["Csak a schengeni övezet államainak polgárait illeti meg, a többi tagállam polgárait nem","A tagállami állampolgárok mindegyikét."]],0],[4,"C","VI. Európai polgárság","Melyik jog NEM az uniós polgárság sajátos jogosultsága?",[["A lakóhely szerinti tagállamban az országgyűlési választáson való szavazati jog","Helyes. A helyi önkormányzati és EP-választáson van választójog, az országgyűlésin nincs."],["A tagállamok területén való szabad mozgás és letelepedés joga, a Szerződések keretei között","Uniós polgári jog."],["Diplomáciai és konzuli védelem más tagállam külképviseletén, ha a sajátja nincs jelen","Uniós polgári jog."],["Petíciós jog az Európai Parlamenthez és az európai ombudsmanhoz fordulás joga","Uniós polgári jog."]],0],[4,"C","VII. Házasság és család","Mit mond az Alaptörvény L) cikke?",[["Védi a házasságot (férfi és nő életközössége) és a családot mint a nemzet fennmaradásának alapját","Helyes."],["A házasság bármely két nagykorú személy szerződése, amelyet az állam teljesen semlegesen kezel","Nem."],["A család kizárólag magánügy, az állam nem vállal felelősséget a védelméért vagy támogatásáért","Nem."],["A házasság védelme kizárólag a polgári törvénykönyv kérdése, nem az Alaptörvény szabálya","Nem."]],0],[5,"C","I. Mi a jogforrás?","Melyik meghatározás pontos?",[["Norma: kötelező, általános, az állam által alkotott szabály; jogforrás: a hordozó dokumentum; jogszabály: a normák szűkebb köre (T) cikk)","Helyes. A norma közvetlenül kikényszeríthető magatartási szabály; a jogszabály a normák azon szűkebb köre, amelyeket az Alaptörvény T) cikke jogszabályként tételez."],["A norma és a jogszabály azonos fogalom, mert minden kötelező magatartási szabályt jogszabály tartalmaz, és a jogforrás ezek alkotója","A jogszabály a norma szűkebb köre."],["A jogforrás maga a jogalkotó szerv, amely a normát megalkotja, a jogszabály pedig a jogforrás terméke","Ez az anyagi jogforrás; a jogforrás a hordozó, dokumentum."],["A jogszabály tágabb fogalom a normánál, mert a nem kötelező ajánlásokat és szokásokat is magában foglalja","A norma a tágabb fogalom."]],0],[5,"T","I. Mi a jogforrás?","Minden jogszabály norma, de nem minden norma jogszabály („minden bogár rovar, de nem minden rovar bogár”).",true,"Igaz. A normák köre a tágabb, a jogszabályoké a szűkebb; a jogrendszerben a jogszabályokon kívül is vannak kötelező magatartási szabályok (pl. közjogi szervezetszabályozó eszközök)."],[5,"C","I. Mi a jogforrás?","Mi a különbség az anyagi (materiális) és az alaki (formális) jogforrás között?",[["Anyagi: a jogalkotási hatáskörű szerv, amely a normát létrehozza; alaki: a nevesített forma, amelyből megismerhető","Helyes. Alaki jogforrás pl. törvény, rendelet."],["Anyagi: a törvény szövege, amelyből a norma megismerhető; alaki: az Országgyűlés mint a törvényalkotásra jogosult szerv","Felcserélt."],["Mindkettő a jogalkotó szerv, csak az anyagi a központi, az alaki a helyi szerveket jelöli meg","Nem."],["Mindkettő a jogszabály szövege, csak az anyagi a hatályos, az alaki a hatályon kívüli változat","Nem."]],0],[5,"C","I. Mi a jogforrás?","Kelsen normapiramis-elmélete mit eredményez az alkotmánybíráskodás kapcsán?",[["A hierarchia őrzésére külön szerv kell, az alkotmánybíróság; innen az AB „negatív jogalkotó” jellege (kiemel, nem alkot)","Helyes. Az AB nem alkot normát, hanem kiemel a rendszerből."],["A parlament a normapiramis csúcsán áll, ezért az AB döntéseit a törvényhozás felülbírálhatja","Nem ez a következmény."],["Az AB új törvényeket alkot a hierarchia hiányzó elemeinek pótlására, ezért „pozitív jogalkotó”","Nem alkot normát, kiemel."],["A normák nem rendezhetők hierarchiába, mert azonos erejűek, ezért alkotmánybíráskodás nem kell","Éppen azt állítja, hogy igen, rendezhetők."]],0],[5,"T","I. Mi a jogforrás?","Az Alaptörvény jogszabály, ezért szerepel a T) cikkben a jogszabályok között.",false,"Hamis. Az Alaptörvény nem jogszabály: kiemelt dokumentum, amelynek státuszát az R) cikk adja (a jogrendszer alapja). A T) cikk a törvényt és a rendeletet sorolja fel. Ez a vizsgák klasszikus buktatója."],[5,"C","I. Mi a jogforrás?","Melyik a helyes sorrend a magyar jogszabályi hierarchiában felülről lefelé?",[["Alaptörvény → törvény → kormányrendelet / MNB-elnök rendelete → miniszteri / miniszterelnöki rendelet → önálló szabályozó szerv rendelete → önkormányzati rendelet","Helyes. Az Alaptörvény nem jogszabály. A kormányrendelet és az MNB elnökének rendelete azonos szinten áll, ugyanígy a miniszteri és a miniszterelnöki rendelet."],["Alaptörvény → törvény → miniszteri rendelet → kormányrendelet → önálló szabályozó szerv rendelete → önkormányzati rendelet","A kormányrendelet a miniszteri rendelet fölött áll."],["Alaptörvény → törvény → kormányrendelet → önkormányzati rendelet → miniszteri rendelet → önálló szabályozó szerv rendelete","Az önkormányzati rendelet a végén áll."],["Törvény → Alaptörvény → kormányrendelet → miniszteri rendelet → önálló szabályozó szerv rendelete → önkormányzati rendelet","Az Alaptörvény áll legfelül."]],0],[5,"C","I. Mi a jogforrás?","Miért kell a médiaszabályozásnál önálló szabályozó szerv?",[["Nemzetközi kötelezettségek írják elő bizonyos ágazatok (pl. média, hírközlés) kormánytól való függetlenségét","Helyes. Az önálló szabályozó szervek a végrehajtó hatalom részei, de a kormánytól függetlenül működnek."],["A kormány nem alkothat rendeletet a médiaszabályozás területén, az kizárólag törvényi tárgykör","A kormány alkothat rendeletet."],["Az Alaptörvény kifejezetten tiltja a kormányzati médiafelügyeletet, ezért kell külön szerv","Nem ez az indok."],["Az önálló szabályozó szervek az Országgyűlés szervei, ezért a kormány nem utasíthatja őket","A végrehajtó hatalom részei."]],0],[5,"C","I. Mi a jogforrás?","Melyik a hierarchiából fakadó három törvényszerűség közül a harmadik?",[["Alacsonyabb szintű normában nem lehet megismételni magasabb szintű norma magatartási szabályát","Helyes. A jogalkotási törvény (Jat.) is megerősíti; a jogrendszer zártsága indokolja."],["Jogszabályt bármely szintű jogszabály módosíthat, ha a tartalma nem ellentétes vele","A módosítás csak azonos vagy magasabb szintű jogszabállyal lehetséges."],["Alacsonyabb szintű norma eltérhet a magasabbtól, ha ezt a jogalkotó kifejezetten kimondja","Nem lehet ellentétes."],["Magasabb szintű norma csak törvény lehet, az alacsonyabb szint pedig mindig rendelet","Nem ez a törvényszerűség."]],0],[5,"C","I. Mi a jogforrás?","Melyik művelet NEM lehetséges a hierarchia második törvényszerűsége szerint?",[["Kormányrendelet módosítása miniszteri rendelettel","Helyes. Jogszabályt csak azonos vagy magasabb szintű jogszabállyal lehet módosítani."],["Kormányrendelet módosítása kormányrendelettel","Lehetséges."],["Kormányrendelet módosítása törvénnyel","Lehetséges."],["Miniszteri rendelet hatályon kívül helyezése törvénnyel","Lehetséges."]],0],[5,"R","I. Mi a jogforrás?","Az Ákr. alapelvei között nem szerepel a tisztességes hatósági eljáráshoz való jog.","Ez a jog az Alaptörvény XXIV. cikkében szerepel, és ami az Alaptörvényben benne van, az a hierarchiából fakadóan a törvényekre is vonatkozik, ezért nem szabad megismételni.","A","Igaz.","Igaz: a hierarchia harmadik törvényszerűsége (nincs megismétlés).","A második állítás megmagyarázza az elsőt: nem azért hiányzik, mert nem kellene tisztességesen eljárni, hanem mert az Alaptörvény már rögzíti."],[5,"C","I. Mi a jogforrás?","Mi a közjogi szervezetszabályozó eszköz, és mi a típusa?",[["Állami szerv belső működését szabályozó, nem jogszabály (pl. SZMSZ); típusa: normatív utasítás vagy határozat","Helyes. Vezetőnél normatív utasítás, testületnél normatív határozat."],["Jogszabály, amelyet a Kormány a közigazgatási szervek belső működésére alkot; típusa: kormányrendelet vagy határozat","Nem jogszabály."],["Törvény, amelyet az Országgyűlés a saját működéséről alkot kétharmaddal; típusa: országgyűlési határozat","Nem törvény."],["Az Alkotmánybíróság határozata az államigazgatás belső működéséről; típusa: alkotmánybírósági határozat","Nem erről van szó."]],0],[5,"C","I. Mi a jogforrás?","Mi az extraneus és az intraneus norma?",[["Extraneus: kifelé szabályoz (jogszabály); intraneus: a szerv belső szabályait határozza meg, főszabály szerint befelé hat","Helyes. Az intraneus norma a közjogi szervezetszabályozó eszköz."],["Extraneus: a szerv belső szabálya; intraneus: a külső szabály, amely a szerven kívüli jogalanyokra hat","Felcserélt."],["Mindkettő jogszabály, csak az extraneus a törvényekre, az intraneus a rendeletekre utal","Az intraneus nem jogszabály."],["Mindkettő bírósági döntés, csak az extraneus a Kúriáé, az intraneus az alsóbb bíróságoké","Nem."]],0],[5,"R","I. Mi a jogforrás?","A Házszabály tipikusan intraneus norma, mégis lehet külső hatása.","A házszabályi rendelkezések betartása a törvény érvényességének egyik követelménye.","A","Igaz: országgyűlési határozat bocsátja ki, az Országgyűlés működését szabályozza.","Igaz.","Ha egy törvény érvényességét kell megítélni, meg kell nézni a Házszabályt is, ezért van külső hatása."],[5,"C","I. Mi a jogforrás?","Melyik a bíróságok két jogfejlesztő, normatív hatású döntési formája?",[["A Kúria jogegységi határozata és az Alkotmánybíróság alkotmányos követelménye","Helyes. Mindkettő kötelező, kvázi jogforrás."],["Az elsőfokú és a másodfokú ítélet, amelyek a jogszabályt az ügyek körében értelmezik","Ezek egyedi ügyre szólnak."],["A bírósági végzés és az ügyészi indítvány, amelyek a gyakorlatot egységesítik","Nem ezek a formák."],["A precedens és az equity, amelyeket a magyar bíróságok közvetlenül alkalmaznak","Magyarországon nincs precedensrendszer."]],0],[5,"T","I. Mi a jogforrás?","Magyarországon precedensrendszer van, ezért minden bírósági döntés kötelező más bíróságokra.",false,"Hamis. Magyarországon nincs precedensrendszer, minden döntés egyedi ügyre szól. A Kúria jogegységi határozata az eltérő jogalkalmazás esetén kötelező szempontokat határoz meg, amelytől a bíróságok nem térhetnek el."],[5,"C","I. Mi a jogforrás?","Mi az alkotmányos követelmény?",[["Az AB kimondja, hogy a jogszabályt az Alaptörvénnyel összhangban hogyan kell értelmezni; csak ez az értelmezés fogadható el","Helyes. Az AB mint az Alaptörvény kizárólagos értelmezési szerve akkor él vele, ha a probléma a jogszabály bírói értelmezéséből fakad, nem magából a jogszabályból."],["A jogszabály megsemmisítése az Alkotmánybíróság által, a hatálybalépése napjára visszamenőleges hatállyal","Ez a megsemmisítés, nem az alkotmányos követelmény."],["Az Országgyűlés Házszabálya, amely a törvényalkotási eljárás részletszabályait és a vita rendjét tartalmazza","Nem."],["A köztársasági elnök vétója, amely a törvény kihirdetését alkotmányossági okból megakadályozza és visszaküldi","Nem."]],0],[5,"C","I. Mi a jogforrás?","Mi a különbség a dualista és a monista felfogás között?",[["Dualista: két külön térben létezik a nemzetközi és a belső jog, kihirdetés kell; monista: egy térben, automatikusan","Helyes."],["Dualista: a nemzetközi jog automatikusan belső jog is; monista: kihirdetés útján válik belső joggá","Felcserélt."],["Mindkettő kihirdetést kíván, csak a kihirdetés szerve különbözik (parlament vagy kormány dönt)","Nem."],["Egyik sem a nemzetközi jog és a belső jog viszonyáról szól, hanem csak a jogforrási hierarchiáról","Nem."]],0],[5,"C","I. Mi a jogforrás?","Milyen a magyar megoldás az Alaptörvény Q) cikke szerint?",[["Alapvetően dualista (a szerződéseket ki kell hirdetni), monista elemmel: az általánosan elismert szabályok is kötnek","Helyes. Az általánosan elismert nemzetközi jogi szabályok kihirdetés nélkül is köteleznek."],["Tisztán monista: a nemzetközi szerződések kihirdetés nélkül, automatikusan belső joggá válnak, kivétel nélkül","Nem."],["Tisztán dualista, kivétel nélkül: még az általánosan elismert szabályokhoz is külön kihirdetés kell","Nem."],["A nemzetközi jog nem kötelezi Magyarországot, csak ha az Országgyűlés külön törvényben vállalja","Nem."]],0],[5,"C","I. Mi a jogforrás?","Hol helyezkedik el a nemzetközi szerződés az Alaptörvényhez képest, és miért?",[["Az Alaptörvény fölött: pacta sunt servanda és az önkorlátozás miatt; ellentmondás esetén az Alaptörvényt kell módosítani","Helyes. Pl. a NATO- és az uniós csatlakozás előtt."],["Az Alaptörvény alatt, mert a belső jogrend erősebb, és a nemzetközi szerződés a törvények szintjén áll","A belső szabályra nem lehet hivatkozni a nemzetközi kötelezettség elkerülésére."],["Az Alaptörvénnyel azonos szinten, mert mindkettőt az Országgyűlés fogadja el kétharmaddal","Az Alaptörvény fölött."],["A törvény szintjén, a rendeletek fölött, mert a kihirdetésükre törvényt kell alkotni","Nem ez a tankönyvi álláspont."]],0],[5,"R","I. Mi a jogforrás?","Egy állam nem hivatkozhat arra, hogy saját alaptörvénye tiltja a nemzetközi szerződés teljesítését.","A másik állam abban a tudatban kötötte a szerződést, hogy szuverén felek állapodtak meg, és elvárja a teljesítést (pacta sunt servanda).","A","Igaz.","Igaz.","A bizalomvédelem és a szerződéshűség (pacta sunt servanda) magyarázza, hogy a belső szabály nem hivatkozási alap (hasonlat: az autóeladás, amelyet a házastárs kifogásol)."],[5,"C","I. Mi a jogforrás?","Mi az Alaptörvény E) cikke (Európa-klauzula)?",[["Az uniós csatlakozás és a hatáskörmegosztás alaptörvényi alapja: az Unióval közösen gyakorolt hatáskörök szabályozása","Helyes."],["A hatalommegosztás cikke, amely a törvényhozó és a végrehajtó hatalom viszonyát és egyensúlyát rendezi","Nem."],["A nemzeti jelképek cikke, amely a Himnusz, a zászló és a címer használatát is szabályozza","Nem."],["Az alapjogok korlátozásáról szóló cikk, amely az arányosság követelményét is előírja","Nem."]],0],[5,"C","I. Mi a jogforrás?","Mi a különbség az uniós rendelet és irányelv között?",[["Rendelet: közvetlen hatályú, a bíróság előtt úgy kötelező, mint a törvény; irányelv: átültetést igényel","Helyes."],["Irányelv: közvetlen hatályú, kihirdetés nélkül kötelező; rendelet: átültetést igényel a tagállami jogba","Felcserélt."],["Mindkettő átültetést igényel a tagállami jogba, csak a rendelet határideje rövidebb az irányelvénél","Nem."],["Egyik sem kötelező a tagállamokra, mindkettő csak ajánlás az uniós jogalkotás irányára és gyakorlatára","Nem."]],0],[5,"C","I. Mi a jogforrás?","Mi az uniós jog két alapelve, és melyik ítélet mondta ki?",[["Közvetlen hatály (Van Gend en Loos, 1963) és elsőbbség (Costa kontra E.N.E.L., 1964)","Helyes."],["Szubszidiaritás (Maastricht, 1992) és arányosság (Lisszabon, a Szerződések átalakítása)","Nem ezek az ítéletek."],["Pacta sunt servanda (Hirst kontra Egyesült Királyság) és arányosság (Roe kontra Wade)","Nem."],["Dualizmus és monizmus (Marbury kontra Madison, 1803) mint az uniós jog két alapelve","Nem."]],0],[5,"T","I. Mi a jogforrás?","Az uniós rendeletet a magyar jogforrási hierarchiában el kell helyezni, mert a törvény és az Alaptörvény között áll.",false,"Hamis. Nem kell elhelyezni: a hatáskörmegosztás miatt az adott kérdésben csak az uniós rendelet létezhet, magyar törvény nem születhet (pl. közös vámtarifa)."],[5,"C","I. Mi a jogforrás?","Mi történik, ha a tagállam nem ülteti át az irányelvet?",[["A Bizottság kötelezettségszegési eljárást indít, az EUB megállapítja a jogsértést; következmény: bírság","Helyes."],["Az irányelv a határidő lejártával automatikusan jogszabállyá válik a tagállamban, szankció nélkül","Nem."],["A magyar Alkotmánybíróság határoz a mulasztásról, és a Kormányt az átültetésre határidővel kötelezi","Nem."],["A tagállamot az Európai Tanács az Unióból ideiglenesen kizárja, ha két éven belül nem ültet át","Nem."]],0],[5,"C","II. Érvényesség és hatályosság","Melyik formula helyes az érvényesség és hatályosság viszonyára?",[["Az érvényesség az alkalmasság a működésre, a hatályosság maga a tényleges működés","Helyes."],["Az érvényesség a tényleges működés, a hatályosság pedig az alkalmasság a működésre","Felcserélt."],["A kettő azonos, csak a bírói gyakorlat és a jogirodalom használja eltérően a két kifejezést","Nem azonos."],["Az érvénybe lépés a helyes kifejezés, az érvényesség és a hatályosság pedig szinonimák","Nem."]],0],[5,"C","II. Érvényesség és hatályosság","Melyik NEM az érvényesség négy követelménye közül való?",[["A jogszabály legalább egy évig hatályban legyen, mielőtt alkalmazzák","Helyes, ez nem követelmény."],["A jogszabályt csak a megalkotására felhatalmazott szerv alkothatja meg","Követelmény."],["A megalkotás az alkotmányos szabályok szerint előírt eljárásban történjen","Követelmény."],["A jogszabályt a Magyar Közlönyben vagy helyben szokásos módon ki kell hirdetni","Követelmény."]],0],[5,"C","II. Érvényesség és hatályosság","Mi a különbség a kihirdetés és a közzététel között?",[["Kihirdetés: jogszabályra vonatkozik, érvényességi követelmény; közzététel: minden más normára, nem érvényességi követelmény","Helyes. A kihirdetés a Magyar Közlönyben, önkormányzati rendeletnél helyben szokásos módon történik; a közzététel a jogbiztonságot szolgálja."],["Közzététel a jogszabályra vonatkozik, kihirdetés a többi normára, a jogbiztonság miatt","Felcserélt."],["Mindkettő érvényességi követelmény, csak a megjelentetés helye (Közlöny vagy helyben szokásos mód) különbözik","A közzététel nem az."],["Nincs különbség, a két kifejezés ugyanazt jelöli, csak más-más normatípusnál használják","Van."]],0],[5,"C","II. Érvényesség és hatályosság","Ha egy rendeletet nem az arra felhatalmazott miniszter adott ki, de megjelent a Magyar Közlönyben, mi a helyzete?",[["Az érvényesség vélelme szól mellette, amíg az Alkotmánybíróság ki nem mondja az érvénytelenséget","Helyes."],["Automatikusan érvénytelen, mert a felhatalmazott miniszter helyett más adta ki, és a hiba nyilvánvaló","A vélelem megdöntéséhez AB-határozat kell."],["Bármely hatóság vagy bíróság megállapíthatja az érvénytelenségét, és ezt követően nem alkalmazza","Csak az AB jogosult."],["Érvényes, és az Alkotmánybíróság sem vizsgálhatja felül, mert a Magyar Közlönyben megjelent","Az AB vizsgálhatja."]],0],[5,"C","II. Érvényesség és hatályosság","Melyik a hatály négy fajtája?",[["Tárgyi, területi, személyi, időbeli","Helyes."],["Tárgyi, jogi, alaki, anyagi","Nem."],["Területi, politikai, gazdasági, időbeli","Nem."],["Személyi, állami, helyi, nemzetközi","Nem."]],0],[5,"T","II. Érvényesség és hatályosság","Nulla felkészülési idő (vacatio legis) lehetséges: a jogszabály a kihirdetés pillanatában hatályba léphet.",false,"Hamis. Nulla felkészülési idő nem lehetséges, mert sértené a jogbiztonságot. Aznapi hatálybalépés esetén óra-perc pontossággal kell meghatározni az időpontot (a Magyar Közlöny elektronikus megjelenése időbélyegzős). A felkészülési idő elégségességét az AB ítéli meg."],[5,"C","II. Érvényesség és hatályosság","Melyik hatálybalépési megfogalmazás NEM megfelelő?",[["„a kihirdetést követő első olyan esemény napján, amelyre a törvény hatálya vonatkozik”","Helyes, ez bizonytalan időpont."],["„a kihirdetést követő nyolcadik napon, a naptári napok szerint számítva”","Fix, meghatározható időpont."],["„2028. január 1., amely a kihirdetés pillanatában már pontosan ismert dátum”","Fix időpont."],["„a kihirdetést követő második hónap első napján, a hónap végi kihirdetés esetén is”","Meghatározható időpont."]],0],[5,"C","II. Érvényesség és hatályosság","Mi az önderogáció?",[["A módosító szabály hatályba lépése után beépül az eredeti normába, és önmagát hatályon kívül helyezi","Helyes. A Jat. szerint automatikusan."],["A jogszabály megsemmisítése az Alkotmánybíróság által, a kihirdetéstől számított három éven belül","Nem."],["A törvény visszamenőleges hatályon kívül helyezése az Országgyűlés által, saját döntésével","Nem."],["A rendeletalkotó felhatalmazása arra, hogy a törvény rendelkezéseit saját rendeletével módosítsa","Nem."]],0],[5,"C","II. Érvényesség és hatályosság","Mit tilt a visszaható hatály tilalma?",[["Hátrányos rendelkezés nem vonatkozhat a hatálybalépés előtti időre (új kötelezettség, jogelvonás visszamenőleg)","Helyes."],["Minden visszamenőleges szabályozást, a kedvező és a hátrányos rendelkezéseket egyaránt kivétel nélkül","Nem: a kedvezőbb rendelkezés visszamenőleg is lehetséges."],["Csak az adójogot érinti, minden más jogterületen a visszamenőleges szabályozás megengedett","Nem."],["A kedvezőbb szabályok visszamenőleges alkalmazását, mert az a hátrányosabb helyzetű jogalanyokat sérti","Nem."]],0],[5,"T","II. Érvényesség és hatályosság","Visszamenőleg lehet kötelezettséget eltörölni vagy jogot adni (pl. visszamenőleges adócsökkentés).",true,"Igaz. Negatív irányban nem lehet visszamenni, pozitív irányban igen. Ha mégis megtörténik a hátrányos visszaható hatály, az AB megsemmisíti, addig működik az érvényesség vélelme."],[5,"C","III. Törvény","Mi igaz a törvényalkotás monopóliumára?",[["Törvényt kizárólag az Országgyűlés alkothat; a törvényerejű rendeleti gyakorlatot az 1987. évi XI. törvény zárta le","Helyes. A kommunista korszak törvényerejű rendeleti gyakorlata ezzel ért véget."],["Törvényt a Kormány is alkothat, ha az Országgyűlés erre külön, kétharmados felhatalmazást ad","Csak az Országgyűlés."],["Törvényerejű rendeletet ma is bármikor lehet alkotni, ha a Kormány azt szükségesnek tartja","Ma nem; néhány régi hatályos."],["Törvényt bármely jogalkotási hatáskörű testület alkothat, ha az Alaptörvény nem tiltja","Csak az Országgyűlés."]],0],[5,"C","III. Törvény","Melyik NEM a négy kötelező törvényalkotási tárgykör közül való?",[["A hivatalos szimbólumok színe","Helyes, nem ilyen tárgykör."],["Az alapvető jogok és kötelezettségek szabályozása","Kötelező tárgykör."],["Az állami költségvetés (és zárszámadás)","Kötelező tárgykör."],["A sarkalatos tárgykörök","Kötelező tárgykör."]],0],[5,"T","III. Törvény","A kötelező törvényalkotási tárgyköröket a törvényben (jogalkotási törvényben) lehet meghatározni.",false,"Hamis. Az AB megsemmisítette a régi jogalkotási törvény ilyen felsorolását, mert önmagába visszatérő, körkörös szabályozás volna (a törvény maga is módosítható). A kötelező tárgyköröket az Alaptörvényben kell keresni."],[5,"C","III. Törvény","Melyik a törvények három típusa, és mi a szükséges többség?",[["Egyszerű (a határozatképes Országgyűlés több mint fele), sarkalatos (jelen lévők kétharmada), alkotmányos (összes képviselő kétharmada)","Helyes."],["Egyszerű (az összes képviselő fele), sarkalatos (az összes képviselő kétharmada), alkotmányos (az összes képviselő háromnegyede)","Nem."],["Egyszerű (a jelen lévők fele), sarkalatos (a jelen lévők kétharmada), alkotmányos (a jelen lévők háromnegyede)","Nem."],["Mindhárom típus egyszerű többséggel fogadható el, csak a kihirdetési eljárásuk különbözik","Nem."]],0],[5,"T","III. Törvény","A sarkalatos törvény magasabb szinten áll a jogforrási hierarchiában, mint az egyszerű törvény.",false,"Hamis. Nagyobb többséget igényel, de azonos szinten van; a típusok között nincs hierarchia, csak eltérő elfogadási követelmény."],[5,"C","III. Törvény","Mit jelent, hogy az Alaptörvény sarkalatos tárgykörről, nem sarkalatos törvényről rendelkezik?",[["Egy törvénynek lehet csak egy része sarkalatos; az érintett rész kétharmaddal fogadható el, az egész nem","Helyes. Ez a salátatörvényeknél fontos."],["Minden törvény sarkalatos, amelynek tárgya az Alaptörvényben nevesített, kétharmados többséget igényel","Nem."],["A salátatörvény egésze sarkalatos, ha legalább egy rendelkezése sarkalatos tárgykört érint","Nem."],["Sarkalatos törvényt nem lehet módosítani, csak újraalkotni az eredeti elfogadási szabályok szerint","Nem."]],0],[5,"C","III. Törvény","Mi a salátatörvény?",[["Olyan törvény, amellyel az Országgyűlés egyszerre több jogszabályt módosít","Helyes."],["Olyan törvény, amely csupán egyetlen mondatból áll, és egyetlen jogszabályt érint","Nem."],["Az Alaptörvény módosítása, amelyet az Országgyűlés egy törvénybe foglal össze","Nem."],["A költségvetési törvény, amely több tárca fejezetét egy törvénybe foglalja","Nem."]],0],[5,"C","IV. Rendelet","Mit jelent a secundum, praeter és contra legem rendelet?",[["Secundum: a felhatalmazás szerint szabályoz, ideális; praeter: azon túl is szabályoz, aggályos; contra: nem arról szól, kizárt","Helyes. A contra legem rendelet érvénytelen."],["Contra legem: ideális, a felhatalmazással összhangban; secundum legem: aggályos; praeter legem: kizárt, érvénytelen","Contra legem kizárt."],["Praeter legem: érvénytelen, mert a felhatalmazáson túl szabályoz; secundum legem: aggályos; contra legem: ideális","Praeter legem aggályos, de nem automatikusan érvénytelen a tankönyv szerint."],["Secundum legem: kizárt, mert a rendelet csak kiegészíthet; praeter legem: ideális; contra legem: aggályos","Secundum legem ideális."]],0],[5,"C","IV. Rendelet","Mit jelent a felhatalmazó rendelkezés?",[["A törvényben található, és megmondja, hogy kit és milyen tárgyban hatalmaz fel rendeletalkotásra","Helyes. A végrehajtási rendeletet csak a felhatalmazott szerv alkothatja, csak olyan tartalommal, amire a felhatalmazás szól."],["A végrehajtási rendeletben található, és megjelöli a törvény végrehajtásának határidejét","A törvényben van."],["Az Alaptörvény általános felhatalmazása, amely minden szervet rendeletalkotásra jogosít","A törvényben."],["A bírósági ítéletben található, amelyben a bíróság a szervet rendeletalkotásra kötelezi","Nem."]],0],[5,"C","IV. Rendelet","Miért „az igazságügyért felelős miniszter” szerepel a felhatalmazó rendelkezésekben, és nem a minisztérium neve?",[["A szervezetalakítási szabadság miatt: a Kormány alakíthatja a struktúrát, a törvény csak a feladatkört jelöli","Helyes."],["Mert a törvényekben csak ilyen elnevezések használhatók, a minisztériumok nevét jogszabály tiltja","Nem."],["Mert a miniszterek személye a törvényben nem szerepelhet, csak a hivatali beosztásuk nevezhető meg","Nem."],["Mert az Alaptörvény kifejezetten előírja, hogy a felhatalmazásban a feladatkört kell megnevezni","Nem."]],0],[5,"C","IV. Rendelet","Kinek van eredeti jogalkotói hatásköre, azaz ki alkothat felhatalmazás nélkül, közvetlenül az Alaptörvény alapján rendeletet?",[["A kormány (15. cikk) és a helyi önkormányzat (32. cikk), ha törvény nincs és a feladatkörébe tartozik","Helyes."],["A miniszterek és a köztársasági elnök, ha az adott kérdést törvény nem szabályozza","Nem."],["Az Országgyűlés és az Alkotmánybíróság, saját működésük körében, felhatalmazás nélkül","Nem."],["Kizárólag a bíróságok, ha a törvényi szabályozás hiányát jogalkotással pótolják","Nem."]],0],[5,"T","IV. Rendelet","Eredeti jogalkotói hatáskörben a kormánynak és az önkormányzatnak rendeletalkotási kötelezettsége van.",false,"Hamis. Eredeti hatáskörben nincs rendeletalkotási kötelezettség, a szerv maga dönt, él-e a lehetőséggel; a származékos hatáskörnél a felhatalmazás teljesítése elvárt."],[6,"C","1. Fogalom","Miért kivételes a közvetlen hatalomgyakorlás?",[["A nép amorf embertömeg, önálló akarata nincs, és nagy közösségben nem lehet mindenkit minden kérdésbe bevonni","Helyes. Az önálló előzetes akarat politikai folyamat eredménye; ezért a képviseleti kormányzás a főszabály."],["Mert a népszavazás az Alaptörvény szerint tilos, csak a választásokon lehet közvetlenül dönteni","Nem tilos, kivételes."],["Mert a nép nem szuverén, a szuverenitást kizárólag az Országgyűlés gyakorolhatja a nép nevében","A nép szuverén, a gyakorlás módja a kérdés."],["Mert közvetlen hatalomgyakorlás csak köztársaságban létezik, monarchiában eleve kizárt","Nem."]],0],[6,"C","1. Fogalom","Melyik országok élnek ritkán, illetve rendszeresen a népszavazással?",[["Ritkán: Németország, Egyesült Királyság; rendszeresen: Svájc, Franciaország, Írország","Helyes."],["Ritkán: Svájc és Írország; rendszeresen: Németország és az Egyesült Királyság","Fordítva."],["Ritkán: Franciaország; rendszeresen: Egyesült Királyság, Svájc, Németország","Nem."],["Mindenhol ugyanolyan gyakran, mert az uniós jog egységesen szabályozza a gyakoriságot","Országonként élesen eltér."]],0],[6,"C","1. Fogalom","Mi a népszavazás előnye és két hátránya?",[["Előny: erős legitimáció; hátrány: igen/nem alternatíva, kompromisszum nélkül, és a kérdésfeltevéssel manipulálható","Helyes. Ezért kiemelt az egyértelműség követelménye."],["Előny: a kompromisszum lehetősége; hátrány: a lebonyolítás magas költsége és időigénye","Nem."],["Előny: szakmai pontosság; hátrány: a kérdések lassú előkészítése és bonyolult jogi nyelvezete","Nem."],["Előny: gyorsaság; hátrány: gyenge legitimáció, mert a részvétel mindig alacsony","Éppen erős legitimáció az előny."]],0],[6,"T","2. Magyar kialakulás","Sopron és környéke 1921 decemberében népszavazáson döntött, hogy Ausztriához vagy Magyarországhoz tartozzon, ezért nevezik a várost „a leghűségesebb városnak”.",true,"Igaz. A város neve: civitas fidelissima. A szocialista időszakban a népszavazás papíron az Elnöki Tanács jogköre volt, de sosem alkalmazták."],[6,"C","2. Magyar kialakulás","Mi volt a „négyigenes népszavazás”?",[["1989. november 26-i népszavazás: a köztársasági elnököt a parlamenti választás előtt vagy után válasszák-e; a „nem” győzött","Helyes. Az 1989. évi XVII. törvény alapján; a „nem” győzelme alapvetően befolyásolta az 1990-es átmenetet."],["1990-es népszavazás az EU-csatlakozásról, amely négy kérdésből állt, és mind a négyre igen válasz érkezett","Nem."],["2016-os népszavazás a betelepítési kvótáról, amely négy kérdést tett fel, és érvénytelen lett","Nem."],["1946-os népszavazás a köztársasági államformáról, amelyen négy kérdésre kellett igennel válaszolni","Nem."]],0],[6,"C","2. Magyar kialakulás","Mi a népszavazás jogforrásainak időrendje?",[["1989. évi XVII. tv. → 1998. évi III. tv. → 2013. évi CCXXXVIII. tv.","Helyes. A hatályos az Nsztv. (2013. évi CCXXXVIII. törvény)."],["2013. évi CCXXXVIII. tv. → 1998. évi III. tv. → 1989. évi XVII. tv.","Fordított sorrend."],["1998. évi III. tv. → 1989. évi XVII. tv. → 2013. évi CCXXXVIII. tv.","Nem."],["1989. évi XVII. tv. → 2013. évi CCXXXVIII. tv., 1998-ban nem volt külön törvény","1998-ban is volt törvény."]],0],[6,"T","2. Magyar kialakulás","A népi kezdeményezés ma is létezik, és megegyezik a népszavazással.",false,"Hamis. Az Alaptörvény már nem ismeri a népi kezdeményezést. Korábban meghatározott számú választópolgár kezdeményezhette, hogy az Országgyűlés napirendre tűzzön egy kérdést, de kötelező érdemi döntés (szavazás) nélkül. Vizsgán gyakori hiba a kettő összekeverése."],[6,"T","2. Magyar kialakulás","A 2016-os népszavazás az EU kötelező betelepítési kvótájáról, a 2022-es gyermekvédelmi tárgyban volt.",true,"Igaz. Ezek a legutóbbi országos népszavazások a tankönyv szerint."],[6,"C","3. Típusok","Milyen három szempont szerint csoportosítjuk a népszavazásokat?",[["Területi kiterjedés, a kezdeményezés jellege és az eredmény kötőereje","Helyes."],["A kérdés tárgya, a szavazás időpontja és a lebonyolítás helye","Nem."],["A szervező szerepe, a résztvevők köre és az eredmény érvényessége","Nem."],["Országos, megyei és települési szint szerint, csak a területi szempont","Ez csak a területi kiterjedés."]],0],[6,"C","3. Típusok","Ki kezdeményezhet országos népszavazást, és mikor kötelező elrendelni?",[["A köztársasági elnök, a Kormány vagy legalább 100 000 választópolgár; kötelező, ha legalább 200 000 választópolgár támogatja","Helyes."],["Csak az Országgyűlés kezdeményezhet, az elrendelés pedig minden esetben kötelező, mérlegelés nélkül","Nem."],["Az Országgyűlés képviselőinek egynegyede vagy 50 000 választópolgár; 100 000 aláírásnál kötelező","Nem."],["Csak a köztársasági elnök kezdeményezhet, a Kormány és a választópolgárok nem, bármilyen aláírásszám mellett","Nem."]],0],[6,"R","3. Típusok","A kötelező népszavazás „kötelező” jelzője nem az eredmény kötőerejére utal.","A kötelező népszavazásnál az Országgyűlésnek nincs mérlegelési joga az elrendelés kérdésében.","A","Igaz: a kezdeményezés jellegét és az eredmény ügydöntő jellegét nem szabad összekeverni.","Igaz.","A „kötelező” jelző éppen azt fejezi ki, hogy az elrendelés nem mérlegelhető, ezért nem az eredményre vonatkozik."],[6,"C","4. Tárgy","Melyik kérdés NEM tiltott tárgykör az Alaptörvény 8. cikk (3) bekezdése szerint?",[["Egy olyan országos politikai kérdés, amely nem szerepel a tiltott tárgykörök felsorolásában","Helyes: a tiltott tárgykörök felsorolása negatív, ami nincs benne, népszavazásra bocsátható."],["Az Alaptörvény módosításának kérdése, amelyről a nép közvetlenül is dönthetne","Tiltott."],["Az országgyűlési képviselők választásának kiírása vagy elhalasztása","Tiltott."],["A központi költségvetés végrehajtásáról szóló zárszámadás elfogadása","Tiltott."]],0],[6,"C","4. Tárgy","Mi az egyértelműség kettős követelménye a népszavazási kérdéseknél? (Az AB elsőként a 25/1999. (VII. 7.) határozatban mondta ki.)",[["Választópolgári egyértelműség (csak egyféleképpen értelmezhető) és jogalkotói egyértelműség (a jogalkotási kötelezettség felismerhető)","Helyes. A választópolgár számára a kérdés csak egyféleképpen érthető; a jogalkotó számára világos, mit kell megalkotnia. Elsőként a 25/1999. (VII. 7.) AB határozat mondta ki."],["Csak választópolgári egyértelműség: elég, ha a kérdés a szavazók számára érthető, a jogalkotót ez nem érinti","A követelmény kettős."],["Pártpolitikai és gazdasági egyértelműség: a kérdés ne kedvezzen egyetlen pártnak, és ne érintse a költségvetést","Nem."],["Nyelvi és eljárási egyértelműség: a kérdés nyelvtanilag hibátlan, és az eljárás szabályai is világosak","Nem."]],0],[6,"T","4. Tárgy","Elég, ha a népszavazási kérdés a választópolgár számára érthető, a jogalkotói egyértelműség nem követelmény.",false,"Hamis. Mindkét követelménynek együtt kell teljesülnie: lehet olyan kérdés, amely a választónak érthető, de a jogalkotónak nem ad eligazítást (túl általános), és fordítva, a jogtechnikailag pontos kérdés a választónak átláthatatlan lehet. Ha bármelyik funkció sérül, az intézmény céljával kerül ellentétbe."],[6,"C","4. Tárgy","Mi a moratórium a népszavazásnál?",[["Érvényes, eredményes népszavazás után (jelenleg három évig) nem lehet újabb kezdeményezés ugyanabban a tárgykörben","Helyes. A döntés stabilitását védi."],["A már kitűzött népszavazás elhalasztása az Országgyűlés döntésével, legfeljebb egy évre","Nem."],["Az érvénytelen népszavazás eredményének megsemmisítése és a kérdés újra kitűzése a Kúria határozata alapján","Nem."],["A kezdeményezés tilalma az országgyűlési választást megelőző három hónapban, a kampány tisztaságának védelmében","Nem."]],0],[6,"C","5. Eredmény","Mi a népszavazás eredményének kötőereje és a végrehajtási határidő?",[["Az érvényes és eredményes népszavazás ügydöntő, az Országgyűlést köti; 180 napon belül jogszabályt kell alkotnia","Helyes. Minden népszavazás ügydöntő."],["A népszavazás csak véleménynyilvánító, az Országgyűlés szabadon mérlegelheti az eredményt","Az Alaptörvény alatt minden ügydöntő."],["Az eredmény csak a Kormányt köti, amely 30 napon belül köteles a döntést végrehajtani","180 nap, és az Országgyűlést köti."],["Az eredmény csak akkor köt, ha a választójogosultak háromnegyede részt vett a szavazáson","Nem ez a feltétel."]],0],[6,"C","6. Eljárás","Melyik a választópolgári kezdeményezésű népszavazási eljárás öt fázisa a helyes sorrendben?",[["Kezdeményezés és hitelesítés → aláírásgyűjtés → ellenőrzés → elrendelés (Országgyűlés) → kitűzés (köztársasági elnök)","Helyes."],["Elrendelés (Országgyűlés) → hitelesítés → aláírásgyűjtés → ellenőrzés → kitűzés (köztársasági elnök)","Nem ez a sorrend."],["Aláírásgyűjtés → hitelesítés → kitűzés (köztársasági elnök) → elrendelés (Országgyűlés) → ellenőrzés","Nem."],["Hitelesítés → kitűzés (köztársasági elnök) → aláírásgyűjtés → ellenőrzés → elrendelés (Országgyűlés)","Nem."]],0],[6,"C","6. Eljárás","Ki hitelesíti a népszavazási kérdést, és ki a jogorvoslati fórum?",[["Az NVB hitelesít (a Nemzeti Választási Iroda előszűrése után); jogorvoslat: Kúria, majd Alkotmánybíróság","Helyes."],["A Kúria hitelesít (a Nemzeti Választási Iroda előszűrése után); jogorvoslat: az NVB, majd az AB","Fordítva."],["A köztársasági elnök hitelesít a Kormány javaslatára; jogorvoslat: Kúria, majd az Országgyűlés","Ő tűzi ki a népszavazást."],["Az Országgyűlés hitelesít bizottsági előkészítés után; jogorvoslat: Kúria, majd Alkotmánybíróság","Ő elrendeli."]],0],[6,"C","6. Eljárás","Mikor utasítja el az NVB a kérdés hitelesítését?",[["Ha a kérdés a népszavazás alkotmányos céljával nyilvánvalóan ellentétes, vagy nem egyértelmű","Helyes."],["Ha a kérdés politikailag kényes, vagy a hatályos kormányzati álláspontnak ellentmond","Nem ez az indok."],["Ha a kezdeményezést politikai párt szervezi, mert csak magánszemély kezdeményezhet","A szervező lehet párt is."],["Soha, mert az NVB hitelesítési jogköre kötött, és mérlegelést nem enged, minden kérdést hitelesít","Elutasíthat."]],0],[6,"C","6. Eljárás","Mi az AB szerepe az elrendelésről szóló országgyűlési határozattal szemben?",[["Kasszációs jogkör: helybenhagyja vagy megsemmisíti a határozatot, és új határozatra utasítja az Országgyűlést","Helyes."],["Maga rendeli el a népszavazást, ha az Országgyűlés a határidőt elmulasztotta, és a kérdés nem tiltott","Nem."],["Nincs szerepe, mert az országgyűlési határozat felülvizsgálatát kizárja az alkotmány, az Országgyűlés döntése végleges","Van."],["Módosítja a határozatot, és a javított szöveggel maga hagyja jóvá az elrendelést","Nem módosíthat, csak kasszálhat."]],0],[6,"C","6. Eljárás","Mi a legfontosabb különbség a választói és az elnöki/kormányzati kezdeményezésű eljárás között?",[["Választói kezdeményezésnél van aláírásgyűjtés és -ellenőrzés, elnöki/kormányzatinál nincs; ott az Országgyűlés mérlegel","Helyes. A hitelesítés mindkét útnál azonos (NVB → Kúria → AB), a kitűzés mindkettőnél a köztársasági elnök."],["Az elnöki kezdeményezésnél több aláírás kell, mint a választói kezdeményezésnél, ezért az nehezebb","Nem kell aláírás."],["Az elnöki kezdeményezésnél az elrendelés mindig kötelező, a választóinál az Országgyűlés mérlegel","Az elnöki esetben mindig mérlegelés van."],["Az elnöki kezdeményezésnél a kitűzést a Kormány végzi, a választóinál a köztársasági elnök","A köztársasági elnök tűzi ki mindkét esetben."]],0],[6,"T","6. Eljárás","Ha a köztársasági elnök vagy a Kormány kezdeményez népszavazást, a hitelesítés után az Országgyűlés szabadon dönt az elrendelésről.",true,"Igaz. Az így kezdeményezett népszavazás mindig fakultatív."],[6,"R","6. Eljárás","A választópolgári kezdeményezésnél az Országgyűlés köteles elrendelni a népszavazást, ha az aláírások száma eléri a 200 000-et.","A kötelező elrendelés azért áll fenn, mert az ilyen népszavazás eredménye ügydöntő.","C","Igaz: 200 000 aláírás esetén kötelező népszavazás.","Hamis (mint indok): a 'kötelező' jelző a kezdeményezés jellegére utal, nem az eredmény kötőerejére; az eredmény minden népszavazásnál ügydöntő, a kötelező elrendelés oka a 200 000 aláírás küszöbe.","Az első állítás igaz, a második mint indok téves."],[7,"C","I. Fogalom","Mi a választójog tárgyi, illetve alanyi értelme?",[["Tárgyi (tágabb): a választási szabályok összessége; alanyi (szűkebb): a választójogosultság, aktív és passzív","Helyes. A tárgyi értelem a képviseleti szervek tagjai megválasztásának anyagi és eljárási rendjét meghatározó jogszabályok összessége; az alanyi az aktív (választani) és passzív (választhatónak lenni) jogosultság."],["Tárgyi: az aktív választójog (választani); alanyi: a passzív választójog (választhatónak lenni)","Nem."],["Tárgyi: csak az Alaptörvény rendelkezései; alanyi: a választási törvény (Ve.) szabályai","Nem."],["A két fogalom azonos, csak a szakirodalom használja őket eltérően a jogosultságra","Nem azonos."]],0],[7,"C","I. Fogalom","Melyik a választójog négy fő forrása közül a választási eljárás közös szabályait tartalmazó?",[["A Ve. (2013. évi XXXVI. törvény)","Helyes."],["A Vjt. (2011. évi CCIII. törvény)","Ez az országgyűlési képviselők választásáról szól."],["Az EP tv. (2003. évi CXIII. törvény)","Ez az EP-választás."],["Az Övt.","Ez az önkormányzati választás."]],0],[7,"C","II. Rendszerek","Mi a választási rendszer, és melyik a három alaptípus?",[["A módszer, amellyel a szavazatokat mandátumokra váltják át; többségi, arányos és vegyes (kompenzációs)","Helyes."],["A választójogosultak névjegyzéke és annak vezetése; helyi, országos és európai névjegyzék","Nem."],["A választás időpontjának kitűzési rendje; tavaszi, őszi, téli vagy rendkívüli választás","Nem."],["A jelölés módja és a jelöltállítás szabályai; egyéni, listás és vegyes jelölés","Nem."]],0],[7,"C","II. Rendszerek","Mi a különbség az abszolút és a relatív többségi rendszer között?",[["Abszolút: a szavazatok több mint fele kell, különben második forduló; relatív: a legtöbb szavazatot kapó nyer","Helyes. Abszolút pl. Franciaország; relatív pl. Egyesült Királyság, a magyar egyéni kerületek (akár egy szavazat előnnyel is)."],["Abszolút: a legtöbb szavazatot kapó nyer; relatív: több mint a szavazatok fele kell, különben második forduló","Felcserélt."],["Mindkettő második fordulót kíván, csak a bejutási küszöb mértéke különbözik köztük","A relatív nem."],["Nincs különbség, mindkettő a legtöbb szavazatot kapó jelölt győzelmét jelenti","Van."]],0],[7,"C","II. Rendszerek","Mi az arányos rendszer jellemzője és a bejutási küszöb célja?",[["Kerületenként több mandátum, a listákra leadott szavazatok arányában; a küszöb a túlzott fragmentáció ellen szól","Helyes. Minél nagyobb a kerület, annál pontosabb az arányosítás (pl. Hollandia, Izrael)."],["Egy kerületben egy mandátum, a legtöbb szavazatot kapó jelölt nyer; a küszöb célja a kisebbségek védelme","Ez a többségi rendszer."],["Kerületenként több mandátum, de a küszöb célja a kisebb pártok szándékos kizárása a parlamentből","A cél a fragmentáció elkerülése."],["A győztes mindent visz: a legtöbb szavazatot kapó lista kapja az összes mandátumot, küszöb nélkül","Ez a többségi jellegű rendszer."]],0],[7,"C","II. Rendszerek","Mi a D'Hondt-módszer?",[["A listák szavazatszámát 1-gyel, 2-vel, 3-mal stb. elosztjuk, és a legnagyobb hányadosok kapják a mandátumokat","Helyes."],["A legtöbb szavazatot kapó jelölt nyeri az egyéni kerületet, a többi szavazat elvész, kompenzáció nélkül","Ez a relatív többségi rendszer."],["A szavazatok felét elérő lista kapja az összes mandátumot, a többi pártnak mandátum nem jár","Ez az abszolút többségi logika."],["A mandátumokat a bejutó pártok között sorsolják, a szavazatszámukra tekintet nélkül","Nem."]],0],[7,"C","II. Rendszerek","Miért vegyes és kompenzációs a magyar országgyűlési választási rendszer?",[["Vegyes: egyéni kerületi (többségi) és országos listás (arányos) elemet ötvöz; kompenzációs: a töredékszavazatok a listás elosztásnál beszámítanak","Helyes. A kompenzáció részben ellensúlyozza a többségi elem aránytalanító hatását."],["Vegyes, mert két fordulóban szavaznak; kompenzációs, mert a második forduló kiegyenlíti az első eredményét","Nem ezért."],["Vegyes, mert külföldi és belföldi választók is szavazhatnak; kompenzációs, mert a külföldiek szavazata beszámít","Nem."],["Vegyes, mert a Kormány és az Országgyűlés együtt dönt; kompenzációs, mert az állam kompenzálja a pártok költségeit","Nem."]],0],[7,"C","III. Alapelvek","Mit jelent a választójog általánossága, és ki zárható ki a XXIII. cikk (6) bekezdése szerint?",[["Minden nagykorút megillet; kizárni csak bírói döntéssel lehet, szűk körben (pl. kényszergyógykezelés)","Helyes. XXIII. cikk (6): szabadságvesztés, kényszergyógykezelés, belátási képesség hiánya."],["Csak a magyarországi lakóhellyel rendelkezőket illeti meg, a külföldön élők kizárhatók a jogból","Nem."],["Mindenkit megillet kivétel nélkül, a bíróság sem zárhatja ki senki választójogát, mert alapjog","Vannak kizárási okok."],["A nagykorúakat illeti meg; a kizárásról a közigazgatási hatóság dönt, a bíróság csak jogorvoslati fórum","A bíróság dönt."]],0],[7,"T","III. Alapelvek","A gondnokság alá helyezés automatikusan a választójog elvesztésével jár.",false,"Hamis. A kizárás nem automatikus: a belátási képesség korlátozottsága esetén a bíróságnak külön kell döntenie a választójogból való kizárásról. A gondnokság és a kizárás két, egymástól elváló bírói döntés."],[7,"C","III. Alapelvek","Mit mondott ki az EJEB a Hirst kontra Egyesült Királyság ügyben?",[["A szabadságvesztést töltők differenciálatlan, automatikus kizárása sérti a választójogot; egyedi bírói mérlegelés kell","Helyes. A magyar szabályozás (bírói eljáráshoz kötött kizárás) elvben megfelel."],["Az elítélteket soha nem lehet kizárni a választójogból, a választójog korlátozhatatlan","Egyedi, bírói mérlegelés alapján lehet."],["Az elítéltek csak levélben szavazhatnak, a szavazóhelyiségben nem, mert ott zavarnák a rendet","Nem erről döntött."],["A választójogot csak a hatóság korlátozhatja, bírói döntés nélkül, ha a törvény ezt kimondja","Nem, éppen bírói mérlegelés kell."]],0],[7,"C","III. Alapelvek","Mit jelent a választójog egyenlősége?",[["Mindenkinek ugyanannyit ér a szavazata: nincs plurális szavazat, a kerületek hozzávetőleg azonos létszámúak","Helyes."],["Mindenki ugyanarra a pártra köteles szavazni, hogy a képviselet arányosan egyenlő legyen minden kerületben","Nem."],["A pártok azonos számú mandátumot kapnak, függetlenül a leadott szavazatok számától és a listák méretétől","Nem."],["Mindenki köteles szavazni, hogy a részvétel egyenlő legyen minden egyes választókerületben és korosztályban","Nem erről szól."]],0],[7,"C","III. Alapelvek","Mi a gerrymandering?",[["Az aránytalanul eltérő méretű választókerületek tudatos kialakítása; a név Gerry amerikai politikustól ered","Helyes. Szalamandra alakú kerület; sérti az egyenlőséget."],["A szavazatok megvásárlása vagy ellenszolgáltatáshoz kötése a választás napja előtt, a jelöltek által","Nem."],["A választási csalás egyik neme: ugyanaz a személy többször is leadja a voksát a választás napján","Nem."],["A bejutási küszöb önkényes emelése a választás előtt, a kisebb pártok kizárása céljából","Nem."]],0],[7,"C","III. Alapelvek","Mit jelent a közvetlenség és a titkosság?",[["Közvetlenség: mások közbeiktatása nélkül szavaz; titkosság: a szavazat tartalma senki más számára nem ismerhető meg","Helyes. Az államnak biztosítania kell a technikai feltételeket."],["Közvetlenség: elektori kollégium szavaz a választók nevében; titkosság: a szavazás eredménye titkos marad","Az közvetett választás."],["Közvetlenség: a megbízott is szavazhat a választó nevében; titkosság: a névjegyzék titkos marad","Nem."],["Közvetlenség: levélben is bárki szavazhat; titkosság: a jelöltek neve a szavazásig titkos marad","Nem."]],0],[7,"C","III. Alapelvek","Melyik NEM a Ve. 2. §-ában rögzített eljárásjogi alapelv?",[["A kötelező részvétel","Helyes: az önkéntes részvétel az elv."],["A választás tisztaságának megóvása","Alapelv."],["A jogorvoslathoz való jog","Alapelv."],["A választási eljárás nyilvánossága","Alapelv."]],0],[7,"C","III. Alapelvek","Milyen eszközöket biztosít a törvény a fogyatékossággal élő választópolgárok esélyegyenlőségéhez?",[["Braille-írásos tájékoztató, akadálymentesített szavazóhelyiség és mozgóurna","Helyes."],["Kizárólag postai szavazás, a szavazóhelyiség látogatása nélkül, minden fogyatékos számára","Nem."],["Automatikus mandátum a fogyatékossággal élők képviselői számára az Országgyűlésben","Nem."],["Kötelező megbízott kijelölése, aki a fogyatékos választó helyett leadja a szavazatát","Nem."]],0],[7,"C","IV. Országgyűlési választás","Hány képviselője van az Országgyűlésnek, és hogyan oszlik meg?",[["199 fő: 106 egyéni választókerületi (relatív többség) és 93 országos listás (D'Hondt, töredékszavazatokkal)","Helyes."],["199 fő: 93 egyéni választókerületi és 106 országos listás képviselő, ugyanazon módszerekkel","Felcserélt."],["200 fő: 100 egyéni és 100 országos listás képviselő, abszolút többségi rendszerben","Nem."],["386 fő: a rendszerváltás után kialakult, régi háromszintű rendszer szerinti összetétel","A régi szám."]],0],[7,"C","IV. Országgyűlési választás","Hány ajánlás kell az egyéni választókerületi jelölteknek, és mi történik szavazategyenlőségnél?",[["500 választópolgár ajánlása; szavazategyenlőségnél időközi választás","Helyes."],["1000 választópolgár ajánlása; szavazategyenlőségnél sorsolás dönt a győztesről","Nem."],["50 választópolgár ajánlása; szavazategyenlőségnél második forduló következik","Nem."],["Nem kell ajánlás, elég a pártigazolás; szavazategyenlőségnél időközi választás","Ajánlás kell."]],0],[7,"C","IV. Országgyűlési választás","Ki állíthat országos pártlistát?",[["Az a párt, amely legalább 14 megyében és a fővárosban összesen legalább 21 egyéni jelöltet indít","Helyes."],["Bármely párt, amely legalább 10 000 támogató aláírást gyűjt, egyéni jelöltek állítása nélkül","Nem."],["Csak az a párt, amely az előző ciklusban már bejutott az Országgyűlésbe, jelölt nélkül is","Nem."],["Az a párt, amely legalább 5 megyében és a fővárosban összesen 10 egyéni jelöltet indít","Nem."]],0],[7,"T","IV. Országgyűlési választás","Nemzetiségi listát két vagy több nemzetiségi önkormányzat közösen is állíthat.",false,"Hamis. Nemzetiségi listát kizárólag országos nemzetiségi önkormányzat állíthat, legalább három jelölttel; két vagy több közösen nem állíthat."],[7,"C","IV. Országgyűlési választás","Mekkora a bejutási küszöb?",[["Önálló pártlista: 5%; két párt közös listája: 10%; három vagy több párt közös listája: 15%","Helyes."],["Mindenkinél egységesen 5%, függetlenül attól, hogy önálló vagy közös listát állítanak","Nem."],["Önálló lista: 4%; két párt közös listája: 8%; három vagy több párt közös listája: 12%","Nem."],["Önálló lista: 10%; két párt közös listája: 20%; három vagy több párt közös listája: 30%","Nem."]],0],[7,"C","IV. Országgyűlési választás","Mi a nemzetiségi mandátumkedvezmény és a nemzetiségi szószóló?",[["Kedvezményes kvóta: ha eléri, teljes jogú mandátum; ha nem, szószólót delegálhat, tanácskozási joggal, szavazati jog nélkül","Helyes. A kvóta alacsonyabb a rendes listás kvótánál."],["A nemzetiség szószólót delegál, akinek tanácskozási és szavazati joga is van, a kvóta elérése nélkül","A szószólónak nincs szavazati joga."],["Minden nemzetiség automatikusan teljes jogú mandátumot kap, kvóta nélkül, listás elosztásban","Nem."],["A szószóló a Kormány tagja, aki a nemzetiségi ügyekben vétójoggal rendelkezik az Országgyűlésben","Nem."]],0],[7,"C","IV. Országgyűlési választás","Hogyan töltik be a megüresedett mandátumot?",[["Egyéni kerületben időközi választás; listán a következő jelölt lép be, ha nincs, betöltetlen marad","Helyes."],["Mindig időközi választást tartanak, a lista és az egyéni kerület esetén is, három hónapon belül","Listás mandátumnál nem."],["Mindig a következő jelölt lép be a helyére, egyéni kerület esetén a második helyezett jelölt","Egyéni kerületnél időközi választás."],["A Kormány nevezi ki a megüresedett mandátum új birtokosát a köztársasági elnök egyetértésével","Nem."]],0],[7,"R","IV. Országgyűlési választás","Az országgyűlési választási rendszer kompenzációs.","A töredékszavazatok az országos listás mandátumok elosztásánál is beszámítanak.","A","Igaz.","Igaz.","A töredékszavazatok beszámítása éppen az, amiért kompenzációsnak nevezzük."],[8,"C","F1. Kronológia","Melyik eseménysor áll helyes időrendben?",[["1222 Aranybulla → 1848 áprilisi törvények → 1867 kiegyezés → 1949 első kartális alkotmány → 1989 rendszerváltás → 2011 Alaptörvény","Helyes."],["1867 kiegyezés → 1848 áprilisi törvények → 1222 Aranybulla → 1949 első kartális alkotmány → 1989 rendszerváltás → 2011 Alaptörvény","Az Aranybulla a legrégebbi, és 1848 megelőzi 1867-et."],["1222 Aranybulla → 1848 áprilisi törvények → 1867 kiegyezés → 1989 rendszerváltás → 1949 első kartális alkotmány → 2011 Alaptörvény","1949 megelőzi 1989-et."],["2011 Alaptörvény → 1989 rendszerváltás → 1949 első kartális alkotmány → 1867 kiegyezés → 1848 áprilisi törvények → 1222 Aranybulla","Fordított."]],0],[8,"C","F1. Kronológia","Melyik évhez kötődik a kékcédulás választás és az utána következő „leszalámizás”?",[["1947","Helyes. Ez vetett véget az 1946–1949 közötti nem klasszikus dem
