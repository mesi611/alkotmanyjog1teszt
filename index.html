m tartozik közéjük","A roma elismert nemzetiség."],["7 elismert nemzetiség; a német nem tartozik közéjük","Tizenhárom van, a német közöttük van."],["20 elismert nemzetiség; a ruszin nem tartozik közéjük","Tizenhárom van, a ruszin közöttük van."]],0],[4,"T","IV. Nemzetiségek","A ruszinok azonosak az ukránokkal, ezért külön nemzetiségként nem ismerték el őket.",false,"Hamis. A ruszinok nem azonosak az ukránokkal, mindkét közösség külön elismert nemzetiség."],[4,"C","IV. Nemzetiségek","Mit jelent a szabad identitásvállalás?",[["A nemzetiséghez tartozás kizárólag önbevalláson alapulhat, senki nem kényszeríthető identitása feltárására, és a vállalt identitás hatóságilag nem vizsgálható felül","Helyes."],["A hatóság ellenőrzi a nemzetiségi hovatartozást","Éppen nincs kontroll."],["Csak származással igazolható","Önbevallás elég."],["Csak az anyanyelv alapján dönthető el","Nem így van."]],0],[4,"R","IV. Nemzetiségek","Európában a nemzetiségi hovatartozás nem vizsgálható felül, és nincs etnikai nyilvántartás.","A náci Németország etnikai listázásainak és a numerus clausus tapasztalata után az etnikai alapú nyilvántartás politikailag és jogilag egyaránt vállalhatatlan.","A","Igaz: az USA-val és Kanadával szemben (ahol az őslakos identitás bíróság előtt is vizsgálható) Európában elképzelhetetlen a kontroll.","Igaz.","A történelmi tapasztalat okozza, hogy Európában nincs ilyen kontroll."],[4,"C","IV. Nemzetiségek","Mi a szabad identitásvállalás gyakorlati kockázata?",[["Szabad identitásválasztássá válhat: valós alap nélkül is választható identitás (pl. nemzetiségi önkormányzati források, pozitív diszkrimináció)","Helyes. A dilemma feloldhatatlan: a kontroll bevezetése rosszabb, mint a visszaélés eltűrése."],["A nemzetiségek eltűnése","Nem ez a kockázat."],["Az AB hatáskörének bővülése","Nem ez a kockázat."],["A kétnyelvű táblák megszűnése","Nem ez a kockázat."]],0],[4,"C","IV. Nemzetiségek","Melyik a nemzetiség tagját önállóan illető, egyéni jog?",[["A névhasználat és a nyelvhasználat","Helyes. Az eljárásokban a hivatalos nyelv a magyar, de a nemzetiségi nyelv is használható."],["Kétnyelvű helységnévtáblák","Ez kollektív jog."],["Iskola-, óvodaalapítás","Ez kollektív jog."],["Nemzetiségi önkormányzat létrehozása","Ez kollektív jog."]],0],[4,"C","IV. Nemzetiségek","Melyik kollektív nemzetiségi jog, és mi a feltétele a kétnyelvű táblákhoz?",[["Ha egy településen 25%-nál több nemzetiségi él: kétnyelvű táblák és intézménynevek","Helyes."],["10% fölött kétnyelvű táblák","Nem 10%."],["50% fölött kötelező","Nem 50%."],["Minden településen kötelező","Nem."]],0],[4,"C","IV. Nemzetiségek","Mi a nemzetiségi önkormányzat választásának feltétele?",[["A legutóbbi népszámláláson az adott településen legalább harmincan vallották magukat anonim módon az adott nemzetiséghez tartozónak; a választás maga nem anonim, külön névjegyzékbe vétel kell","Helyes. A megoldás ára: a népszámlálás tízévente zajlik, tíz év alatt a település összetétele jelentősen megváltozhat."],["Minden választás előtt külön jelentkezés","Ez volt a korábbi megoldás, amit a visszaélések miatt váltottak le."],["Legalább 1000 fő","Nem ez a feltétel."],["Az Országgyűlés döntése településenként","Nem ez a feltétel."]],0],[4,"T","IV. Nemzetiségek","A nemzetiségi önkormányzatot települési, vármegyei és országos szinten is létre lehet hozni, közvetlen választás útján.",true,"Igaz. Települési szinten az önkormányzati működés segítése és rendezvények szervezése, országos szinten az országos politikai képviselet a feladat."],[4,"C","V. Állampolgárság","Mi az állampolgárság, és ki lehet az alanya?",[["A legszorosabb közjogi kapcsolat egy állam és egy természetes személy között; csak természetes személy lehet állampolgár, jogi személynek honossága lehet","Helyes."],["Az állam és bármely jogalany kapcsolata","Csak természetes személy."],["Csak szerződéses viszony","Közjogi kapcsolat."],["Kizárólag jogokat keletkeztet","Mindkét oldalon jogokat és kötelezettségeket is."]],0],[4,"C","V. Állampolgárság","Melyik a két nemzetközi alapelv az állampolgárság kapcsán?",[["Senkit nem lehet megfosztani az állampolgárságától, és a hontalanságot vissza kell szorítani","Helyes. Ideális, ha mindenki legalább egy, lehetőleg egy államhoz kapcsolható."],["Mindenki szerezzen minél több állampolgárságot","Ez nem alapelv."],["Az állampolgárság elvehető büntetésként","Éppen ellenkező az alapelv."],["A hontalanság szükséges a nemzetközi jog szerint","A hontalanságot vissza kell szorítani."]],0],[4,"C","V. Állampolgárság","Miért problémás a többes állampolgárság a tankönyv szerint?",[["Bonyodalmakat okoz: baráti és ellenséges állam állampolgárságánál nem közömbös, melyiket veszi figyelembe az eljáró állam; honvédelmi kötelezettségnél feloldhatatlan helyzet is lehet","Helyes. Ezért tiltja számos ország (pl. Ausztria, Ukrajna, Szlovákia)."],["Mert a nemzetközi jog tiltja","A nemzetközi jog nem tiltja."],["Mert adófizetést nem lehet beszedni","Nem ez az érv."],["Mert csak köztársaságokban létezik","Nincs ilyen megkötés."]],0],[4,"C","V. Állampolgárság","Mi a menekült, a menedékes és a migráns közötti lényeges különbség?",[["Menekült: egyéni jog, tartós; menedékes: kollektív jogcím, ideiglenes (háború miatt menekülő nagyszámú csoport); migráns: nem jogi kategória, nincs alanyi jog a befogadásra","Helyes."],["Mind a három ugyanaz","Éles különbség van."],["Menekült: kollektív, ideiglenes; menedékes: egyéni, tartós","Felcserélt."],["A migráns alanyi joga a befogadás","Nincs alanyi jog a befogadásra."]],0],[4,"C","V. Állampolgárság","Ki minősül menekültnek?",[["Akit a saját országában üldöznek, vagy üldöztetésétől megalapozottan tart nemének, fajának, politikai hovatartozásának, szexuális orientációjának vagy vallásának miatt","Helyes. Pl. ahol a homoszexualitás halálbüntetéssel fenyegetett."],["Aki gazdasági okból hagyja el az országát","Ő migráns."],["Aki háború miatt ideiglenesen menekül nagyszámú csoportban","Ez a menedékes."],["Aki turistaként érkezik","Nem menekült."]],0],[4,"T","V. Állampolgárság","A menekültstátusszal rendelkező személy nem utasítható ki és nem küldhető vissza, és könnyített honosítást kaphat.",true,"Igaz. A menekültnek tartós letelepedés, szabad mozgás, könnyített honosítás jár; a menedékes csak ideiglenesen tartózkodhat az első biztonságos országban, jellemzően táborban, korlátozott mozgással."],[4,"C","V. Állampolgárság","Mi az állampolgárság keletkezése, és miben különbözik a szerzéstől?",[["Keletkezés: külön aktus nélkül jön létre (születés, családi kötelék utólagos megállapítása); szerzés: aktív magatartás szükséges (honosítás, visszahonosítás, nyilatkozattétel)","Helyes."],["Keletkezés: aktív magatartást igényel; szerzés: automatikus","Felcserélt."],["Nincs különbség","A nyelvtani különbség jogi tartalmat hordoz."],["Keletkezés: csak a honosítás","Nem."]],0],[4,"C","V. Állampolgárság","Mi a különbség a ius sanguinis és a ius soli között?",[["Ius sanguinis: a szülő állampolgársága számít (vérségi elv; Magyarország); ius soli: a születés helye számít (pl. USA, Ausztrália)","Helyes."],["Ius sanguinis: a születés helye; ius soli: a szülő állampolgársága","Felcserélt."],["Mindkettő a szülő állampolgárságán alapul","Nem."],["Magyarország a ius soli államok közé tartozik","Vérségi elvet követ."]],0],[4,"C","V. Állampolgárság","Mikor érvényesül a magyar jogban kisegítő jelleggel a területi elv?",[["Hontalan szülők Magyarországon született gyermekénél és a talált gyermeknél","Helyes. A talált gyermek magyar állampolgársága megdönthető vélelem."],["Minden Magyarországon született gyermeknél","Magyarország főszabálya a vérségi elv."],["Csak a külföldi diplomaták gyermekénél","Nem."],["Sohasem","Két esetben érvényesül."]],0],[4,"T","V. Állampolgárság","A talált gyermek magyar állampolgársága megdönthető vélelem: ha kiderül, kik a szülei, és a vérségi elv alapján nem illetné meg, elveszíti az állampolgárságot.",true,"Igaz. A vélelem egy valószínű tény valósként való elfogadása."],[4,"R","V. Állampolgárság","Ha egy személy születése után bíróság állapítja meg, hogy az apja magyar állampolgár, magyar állampolgárságot szerez.","Ez az állampolgárság-keletkezés mindig a születésre visszamenőleges hatályú.","A","Igaz: a fennálló rokoni kapcsolat utóbb bebizonyosodott.","Igaz.","Mivel az apa a születéskor is az apja volt, az állampolgárság visszamenőleg keletkezik."],[4,"C","V. Állampolgárság","Hány év a honosítás főszabály szerinti tartózkodási ideje, és mikor csökken 5, illetve 3 évre?",[["8 év; 5 évre, ha Magyarországon született vagy kiskorúként került ide; 3 évre, ha menekült, házastársa magyar állampolgár, vagy örökbefogadás útján kapcsolódik","Helyes."],["10 év; 5 évre minden uniós polgár esetén","Nem."],["3 év; 8 évre a menekülteknél","Fordított."],["5 év; 8 évre a házastársaknak","Nem."]],0],[4,"C","V. Állampolgárság","Mi igaz a honosítás büntetlen előéleti feltételére?",[["A magyar jog szerint értendő: külföldön emberölésért elítélt nem honosítható; külföldön házasságtörésért elítélt igen, mert az Btk. szerint nem bűncselekmény","Helyes. Külföldön folyó büntetőeljárás nem kizáró ok, Magyarországon folyó igen."],["Bármely külföldi ítélet kizár","Nem, csak ami a magyar jog szerint is bűncselekmény."],["Csak magyar bírósági ítélet számít","Bárhol a világon hozott ítélet számít, ha a cselekmény a Btk. szerint is bűncselekmény."],["Nincs büntetlen előélet feltétel","Van."]],0],[4,"C","V. Állampolgárság","Ki mentesül az állampolgársági vizsga alól?",[["A kiskorú, a 65 év feletti, a magyar nyelvű felsőoktatási végzettséggel rendelkező, valamint a házastársi jogcímen honosított személy","Helyes."],["Mindenki, aki 5 éve él Magyarországon","Nincs ilyen mentesség."],["Csak a kiskorú","Több mentességi kör van."],["Senki","Van mentesség."]],0],[4,"C","V. Állampolgárság","Ki dönt a honosítási kérelemről, és megtagadható-e minden feltétel teljesülése esetén?",[["A köztársasági elnök dönt; igen, megtagadható, mert a feltételek teljesítése nem alanyi jogot, hanem lehetőséget keletkeztet; jogorvoslat nincs","Helyes. Az állampolgárság szuverenitási kérdés."],["A bíróság dönt; nem tagadható meg","Nem a bíróság dönt."],["A belügyminiszter dönt; nem tagadható meg","A köztársasági elnök dönt."],["A köztársasági elnök dönt, de nem tagadhatja meg","Megtagadhatja."]],0],[4,"C","V. Állampolgárság","Hogyan szűnhet meg a magyar állampolgárság?",[["Lemondással vagy visszavonással (csalással szerzett állampolgárság, csak tíz éven belül); megfosztás nem lehetséges","Helyes."],["Megfosztással büntetésként","A megfosztás nemzetközi alapelv szerint kizárt."],["Automatikusan külföldre költözéssel","Nem."],["Csak halállal","Lemondással és visszavonással is."]],0],[4,"C","V. Állampolgárság","Mi a visszahonosítás tipikus esete?",[["Valaki lemondott a magyar állampolgárságáról egy másik megszerzése érdekében, de azt végül nem kapta meg; hogy ne váljon hontalanná, visszahonosítható","Helyes. Ha megszerezte a másikat és utóbb kéri vissza a magyart, az már rendes honosítás."],["Aki sosem volt magyar állampolgár","Ő honosítással szerezhet."],["Akit megfosztottak az állampolgárságtól","Megfosztás nincs."],["Aki két éve külföldön él","Nem."]],0],[4,"T","V. Állampolgárság","A nyilatkozattétellel történő állampolgárság-szerzésnél az államnak nincs mérlegelési joga, és nincs köztársasági elnöki vétó.",true,"Igaz. A nyilatkozat megtételével az állampolgárság megszerezhető (a kommunista rendszerben megfosztottak, illetve az 1957 előtti szabály érintettjei)."],[4,"C","V. Állampolgárság","Mi az állampolgárság felfüggesztése, és mi a vitatott benne?",[["Az államot veszélyeztető személy állampolgársága ideiglenesen felfüggeszthető (nem szűnik meg, de a jogok nem gyakorolhatók); problémás: több nemzetközi egyezménnyel ellentétes, idegen a jogrendszerünktől, gyakorlatban soha nem alkalmazták, uniós polgárral szemben kizárt","Helyes."],["Az állampolgárság végleges elvesztése","Nem szűnik meg."],["Csak kiskorúakra alkalmazható","Nem erről szól."],["Automatikusan jár bűncselekmény elkövetésekor","Nem."]],0],[4,"C","VI. Európai polgárság","Mi az uniós polgárság viszonya a tagállami állampolgársághoz?",[["Leszármaztatott jogállás: minden tagállami állampolgár egyúttal uniós polgár is, önálló uniós polgárság nem létezik; a Maastrichti Szerződés (1992) vezette be","Helyes."],["Önálló jogállás, tagállami állampolgárság nélkül is megszerezhető","Nem létezik önálló uniós polgárság."],["Az uniós polgárság helyettesíti a tagállami állampolgárságot","Nem helyettesíti."],["Csak a schengeni államok polgárait illeti meg","A tagállami állampolgárok mindegyikét."]],0],[4,"C","VI. Európai polgárság","Melyik jog NEM az uniós polgárság sajátos jogosultsága?",[["A lakóhely szerinti tagállamban az országgyűlési választáson való szavazati jog","Helyes. A helyi önkormányzati és EP-választáson van választójog, az országgyűlésin nincs."],["Szabad mozgás és letelepedés joga","Uniós polgári jog."],["Diplomáciai és konzuli védelem más tagállam külképviseletén","Uniós polgári jog."],["Petíciós jog az Európai Parlamenthez","Uniós polgári jog."]],0],[4,"C","VII. Házasság és család","Mit mond az Alaptörvény L) cikke?",[["Magyarország védi a házasság intézményét mint egy férfi és egy nő önkéntes elhatározás alapján létrejött életközösségét, a családot pedig mint a nemzet fennmaradásának alapját","Helyes. Az állam nem semleges e társadalmi intézményekkel szemben."],["A házasság bármely két személy közötti szerződés","Nem ezt mondja."],["A család kizárólag magánügy, az állam nem vállal felelősséget","Az állam felelősséget vállal."],["A házasság védelme csak a polgári törvénykönyv kérdése","Alkotmányos szintű védelem."]],0],[5,"C","I. Mi a jogforrás?","Melyik meghatározás pontos?",[["Norma: kötelező, általános, az állam szerve által alkotott, közvetlenül kikényszeríthető magatartási szabály; jogforrás: az a dokumentum, amelyből a norma megismerhető; jogszabály: a normák szűkebb köre, amelyeket az Alaptörvény T) cikke jogszabályként tételez","Helyes."],["Norma és jogszabály ugyanaz","A jogszabály a norma szűkebb köre."],["A jogforrás a jogalkotó szerv","Ez az anyagi jogforrás; a jogforrás a hordozó, dokumentum."],["A jogszabály tágabb, mint a norma","A norma a tágabb fogalom."]],0],[5,"T","I. Mi a jogforrás?","Minden jogszabály norma, de nem minden norma jogszabály („minden bogár rovar, de nem minden rovar bogár”).",true,"Igaz. A normák köre a tágabb, a jogszabályoké a szűkebb; a jogrendszerben a jogszabályokon kívül is vannak kötelező magatartási szabályok (pl. közjogi szervezetszabályozó eszközök)."],[5,"C","I. Mi a jogforrás?","Mi a különbség az anyagi (materiális) és az alaki (formális) jogforrás között?",[["Anyagi: a jogalkotási hatáskörrel felhatalmazott szerv, amely a normát létrehozza; alaki: az Alaptörvényben nevesített formát öltő szöveg (pl. törvény, rendelet), amelyből a norma megismerhető","Helyes."],["Anyagi: a törvény szövege; alaki: az Országgyűlés","Felcserélt."],["Mindkettő a jogalkotó szerv","Nem."],["Mindkettő a jogszabály szövege","Nem."]],0],[5,"C","I. Mi a jogforrás?","Kelsen normapiramis-elmélete mit eredményez az alkotmánybíráskodás kapcsán?",[["A hierarchia őrzésére külön szerv kell, és ez legyen az alkotmánybíróság; innen az AB „negatív jogalkotó” jellege (nem alkot normát, hanem kiemel a rendszerből)","Helyes."],["A parlament felülbírálhatja az AB döntéseit","Nem ez a következmény."],["Az AB törvényeket alkot","Nem alkot normát, kiemel."],["A normák nem rendezhetők hierarchiába","Éppen azt állítja, hogy igen."]],0],[5,"T","I. Mi a jogforrás?","Az Alaptörvény jogszabály, ezért szerepel a T) cikkben a jogszabályok között.",false,"Hamis. Az Alaptörvény nem jogszabály: kiemelt dokumentum, amelynek státuszát az R) cikk adja (a jogrendszer alapja). A T) cikk a törvényt és a rendeletet sorolja fel. Ez a vizsgák klasszikus buktatója."],[5,"C","I. Mi a jogforrás?","Melyik a helyes sorrend a magyar jogszabályi hierarchiában felülről lefelé?",[["Alaptörvény (nem jogszabály) → törvény → kormányrendelet / MNB elnökének rendelete → miniszteri / miniszterelnöki rendelet → önálló szabályozó szervek rendelete → önkormányzati rendelet","Helyes. A kormányrendelet és az MNB elnökének rendelete azonos szinten áll, ugyanígy a miniszteri és miniszterelnöki rendelet."],["Törvény → Alaptörvény → kormányrendelet → miniszteri rendelet","Az Alaptörvény áll legfelül."],["Alaptörvény → miniszteri rendelet → kormányrendelet → törvény","A törvény a rendeletek fölött áll."],["Alaptörvény → törvény → önkormányzati rendelet → kormányrendelet","Az önkormányzati rendelet a végén áll."]],0],[5,"C","I. Mi a jogforrás?","Miért kell a médiaszabályozásnál önálló szabályozó szerv?",[["Számos nemzetközi kötelezettség írja elő bizonyos ágazatok (pl. média, hírközlés) kormánytól való függetlenségét","Helyes. Az önálló szabályozó szervek a végrehajtó hatalom részei, de a kormánytól függetlenül működnek."],["Mert a kormány nem alkothat rendeletet","Alkothat."],["Mert az Alaptörvény tiltja a kormányzati médiafelügyeletet","Nem ez az indok."],["Mert ezek az országgyűlés szervei","A végrehajtó hatalom részei."]],0],[5,"C","I. Mi a jogforrás?","Melyik a hierarchiából fakadó három törvényszerűség közül a harmadik?",[["Alacsonyabb szintű normában nem lehet megismételni magasabb szintű norma magatartási szabályát","Helyes. A jogalkotási törvény (Jat.) is megerősíti; a jogrendszer zártsága indokolja."],["Jogszabályt bármely szint módosíthat","A módosítás csak azonos vagy magasabb szintű jogszabállyal lehetséges."],["Alacsonyabb norma lehet ellentétes magasabbal","Nem lehet."],["Magasabb szintű norma csak törvény lehet","Nem ez a törvényszerűség."]],0],[5,"C","I. Mi a jogforrás?","Melyik művelet NEM lehetséges a hierarchia második törvényszerűsége szerint?",[["Kormányrendelet módosítása miniszteri rendelettel","Helyes. Jogszabályt csak azonos vagy magasabb szintű jogszabállyal lehet módosítani."],["Kormányrendelet módosítása kormányrendelettel","Lehetséges."],["Kormányrendelet módosítása törvénnyel","Lehetséges."],["Miniszteri rendelet hatályon kívül helyezése törvénnyel","Lehetséges."]],0],[5,"R","I. Mi a jogforrás?","Az Ákr. alapelvei között nem szerepel a tisztességes hatósági eljáráshoz való jog.","Ez a jog az Alaptörvény XXIV. cikkében szerepel, és ami az Alaptörvényben benne van, az a hierarchiából fakadóan a törvényekre is vonatkozik, ezért nem szabad megismételni.","A","Igaz.","Igaz: a hierarchia harmadik törvényszerűsége (nincs megismétlés).","A második állítás megmagyarázza az elsőt: nem azért hiányzik, mert nem kellene tisztességesen eljárni, hanem mert az Alaptörvény már rögzíti."],[5,"C","I. Mi a jogforrás?","Mi a közjogi szervezetszabályozó eszköz, és mi a típusa?",[["Nem jogszabály, hanem valamely állami szerv belső működését szabályozó norma (pl. SZMSZ, közszolgálati szabályzat); egyszemélyi vezetés alatt álló szervnél normatív utasítás, testületi szervnél normatív határozat","Helyes."],["Jogszabály, amelyet a Kormány alkot","Nem jogszabály."],["A törvény egy fajtája","Nem törvény."],["Az AB határozata","Nem erről van szó."]],0],[5,"C","I. Mi a jogforrás?","Mi az extraneus és az intraneus norma?",[["Extraneus: kifelé, a megalkotó szerven kívülre szabályoz (jogszabály); intraneus: a szerv belső szabályait határozza meg, főszabály szerint csak befelé hat (közjogi szervezetszabályozó eszköz)","Helyes."],["Extraneus: belső szabály; intraneus: külső","Felcserélt."],["Mindkettő jogszabály","Az intraneus nem jogszabály."],["Mindkettő bírósági döntés","Nem."]],0],[5,"R","I. Mi a jogforrás?","A Házszabály tipikusan intraneus norma, mégis lehet külső hatása.","A házszabályi rendelkezések betartása a törvény érvényességének egyik követelménye.","A","Igaz: országgyűlési határozat bocsátja ki, az Országgyűlés működését szabályozza.","Igaz.","Ha egy törvény érvényességét kell megítélni, meg kell nézni a Házszabályt is, ezért van külső hatása."],[5,"C","I. Mi a jogforrás?","Melyik a bíróságok két jogfejlesztő, normatív hatású döntési formája?",[["A Kúria jogegységi határozata és az Alkotmánybíróság alkotmányos követelménye","Helyes. Mindkettő kötelező, kvázi jogforrás."],["Az elsőfokú ítélet és a másodfokú ítélet","Ezek egyedi ügyre szólnak."],["A bírósági végzés és az ügyészi indítvány","Nem ezek a formák."],["A precedens és az equity","Magyarországon nincs precedensrendszer."]],0],[5,"T","I. Mi a jogforrás?","Magyarországon precedensrendszer van, ezért minden bírósági döntés kötelező más bíróságokra.",false,"Hamis. Magyarországon nincs precedensrendszer, minden döntés egyedi ügyre szól. A Kúria jogegységi határozata az eltérő jogalkalmazás esetén kötelező szempontokat határoz meg, amelytől a bíróságok nem térhetnek el."],[5,"C","I. Mi a jogforrás?","Mi az alkotmányos követelmény?",[["Az AB mint az Alaptörvény kizárólagos értelmezési szerve kimondja, hogy egy jogszabályi rendelkezést az Alaptörvény adott cikkével összhangban miként kell értelmezni; onnantól csak ez az értelmezés egyeztethető össze az Alaptörvénnyel","Helyes. Akkor él vele, ha a probléma a jogszabály bírói értelmezéséből fakad, nem magából a jogszabályból."],["A jogszabály megsemmisítése","Ez a megsemmisítés, nem az alkotmányos követelmény."],["Az Országgyűlés Házszabálya","Nem."],["A köztársasági elnök vétója","Nem."]],0],[5,"C","I. Mi a jogforrás?","Mi a különbség a dualista és a monista felfogás között?",[["Dualista: a nemzetközi és a belső jog két külön térben létezik, transzformáció (kihirdetés) kell; monista: egyetlen térben létezik, automatikusan válik belső joggá","Helyes."],["Dualista: automatikus; monista: kihirdetéssel","Felcserélt."],["Mindkettő kihirdetést kíván","A monista nem."],["Egyik sem a nemzetközi jogról szól","A nemzetközi jog viszonyáról szólnak."]],0],[5,"C","I. Mi a jogforrás?","Milyen a magyar megoldás az Alaptörvény Q) cikke szerint?",[["Alapvetően dualista (a nemzetközi szerződéseket ki kell hirdetni), monista elemmel: a nemzetközi jog általánosan elismert szabályai (népirtás, apartheid, kínzás tilalma) kihirdetés nélkül is köteleznek","Helyes."],["Tisztán monista","A szerződéseket ki kell hirdetni."],["Tisztán dualista, kivétel nélkül","Van monista elem."],["A nemzetközi jog nem kötelez Magyarországot","Kötelez."]],0],[5,"C","I. Mi a jogforrás?","Hol helyezkedik el a nemzetközi szerződés az Alaptörvényhez képest, és miért?",[["Az Alaptörvény fölött: a pacta sunt servanda és a szuverenitás önkorlátozása miatt; ellentmondás esetén az Alaptörvényt kell módosítani (pl. NATO- és uniós csatlakozás előtt)","Helyes."],["Az Alaptörvény alatt, mert a belső jog erősebb","A belső szabályra nem lehet hivatkozni a nemzetközi kötelezettség elkerülésére."],["Az Alaptörvénnyel azonos szinten","Az Alaptörvény fölött."],["A törvény szintjén, a rendeletek fölött","Nem ez a tankönyvi álláspont."]],0],[5,"R","I. Mi a jogforrás?","Egy állam nem hivatkozhat arra, hogy saját alaptörvénye tiltja a nemzetközi szerződés teljesítését.","A másik állam abban a tudatban kötötte a szerződést, hogy szuverén felek állapodtak meg, és elvárja a teljesítést (pacta sunt servanda).","A","Igaz.","Igaz.","A bizalomvédelem és a szerződéshűség (pacta sunt servanda) magyarázza, hogy a belső szabály nem hivatkozási alap (hasonlat: az autóeladás, amelyet a házastárs kifogásol)."],[5,"C","I. Mi a jogforrás?","Mi az Alaptörvény E) cikke (Európa-klauzula)?",[["A rendelkezés, amely az Unió és a tagállamok közötti hatáskörmegosztást alaptörvényi szintre emeli, és az uniós csatlakozás alkotmányi alapja","Helyes."],["A hatalommegosztás cikke","Nem."],["A nemzeti jelképek cikke","Nem."],["Az alapjogok korlátozásáról szóló cikk","Nem."]],0],[5,"C","I. Mi a jogforrás?","Mi a különbség az uniós rendelet és irányelv között?",[["Rendelet: közvetlen hatályú, a magyar bíróság előtt úgy kötelező, mint egy magyar törvény; irányelv: nincs közvetlen hatálya, a tagállam jogharmonizációval beépíti a belső jogába","Helyes."],["Irányelv: közvetlen hatályú; rendelet: átültetést igényel","Felcserélt."],["Mindkettő átültetést igényel","A rendelet nem."],["Egyik sem kötelező","Mindkettő kötelező."]],0],[5,"C","I. Mi a jogforrás?","Mi az uniós jog két alapelve, és melyik ítélet mondta ki?",[["Közvetlen hatály (Van Gend en Loos, 1963) és az uniós jog elsőbbsége (Costa kontra E.N.E.L., 1964)","Helyes."],["Szubszidiaritás (Maastricht, 1992) és jogharmonizáció (Lisszabon)","Nem ezek az ítéletek."],["Pacta sunt servanda (Hirst) és proporcionalitás","Nem."],["Dualizmus és monizmus (Marbury v. Madison)","Nem."]],0],[5,"T","I. Mi a jogforrás?","Az uniós rendeletet a magyar jogforrási hierarchiában el kell helyezni, mert a törvény és az Alaptörvény között áll.",false,"Hamis. Nem kell elhelyezni: a hatáskörmegosztás miatt az adott kérdésben csak az uniós rendelet létezhet, magyar törvény nem születhet (pl. közös vámtarifa)."],[5,"C","I. Mi a jogforrás?","Mi történik, ha a tagállam nem ülteti át az irányelvet?",[["Az Európai Bizottság kötelezettségszegési eljárást indít, az Európai Unió Bírósága állapítja meg a jogsértést, a következmény bírság / költségvetési szankció","Helyes. Az irányelv „lopakodó föderalizmus”: nyomai az egész belső jogba beépülnek."],["Az irányelv automatikusan jogszabállyá válik, és nincs szankció","Nem automatikus a hatály, szankció van."],["Magyar AB határoz","Az uniós jogi eljárás Bizottság–EUB."],["A tagállam kizárható az Unióból","Nem ez a szankció."]],0],[5,"C","II. Érvényesség és hatályosság","Melyik formula helyes az érvényesség és hatályosság viszonyára?",[["Az érvényesség az alkalmasság, a hatályosság a működés","Helyes. Az „érvénybe lépés” kifejezés helytelen, legfeljebb hatályba lépés van."],["Az érvényesség a működés, a hatályosság az alkalmasság","Felcserélt."],["A kettő azonos","Különbözik."],["Az érvénybe lépés helyes kifejezés","Nem létezik érvénybe lépés."]],0],[5,"C","II. Érvényesség és hatályosság","Melyik NEM az érvényesség négy követelménye közül való?",[["A jogszabály legalább egy évig hatályban legyen","Helyes, ez nem követelmény."],["A felhatalmazott szerv alkossa meg","Követelmény."],["Az előírt eljárásban történjék a megalkotás","Követelmény."],["Ki kell hirdetni","Követelmény."]],0],[5,"C","II. Érvényesség és hatályosság","Mi a különbség a kihirdetés és a közzététel között?",[["Kihirdetés: jogszabályra vonatkozik, érvényességi követelmény (Magyar Közlöny; önkormányzati rendeletnél helyben szokásos módon); közzététel: minden más normára, nem érvényességi követelmény, a jogbiztonságot szolgálja","Helyes."],["Közzététel a jogszabályra, kihirdetés a többi normára","Felcserélt."],["Mindkettő érvényességi követelmény","A közzététel nem az."],["Nincs különbség","Van."]],0],[5,"C","II. Érvényesség és hatályosság","Ha egy rendeletet nem az arra felhatalmazott miniszter adott ki, de megjelent a Magyar Közlönyben, mi a helyzete?",[["Az érvényesség vélelme szól mellette; amíg az Alkotmánybíróság nem mondja ki az érvénytelenséget, a vélelem áll","Helyes."],["Automatikusan érvénytelen","A vélelem megdöntéséhez AB-határozat kell."],["Bármely hatóság megállapíthatja az érvénytelenséget","Csak az AB jogosult."],["Érvényes, és az AB sem vizsgálhatja","Az AB vizsgálhatja."]],0],[5,"C","II. Érvényesség és hatályosság","Melyik a hatály négy fajtája?",[["Tárgyi, területi, személyi, időbeli","Helyes."],["Tárgyi, jogi, alaki, anyagi","Nem."],["Területi, politikai, gazdasági, időbeli","Nem."],["Személyi, állami, helyi, nemzetközi","Nem."]],0],[5,"T","II. Érvényesség és hatályosság","Nulla felkészülési idő (vacatio legis) lehetséges: a jogszabály a kihirdetés pillanatában hatályba léphet.",false,"Hamis. Nulla felkészülési idő nem lehetséges, mert sértené a jogbiztonságot. Aznapi hatálybalépés esetén óra-perc pontossággal kell meghatározni az időpontot (a Magyar Közlöny elektronikus megjelenése időbélyegzős). A felkészülési idő elégségességét az AB ítéli meg."],[5,"C","II. Érvényesség és hatályosság","Melyik hatálybalépési megfogalmazás NEM megfelelő?",[["„a kihirdetést követő első olyan esemény napján, amelyre a törvény hatálya vonatkozik”","Helyes, ez bizonytalan időpont."],["„a kihirdetést követő 8. napon”","Fix, meghatározható időpont."],["„2028. január 1.”","Fix időpont."],["„a kihirdetést követő második hónap első napján”","Meghatározható időpont."]],0],[5,"C","II. Érvényesség és hatályosság","Mi az önderogáció?",[["A módosító szabály hatálybalépését követően beépül az eredeti normába, majd a Jat. szerint automatikusan hatályon kívül helyezi saját magát","Helyes. Technikai szabály, súlyos anyagi jogi következménnyel: az AB csak a módosított eredeti szabályt semmisítheti meg."],["A jogszabály megsemmisítése az AB által","Nem ez."],["A törvény visszamenőleges hatályon kívül helyezése","Nem ez."],["A rendelet törvényi felhatalmazása","Nem ez."]],0],[5,"C","II. Érvényesség és hatályosság","Mit tilt a visszaható hatály tilalma?",[["Hátrányos rendelkezés nem vonatkozhat a hatálybalépést megelőző időpontra: új kötelezettség megállapítása, meglévő terhesebbé tétele, jog elvonása visszamenőleg","Helyes."],["Minden visszamenőleges szabályozást","A pozitív visszaható hatály megengedett."],["Csak az adójogot érinti","Nem csak."],["A kedvezőbb szabályok visszamenőleges alkalmazását","Az megengedett."]],0],[5,"T","II. Érvényesség és hatályosság","Visszamenőleg lehet kötelezettséget eltörölni vagy jogot adni (pl. visszamenőleges adócsökkentés).",true,"Igaz. Negatív irányban nem lehet visszamenni, pozitív irányban igen. Ha mégis megtörténik a hátrányos visszaható hatály, az AB megsemmisíti, addig működik az érvényesség vélelme."],[5,"C","III. Törvény","Mi igaz a törvényalkotás monopóliumára?",[["Törvényt kizárólag az Országgyűlés alkothat; a kommunista korszak törvényerejű rendeleti gyakorlatát az 1987. évi XI. törvény zárta le","Helyes."],["Törvényt a Kormány is alkothat","Csak az Országgyűlés."],["Törvényerejű rendeletet ma is lehet alkotni","Ma nem; néhány régi hatályos."],["Törvényt bármilyen testület alkothat","Csak az Országgyűlés."]],0],[5,"C","III. Törvény","Melyik NEM a négy kötelező törvényalkotási tárgykör közül való?",[["A hivatalos szimbólumok színe","Helyes, nem ilyen tárgykör."],["Az alapvető jogok és kötelezettségek szabályozása","Kötelező tárgykör."],["Az állami költségvetés (és zárszámadás)","Kötelező tárgykör."],["A sarkalatos tárgykörök","Kötelező tárgykör."]],0],[5,"T","III. Törvény","A kötelező törvényalkotási tárgyköröket a törvényben (jogalkotási törvényben) lehet meghatározni.",false,"Hamis. Az AB megsemmisítette a régi jogalkotási törvény ilyen felsorolását, mert önmagába visszatérő, körkörös szabályozás volna (a törvény maga is módosítható). A kötelező tárgyköröket az Alaptörvényben kell keresni."],[5,"C","III. Törvény","Melyik a törvények három típusa, és mi a szükséges többség?",[["Egyszerű (a határozatképes Országgyűlés több mint fele), sarkalatos (a jelen lévő képviselők kétharmada), alkotmányos többségű (az összes képviselő kétharmada)","Helyes."],["Egyszerű (az összes képviselő fele), sarkalatos (az összes képviselő kétharmada)","Nem."],["Sarkalatos: az összes képviselő háromnegyede","Nem."],["Mindhárom egyszerű többséggel","Nem."]],0],[5,"T","III. Törvény","A sarkalatos törvény magasabb szinten áll a jogforrási hierarchiában, mint az egyszerű törvény.",false,"Hamis. Nagyobb többséget igényel, de azonos szinten van; a típusok között nincs hierarchia, csak eltérő elfogadási követelmény."],[5,"C","III. Törvény","Mit jelent, hogy az Alaptörvény sarkalatos tárgykörről, nem sarkalatos törvényről rendelkezik?",[["Egy törvénynek lehet csak egy része sarkalatos (különösen salátatörvénynél); az érintett rész kétharmaddal fogadható el, többlépcsős szavazás zajlik, az egész törvényhez nem kell kétharmad","Helyes."],["Minden törvény sarkalatos","Nem."],["A salátatörvény egésze sarkalatos","Csak az érintett rész."],["Sarkalatos törvényt nem lehet módosítani","Módosítható."]],0],[5,"C","III. Törvény","Mi a salátatörvény?",[["Olyan törvény, amellyel az Országgyűlés egyszerre több jogszabályt módosít","Helyes."],["Olyan törvény, amely csak egy mondatból áll","Nem."],["Az Alaptörvény módosítása","Nem."],["A költségvetési törvény","Nem."]],0],[5,"C","IV. Rendelet","Mit jelent a secundum, praeter és contra legem rendelet?",[["Secundum legem: pontosan arról szól, amire a felhatalmazás szólt (ideális); praeter legem: a felhatalmazáson túl mást is szabályoz (aggályos); contra legem: nem arról szól, amire a felhatalmazás vonatkozott (kizárt, érvénytelen)","Helyes."],["Contra legem: ideális","Kizárt."],["Praeter legem: érvénytelen","Aggályos, de nem automatikusan érvénytelen a tankönyv szerint."],["Secundum legem: kizárt","Ideális."]],0],[5,"C","IV. Rendelet","Mit jelent a felhatalmazó rendelkezés?",[["Mindig a törvényben található, és két kérdésre ad választ: kit és mire hatalmaz fel","Helyes. A végrehajtási rendeletet csak a felhatalmazott szerv alkothatja, csak olyan tartalommal, amire a felhatalmazás szól."],["A rendeletben található felhatalmazás","A törvényben van."],["Az Alaptörvény általános felhatalmazása","A törvényben."],["A bíróság felhatalmazása","Nem."]],0],[5,"C","IV. Rendelet","Miért „az igazságügyért felelős miniszter” szerepel a felhatalmazó rendelkezésekben, és nem a minisztérium neve?",[["A szervezetalakítási szabadság miatt: a kormány olyan struktúrában működik, amilyenben kíván; a feladatkört jelölik meg, a konkrét minisztert a statútumrendelet azonosítja","Helyes."],["Mert csak ilyen elnevezések léteznek","A kormány szabadon alakítja a struktúrát."],["Mert a miniszterek nem szerepelhetnek törvényben","Feladatkör alapján azonosítják őket."],["Mert az Alaptörvény előírja","A szervezetalakítási szabadság az indok."]],0],[5,"C","IV. Rendelet","Kinek van eredeti jogalkotói hatásköre, azaz ki alkothat felhatalmazás nélkül, közvetlenül az Alaptörvény alapján rendeletet?",[["A kormány (15. cikk) és a helyi önkormányzat (32. cikk), ha nincs törvény a kérdésről és a feladatkörébe tartozik","Helyes."],["A miniszterek és a köztársasági elnök","Nem."],["Az Országgyűlés és az AB","Nem."],["Csak a bíróságok","Nem."]],0],[5,"T","IV. Rendelet","Eredeti jogalkotói hatáskörben a kormánynak és az önkormányzatnak rendeletalkotási kötelezettsége van.",false,"Hamis. Eredeti hatáskörben nincs rendeletalkotási kötelezettség, a szerv maga dönt, él-e a lehetőséggel; a származékos hatáskörnél a felhatalmazás teljesítése elvárt."],[6,"C","1. Fogalom","Miért kivételes a közvetlen hatalomgyakorlás?",[["A „nép” fogalmilag amorf embertömeg, önálló előzetes akarata nincs (politikai folyamat eredménye), és minél nagyobb a közösség, annál nehezebb mindenkit minden kérdésben bevonni; ezért a képviseleti kormányzás a főszabály","Helyes."],["Mert a népszavazás tilos","Nem tilos, kivételes."],["Mert a nép nem szuverén","A nép szuverén, a gyakorlás módja a kérdés."],["Mert csak köztársaságban létezik","Nem."]],0],[6,"C","1. Fogalom","Melyik országok élnek ritkán, illetve rendszeresen a népszavazással?",[["Ritkán: Németország, Egyesült Királyság; rendszeresen: Svájc, Franciaország, Írország","Helyes."],["Ritkán: Svájc; rendszeresen: Németország","Fordítva."],["Ritkán: Franciaország; rendszeresen: Egyesült Királyság","Nem."],["Mindenhol ugyanolyan gyakran","Országonként élesen eltér."]],0],[6,"C","1. Fogalom","Mi a népszavazás előnye és két hátránya?",[["Előny: erős legitimáció; hátrány: a döntés nem kompromisszum, hanem igen/nem alternatíva, és a kérdésfeltevéssel manipulálható","Helyes. Ezért kiemelt az egyértelműség követelménye."],["Előny: kompromisszum; hátrány: költség","Nem."],["Előny: szakmai pontosság; hátrány: lassúság","Nem."],["Előny: gyorsaság; hátrány: legitimációhiány","Éppen erős legitimáció az előny."]],0],[6,"T","2. Magyar kialakulás","Sopron és környéke 1921 decemberében népszavazáson döntött, hogy Ausztriához vagy Magyarországhoz tartozzon, ezért nevezik a várost „a leghűségesebb városnak”.",true,"Igaz. A város neve: civitas fidelissima. A szocialista időszakban a népszavazás papíron az Elnöki Tanács jogköre volt, de sosem alkalmazták."],[6,"C","2. Magyar kialakulás","Mi volt a „négyigenes népszavazás”?",[["1989. november 26-i népszavazás (1989. évi XVII. törvény alapján); a legfontosabb kérdés: a köztársasági elnököt a parlamenti választások előtt vagy után válasszák; a „nem” győzött, ami alapvetően befolyásolta az 1990-es átmenetet","Helyes."],["1990-es népszavazás az EU-csatlakozásról","Nem."],["2016-os népszavazás a kvótáról","Nem."],["1946-os köztársasági népszavazás","Nem."]],0],[6,"C","2. Magyar kialakulás","Mi a népszavazás jogforrásainak időrendje?",[["1989. évi XVII. tv. → 1998. évi III. tv. → 2013. évi CCXXXVIII. tv. (Nsztv., hatályos)","Helyes."],["2013. évi CCXXXVIII. → 1998. évi III. → 1989. évi XVII.","Fordított sorrend."],["1998. évi III. → 1989. évi XVII. → 2013","Nem."],["Csak az Alaptörvény szabályozza","Törvény is szabályozza."]],0],[6,"T","2. Magyar kialakulás","A népi kezdeményezés ma is létezik, és megegyezik a népszavazással.",false,"Hamis. Az Alaptörvény már nem ismeri a népi kezdeményezést. Korábban meghatározott számú választópolgár kezdeményezhette, hogy az Országgyűlés napirendre tűzzön egy kérdést, de kötelező érdemi döntés (szavazás) nélkül. Vizsgán gyakori hiba a kettő összekeverése."],[6,"T","2. Magyar kialakulás","A 2016-os népszavazás az EU kötelező betelepítési kvótájáról, a 2022-es gyermekvédelmi tárgyban volt.",true,"Igaz. Ezek a legutóbbi országos népszavazások a tankönyv szerint."],[6,"C","3. Típusok","Milyen három szempont szerint csoportosítjuk a népszavazásokat?",[["Területi kiterjedés, a kezdeményezés jellege, a kötőerő","Helyes."],["Tárgy, idő, hely","Nem."],["Szervező, résztvevők, eredmény","Nem."],["Országos, megyei, települési","Ez csak a területi kiterjedés."]],0],[6,"C","3. Típusok","Ki kezdeményezhet országos népszavazást, és mikor kötelező elrendelni?",[["A köztársasági elnök, a Kormány vagy legalább 100 000 választópolgár; kötelező az elrendelés, ha a kezdeményezést legalább 200 000 választópolgár támogatja","Helyes."],["Csak az Országgyűlés; mindig kötelező","Nem."],["50 000 választópolgár; 100 000 aláírásnál kötelező","Nem."],["Csak a köztársasági elnök","Nem."]],0],[6,"R","3. Típusok","A kötelező népszavazás „kötelező” jelzője nem az eredmény kötőerejére utal.","A kötelező népszavazásnál az Országgyűlésnek nincs mérlegelési joga az elrendelés kérdésében.","A","Igaz: a kezdeményezés jellegét és az eredmény ügydöntő jellegét nem szabad összekeverni.","Igaz.","A „kötelező” jelző éppen azt fejezi ki, hogy az elrendelés nem mérlegelhető, ezért nem az eredményre vonatkozik."],[6,"C","4. Tárgy","Melyik kérdés NEM tiltott tárgykör az Alaptörvény 8. cikk (3) bekezdése szerint?",[["Egy közvetlen helyi jelentőségű, nem tiltott tárgykörbe tartozó országos politikai kérdés (pl. más, nem felsorolt ügy)","Helyes: a tiltott tárgykörök felsorolása negatív, ami nincs benne, népszavazásra bocsátható."],["Az Alaptörvény módosítása","Tiltott."],["Az országgyűlési képviselők választása","Tiltott."],["A központi költségvetés végrehajtása","Tiltott."]],0],[6,"C","4. Tárgy","Mi az egyértelműség kettős követelménye, és melyik AB-határozat mondta ki elsőként?",[["Választópolgári egyértelműség (a kérdés világos, csak egyféleképpen értelmezhető) és jogalkotói egyértelműség (az Országgyűlés lássa, milyen jogalkotási kötelezettség fakad belőle); 25/1999. (VII. 7.) AB határozat","Helyes."],["Csak a választópolgári egyértelműség; 22/2005. AB határozat","A követelmény kettős, és nem ez a határozat."],["Pártpolitikai és gazdasági egyértelműség","Nem."],["Az egyértelműség a Kúria joggyakorlata","AB-gyakorlat."]],0],[6,"T","4. Tárgy","Elég, ha a népszavazási kérdés a választópolgár számára érthető, a jogalkotói egyértelműség nem követelmény.",false,"Hamis. Mindkét követelménynek együtt kell teljesülnie: lehet olyan kérdés, amely a választónak érthető, de a jogalkotónak nem ad eligazítást (túl általános), és fordítva, a jogtechnikailag pontos kérdés a választónak átláthatatlan lehet. Ha bármelyik funkció sérül, az intézmény céljával kerül ellentétbe."],[6,"C","4. Tárgy","Mi a moratórium a népszavazásnál?",[["Egy érvényes és eredményes népszavazás után (jelenleg három évig) nincs helye újabb népszavazási kezdeményezésnek ugyanabban a tárgykörben","Helyes. A döntés stabilitását védi."],["A népszavazás elhalasztása","Nem."],["A népszavazás eredményének megsemmisítése","Nem."],["A kezdeményezés tilalma a választások előtt","Nem."]],0],[6,"C","5. Eredmény","Mi a népszavazás eredményének kötőereje és a végrehajtási határidő?",[["Minden népszavazás ügydöntő; az érvényes és eredményes népszavazás az Országgyűlést köti, amely 180 napon belül köteles a döntést végrehajtó jogszabályt megalkotni","Helyes."],["A népszavazás csak véleménynyilvánító","Az Alaptörvény alatt minden ügydöntő."],["Határidő: 30 nap","180 nap."],["Az Országgyűlés szabadon dönthet az eredmény végrehajtásáról","Köti."]],0],[6,"C","6. Eljárás","Melyik a választópolgári kezdeményezésű népszavazási eljárás öt fázisa a helyes sorrendben?",[["Kezdeményezés és hitelesítés → aláírásgyűjtés → aláírások ellenőrzése → elrendelés (Országgyűlés) → kitűzés (köztársasági elnök)","Helyes."],["Elrendelés → hitelesítés → aláírásgyűjtés → ellenőrzés → kitűzés","Nem ez a sorrend."],["Aláírásgyűjtés → hitelesítés → kitűzés → elrendelés → ellenőrzés","Nem."],["Hitelesítés → kitűzés → aláírásgyűjtés → ellenőrzés → elrendelés","Nem."]],0],[6,"C","6. Eljárás","Ki hitelesíti a népszavazási kérdést, és ki a jogorvoslati fórum?",[["Az NVB hitelesít (a Nemzeti Választási Iroda előszűrésével); jogorvoslat: Kúria, majd Alkotmánybíróság","Helyes."],["A Kúria hitelesít; jogorvoslat: NVB","Fordítva."],["A köztársasági elnök hitelesít","Ő tűzi ki a népszavazást."],["Az Országgyűlés hitelesít","Ő elrendeli."]],0],[6,"C","6. Eljárás","Mikor utasítja el az NVB a kérdés hitelesítését?",[["Ha a kérdés a népszavazás alkotmányos céljával nyilvánvalóan ellentétes, vagy nem felel meg az egyértelműség követelményének","Helyes."],["Ha a kérdés politikailag kényes","Nem ez az indok."],["Ha a szervező párt","A szervező lehet párt is."],["Soha","Elutasíthat."]],0],[6,"C","6. Eljárás","Mi az AB szerepe az elrendelésről szóló országgyűlési határozattal szemben?",[["Kasszációs jogkör: helybenhagyja, vagy megsemmisíti és új határozatra utasítja az Országgyűlést","Helyes."],["Maga rendeli el a népszavazást","Nem."],["Nincs szerepe","Van."],["Módosítja a határozatot","Nem módosíthat, csak kasszálhat."]],0],[6,"C","6. Eljárás","Mi a legfontosabb különbség a választói és az elnöki/kormányzati kezdeményezésű eljárás között?",[["A választói kezdeményezésnél mindig van aláírásgyűjtés és -ellenőrzés, az elnöki/kormányzatinál soha; az utóbbi mindig fakultatív, az Országgyűlés mérlegel","Helyes. A hitelesítés mindkét útnál azonos (NVB → Kúria → AB), a kitűzés mindkettőnél a köztársasági elnök."],["Az elnöki kezdeményezésnél több aláírás kell","Nem kell aláírás."],["Az elnöki kezdeményezésnél az elrendelés kötelező","Mindig mérlegelés."],["A kitűzést a Kormány végzi elnöki kezdeményezésnél","A köztársasági elnök tűzi ki mindkét esetben."]],0],[6,"T","6. Eljárás","Ha a köztársasági elnök vagy a Kormány kezdeményez népszavazást, a hitelesítés után az Országgyűlés szabadon dönt az elrendelésről.",true,"Igaz. Az így kezdeményezett népszavazás mindig fakultatív."],[6,"R","6. Eljárás","A választópolgári kezdeményezésnél az Országgyűlés köteles elrendelni a népszavazást, ha az aláírások száma eléri a 200 000-et.","A kötelező elrendelés azért áll fenn, mert az ilyen népszavazás eredménye ügydöntő.","C","Igaz: 200 000 aláírás esetén kötelező népszavazás.","Hamis (mint indok): a 'kötelező' jelző a kezdeményezés jellegére utal, nem az eredmény kötőerejére; az eredmény minden népszavazásnál ügydöntő, a kötelező elrendelés oka a 200 000 aláírás küszöbe.","Az első állítás igaz, a második mint indok téves."],[7,"C","I. Fogalom","Mi a választójog tárgyi, illetve alanyi értelme?",[["Tárgyi (tágabb): a képviseleti szervek tagjai megválasztásának anyagi és eljárási rendjét meghatározó jogszabályok összessége; alanyi (szűkebb): a választójogosultság (aktív: választani, passzív: választhatónak lenni)","Helyes."],["Tárgyi: az aktív választójog; alanyi: a passzív","Nem."],["Tárgyi: csak az Alaptörvény; alanyi: a Ve.","Nem."],["A kettő azonos","Nem."]],0],[7,"C","I. Fogalom","Melyik a választójog négy fő forrása közül a választási eljárás közös szabályait tartalmazó?",[["A Ve. (2013. évi XXXVI. törvény)","Helyes."],["A Vjt. (2011. évi CCIII. törvény)","Ez az országgyűlési képviselők választásáról szól."],["Az EP tv. (2003. évi CXIII. törvény)","Ez az EP-választás."],["Az Övt.","Ez az önkormányzati választás."]],0],[7,"C","II. Rendszerek","Mi a választási rendszer, és melyik a három alaptípus?",[["A módszer, amellyel a szavazatokat mandátumokra váltják át; többségi, arányos és vegyes (kompenzációs)","Helyes."],["A választójogosultak névjegyzéke; helyi, országos, európai","Nem."],["A választás időpontja; tavaszi, őszi, téli","Nem."],["A jelölés módja; egyéni, listás, vegyes","Nem."]],0],[7,"C","II. Rendszerek","Mi a különbség az abszolút és a relatív többségi rendszer között?",[["Abszolút: a leadott érvényes szavazatok több mint fele kell, különben második forduló (pl. Franciaország); relatív: a legtöbb szavazatot kapó nyer, akár egy szavazat előnnyel (pl. UK, magyar egyéni kerületek)","Helyes."],["Abszolút: a legtöbb szavazat; relatív: több mint fele","Felcserélt."],["Mindkettő második fordulót kíván","A relatív nem."],["Nincs különbség","Van."]],0],[7,"C","II. Rendszerek","Mi az arányos rendszer jellemzője és a bejutási küszöb célja?",[["Választókerületenként több mandátum, a listákra leadott szavazatok arányában; a küszöb célja, hogy a képviseleti szerv ne váljon túlzottan fragmentálttá","Helyes. Minél nagyobb a kerület, annál pontosabb az arányosítás (pl. Hollandia, Izrael)."],["Egy kerületben egy mandátum","Ez a többségi."],["A küszöb célja a kisebbségek kizárása","A cél a fragmentáció elkerülése."],["A győztes mindent visz","Ez a többségi."]],0],[7,"C","II. Rendszerek","Mi a D'Hondt-módszer?",[["A listák szavazatszámát elosztjuk 1-gyel, 2-vel, 3-mal stb., és a legnagyobb hányadosok kapják a mandátumokat, amíg ki nem oszlik mind","Helyes."],["A legtöbb szavazatot kapó jelölt nyer","Ez a relatív többségi."],["A szavazatok felét kapó nyer","Ez az abszolút többségi."],["A mandátumokat sorsolják","Nem."]],0],[7,"C","II. Rendszerek","Miért vegyes és kompenzációs a magyar országgyűlési választási rendszer?",[["Vegyes: egyéni kerületi (relatív többségi) és országos listás (arányos) elemet ötvöz; kompenzációs: a töredékszavazatok az országos listás elosztásnál is beszámítanak, részben ellensúlyozva a többségi elem aránytalanító hatását","Helyes."],["Mert két fordulóban szavaznak","Nem ezért."],["Mert külföldiek is szavazhatnak","Nem."],["Mert a Kormány kompenzálja a pártokat","Nem."]],0],[7,"C","III. Alapelvek","Mit jelent a választójog általánossága, és ki zárható ki a XXIII. cikk (6) bekezdése szerint?",[["A politikai közösség minden nagykorú tagját megilleti; nincs választójoga, akit a bíróság kizárt: jogerős szabadságvesztés / kényszergyógykezelés tartama alatt, vagy a belátási képesség hiánya / korlátozottsága miatt","Helyes."],["Csak a férfiakat illeti meg","Nem."],["Mindenkit megillet, kivétel nélkül","Vannak kizárási okok."],["A kizárásról a közigazgatási hatóság dönt","A bíróság dönt."]],0],[7,"T","III. Alapelvek","A gondnokság alá helyezés automatikusan a választójog elvesztésével jár.",false,"Hamis. A kizárás nem automatikus: a belátási képesség korlátozottsága esetén a bíróságnak külön kell döntenie a választójogból való kizárásról. A gondnokság és a kizárás két, egymástól elváló bírói döntés."],[7,"C","III. Alapelvek","Mit mondott ki az EJEB a Hirst kontra Egyesült Királyság ügyben?",[["A szabadságvesztést töltő elítéltek differenciálatlan, automatikus kizárása a választójogból sérti a választójogot; a korlátozásnak egyedi, bírói mérlegelésen kell alapulnia","Helyes. A magyar szabályozás (bírói eljáráshoz kötött kizárás) elvben megfelel."],["Az elítélteket nem lehet kizárni a választójogból","Egyedi, bírói mérlegelés alapján lehet."],["Az elítéltek szavazata kétszeresen számít","Nem."],["A választójog korlátozhatatlan","Nem."]],0],[7,"C","III. Alapelvek","Mit jelent a választójog egyenlősége?",[["Mindenkinek ugyanannyit ér a szavazata: nincs plurális szavazat, és a képviselők megközelítőleg azonos számú választópolgárt képviselnek","Helyes."],["Mindenki ugyanarra a pártra szavaz","Nem."],["A pártok azonos számú mandátumot kapnak","Nem."],["Mindenki köteles szavazni","Nem erről szól."]],0],[7,"C","III. Alapelvek","Mi a gerrymandering?",[["Az aránytalanul eltérő méretű választókerületek tudatos kialakítása, ami sérti az egyenlőséget; az elnevezés Elbridge Gerry amerikai politikustól ered (szalamandra alakú kerület)","Helyes."],["A szavazatok megvásárlása","Nem."],["A választási csalás egy neme: dupla szavazás","Nem."],["A bejutási küszöb emelése","Nem."]],0],[7,"C","III. Alapelvek","Mit jelent a közvetlenség és a titkosság?",[["Közvetlenség: mások közbeiktatása nélkül, személyesen szavaz a jelöltre / listára; titkosság: a szavazat tartalma senki más számára nem ismerhető meg, az államnak biztosítania kell a technikai feltételeket","Helyes."],["Közvetlenség: elektori kollégium dönt","Az közvetett választás."],["Titkosság: a szavazás eredménye titkos marad","Nem ez."],["Közvetlenség: levélben is szavazhat a megbízottja","Nem."]],0],[7,"C","III. Alapelvek","Melyik NEM a Ve. 2. §-ában rögzített eljárásjogi alapelv?",[["A kötelező részvétel","Helyes: az önkéntes részvétel az elv."],["A választás tisztaságának megóvása","Alapelv."],["A jogorvoslathoz való jog","Alapelv."],["A választási eljárás nyilvánossága","Alapelv."]],0],[7,"C","III. Alapelvek","Milyen eszközöket biztosít a törvény a fogyatékossággal élő választópolgárok esélyegyenlőségéhez?",[["Braille-írásos tájékoztató, akadálymentesített szavazóhelyiség, mozgóurna","Helyes."],["Csak postai szavazás","Nem."],["Automatikus mandátum","Nem."],["Kötelező megbízott","Nem."]],0],[7,"C","IV. Országgyűlési választás","Hány képviselője van az Országgyűlésnek, és hogyan oszlik meg?",[["199 fő: 106 egyéni választókerületi (relatív többség) és 93 országos listás (D'Hondt, töredékszavazatokkal)","Helyes."],["199 fő: 93 egyéni és 106 listás","Felcserélt."],["200 fő: 100 egyéni és 100 listás","Nem."],["386 fő","A régi szám."]],0],[7,"C","IV. Országgyűlési választás","Hány ajánlás kell az egyéni választókerületi jelölteknek, és mi történik szavazategyenlőségnél?",[["500 választópolgár ajánlása; szavazategyenlőségnél időközi választás","Helyes."],["1000 ajánlás; sorsolás","Nem."],["50 ajánlás; második forduló","Nem."],["Nem kell ajánlás","Kell."]],0],[7,"C","IV. Országgyűlési választás","Ki állíthat országos pártlistát?",[["Az a párt (vagy pártszövetség), amely legalább 14 megyében és a fővárosban, összesen legalább 21 egyéni jelöltet indít","Helyes."],["Bármely párt jelölt nélkül","Nem."],["Csak a parlamenti pártok","Nem."],["Legalább 5 megyében 10 jelölt","Nem."]],0],[7,"T","IV. Országgyűlési választás","Nemzetiségi listát két vagy több nemzetiségi önkormányzat közösen is állíthat.",false,"Hamis. Nemzetiségi listát kizárólag országos nemzetiségi önkormányzat állíthat, legalább három jelölttel; két vagy több közösen nem állíthat."],[7,"C","IV. Országgyűlési választás","Mekkora a bejutási küszöb?",[["Önálló pártlista: 5%; két párt közös listája: 10%; három vagy több párt közös listája: 15%","Helyes."],["Mindenkinél 5%","Nem."],["Önálló 4%, közös 8%","Nem."],["Önálló 10%, közös 20%","Nem."]],0],[7,"C","IV. Országgyűlési választás","Mi a nemzetiségi mandátumkedvezmény és a nemzetiségi szószóló?",[["A kedvezményes mandátumkvóta alacsonyabb a rendes listás kvótánál; ha eléri, teljes jogú mandátum; ha nem, a nemzetiség szószólót delegálhat, aki tanácskozási joggal, de szavazati jog nélkül vesz részt","Helyes."],["A szószólónak szavazati joga is van","Nincs szavazati joga."],["Minden nemzetiség automatikusan mandátumot kap","Nem."],["A szószóló a Kormány tagja","Nem."]],0],[7,"C","IV. Országgyűlési választás","Hogyan töltik be a megüresedett mandátumot?",[["Egyéni kerületben időközi választás; listán a lista következő, mandátumot még nem szerzett jelöltje lép a helyére, ha nincs több jelölt, betöltetlen marad","Helyes."],["Mindig időközi választás","Listás mandátumnál nem."],["Mindig a következő jelölt lép be","Egyéni kerületnél időközi választás."],["A Kormány kinevezi","Nem."]],0],[7,"R","IV. Országgyűlési választás","Az országgyűlési választási rendszer kompenzációs.","A töredékszavazatok az országos listás mandátumok elosztásánál is beszámítanak.","A","Igaz.","Igaz.","A töredékszavazatok beszámítása éppen az, amiért kompenzációsnak nevezzük."],[8,"C","F1. Kronológia","Melyik eseménysor áll helyes időrendben?",[["1222 Aranybulla → 1848 áprilisi törvények → 1867 kiegyezés → 1949 első kartális alkotmány → 1989 rendszerváltás → 2011 Alaptörvény","Helyes."],["1867 kiegyezés → 1848 áprilisi törvények → 1949 → 1222","Nem."],["1949 → 1946 → 1989 → 1987","Az 1946 megelőzi 1949-et, és az 1987 az 1989 előtt van."],["2011 → 1989 → 1949 → 1867","Fordított."]],0],[8,"C","F1. Kronológia","Melyik évhez kötődik a kékcédulás választás és az utána következő „leszalámizás”?",[["1947","Helyes. Ez vetett véget az 1946–1949 közötti nem klasszikus demokratikus időszaknak."],["1956","Ekkor volt a forradalom."],["1989","Rendszerváltás."],["1921","Soproni népszavazás."]],0],[8,"C","F1. Kronológia","Mi az 1956-os forradalom egyetlen közjogi hozadéka?",[["A címer és a zászló módosítása","Helyes."],["Az Alkotmányjogi Tanács felállítása","Ez 1984."],["A többpártrendszer bevezetése","Ez 1989."],["Az Alkotmánybíróság létrehozása","Ez a rendszerváltás."]],0],[8,"C","F1. Kronológia","Mi történt 1972-ben, 1984-ben és 1987-ben?",[["1972: átfogó alkotmánymódosítás; 1984: Alkotmányjogi Tanács; 1987: jogalkotási törvény (1987. évi XI.)","Helyes."],["1972: Alkotmánybíróság; 1984: köztársaság; 1987: Alaptörvény","Nem."],["1972: kiegyezés; 1984: Aranybulla; 1987: kerekasztal","Nem."],["1972: Nemzeti Kerekasztal; 1984: szabad választás; 1987: rendszerváltás","Nem."]],0],[8,"C","F1. Kronológia","Melyik dátum és esemény párosítása HELYES?",[["2012. december: az AB megsemmisíti az Átmeneti rendelkezéseket","Helyes."],["2011. április 18.: az Alaptörvény hatályba lépése","Ekkor fogadták el; hatályba 2012. január 1-jén lépett."],["1989. október 23.: a négyigenes népszavazás","Ekkor kiáltották ki a köztársaságot; a népszavazás november 26-án volt."],["2016: a moratórium bevezetése","2016-ban a kvótanépszavazás volt."]],0],[8,"C","F1. Kronológia","Mikor volt a „négyigenes népszavazás”, és mikor kiáltották ki a köztársaságot?",[["Népszavazás: 1989. november 26.; köztársaság kikiáltása: 1989. október 23.","Helyes."],["Népszavazás: 1989. október 23.; köztársaság: 1989. november 26.","Felcserélt."],["Mindkettő 1990 áprilisában","Nem."],["Népszavazás: 1946; köztársaság: 1949","Nem."]],0],[8,"C","F2. Jogszabályok","Melyik törvény tárgya HELYESEN megadva?",[["2011. évi CCIII. törvény: az országgyűlési képviselők választásáról (Vjt.)","Helyes."],["2013. évi XXXVI. törvény: az állampolgárságról","Ez a választási eljárásról szól (Ve.)."],["1993. évi LV. törvény: a népszavazásról","Ez az állampolgársági törvény."],["2010. évi CXXX. törvény: a nemzetiségekről","Ez a jogalkotásról szóló (Jat.)."]],0],[8,"C","F2. Jogszabályok","Melyik törvény a hatályos népszavazási törvény, és mi a rövidítése?",[["2013. évi CCXXXVIII. törvény (Nsztv.)","Helyes."],["1989. évi XVII. törvény","Ez a régi, első rendszerváltáskori törvény."],["1998. évi III. törvény","Ez az előző törvény."],["2013. évi XXXVI. törvény (Ve.)","Ez a választási eljárásról szól."]],0],[8,"C","F2. Jogszabályok","Melyik törvény szól a nemzetiségek jogairól, és melyik az állampolgárságról?",[["Nemzetiségek: 2011. évi CLXXIX. törvény; állampolgárság: 1993. évi LV. törvény","Helyes."],["Nemzetiségek: 1993. évi LV.; állampolgárság: 2011. évi CLXXIX.","Felcserélt."],["Mindkettő a 2010. évi CXXX. törvény","Az a Jat."],["Mindkettő az Ákr.","Nem."]],0],[8,"C","F2. Alaptörvényi cikkek","Melyik cikk mit szabályoz?",[["B) cikk: jogállamiság, a közhatalom forrása a nép; E) cikk: Európa-klauzula; Q) cikk: nemzetközi jog és belső jog viszonya","Helyes."],["B) cikk: nemzetközi jog; Q) cikk: népszuverenitás","Nem."],["E) cikk: a jogszabályok felsorolása; T) cikk: Európa-klauzula","Fordított."],["R) cikk: népszavazás; S) cikk: állampolgárság","Nem."]],0],[8,"C","F2. Alaptörvényi cikkek","Melyik cikk sorolja fel a jogszabályokat, és melyik mondja ki, hogy az Alaptörvény a jogrendszer alapja?",[["T) cikk sorolja fel a jogszabályokat; az R) cikk mondja ki, hogy az Alaptörvény a jogrendszer alapja","Helyes."],["R) cikk sorolja fel a jogszabályokat; a T) cikk a jogrendszer alapja","Felcserélt."],["Mindkettő az R) cikk","Nem."],["Az E) és Q) cikk","Nem."]],0],[8,"C","F2. Alaptörvényi cikkek","Mely cikkek alapján alkot rendeletet eredeti hatáskörben a kormány, illetve az önkormányzat?",[["Kormány: 15. cikk; önkormányzat: 32. cikk","Helyes."],["Kormány: 32. cikk; önkormányzat: 15. cikk","Felcserélt."],["Mindkettő a 8. cikk","A 8. cikk (3) a népszavazás tilalmairól szól."],["Mindkettő a XXIII. cikk","Az a választójog."]],0],[8,"C","F2. Alaptörvényi cikkek","Melyik cikk tartalma HELYES?",[["8. cikk (3): a népszavazásból kizárt tárgykörök","Helyes."],["XXIII. cikk: tisztességes hatósági eljárás","Ez a XXIV. cikk; a XXIII. a választójog."],["VIII. cikk (1): a választójog","Ez a békés gyülekezéshez való jog."],["L) cikk: jogállamiság","Ez a házasság és a család védelme; a jogállamiság a B) cikk."]],0],[8,"C","F2. Alaptörvényi cikkek","Melyik cikk szól a házasság és a család védelméről, a magyar nyelv védelméről és a területi tagozódásról?",[["L) cikk; H) cikk; F) cikk","Helyes."],["F) cikk; L) cikk; H) cikk","Nem ez a párosítás."],["D) cikk; E) cikk; Q) cikk","Nem."],["S) cikk; T) cikk; R) cikk","Nem."]],0],[8,"C","F2. Alaptörvényi cikkek","Melyik cikk szól a határon túli magyarokért viselt felelősségről, és melyik az Alaptörvény elfogadásáról és módosításáról?",[["D) cikk; S) cikk","Helyes."],["S) cikk; D) cikk","Felcserélt."],["B) cikk; E) cikk","Nem."],["Q) cikk; R) cikk","Nem."]],0],[8,"C","F3. Latin kifejezések","Mit jelent a pacta sunt servanda?",[["A szerződéseket be kell tartani","Helyes."],["A tények magukért beszélnek","Nem."],["A törvény nem ismerete nem mentesít","Nem."],["A szerződés semmis","Nem."]],0],[8,"C","F3. Latin kifejezések","Mit jelent a vacatio legis, az erga omnes és a tabula rasa?",[["Vacatio legis: felkészülési idő; erga omnes: mindenkire kiterjedő hatály; tabula rasa: tiszta lap","Helyes."],["Vacatio legis: törvényhozás; erga omnes: egy személyre; tabula rasa: háború","Nem."],["Vacatio legis: hatályon kívül helyezés; erga omnes: jogorvoslat; tabula rasa: kegyelem","Nem."],["Vacatio legis: büntetés; erga omnes: visszamenőleges hatály; tabula rasa: pert","Nem."]],0],[8,"C","F3. Latin kifejezések","Mit jelent a secundum, praeter és contra legem a végrehajtási rendeletek kapcsán?",[["Secundum: a törvény szerinti (ideális); praeter: a törvényen túlnyúló (aggályos); contra: a törvénnyel ellentétes (kizárt)","Helyes."],["Secundum: kizárt; contra: ideális","Fordított."],["Mindhárom ideális","Nem."],["Mindhárom kizárt","Nem."]],0],[8,"C","F3. Latin kifejezések","Mit jelent az ius sanguinis és az ius soli?",[["Ius sanguinis: a vérségi leszármazás elve; ius soli: a területen születés elve","Helyes."],["Ius sanguinis: területen születés; ius soli: vérségi","Felcserélt."],["Mindkettő a választójogról szól","Nem."],["Mindkettő a nemzetközi szerződésekről szól","Nem."]],0],[8,"C","F3. Latin kifejezések","Mit jelent az ultima ratio, és melyik jogághoz kötődik?",[["Végső eszköz; a büntetőjog","Helyes."],["Első eszköz; a polgári jog","Nem."],["Észszerű döntés; a közigazgatási jog","Nem."],["Utolsó szó; az alkotmányjog","Nem."]],0],[8,"C","F3. Idegen kifejezések","Mit jelent a case law, az equity és a checks and balances?",[["Case law: bírói esetjog; equity: a common law méltányossági kiegészítő rendszere; checks and balances: fékek és ellensúlyok (amerikai hatalommegosztás)","Helyes."],["Case law: törvény; equity: egyenlőség; checks and balances: választás","Nem."],["Mindhárom a civil jog fogalma","Nem."],["Case law: precedens nélküli jog","Nem."]],0],[8,"C","F3. Idegen kifejezések","Mit jelent az acquis communautaire, az état de droit és a droit constitutionnel?",[["Acquis communautaire: az uniós közös elvek és vívmányok; état de droit: a jogállamiság francia elnevezése; droit constitutionnel: az alkotmányjog francia elnevezése","Helyes."],["Acquis: az uniós büntetőjog; état de droit: államforma; droit: választójog","Nem."],["Mindhárom a francia alkotmány szakasza","Nem."],["Acquis: kormányzati program","Nem."]],0],[8,"C","F4. Nevek","Kihez kapcsolódik a „normapiramis”, és mi az AB-ra vonatkozó következménye?",[["Hans Kelsen; a hierarchia őrzésére külön szerv kell, az alkotmánybíróság („negatív jogalkotó”)","Helyes."],["Montesquieu; hatalommegosztás","Nem."],["Jellinek; terület, népesség, főhatalom","Nem."],["Max Weber; államforma","Nem."]],0],[8,"C","F4. Nevek","Kihez kapcsolódnak: Jellinek, Bodin, Max Weber, Kármán Tódor?",[["Jellinek: állam három ismérve (terület, népesség, főhatalom); Bodin: szuverén fogalma; Max Weber: monarchia / köztársaság legitimációs tipizálása; Kármán Tódor: a világűr határa 100 km-nél","Helyes."],["Jellinek: normapiramis; Bodin: népszuverenitás","Nem."],["Max Weber: szuverenitás; Kármán: választójog","Nem."],["Bodin: hatalommegosztás","Nem."]],0],[8,"C","F4. Nevek","Melyik mondat kihez fűződik? „A jogállamot nem lehet a jogállam ellenében megvalósítani.”",[["Sólyom László","Helyes."],["Antall József","Tőle ered: „tetszettek volna forradalmat csinálni”."],["Kelsen","Nem."],["Deák Ferenc","Tőle: „Alkotmányunk történelmi alkotmány…”"]],0],[8,"C","F4. Nevek","Kihez fűződik a „lopakodó föderalizmus” kifejezés (irányelv), és ki állította, hogy „Európában az ateista is keresztény”?",[["Lopakodó föderalizmus: Szabó Marcel; „az ateista is keresztény”: Antall József","Helyes."],["Lopakodó föderalizmus: Antall József; ateista: Szabó Marcel","Felcserélt."],["Mindkettő Sólyom László","Nem."],["Mindkettő Dicey","Nem."]],0],[8,"C","F4. Nevek","Kihez kapcsolódik a gerrymandering, és ki mondta ki a szubszidiaritás elvét (Quadragesimo anno)?",[["Gerrymandering: Elbridge Gerry; szubszidiaritás: XI. Piusz pápa","Helyes."],["Gerrymandering: Montesquieu; szubszidiaritás: Bodin","Nem."],["Gerrymandering: Rousseau; szubszidiaritás: Locke","Nem."],["Mindkettő Lijphart","Lijphart a többségi és a konszenzuális demokrácia modelljeinek elhatárolásáról ismert."]],0],[8,"C","F4. Nevek","Kik voltak a rendszerváltás kerekasztal-tárgyalásainak meghatározó szereplői a tankönyv szerint?",[["Tölgyessy Péter (SZDSZ) és Salamon László (KDNP, később alkotmánybíró)","Helyes."],["Antall József és Horthy Miklós","Nem."],["Sólyom László és Deák Ferenc","Nem."],["Kelsen és Dicey","Nem."]],0],[8,"C","F4. Nevek","Mit mondott Deák Ferenc, és mit foglalt össze Nagy Ernő?",[["Deák: „Alkotmányunk történelmi alkotmány, nem egyszerre készült, hanem a nemzet életéből fejlett ki”; Nagy Ernő: a magyar történeti alkotmány biztosítékai (koronázási hitlevél, adómegállapítási jog, miniszteri felelősség, bírói függetlenség, sajtószabadság)","Helyes."],["Deák: a kiegyezés ellen; Nagy Ernő: a Tripartitum","Nem."],["Deák: a köztársaságot; Nagy Ernő: a szovjet alkotmányt","Nem."],["Mindkettő a kerekasztalról","Nem."]],0],[8,"C","F4. Nevek","Kihez kapcsolódik a közjog–magánjog elhatárolás kezdete?",[["Ulpianus, akire Justinianus az Institúcióban hivatkozott; később Grotius és Althusius is hangsúlyozta az elválasztás szükségességét","Helyes."],["Kelsen","Nem."],["Max Weber","Nem."],["Jellinek","Nem."]],0],[9,"T","Történeti alkotmányosság","A magyar alkotmánytörténet tárgyalását a vizsgán célszerű a rendszerváltással kezdeni, mert a korábbi korszakok már nem relevánsak.",false,"Hamis. Az előadó kifejezetten kiemelte, hogy ez gyakori vizsgahiba: a magyar alkotmányosság több mint ezeréves történetéből mintegy 950 évet a történeti alkotmányosság kora tesz ki, és az Alaptörvény is utal rá. A korábbi korszakok jogintézményei megalapozzák a mai működést, ezért legalább vázlatosan érdemes őket bemutatni."],[9,"T","Történeti alkotmányosság","Az 1848-as áprilisi törvények hozták létre az Országgyűlésnek felelős kormányzatot, az első felelős magyar kormány a Batthyány-kormány volt.",true,"Igaz. 1848 áprilisában jött létre az Országgyűlésnek felelős, testületi kormányzat önálló, felelős minisztériumokkal, amelyek beszámolnak az Országgyűlésnek, onnan kerülnek pozícióba, és el is mozdíthatók. Ez a modell lényegében a mai napig él."],[9,"T","Történeti alkotmányosság","Az áprilisi törvények óta az Országgyűlés nem rendi küldöttgyűlés, hanem a nép által választott országgyűlés.",true,"Igaz. Az áprilisi törvények hozták az első választójogi szabályokat, és megszüntették az Országgyűlés rendi küldöttgyűlés jellegét. Ez a feudális alapokról a polgári társadalom és a modern demokrácia felé vezető út mérföldköve."],[9,"T","Történeti alkotmányosság","Az 1867-es kiegyezés után az Osztrák–Magyar Monarchiában közös uralkodó és három közös ügy (a külügy, a hadügy és az ezek finanszírozására szolgáló pénzügy) volt; minden más a két országban függetlenül működött.",true,"Igaz. A Monarchia sajátos államszerkezetet hozott létre: közös uralkodó, három közös ügy, de minden egyéb ügyben a két ország saját felelős kormányzattal és országgyűléssel működött."],[9,"T","Történeti alkotmányosság","A kiegyezés után az Osztrák–Magyar Monarchiában a két országnak közös kormánya és közös országgyűlése volt, amely minden ügyben döntött.",false,"Hamis. Csak az uralkodó és három ügy (külügy, hadügy, ezek pénzügye) volt közös. Minden más ügyben a két ország önálló felelős kormányzattal és országgyűléssel működött."],[9,"T","Történeti alkotmányosság","Az 1222-es Aranybulla, az 1351-es, az ősiség szabályait rögzítő törvény és az 1514-es Werbőczy-féle Hármaskönyv (Tripartitum) a történeti alkotmányosság kiemelt állomásai.",true,"Igaz. Az előadó szerint a vizsgán és a záróvizsgán elég ilyen vázlatosan felsorolni a legfontosabb lépéseket (Szent István Intelmei, Aranybulla, 1351, Hármaskönyv, Rákóczi-szabadságharc, a Habsburg-ház trónfosztása)."],[9,"T","Történeti alkotmányosság","Az Aranybulla ellenállási joga mai továbbélő maradványa például a petíciós jog.",true,"Igaz. Az előadó szerint a középkori ellenállási jognak a mai napig vannak továbbélő maradványai, például a petíciós jogban."],[9,"T","Honosítás","A honosítás nyolcéves magyarországi tartózkodási feltétele minden esetben kötelező, belőle semmilyen esetben nem lehet engedni.",false,"Hamis. A nyolc év csökkenhet öt évre (Magyarországon született vagy kiskorúként került ide), három évre (menekült, magyar állampolgár házastársa, örökbefogadás) és nulla évre (állami érdekből, illetve kedvezményes honosítás)."],[9,"T","Honosítás","A kedvezményes honosításhoz a kérelmezőnek nem kell Magyarországon laknia, elegendő a magyar származás és a nyelvtudás igazolása.",true,"Igaz. A kedvezményes honosítás esetében nincs szükség a magyarországi tartózkodásra és lakóhelyre sem; a magyar származás és a magyar nyelvtudás igazolása elég."],[9,"T","Honosítás","A honosítás feltételei közül a nemzetbiztonsági és közbiztonsági kockázat hiánya, valamint a büntetlen előélet alól felmentés adható, ha a kérelmező indokolja.",false,"Hamis. Az előadó külön hangsúlyozta, hogy a 3. és 4. feltétel (nemzetbiztonság–közbiztonság, illetve büntetlen előélet és büntetőeljárás hiánya) az a kettő, amely alól nem adható felmentés; ezeknek mindig teljesülniük kell."],[9,"T","Honosítás","A honosítás büntetlen előélet feltételénél a magyar jog szerinti büntetlenség számít: ha valakit külföldön olyan cselekmény miatt ítéltek el, amely a magyar Btk. szerint nem bűncselekmény (pl. házasságtörés), az nem akadálya a honosításnak.",true,"Igaz. Nem magyar bíróság ítélete, hanem az számít, hogy a világ bármely pontján olyan cselekmény miatt ítélték-e el, amely a magyar Btk. szerint is bűncselekmény. A házasságtörés nem az, az emberölés viszont igen."],[9,"T","Honosítás","Ha a kérelmezővel szemben külföldön büntetőeljárás folyik, az kizárja a honosítást, mert az eljárás tárgyától függetlenül minden büntetőeljárás akadály.",false,"Hamis. A feltétel a magyar jog szerinti büntetőeljárás alatt állást jelenti: a külföldi eljárás önmagában nem kizáró ok, a Magyarországon folyó viszont az."],[9,"T","Honosítás","Ha a kérelmező a honosítás összes törvényi feltételének megfelel, a köztársasági elnök akkor is megtagadhatja a honosítást.",true,"Igaz. A feltételek teljesítése nem jogot, hanem csak lehetőséget keletkeztet; az állampolgárság szuverenitási kérdés, az állam szabadon dönt, és nincs jogorvoslat. Ha a feltételek nem teljesülnek, biztosan nem lehet honosítani, még akkor sem, ha a köztársasági elnök akarná."],[9,"T","Honosítás","A honosítási kérelmet az Országos Idegenrendészeti Főigazgatósághoz kell benyújtani, a honosításról a végső szót a köztársasági elnök mondja ki.",true,"Igaz. A kérelmet az Országos Idegenrendészeti Főigazgatóságnál kell előterjeszteni; ha a feltételek teljesülnek, a köztársasági elnök dönt a honosításról."],[9,"T","Honosítás","Honosítani csak olyan személyt lehet, aki soha nem volt magyar állampolgár; aki korábban az volt, azt visszahonosítják.",true,"Igaz. A honosításnál nagyon fontos kitétel, hogy a kérelmező nem magyar állampolgár, és soha nem is volt az. Aki korábban az volt, az a visszahonosítás körébe tartozik."],[9,"T","Honosítás","A Magyarországon született külföldi szülők gyermeke a születéssel automatikusan magyar állampolgár lesz.",false,"Hamis. Főszabály a ius sanguinis (vérségi elv): a gyermek a szülei állampolgárságát kapja. A Magyarországon születés csupán azt eredményezi, hogy a honosításnál a várakozási idő nyolcról öt évre csökken (példa: a kecskeméti Mercedes-gyárban dolgozó német szülők gyermeke)."],[9,"T","Honosítás","Az állampolgársági vizsga alól mentesül a kiskorú, a 65 év feletti személy, aki magyar nyelvű felsőoktatási végzettséggel rendelkezik, valamint a házastársi jogcímen honosított személy.",true,"Igaz. Mind a négy csoport mentesül az állampolgársági vizsga alól (a magyar nyelvű felsőoktatási végzettséget akár külföldön is megszerezhették)."],[9,"T","Honosítás","Az állampolgársági vizsgát magyar nyelven kell letenni állampolgársági ismeretekből (pl. nemzeti jelképek, Himnusz, alapvető történeti események).",true,"Igaz. Az előadó szerint nagyjából az a szint, mint amit a hallgatóktól várnak a félév végén, talán kevesebb anyagból."],[9,"T","Állampolgárság","A nemzetközi elvek szerint senkit nem lehet megfosztani az állampolgárságától, és a hontalanság visszaszorítandó.",true,"Igaz. Ez két alapvető nemzetközi elv. Az előadó példaként említette, hogy Szlovákia egy időben megfosztotta állampolgárságától azt, aki magyar állampolgárságot is szerzett, ami ellentétes a nemzetközi elvvel."],[9,"T","Állampolgárság","A nemzetközi jog szempontjából a többes állampolgárság súlyosabb probléma, mint a hontalanság, ezért azt kell elsősorban visszaszorítani.",false,"Hamis. Az előadó szerint a többes állampolgárság a legkevésbé zavaró; az a baj, ha valaki egy államhoz sem tartozik. Ezért a hontalanság ellen kell küzdeni."],[9,"T","Állampolgárság","A családegység elve szerint arra kell törekedni, hogy egy család tagjainak közös állampolgársága legyen; ez a nemzeti állampolgársági szabályozás kialakítását is befolyásolja.",true,"Igaz. A családegység elve nemzetközi kötelezettség, amely az állampolgársági szabályozásra is hatással van."],[9,"T","Állampolgárság","Az inkubátorban talált gyermek alkotmányjogi szempontból magyar állampolgárnak minősül, de ez megdönthető vélelem: ha kiderül, hogy a vérségi elv alapján nem illetné meg, az állampolgárságot elveszíti.",true,"Igaz. A talált gyermek magyar állampolgársága vélelem; ha utóbb kiderülnek a szülők, és a vérségi elv szerint a gyermek nem lenne magyar állampolgár, a vélelem megdől."],[9,"T","Állampolgárság","A menekült egyéni elbírálás alapján, tartós védelmet kap, a menedékes védelme viszont kollektív és ideiglenes.",true,"Igaz. A menekült egyéni és tartós, a menedékes kollektív és ideiglenes jogállás. A migráns nem jogi kategória, és nincs alanyi jog a befogadására."],[9,"T","Jogforrás és hierarchia","A jog fogalma azonos azzal, hogy minden ember számára kötelező magatartási szabály.",false,"Hamis. Ez a norma fogalma. A klasszikus meghatározás szerint a jog a jó és a méltányos művészete, a jogászság pedig mérlegelés eredményeként megvalósuló döntéshozatal."],[9,"T","Jogforrás és hierarchia","A sarkalatos törvény a jogforrási hierarchiában az egyszerű törvény felett áll, mert elfogadásához nagyobb többség kell.",false,"Hamis. A sarkalatos törvény elfogadásához nagyobb többség kell, de hierarchiában nem áll az egyszerű törvény fölött. Nincs olyan, hogy a sarkalatos törvény erősebb a sima törvénynél."],[9,"T","Jogforrás és hierarchia","Az Alaptörvény nem sarkalatos törvényekről, hanem sarkalatos tárgykörökről beszél, ezért előfordulhat, hogy egy törvénynek csak egy része igényel sarkalatos többséget.",true,"Igaz. Vannak teljes egészében sarkalatos törvények (pl. a választójogi törvény, az Alkotmánybíróságról szóló törvény), de a salátatörvényeknél gyakori, hogy csak egy rész sarkalatos."],[9,"T","Jogforrás és hierarchia","A sarkalatos törvény elfogadásához a jelen lévő országgyűlési képviselők kétharmadának szavazata szükséges.",true,"Igaz. A sarkalatos többséghez a jelen lévő képviselők kétharmada kell. Az alkotmányos többség ennél erősebb: az összes képviselő kétharmada."],[9,"T","Jogforrás és hierarchia","A legtöbb rendelet ma Magyarországon miniszteri rendelet; a miniszterelnöki rendelet elméletileg létezik, és a miniszteri rendelettel egy szinten áll.",true,"Igaz. Az Alaptörvény T) cikke szerint a kormányrendeletek után a miniszteri és a miniszterelnöki rendeletek következnek, ugyanazon a szinten."],[9,"T","Jogforrás és hierarchia","Egy kormányrendeletet miniszteri rendelet is módosíthat, ha tartalmilag nem ellentétes vele.",false,"Hamis. Jogszabályt csak azonos vagy magasabb szintű jogszabály módosíthat vagy helyezhet hatályon kívül. Kormányrendeletet tehát csak kormányrendelet vagy törvény módosíthat, miniszteri rendelet nem."],[9,"T","Jogforrás és hierarchia","Törvénnyel hatályon kívül lehet helyezni miniszteri rendeletet.",true,"Igaz. A törvény a hierarchiában magasabb szinten áll, ezért miniszteri rendeletet is módosíthat vagy hatályon kívül helyezhet."],[9,"T","Jogforrás és hierarchia","Alacsonyabb szintű jogszabály megismételheti a magasabb szintű jogszabály magatartási szabályát, mert ezzel erősíti annak érvényesülését.",false,"Hamis. A hierarchiából fakadó követelmény (amelyet a Jat., a 2010. évi CXXX. törvény is megerősít): alacsonyabb szintű normában nem lehet megismételni a magasabb szintű normában megjelenő magatartási szabályt."],[9,"T","Érvényesség","A norma érvényességének négy követelménye: a felhatalmazott szerv alkotta meg, az előírt eljárásban született, illeszkedik a jogforrási hierarchiába, és kihirdették.",true,"Igaz. Az előadó szerint ez az a rész, amit tényleg tudni kell: aki nem tudja, azt egészen biztosan megbuktatják."],[9,"T","Érvényesség","Ha a miniszteri rendeletet nem az a miniszter adta ki, aki a felhatalmazást kapta, a rendelet ettől automatikusan érvénytelen, az Alkotmánybíróság döntésére nincs szükség.",false,"Hamis. Az érvényesség mellett vélelem szól. A hibás rendelet addig érvényesnek tekintendő, amíg az Alkotmánybíróság ki nem mondja az érvénytelenségét. Ez a tartalmi érvénytelenségre (hierarchiába illeszkedés) is igaz."],[9,"T","Érvényesség","A jogszabályok nyilvánosságra hozatala érvényességi követelmény, ezért ezt kihirdetésnek nevezzük; a többi norma (pl. jogegységi határozat, közjogi szervezetszabályozó eszköz) nyilvánosságra hozatala közzététel.",true,"Igaz. Mindkettő a jogbiztonságot szolgálja, de a kihirdetés hiánya a jogszabályt érvénytelenné teszi, a közzététel hiánya a többi normát nem."],[9,"T","Érvényesség","Az önkormányzati rendeletet a Magyar Közlönyben kell kihirdetni, más módon nem lehet.",false,"Hamis. Az önkormányzati rendeletet helyben szokásos módon hirdetik ki (hirdetőtábla, hivatalos honlap, akár kidoboltatás). A Magyar Közlöny a központi jogszabályoké."],[9,"T","Érvényesség","Ha az eljárási szabályokat megsértve fogadnak el egy normát (pl. sarkalatos törvényt egyszerű többséggel), az közjogi érvénytelenséget eredményez.",true,"Igaz. Az eljárási szabály megsértése alapból érvénytelenséget okoz; ezt hívjuk közjogi érvénytelenségnek."],[9,"T","Jelképek","A nemzeti jelképek, azaz a Himnusz, a zászló és a címer, az Alaptörvény Alapvetés fejezetében szerepelnek; használatukat törvény szabályozza, és büntetőjogi védelem alatt állnak.",true,"Igaz. A nemzeti jelképek a jellineki triász kapcsán kerültek elő; az előadó kiemelte, hogy ez általános iskolai tananyag, ezért a vizsgán nem szabad belekeveredni ilyen hibákba."],[9,"R","Történeti alkotmányosság","A kiegyezés közös ügyei a külügy, a hadügy és ezek finanszírozására szolgáló pénzügy voltak.","Az áprilisi törvények óta Magyarországon az Országgyűlésnek felelős kormányzat működik.","B","Igaz.","Igaz.","Mindkét állítás igaz, de egymással nincs ok-okozati kapcsolatban: az egyik az 1867-es államszerkezetről, a másik az 1848-as kormányzati modellről szól."],[9,"R","Történeti alkotmányosság","Az 1848-as áprilisi törvényekkel jött létre az első felelős magyar kormány, a Batthyány-kormány.","A Batthyány-kormány nem az Országgyűlésnek, hanem az uralkodónak tartozott beszámolási kötelezettséggel.","C","Igaz.","Hamis. A felelős kormányzat lényege, hogy az Országgyűlésnek számol be, onnan kerül pozícióba, és el is mozdítható.","Az első állítás igaz, a második hamis, ezért C."],[9,"R","Történeti alkotmányosság","Az Aranybulla 1514-ben született.","A Werbőczy-féle Hármaskönyv (Tripartitum) 1514-ben született.","D","Hamis. Az Aranybulla 1222-ből való.","Igaz.","Az első állítás hamis (1222), a második igaz, ezért D."],[9,"R","Történeti alkotmányosság","A magyar alkotmánytörténetet a rendszerváltással kell kezdeni a vizsgán.","A történeti alkotmányosság kora nagyjából 950 évet tesz ki a magyar alkotmányosság ezeréves történetéből.","D","Hamis. Pont ezt a hibát emelte ki az előadó: nem a rendszerváltással kell kezdeni.","Igaz.","Az első állítás hamis, a második igaz, ezért D. (A második állítás éppen azt mutatja, miért hiba a rendszerváltással kezdeni.)"],[9,"R","Történeti alkotmányosság","Az Aranybulla (1222) rögzítette az ellenállási jogot.","Az ősiség szabályait az 1351-es törvény rögzítette.","B","Igaz.","Igaz.","Mindkettő igaz, de két különböző történeti állomásról szólnak, ok-okozati kapcsolat nélkül."],[9,"R","Honosítás","A köztársasági elnök a honosítást akkor is megtagadhatja, ha a kérelmező minden feltételnek megfelel.","Az állampolgárság megszerzése nem alanyi jog, hanem csak lehetőség, az államok szabadon, szuverén módon döntenek róla.","A","Igaz.","Igaz.","A második állítás magyarázza az elsőt: mivel a feltételek teljesítése nem jogot keletkeztet, és az állampolgárság szuverenitási kérdés, a köztársasági elnök megtagadhatja a honosítást. Ezért A."],[9,"R","Honosítás","A honosítás nemzetbiztonsági feltétele alól nem adható felmentés.","Az állampolgársági vizsga alól a 65 év feletti személy mentesül.","B","Igaz.","Igaz.","Mindkét állítás igaz, de egymással nincs ok-okozati kapcsolatban: az egyik a nem mellőzhető feltételekről, a másik a vizsgamentességről szól."],[9,"R","Honosítás","A honosítás büntetlenségi feltétele a magyar jog szerinti büntetlenséget jelenti.","Akit külföldön házasságtörés miatt ítéltek el, az emiatt nem honosítható.","C","Igaz.","Hamis. A házasságtörés a magyar jog szerint nem bűncselekmény, ezért nem akadálya a honosításnak.","Az első állítás igaz, a második hamis, ezért C."],[9,"R","Honosítás","A honosítás nyolcéves várakozási ideje semmilyen esetben nem csökkenhet.","Állami érdekbő
