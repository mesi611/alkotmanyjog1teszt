<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Alkotmányjog ZH-gyakorló</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: egy keskeny munkaasztal. Kezdőlapon a ZH-szimuláció és a gyakorlás két külön doboza,
   kérdés közben egyetlen kártya, alatta a magyarázat. Színek és betűk a tanulókártyák oldaláról. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #172030;
  --muted: #566274;
  --line: #d3dae5;
  --accent: #00508c;
  --on-accent: #ffffff;
  --accent-soft: #e2eef7;
  --ok: #17704f;
  --ok-soft: #e1f2ea;
  --bad: #b4234f;
  --bad-soft: #fbe6ec;
  --warn: #8a6411;
  --warn-soft: #faf4e2;

  --font-ui: "Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  --font-body: "Caladea", Cambria, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141d;
    --surface: #141d29;
    --ink: #e6ecf3;
    --muted: #9aa8ba;
    --line: #2a3748;
    --accent: #5aaae8;
    --on-accent: #06121d;
    --accent-soft: #12283d;
    --ok: #62cba0;
    --ok-soft: #10291f;
    --bad: #f27aa0;
    --bad-soft: #3a1523;
    --warn: #dcb455;
    --warn-soft: #2e2610;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141d;
  --surface: #141d29;
  --ink: #e6ecf3;
  --muted: #9aa8ba;
  --line: #2a3748;
  --accent: #5aaae8;
  --on-accent: #06121d;
  --accent-soft: #12283d;
  --ok: #62cba0;
  --ok-soft: #10291f;
  --bad: #f27aa0;
  --bad-soft: #3a1523;
  --warn: #dcb455;
  --warn-soft: #2e2610;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-ui); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.2rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.ui { font-family: var(--font-ui); }
.small { font-size: 0.9rem; }
.eyebrow { font-family: var(--font-ui); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.btn { font-family: var(--font-ui); font-size: 1.05rem; font-weight: 700; border-radius: 6px; padding: 10px 18px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }

/* kezdőlap */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-ui); font-size: 0.95rem; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.fieldline { display: flex; flex-direction: column; gap: 8px; }
.fieldline label.cap { font-family: var(--font-ui); font-weight: 700; font-size: 0.95rem; }
select { font-family: var(--font-ui); font-size: 1rem; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-ui); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.passline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-ui); }
.link { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; font-family: var(--font-ui); font-size: 0.95rem; }

/* kérdés */
.topbar { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--font-ui); }
.tag { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; padding: 3px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.T { background: var(--warn-soft); color: var(--warn); }
.tag.R { background: var(--ok-soft); color: var(--ok); }
.qtext { font-size: 1.15rem; line-height: 1.5; }
.stmt { border-left: 3px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }
.stmt .lab { font-family: var(--font-ui); font-weight: 700; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.06em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; width: 100%; min-width: 0; }
.opt .t { display: flex; gap: 10px; align-items: baseline; }
.opt .mark { font-family: var(--font-ui); font-weight: 700; flex: none; width: 1.4em; color: var(--muted); }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .ex { font-size: 0.97rem; color: var(--muted); padding-left: calc(1.4em + 10px); }
.opt.right .ex, .opt.wrong .ex { color: var(--ink); }
.verdict { font-family: var(--font-ui); font-weight: 700; font-size: 1.1rem; display: flex; gap: 8px; align-items: center; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.explain { border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--warn-soft); border: 1px solid var(--line); }
.explain.ok { background: var(--ok-soft); }
.explain.bad { background: var(--bad-soft); }
.explain .tv { font-family: var(--font-ui); font-weight: 700; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { font-family: var(--font-ui); font-variant-numeric: tabular-nums; width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 0.9rem; }
.dot.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

/* eredmény */
.score { font-family: var(--font-ui); font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.pill { font-family: var(--font-ui); font-weight: 700; padding: 4px 12px; border-radius: 999px; font-size: 0.95rem; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.meter { position: relative; height: 14px; background: var(--line); border-radius: 7px; margin-top: 14px; }
.meter > i { display: block; height: 100%; border-radius: 7px; background: var(--accent); }
.meter > b { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
.meter > span { position: absolute; top: -26px; transform: translateX(-50%); font-family: var(--font-ui); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
details.rev { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.rev > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: baseline; font-family: var(--font-ui); }
details.rev > summary::-webkit-details-marker { display: none; }
details.rev .ico { flex: none; font-weight: 700; width: 1.2em; }
details.rev .ico.ok { color: var(--ok); }
details.rev .ico.bad { color: var(--bad); }
details.rev .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.toolbar { display: flex; justify-content: flex-end; }
@media (prefers-reduced-motion: no-preference) { .bar > i, .meter > i { transition: width 0.25s ease; } }
</style>

<script>
var RAW = [[1,"C","I. Közjog és alkotmányjog","Melyik NEM tekinthető a közjog és a magánjog elhatárolásának önálló, megbízható szempontjának?",[["A felek egymáshoz való viszonya (alá-fölé rendeltség / mellérendeltség)","Ez valódi szempont: a közjogban alá-fölé rendeltség, a magánjogban mellérendeltség van."],["A jogviszony alanya, vagyis hogy szerepel-e benne az állam","Helyes. Az állam magánjogi jogviszonyban is részt vehet (pl. ingatlant ad el), ott viszont mellérendelt szereplő. Az számít, milyen minőségben lép fel, nem az, hogy ki ő."],["A szabályozás jellege (kógens / diszpozitív)","Ez valódi szempont: a közjogban főszabályként kógens, a magánjogban diszpozitív a szabályozás."],["A jogsértés következménye (közvetlen kikényszerítés / bírói út)","Ez valódi szempont: a közjogban az állam közvetlenül érvényesíti a követelést (letiltás, végrehajtás), a magánjogban bírósághoz kell fordulni."]],1],[1,"T","I. Közjog és alkotmányjog","Ha egy jogviszonyban az állam (pl. önkormányzat) az egyik fél, akkor az a jogviszony szükségképpen közjogi.",false,"Hamis. Ha az önkormányzat feleslegessé vált ingatlanát eladja, magánjogi jogviszony jön létre: az önkormányzatnak itt nincs imperiuma, nem erősebb a vevőnél, nem írhatja elő egyoldalúan a vételárat. Az állam a magánjogi jogviszonyban elveszíti közhatalmi jellegét."],[1,"C","I. Közjog és alkotmányjog","Egy önkormányzat feleslegessé vált ingatlanát eladja egy magánszemélynek. Milyen jogviszony ez, és miért?",[["Közjogi, mert az egyik fél az állam szerve","Az alany személye nem dönt. Az állam nem mindig közjogi minőségében jár el."],["Magánjogi, mert az önkormányzatnak itt nincs imperiuma, mellérendelt szereplő","Helyes. A vevő bárki lehet, az önkormányzat nem határozhatja meg egyoldalúan a vételárat, nincsenek többletjogosítványai."],["Vegyes jellegű, mert az ingatlan közvagyon","A közvagyon jellege itt nem teszi vegyessé a jogviszonyt; a felek viszonya a döntő, az pedig mellérendelt."],["Büntetőjogi, mert az állam végső eszköze a jogalkalmazás","A büntetőjog az ultima ratio, de ennek a példának semmi köze hozzá."]],1],[1,"T","I. Közjog és alkotmányjog","A közjogban főszabályként a kógencia, a magánjogban a diszpozitivitás érvényesül.",true,"Igaz. A közjogi norma megmondja, hogyan van, és ezen a felek egyetértése sem változtat; a magánjogban a felek a törvény adta kereten belül szabadon alakíthatják a jogviszony tartalmát. Ez főszabály, nem kizárólagos viszony."],[1,"T","I. Közjog és alkotmányjog","A közjogban soha nincs diszpozitív szabály, a magánjogban pedig soha nincs kógens szabály.",false,"Hamis, túlfogalmazás. A viszony nem kizárólagos: a magánjogban is vannak kógens, a közjogban is vannak diszpozitív szabályok. A vizsgán a főszabályt kell tudni (közjog: kógencia, magánjog: diszpozitivitás)."],[1,"C","I. Közjog és alkotmányjog","Melyik állítás igaz az érdekviszonyokra?",[["A magánjogban érdekazonosság, a közjogban érdekellentét van","Fordítva igaz."],["Mindkét területen érdekellentét jellemző","A közjogban az állam működése mindannyiunk közös érdeke, ezért nem érdekellentét a jellemző."],["A magánjogban érdekellentét van (az eladó drágán, a vevő olcsón akar), a közjogban érdekazonosság (a társadalmi szerződés alapján azt akarjuk, hogy az állam működjön)","Helyes. Magánjogban az érdekazonosság csak a folyamat eredménye (a felek engednek), a közjogban a kiindulópont."],["Egyik területen sincs érdekviszony","Érdekviszony mindkét területen van, csak ellentétes jellegű."]],2],[1,"R","I. Közjog és alkotmányjog","A közjogban az állam az adótartozást közvetlenül, bírósági eljárás nélkül is behajthatja (pl. a bankszámla letiltásával).","Az állam a közjogi jogviszonyban fölérendelt helyzetben van, és többletjogosítványokkal rendelkezik.","A","Igaz: közjogban az állam közvetlenül kikényszerítheti a kötelezettséget (letiltás, végrehajtó, lefoglalás, árverés).","Igaz: a közjogi jogviszony alá-fölé rendeltségen alapul, az állam fölérendelt szereplő, többletjogosítványokkal.","A közvetlen kikényszeríthetőség éppen a fölérendelt helyzet és a többletjogosítványok következménye, ezért van ok-okozati összefüggés."],[1,"C","I. Közjog és alkotmányjog","Miért nem jön létre a közjogi jogviszony „a felek akaratából” az építési engedély esetében, noha az ügyfél maga kérelmezi az engedélyt?",[["Mert az ügyfél kérelmét az építési hatóság mindig elutasítja","Ennek semmi köze a kérdéshez."],["Mert a jogviszony megindítása és a jogviszony tartalma két külön dolog: a tartalmat a jogszabály, nem az akarat határozza meg, a kérelem pedig kötelesség, nem választás","Helyes. Ha nem kérek engedélyt, szankció (bírság, bontási kötelezettség) következik, ezért a kérelem nem szabad akarati döntés."],["Mert az építési engedély magánjogi aktus","Az építési engedély közhatalmi aktus, ezért közjogi a viszony."],["Mert az ügyfél és a hatóság mellérendelt","A közjogi viszonyban alá-fölé rendeltség van."]],1],[1,"C","I. Közjog és alkotmányjog","Hová sorolható a munkajog a jogágak rendszerében?",[["A közjoghoz","A munkajogban a felek szerződése magánjogi elem, ezért nem tisztán közjogi."],["A magánjoghoz","A munkavédelem és a felmondási korlátok közjogias elemek, ezért nem tisztán magánjogi."],["Vegyes jogág: közjogi és magánjogi jellemzőket egyaránt hordoz","Helyes. A felek szerződéses viszonyát közjogias védelmi szabályokkal ötvözi."],["A büntetőjoghoz","A munkajog nem a büntetőjog része."]],2],[1,"C","I. Közjog és alkotmányjog","Mi a büntetőjog helye a jogágak rendszerében?",[["A közjog része, mert az állam büntetőhatalmat gyakorol","Közjogias jellege kétségtelen, mégsem tartozik a közjoghoz."],["A magánjog része, mert a bűncselekmény két ember között történik","A büntetőjog nem magánjog."],["Sem a közjogba, sem a magánjogba nem sorolható: az egész jogrendszer záróköve, az ultima ratio","Helyes. Az a pont, ahol az állam a végső eszközéhez, a büntetőhatalomhoz nyúl, ezért külön kategória."],["Az alkotmányjog alágazata","A büntetőjog önálló jogág."]],2],[1,"C","I. Közjog és alkotmányjog","Hogyan viszonyul egymáshoz az alkotmányjog és a közigazgatási jog?",[["Az alkotmányjog a statikus felépítés (a keret), a közigazgatási jog a tényleges működés","Helyes. Az államszervezet felépítése, a hatalommegosztás alkotmányjogi kérdés; a kormány és az igazgatási ágazatok tényleges működése közigazgatási jogi."],["Az alkotmányjog a magánjog, a közigazgatási jog a közjog része","Mindkettő a közjog része."],["Az alkotmányjog a dinamikus működés, a közigazgatási jog a statikus keret","Fordítva igaz."],["Nincs közöttük különbség, csak elnevezésbeli","Van tartalmi különbség."]],0],[1,"C","I. Közjog és alkotmányjog","Mi a különbség az alkotmány és az alkotmányjog között?",[["Az alkotmányjog szűkebb fogalom, csak az Alaptörvény szövegét jelenti","Fordítva: az alkotmányjog a tágabb fogalom."],["Az alkotmány az alapdokumentum, az alkotmányjog minden olyan norma, gyakorlat és értelmezés összessége, amely az alkotmányt kibontja","Helyes. Ide tartozik a törvények, rendeletek, az AB és a bírói gyakorlat, a nemzetközi fórumok döntései is."],["Az alkotmány a jogtudomány, az alkotmányjog a jogalkotás","Nem erről szól a megkülönböztetés."],["Az alkotmányjog csak az Alkotmánybíróság döntéseit jelenti","Az AB-gyakorlat csak egy eleme az alkotmányjognak."]],1],[1,"T","I. Közjog és alkotmányjog","A gyülekezési jog példája jól mutatja az alkotmány és az alkotmányjog különbségét: az Alaptörvény egyetlen mondatot ad, az alkotmányjog viszont ehhez törvényt, AB-gyakorlatot és strasbourgi gyakorlatot is magában foglal.",true,"Igaz. A VIII. cikk (1) bekezdése egy mondat (mindenkinek joga van a békés gyülekezéshez). Az alkotmányjog része a gyülekezési törvény, az AB gyakorlata (konkuráló gyűlések, spontán és bejelentett gyűlés elhatárolása, tiltási okok) és az EJEB gyakorlata."],[1,"C","I. Közjog és alkotmányjog","Melyik NEM tiszta, hanem vegyes alkotmányjogi norma?",[["Az Országgyűlésre vonatkozó szabályok","Tiszta alkotmányjogi norma: csak az alkotmányjog szabályozza."],["A köztársasági elnökre vonatkozó szabályok","Tiszta alkotmányjogi norma."],["Az ártatlanság vélelme","Helyes. A büntető eljárásjogot is közvetlenül érinti, ezért vegyes norma. Ugyanígy a tulajdonhoz való jog (polgári jog)."],["Az Alkotmánybíróságra vonatkozó szabályok","Tiszta alkotmányjogi norma."]],2],[1,"C","I. Közjog és alkotmányjog","Mit jelent a „láthatatlan alkotmány” koncepciója, és ki fogalmazta meg?",[["Az íratlan angol alkotmányt; Dicey","Dicey az angol alkotmány két pillérét (parlamenti szuverenitás, rule of law) írta le, nem ezt a koncepciót."],["Az alkotmány és a benne foglalt jogok elvi alapjainak koherens rendszere, amely a napi érdekű módosítások fölött is mérce; Sólyom László, az AB első elnöke","Helyes. Párhuzamos véleményében fogalmazta meg; kritikusai szerint túlzott bírói aktivizmushoz vezethet."],["A titkos alkotmányos szokások összességét; Kelsen","Kelsen a norma-hierarchia kapcsán fontos, de nem ez a koncepció."],["A történeti alkotmány elemeit; Werbőczy","Werbőczy a Hármaskönyv szerzője."]],1],[1,"C","I. Közjog és alkotmányjog","Mi a különbség a pozitivista és a normativista módszer között az alkotmányjog-tudományban?",[["A pozitivista a normát nyelvtani értelmezéssel, értéktartalom nélkül vizsgálja; a normativista az értéktartalmat is figyelembe véve vizsgálja, megfelel-e az alkotmányos elveknek","Helyes."],["A pozitivista az értéktartalmat, a normativista csak a nyelvtani szöveget vizsgálja","Fordítva igaz."],["A pozitivista a történeti, a normativista a kartális alkotmányokat vizsgálja","A két módszer nem alkotmánytípusokhoz kötődik."],["Nincs különbség, csak a szerzők nevében","Van érdemi különbség."]],0],[1,"T","I. Közjog és alkotmányjog","A költségvetési jog részletszabályai az alkotmányjog forrásai, mert a költségvetés elfogadása alkotmányos hatáskör.",false,"Hamis. A költségvetés elfogadása alkotmányos hatáskör, de a költségvetési jog részletszabályai a pénzügyi jog területéhez tartoznak. Nem minden, az alkotmányban érintett tárgykör szabálya az alkotmányjog forrása."],[1,"C","I. Közjog és alkotmányjog","Mit jelent, hogy az alkotmányos szokás nem lehet contra legem?",[["Nem mondhat ellent az írott jogszabálynak","Helyes. Az alkotmányos szokás kiegészíthet, de nem írhatja felül a jogszabályt. Klasszikus példa: az Egyesült Királyságban a bizalmát vesztett miniszterelnök lemond, bár írott szabály nincs rá."],["Csak írásban létezhet","A szokás lényege éppen az, hogy gyakorlatból fakad."],["Csak az Alkotmánybíróság állapíthatja meg","Az alkotmányos szokás nem AB-hatáskör."],["Kizárólag nemzetközi szerződésből eredhet","A szokás belső gyakorlat."]],0],[1,"T","I. Közjog és alkotmányjog","Az alkotmányértelmező alkotmánybírósági határozatok Magyarországon erga omnes hatályú, hiteles értelmezésnek minősülnek, a jogtudományi (doktrinális) értelmezések viszont nem kötelezőek.",true,"Igaz. Az AB alkotmányértelmezése mindenkire kötelező (erga omnes), a doktrinális értelmezés csak szakmai vélemény."],[1,"C","II. Az alkotmány","Mit jelent pontosan, hogy a történeti alkotmány „íratlan”?",[["Hogy az elemei sehol nincsenek leírva","Ez a félreértés. Az elemek le vannak írva."],["Hogy az elemei nincsenek egyetlen dokumentumba foglalva","Helyes. Az „íratlan” elnevezés félrevezető."],["Hogy kizárólag szokásjogból áll","Írott törvények (Magna Charta, Habeas Corpus Act) is részei."],["Hogy nem lehet módosítani","Folyamatosan épül, módosítása nem tiltott."]],1],[1,"T","II. Az alkotmány","A történeti alkotmány organikusan épül: a korábbi elemek akkor is az alapot jelentik, ha közvetlenül már nem alkalmazzák őket.",true,"Igaz. A ház-hasonlat: az alap a kész házban nem látszik, de nélküle összeomlana. Az 1215-ös Magna Charta ma már nem alkalmazott, mégis a történeti alkotmány része, és a rá épülő elemek (Habeas Corpus, parlamenti szuverenitás) rajta nyugszanak."],[1,"C","II. Az alkotmány","Az Aranybulla (1222) ellenállási jogának modern továbbélése:",[["A népszavazás","A népszavazás nem az ellenállási jogból ered."],["A petíciós jog","Helyes. Középkori kiváltságból lett modern alapjog."],["A gyülekezési jog","Ez nem az ellenállási jog továbbélése."],["A tulajdonhoz való jog","Nincs közvetlen kapcsolat."]],1],[1,"R","II. Az alkotmány","Angliában nincs alkotmánybíróság.","A parlamenti szuverenitás elve szerint a parlament döntéseit semmilyen szerv nem bírálhatja felül.","A","Igaz: az angol alkotmányos berendezkedésben nincs alkotmánybíróság.","Igaz: a parlamenti szuverenitás a történeti angol alkotmány alapelve.","Ha a parlament szuverén, nincs olyan szerv, amely a törvényhozást kontrollálhatná, ezért nincs alkotmánybíróság: ok-okozati kapcsolat."],[1,"C","II. Az alkotmány","Mi jellemző kizárólag a kartális alkotmányra?",[["Az alkotmányozói pillanat léte","Helyes. Alkotmányozói pillanat (forradalom, rendszerváltás) csak kartális alkotmányozásnál van; a történeti alkotmánynál folyamatos építkezés zajlik."],["Hogy a régi elemek alapul szolgálnak","Ez a történeti alkotmány jellemzője."],["Hogy nincs egyetlen dokumentuma","Ez a történeti alkotmány jellemzője."],["Hogy mindig organikusan változik","Ez a történeti alkotmány jellemzője."]],0],[1,"T","II. Az alkotmány","A kartális alkotmány módosításakor a korábbi szabály kikerül belőle, jogtörténetté válik, és mindig a hatályos állapot az irányadó.",true,"Igaz. Ez a különbség a történeti alkotmánytól, ahol a régi elem alapként megmarad."],[1,"T","II. Az alkotmány","Magyarország 1949-ig történeti, 1949-től kartális alkotmánnyal rendelkezett.",true,"Igaz. Az 1949. évi XX. törvény az első magyar kartális alkotmány, amely a mintegy 950 éves történeti alkotmányossággal szakított."],[1,"C","II. Az alkotmány","Mi a formai értelemben vett merevség kritériuma?",[["A módosításhoz szükséges többség nagysága","Ez a tartalmi merevség kérdése."],["Hogy van-e az alkotmánynak olyan része, amely egyáltalán nem módosítható (örökkévalósági klauzula)","Helyes. Ha van ilyen, merev, ha nincs, rugalmas. Pl. a német alaptörvény: Németország szövetségi köztársaság."],["Hogy írott-e az alkotmány","Az írottság más szempont."],["Hogy hány cikkből áll","A terjedelem nem számít."]],1],[1,"C","II. Az alkotmány","Mi jellemzi a dán, illetve svéd típusú alkotmánymódosítási eljárást?",[["Elegendő a képviselők egyszerű többsége","Ez a legkönnyebb eljárás lenne, nem ez a dán-svéd modell."],["Kétharmaddal elfogadás, a parlament feloszlatása, az új parlament változatlan újra-elfogadása kétharmaddal, majd népszavazás","Helyes. Ez a legnehezebb eljárás, óriási politikai kockázattal: a parlament a saját mandátumát teszi kockára."],["Csak népszavazás, parlament nélkül","A parlament szerepe megmarad."],["Az államfő egyoldalúan módosíthat","Nem ilyen a modell."]],1],[1,"T","II. Az alkotmány","A magyar Alaptörvény módosításához az összes képviselő kétharmadának szavazata kell, ezért az alkotmány a gyakorlatban is mindig merev.",false,"Hamis. Papíron merev, de a gyakorlati rugalmasság a politikai erőviszonyoktól függ: ha tartósan van kétharmados többség, sorra születnek a módosítások. A magyar alkotmány rugalmasságát végső soron a választási rendszer határozza meg."],[1,"R","II. Az alkotmány","Egy alkotmányozásnál az a fő kérdés, hogy a szöveg elfogadottságot nyer-e a társadalom egészében.","Az alkotmányozásnál az a döntő, hogy jogilag megvan-e a szükséges többség.","C","Igaz: a legitimáció, az elfogadottság a kulcskérdés, nem a puszta formális többség.","Hamis: a szükséges többség megléte nem elég; egy alkotmány csak akkor tölti be a szerepét, ha nem egyetlen politikai közösség dokumentumaként tekintenek rá.","Az első állítás igaz, a második hamis."],[1,"C","II. Az alkotmány","Miért problémás az alkotmányozás népszavazással történő megerősítése?",[["Mert a népszavazás jogilag kizárt","Nem kizárt, csak problémás."],["Az igen–nem csapda (a szöveg egy részével egyet lehet érteni, mással nem) és a részvétel kockázata miatt: gyenge eredmény utólag megkérdőjelezi az alkotmányt","Helyes."],["Mert népszavazással nem lehet legitimációt szerezni","Magas részvétel és nagy többség esetén erős legitimációt ad."],["Mert a népszavazás mindig sikertelen","Nem mindig sikertelen."]],1],[1,"C","II. Az alkotmány","Mi a deliberatív (részvételi) alkotmányozás tanulsága a chilei és izlandi kísérlet alapján?",[["Mindkettő sikeres volt, ezért érdemes másolni","Mindkettő kudarccal végződött."],["Gyakorlatilag lehetetlen úgy alkotmányt alkotni, hogy mindenki elmondhassa és érdemben figyelembe is vegyék a véleményét, és az eljárás egyetlen politikai cikluson belül aligha teljesíthető","Helyes."],["Csak a monarchiákban működik","Ilyen megkötés nincs."],["A népszavazás helyettesíti","Nem erről szól."]],1],[1,"T","II. Az alkotmány","A magyar alkotmányozói pillanatok közül az 1994–1998 közötti alkotmányozási folyamat az MSZP–SZDSZ kétharmados többsége ellenére sem zárult le egy cikluson belül, 2010 után viszont eredményes lett.",true,"Igaz. 1994–1998-ban belső viták és szakmai-politikai problémák miatt bukott el, 2010-ben a kétharmados győzelem újabb alkotmányozói pillanatot teremtett, ennek eredménye az Alaptörvény."],[1,"C","III. Alkotmányfejlődési irányok","Dicey szerint az angol alkotmány két alappillére:",[["A parlamenti szuverenitás és a rule of law","Helyes. A parlament korlátlanul alkothat és módosíthat törvényt; a jog uralma mindenkire, a hatalom gyakorlóira is egyformán vonatkozik."],["A hatalommegosztás és az alkotmánybíráskodás","Angliában nincs alkotmánybíráskodás."],["A kartális alkotmány és az örökkévalósági klauzula","Az angol alkotmány történeti."],["A népszavazás és a köztársasági elnök","Nem ezek a pillérek."]],0],[1,"C","III. Alkotmányfejlődési irányok","Melyik alkotmányfejlődési irányhoz tartozik a Roe kontra Wade-példa?",[["Angol (organikus)","Az angol modellre nem ez a példa."],["Amerikai: a szöveg érinthetetlen, a változást a Supreme Court értelmezése hozza","Helyes. Ugyanabból az alkotmányszövegből ellentétes tartalmat vezettek le, ezért mondjuk, hogy az USA alkotmánya a legrugalmasabb."],["Francia (forradalmi)","Nem erre szolgál példaként."],["Német (kompromisszumos)","Nem erre szolgál példaként."]],1],[1,"R","III. Alkotmányfejlődési irányok","Az amerikai alkotmány a világ legrugalmasabb alkotmánya.","A szöveget gyakorlatilag nem lehet megváltoztatni, csak kiegészíteni (amendment), ám a Supreme Court értelmezése változtat a tartalmon.","A","Igaz a tankönyvi állítás szerint: a rugalmasság az értelmezésből fakad.","Igaz: nincs klasszikus értelemben vett módosítás, csak kiegészítés, a tartalmi változás az értelmezésen keresztül zajlik.","A rugalmasságot éppen az értelmezés adja, tehát a második állítás magyarázza az elsőt."],[1,"C","III. Alkotmányfejlődési irányok","Mi a forradalmi (francia típusú) alkotmányozás lényege?",[["Az új hatalom tabula rasát nyom: nincs örökkévalósági klauzula, nincs kötődés a korábbi rendszerhez","Helyes."],["A régi rendszerre építkezik kompromisszumokkal","Ez a német és közép-európai modell."],["A bírói értelmezés által változtatja a tartalmat","Ez az amerikai modell."],["Folyamatos organikus építkezés","Ez az angol modell."]],0],[1,"T","III. Alkotmányfejlődési irányok","Az 1958-as francia alkotmány az V. Köztársaság alkotmánya, de Gaulle nevéhez fűződik, és félprezidenciális rendszert hozott létre.",true,"Igaz. Azóta viszonylagos stabilitás jellemzi a francia alkotmányos berendezkedést."],[1,"C","III. Alkotmányfejlődési irányok","Mi a bonni alaptörvény elnevezésének oka, és mi történt az egyesüléskor?",[["Ideiglenesnek szánták (alkotmánya csak egységes országnak lehet); az egyesüléskor nem alkottak új alkotmányt, hanem kiterjesztették a hatályát a keleti területekre","Helyes."],["Végleges alkotmánynak szánták; az egyesüléskor új alkotmányt fogadtak el","Nem alkottak új alkotmányt."],["Királyság volt, ezért alaptörvény","Nincs köze a királysághoz."],["A weimari alkotmányt vezették vissza","Nem a weimarit élesztették újjá."]],0],[1,"C","III. Alkotmányfejlődési irányok","Mit fejez ki Antall József mondata („tetszettek volna forradalmat csinálni”), és mi volt a közép-európai kompromisszumos átmenet ára?",[["A békés, kompromisszumos átmenetet; ára az elmaradt felelősségre vonás és az, hogy nem derült ki, miként mentette át hatalmát az állampárt","Helyes. Cserébe az addigi hatalom átadta pozícióit, hozzájárult az átmenethez, és a pártállami parlament fogadta el az átmenet alkotmányát."],["A francia típusú tabula rasát; ára a polgárháború","Nem forradalmi, hanem kompromisszumos átmenet volt."],["Az amerikai típusú bírói értelmezést; ára az instabilitás","Nem erről szól."],["Az angol organikus fejlődést; ára a monarchia","Nem erről szól."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik a történeti sorrend helyes?",[["Aranybulla (1222) → Tripartitum (1514) → áprilisi törvények (1848) → kiegyezés (1867)","Helyes."],["Tripartitum → Aranybulla → kiegyezés → áprilisi törvények","Az Aranybulla régebbi, és 1848 megelőzi 1867-et."],["Kiegyezés → Aranybulla → áprilisi törvények → Tripartitum","Nem ez a sorrend."],["Áprilisi törvények → Tripartitum → Aranybulla → kiegyezés","Nem ez a sorrend."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Mi az 1848-as áprilisi törvények legfontosabb vívmánya, amely szerkezetében ma is él?",[["Az első felelős magyar kormány (Batthyány-kormány), az Országgyűlésnek felelős testületi szerv","Helyes. Az Országgyűlésnek felelős kormány modellje él ma is."],["A Szent Korona felsőbbrendűsége","Ez az Aranybullához kötődik."],["A kétkamarás országgyűlés visszaállítása","Nem ez a legfontosabb vívmány."],["A köztársasági államforma","Az 1946. évi I. törvény hozta."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyek voltak a kiegyezés (1867) három közös ügye?",[["Külügy, hadügy, pénzügy (az előző kettő finanszírozására)","Helyes. Minden más (felelős kormányzat, országgyűlés) a két államban egymástól függetlenül működött."],["Külügy, belügy, igazságügy","Nem ezek a közös ügyek."],["Hadügy, oktatás, vám","Nem ezek."],["Pénzügy, igazságügy, belügy","Nem ezek."]],0],[1,"T","IV. Magyar alkotmányfejlődés","Az 1949. évi XX. törvény a szovjet alkotmány mintáját követte, és valódi normatív érvényesülés nélkül pártos politikai dokumentum volt.",true,"Igaz. Elnöki Tanács, tanácsrendszer, az alapjogok (valódi egyesülési jog, sztrájkjog) hiánya jellemezte. Az első magyar kartális alkotmány volt, de nem alkotmányos."],[1,"C","IV. Magyar alkotmányfejlődés","Mit mondott ki először az 1987. évi XI. törvény (jogalkotási törvény)?",[["Hogy a törvények megalkotása az Országgyűlés feladata, szemben az Elnöki Tanács törvényerejű rendeleteivel","Helyes. Addig a valóságban az Elnöki Tanács alkotta a legfontosabb normákat törvényerejű rendeletekben, demokratikus legitimáció nélkül."],["Hogy a köztársaság az államforma","Ez az 1946. évi I. törvény, illetve 1989."],["Az Alkotmánybíróság létrehozását","Ez 1989-hez kötődik."],["A többpártrendszer bevezetését","Nem ez a törvény tartalma."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik törvény melyik jogot szabályozta 1989-ben?",[["1989. évi II. törvény: egyesülési jog; 1989. évi III. törvény: gyülekezési jog","Helyes. Logikai sorrend: előbb létre kell jönni (egyesülés), azután lehet az utcára vonulni (gyülekezés)."],["1989. évi II. törvény: gyülekezési jog; 1989. évi III. törvény: egyesülési jog","Felcserélték (gyakori vizsgahiba)."],["Mindkettő az Alkotmánybíróságról szól","Nem erről szólnak."],["Mindkettő a választójogról szól","Nem erről szólnak."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Kik vettek részt a Nemzeti (háromoldalú) Kerekasztalon?",[["Az Ellenzéki Kerekasztal, az MSZMP, valamint a civil, illetve vállalkozói oldal (érdemi szerep nélkül)","Helyes."],["Csak az MSZMP és a szakszervezetek","Nem csak ők."],["Az Országgyűlés és a Kormány","Nem ők."],["A köztársasági elnök és az AB","Ezek akkor még nem is léteztek."]],0],[1,"R","IV. Magyar alkotmányfejlődés","Az 1989. évi XXXI. törvény a preambulumában ideiglenesnek nevezte magát.","Az átmenet alkotmányát még a pártállami parlament fogadta el, így nem lehetett rá modern demokráciát alapozni.","A","Igaz: az 1949-es alkotmány átfogó módosítása meghagyta az 1949. évi XX. törvény számozását és elnevezését, ugyanakkor ideiglenesnek mondta ki magát.","Igaz: a végleges alkotmányt majd a szabadon választott Országgyűlés alkotja meg.","A pártállami eredet volt az indok, amellyel az ideiglenességet megmagyarázták."],[1,"C","IV. Magyar alkotmányfejlődés","Mi volt az Antall–Tölgyessy-paktum lényege?",[["A köztársasági elnök SZDSZ-es lehet, cserébe az SZDSZ megszavazza az MDF által előterjesztett kétharmados törvényeket","Helyes. A kétharmados törvényekhez ellenzéki szavazatok kellettek."],["Az Alaptörvény elfogadása","A paktum 1990-es."],["A kétkamarás parlament bevezetése","Nem erről szólt."],["Az MSZP–SZDSZ koalíció megalakítása","Az 1994-es koalíció más."]],0],[1,"T","IV. Magyar alkotmányfejlődés","A köztársaság kikiáltására 1989. október 23-án került sor, és a rendszerváltás közjogi csúcspontja az 1989. évi XXXI. törvény volt.",true,"Igaz. Az 1949-es alkotmány olyan átfogó módosítása, hogy egyetlen szakasza sem maradt változatlan; következménye a köztársaság kikiáltása, a választójogi törvény, az Alkotmánybíróságról szóló törvény."],[1,"C","IV. Magyar alkotmányfejlődés","Mikor fogadták el, írták alá és léptek hatályba az Alaptörvény?",[["Elfogadás: 2011. április 18.; aláírás: 2011. április 25.; hatályba: 2012. január 1.","Helyes."],["Elfogadás: 2010. május 2.; hatályba: 2011. január 1.","Nem ezek a dátumok."],["Elfogadás: 2012. január 1.; hatályba: 2011. április 18.","Felcserélt dátumok."],["Elfogadás: 1989. október 23.; hatályba: 1990. május 2.","Ez a rendszerváltás időszaka."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Mi az Alaptörvény ellen a legfőbb megfogalmazott kritika az elfogadásával kapcsolatban?",[["Hogy az ellenzék kivonult a folyamatból, így a kormányoldal egyedül szövegezett és fogadott el, ideológiailag meghatározott tartalommal („nem mindenki alkotmánya”)","Helyes. A kritika logikája visszafelé is működik: ha később a másik oldal alkotmányoz egyedül, ugyanez a hiány terhelné."],["Hogy népszavazással fogadták el","Nem népszavazással fogadták el."],["Hogy túl kevés alapjogot tartalmaz","Az alapjogi katalógus a korábbinál szélesebb."],["Hogy a Nemzeti hitvallás hiányzik belőle","A Nemzeti hitvallás szerepel benne."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik rész melyik számozással szerepel az Alaptörvényben?",[["Alapvetés: betűk (ABC); Szabadság és felelősség: római számok; Az állam: arab számok; Záró rész: pontok","Helyes. Pl. a B) cikk az Alapvetésben, a XXIV. cikk a Szabadság és felelősség fejezetben, a 15. cikk Az állam fejezetben."],["Alapvetés: római számok; Szabadság és felelősség: betűk","Felcserélt."],["Az állam: római számok; Alapvetés: arab számok","Felcserélt."],["Minden rész arab számozású","Nem így van."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Mi az „Alaptörvény” elnevezés legelfogadottabb magyarázata?",[["A német párhuzam: ideiglenes jelleg, a végleges majd „alkotmány” lesz","Ez egy versengő magyarázat, de nem a legelfogadottabb."],["A magalkotmány-koncepció: csak a legalapvetőbb szabályokat tartalmazza, a részleteket sarkalatos törvények bontják ki; az alkotmányosság belső magja","Helyes."],["A külön törvényi formában történő elfogadás","Nem törvényi formában, hanem külön státusszal fogadták el."],["Az uniós tagság","Nincs köze az elnevezéshez."]],1],[1,"C","IV. Magyar alkotmányfejlődés","Miért vitatott a Nemzeti hitvallás jogi kötőereje, és mi a meggyőzőbb álláspont?",[["A meggyőzőbb álláspont: értékvallomás, mert jogi kötőerővel pl. a német megszállás (1944. március 19.) és 1990. május 2. közötti időszak érvénytelensége miatt tarthatatlan következmények lennének","Helyes. Az R) cikk szerint az Alaptörvényt a Nemzeti hitvallással összhangban kell értelmezni, ez egyesek szerint kötőerőt ad neki, de ellenérv a hitvallás tartalma."],["A meggyőzőbb álláspont: teljes jogi kötőerő, ezért érvénytelen a szocializmus alatt kötött minden házasság","Éppen ezt a tarthatatlan következményt hozzák fel ellenérvként."],["A hitvallásnak nincs szövege","Van szövege."],["Az AB a hitvallást kizárta az Alaptörvényből","Nem zárta ki."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Melyik kulcseseményhez kapcsolódik az Alaptörvény negyedik módosítása?",[["Az Átmeneti rendelkezések AB általi megsemmisítése (2012. december), amelyre válaszul az alkotmánymódosítások érdemi felülvizsgálatát kizárták","Helyes. Az AB csak eljárási szempontból vizsgálhatja felül az alkotmánymódosítást."],["Az Alaptörvény elfogadása","Az 2011-es esemény."],["A rendszerváltás","Régebbi esemény."],["A kiegyezés","Régebbi esemény."]],0],[1,"T","IV. Magyar alkotmányfejlődés","A felülalkotmányozás azt jelenti, hogy amit az Alkotmánybíróság alkotmányellenesnek mondott ki, azt az alkotmányozó beemeli az Alaptörvénybe, és ezzel „alkotmányossá” teszi.",true,"Igaz. Az Alaptörvény módosításainak legvitatottabb jellemzője éppen ez: az AB-döntések felülalkotmányozása és az AB hatásköreinek szűkítése."],[1,"C","IV. Magyar alkotmányfejlődés","Mit tartalmaz az Alaptörvény a határon kívül élő magyarságról?",[["A határon kívüli magyarságot a magyar nemzet részének tekinti; eszközei a státusztörvény (2001. évi LXII.), az egyszerűsített kedvezményes honosítás és a lakóhelytől független választójog","Helyes."],["Csak az állampolgárságról szóló szabályt","Ennél több."],["Semmit; ez kizárólag a nemzetközi jog kérdése","Az Alaptörvény rendelkezik róla."],["Csak a kisebbségi önkormányzatokat","Nem csak azt."]],0],[1,"C","IV. Magyar alkotmányfejlődés","Miért nem építették be teljes egészében az EU Alapvető Jogok Kartáját az Alaptörvénybe?",[["A Velencei Bizottság nem javasolta a teljes inkorporációt; a Kartát és az EJEE-t inspirációs forrásként használták","Helyes."],["Mert Magyarország nem EU-tag","Magyarország EU-tag."],["Mert az Alkotmánybíróság megsemmisítette","Nem ez történt."],["Mert az Alaptörvény nem tartalmaz alapjogokat","Tartalmaz alapjogi katalógust."]],0],[2,"C","Alkotmányosság fogalma","Miért nem elég az alkotmányosság megállapításához, hogy az államnak van alkotmánya?",[["Mert alkotmánya Észak-Koreának és más diktatúráknak is van, az alkotmányosság az alapelvek tényleges érvényesülését jelenti","Helyes. Az alkotmányosság az alapelvek gyakorlati működésén múlik, nem az alkotmány létén."],["Mert csak a kartális alkotmány számít","Az alkotmány típusa nem ez a kérdés."],["Mert az alkotmányosság csak az uniós tagoknál értelmezhető","Nincs ilyen megkötés."],["Mert alkotmányos állam csak köztársaság lehet","Az államforma nem kritérium."]],0],[2,"C","Alkotmányosság fogalma","Melyik NEM tartozik az alkotmányosság öt alapelve közé?",[["Demokrácia","Az alkotmányosság öt alapelvének egyike."],["Pluralizmus","Az alkotmányosság öt alapelvének egyike."],["Az államforma köztársasági jellege","Helyes. Az öt alapelv: demokrácia, pluralizmus, jogállamiság, hatalommegosztás, az alapjogok tényleges érvényesülése. Az államforma nem tartozik ide."],["Hatalommegosztás","Az alkotmányosság öt alapelvének egyike."]],2],[2,"T","Pluralizmus","A politikai pluralizmus azt jelenti, hogy demokratikus államban minden pártot működni kell hagyni, céljaitól függetlenül.",false,"Hamis. A szabadság nem korlátlan: a párttörvény követelményeket támaszt (külföldi forrás tilalma, elszámolási kötelezettség, az ÁSZ ellenőrzése, a hatalom kizárólagos megszerzésére irányuló tevékenység tilalma). Párt betiltása a követelmények megsértése esetén önmagában nem sérti a pluralizmust."],[2,"C","Pluralizmus","A magyar párttörvény szerint a pártokra az alábbiak közül mi igaz?",[["Külföldi forrást is elfogadhatnak","Nem fogadhatnak el külföldi forrást."],["Szigorú elszámolási kötelezettség terheli őket, működésüket az Állami Számvevőszék ellenőrzi","Helyes."],["Tevékenységük irányulhat a hatalom kizárólagos megszerzésére","Ez tilos."],["Nem kell elszámolniuk a támogatásaikkal","Szigorú elszámolási kötelezettségük van."]],1],[2,"C","Pluralizmus","Miért nem volt demokratikus a kommunista Magyarország a pluralizmus szempontjából?",[["Mert nem voltak szabad választások, és a választópolgár nem választhatott versengő politikai alternatívák közül","Helyes. A pluralizmus lényege a pártok szabad versenye."],["Mert nem volt parlament","Volt (formális) országgyűlés."],["Mert nem volt írott alkotmány","Volt: az 1949. évi XX. törvény."],["Mert nem volt köztársaság","Az államforma nem a pluralizmus kérdése."]],0],[2,"R","Pluralizmus","A demokrácia mérésénél a választások megtartása önmagában nem elegendő.","A látszatversenyben a valódi kihívást jelentő pártokat a szavazás előtt kizárják, így formálisan van pártverseny, valójában nincs.","A","Igaz: a döntő a verseny valódisága.","Igaz: ez a látszatverseny esete (pl. a mai orosz gyakorlat).","A látszatverseny példa arra, miért nem elég a választások megtartása: a második állítás magyarázza az elsőt."],[2,"C","Világnézeti pluralizmus","Mi a világnézeti pluralizmus lényege és határa?",[["Mindenki abban hisz, amit akar, amíg ezzel másokat vagy önmagát nem veszélyezteti","Helyes. A korlát meghúzása a nehéz kérdés."],["Az állam előírja az egységes világnézetet","Ez a pluralizmus tagadása."],["Csak a vallásos nézetek védettek","Nem csak azok."],["A világnézet gyakorlása korlátlan","A határ a mások veszélyeztetése."]],0],[2,"C","Világnézeti pluralizmus","A kötelező védőoltás példája mit mutat a világnézeti pluralizmus határairól?",[["A meggyőződés (hogy az oltás káros) szabad marad, de a cselekvés (az oltás elmulasztása) korlátozható az állam életvédelmi kötelezettsége miatt","Helyes. Az oltás elmulasztása rontja a nyájimmunitást, mások egészségét veszélyezteti; végső soron kényszeroltás alkalmazható."],["A lelkiismereti szabadság kiterjed az oltás megtagadására is","A döntési szabadságot az állam nem biztosítja."],["Az állam nem avatkozhat be az egészségügybe","Az életvédelmi kötelezettség alapján beavatkozhat."],["Az oltás mindig önkéntes","A példa éppen a kötelező oltásról szól."]],0],[2,"T","Világnézeti pluralizmus","A romániai kanyarójárvány a példa arra, hogy az oltatlanság mások egészségét is veszélyezteti.",true,"Igaz. A kanyaró elleni oltás nem volt kötelező, sokan nem oltatták be gyermeküket, és járvány tört ki olyan betegségből, amelyet a térség korábban gyakorlatilag felszámolt."],[2,"C","Demokrácia","Ki dolgozta ki elsőként a szuverén fogalmát, és milyen értelemben?",[["Jean Bodin; még az uralkodó legitimációjának megalapozására: a király hatalma Istentől ered","Helyes. A koronázási olajozás ennek a szertartási lenyomata."],["Rousseau; a nép szuverenitására","Rousseau a gondolatot megfordította, de nem ő dolgozta ki elsőként."],["Montesquieu; a hatalommegosztásra","Montesquieu a hatalommegosztás teoretikusa."],["Locke; az uralkodó hatalmára","Locke a nép felől közelített."]],0],[2,"R","Demokrácia","A demokratikus államban a hatalom nem Istentől, hanem a néptől ered.","Locke, Hobbes és Rousseau a szuverenitás gondolatát megfordította, és a társadalmi szerződés eszméjére építette.","A","Igaz: a népszuverenitás a demokrácia alapja.","Igaz: a korábbi, isteni eredetű (Bodin-féle) felfogást ők fordították meg.","A második állítás magyarázza az elsőt: a társadalmi szerződés elmélete teremtette meg a népszuverenitás gondolatát. (A francia Emberi és Polgári Jogok Nyilatkozata és az amerikai függetlenségi nyilatkozat is ezt tükrözi.)"],[2,"C","Demokrácia","Mi a demokratikus legitimáció lényege?",[["Minden közhatalmat gyakorló személy vagy szerv hatalma megszakítatlan láncolaton át visszavezethető a népre","Helyes."],["Elegendő, hogy a hatalomgyakorló az államtól kapja a felhatalmazását","A lényeg a lánc megszakítatlansága, végül a népig."],["Csak a közvetlenül választott tisztviselők legitimek","Közvetett láncolat is lehet legitim (pl. a rendőr)."],["A legitimációt a bíróság adja","A legitimáció forrása a nép."]],0],[2,"C","Demokrácia","Mi a helyes legitimációs lánc az igazoltató rendőr esetében?",[["Nép → Országgyűlés → köztársasági elnök és miniszterelnök → (a miniszterelnök javaslatára kinevezett) belügyminiszter → országos rendőrfőkapitány → intézkedő rendőr","Helyes. A lánc megszakítatlan, ezért a közhatalom-gyakorlás legitim."],["Nép → köztársasági elnök → rendőrfőkapitány → rendőr","Kimarad az Országgyűlés és a kormány."],["Nép → bíróság → rendőr","A bíróság nem része a láncnak."],["Nép → polgármester → rendőr","Az országos rendőrség nem a polgármestertől függ."]],0],[2,"T","Demokrácia","A kommunista időszakban a legitimációs láncolat azért szakadt meg, mert a valódi hatalmat a Népköztársaság Elnöki Tanácsa gyakorolta, amelyet nem a nép választott.",true,"Igaz. Ez önmagában kizárja, hogy demokráciáról beszéljünk."],[2,"C","Jogállam","Melyik fogalommal ragadható meg legjobban a jogállamiság lényege?",[["Kiszámíthatóság","Helyes. A rule of law a jog uralmát jelenti; a hatalomgyakorlás a jogszabályok által meghatározott rendben zajlik."],["Sebesség","A jogállamiság nem a gyorsaságról szól."],["Szigor","A jogállamiság nem a szigorúságról szól."],["Egyszerűség","A jogállamiság nem az egyszerűségről szól."]],0],[2,"C","Jogállam","Az AB 1990-es évekbeli meghatározása szerint mikor érvényesül a jogbiztonság?",[["Ha a normák mindenki számára megismerhetők, érthetők, és megfelelő idő áll rendelkezésre a felkészülésre és az alkalmazkodásra","Helyes."],["Ha a normák csak a jogászok számára érthetők","Mindenki számára érthetőnek kell lenniük."],["Ha a jogszabályok visszamenőleg is hatályosak","A visszamenőleges hatály sérti a jogbiztonságot."],["Ha a bíróság dönt minden kérdésben","Ez nem a jogbiztonság meghatározása."]],0],[2,"T","Jogállam","A tisztességes eljáráshoz való jog az eljárási jogbiztonság, amelynek hatósági és bírósági ága is van.",true,"Igaz. Az eljárásokban tudnom kell a jogaimat, kötelezettségeimet, hogyan születik döntés, és milyen jogorvoslat áll rendelkezésre."],[2,"C","Jogállam","Melyik eset sérti a jogállamiság kiszámíthatósági követelményét?",[["Az állam a futamidő végéig garantált kamattámogatást utólag megszünteti","Helyes. A szerződéskötéskor mást ígértek, a jogviszony kiszámíthatatlanná válik."],["Az öt évre garantált kamatot az állam ötévente felülvizsgálja, és felül is vizsgálja","A felülvizsgálat lehetősége eleve a konstrukció része volt, számítani lehetett rá."],["A lakás-előtakarékossági támogatást csak az új szerződésekre szüntetik meg","A fennálló jogviszonyokat nem érinti."],["Új adónem bevezetése megfelelő felkészülési idővel, a jövőre nézve","Megfelelő felkészülési idő esetén nem sérti a jogbiztonságot."]],0],[2,"T","Jogállam","A kiszámíthatóság sérelme attól függ, hogy a változtatás kellemetlen-e az érintettnek.",false,"Hamis. A döntő az, hogy az érintett számíthatott-e a változtatásra. Ha a módosítás lehetősége eleve be volt építve a jogviszonyba, a kiszámíthatóság nem sérül."],[2,"T","Jogállam","A hivatalban lévő köztársasági elnök alaptörvény-módosítással való eltávolítása szembemegy a kiszámíthatóság követelményével.",true,"Igaz. A tankönyvi eset: az ilyen beavatkozás a jogállamiság ellen hat."],[2,"C","Jogállam","Mit mond ki a Sólyom-tétel („a jogállamot nem lehet a jogállam ellenében megvalósítani”)?",[["A jogállamot nem jogállami eszközökkel nem lehet helyreállítani; ha a helyreállítás sem jogállami, a végeredmény sem lesz az","Helyes. Sólyom László az igazságtételi törvényt megsemmisítő döntéshez fűzött párhuzamos indokolásában fogalmazta meg."],["A jogállamot csak forradalommal lehet megteremteni","Éppen ellenkezőleg."],["A jogállam ellen bármit meg lehet tenni, ha az igazságos","Ez a tétel tagadása."],["A jogállam csak az EU-ban létezik","Nincs köze az EU-hoz."]],0],[2,"C","Jogállam","Melyik példa illusztrálja, hogy a jogbiztonság és az igazságosság ütközhet, és ütközés esetén a jogbiztonságnak van elsőbbsége?",[["A 98%-os különadó, amelyet az AB megsemmisített, és a visszamenőleges el nem évülés kérdése","Helyes. Az igazságérzet kielégítése nem elsődleges, ha az a jogbiztonság rovására megy."],["A népszavazás kiírása","Nincs köze a témához."],["Az Országgyűlés feloszlatása","Nincs köze a témához."],["Az országgyűlési választás lebonyolítása","Nincs köze a témához."]],0],[2,"R","Jogállam","A 98%-os különadó törvényt az Alkotmánybíróság megsemmisítette.","A korábbi munkajogi szabályozás szerint a kifizetések jogszerűek voltak, a visszamenőleges megadóztatás pedig a jogbiztonságot sértette, noha az igazságérzetnek megfelelt.","A","Igaz.","Igaz: nem írt elő minimális időtartamot, a kifizetések jogszerűek voltak.","A megsemmisítés oka éppen a jogbiztonság sérelme volt; az igazságérzet nem elég."],[2,"C","Jogállam","Mit tartalmaz a kényszervallatás tankönyvi esete a jogállamiság szempontjából?",[["A kislány megtalálása érdekében sem fér bele a kínzás, mert a jogbiztonság ára éppen az, hogy a jog tiltja a kényszervallatást; a dilemma feloldhatatlan","Helyes."],["A kínzás ilyen esetben megengedett","A jogállam a kínzást alapkövetelményként tiltja."],["Az igazságosság mindig felülírja a jogbiztonságot","Ütközéskor a jogbiztonságnak van elsőbbsége."],["A bíróság dönthet a kínzásról","Ilyen bírói hatáskör nincs."]],0],[2,"C","Jogállam","Mit jelent a jogállamiság fogalmának „eróziója”?",[["A fogalom gumiszabállyá vált, gyűjtőfogalommá (különösen az EU-gyakorlatban), és emiatt hitelét veszti","Helyes. A lengyel példa a kettős mércére: kormányváltás után tartalmi változtatás nélkül feloldották a forrásokat."],["A jogállamiság megszűnt az EU-ban","Nem erről van szó."],["A jogállamiság szigorúbbá vált","Éppen ellenkezőleg: elvesztette az élét."],["A jogállamiságot kizárólag az AB alkalmazza","Nem erről szól."]],0],[2,"C","Jogállam","A „kormányváltás – rezsimváltás – rendszerváltozás” hármas esetében mit cserélünk le?",[["Kormányváltás: a játékosokat; rezsimváltás: a játékszabályokat; rendszerváltozás: magát a játékot","Helyes. A kétharmados felhatalmazás joggal ad lehetőséget a játékszabályok átírására, de a játék (demokrácia) maga ne változzon."],["Kormányváltás: a játékot; rezsimváltás: a játékosokat","Felcserélt."],["Mindhárom ugyanazt jelenti","Három különböző mértékű változás."],["Rendszerváltozás: a játékosokat","A játékosok cseréje a kormányváltás."]],0],[2,"C","Hatalommegosztás","Mi jellemző a klasszikus amerikai (checks and balances) hatalommegosztásra?",[["A hatalmi ágak teljesen függetlenek egymástól, de lehetőségük van a másik kontrollálására és ellensúlyozására (elefántcsonttorony-kép)","Helyes."],["A kormány a parlament bizalmából létezik","Ez a magyar/európai parlamentáris modell jellemzője."],["A törvényhozás és a végrehajtás szoros összefonódása","Az amerikai rendszerben ez a kapcsolat hiányzik."],["Egyetlen hatalmi ág sem ellenőrizheti a másikat","Éppen az ellenőrzés a lényeg."]],0],[2,"C","Hatalommegosztás","Mi a modern, európai értelemben vett hatalommegosztás lényege a libikóka-hasonlat szerint?",[["Az egymás ellensúlyozására képes hatalmi ágak és tényezők egyensúlyi állapota, akkor is, ha egyik szereplő kiemelkedően fajsúlyos","Helyes. Nem elválasztás, hanem egyensúlyozás."],["A három hatalmi ág szigorú elválasztása","Ez a klasszikus amerikai logika."],["Az egyik hatalmi ág alávetése a másiknak","Ez nem hatalommegosztás."],["A hatalmi ágak teljes összeolvadása","Ez nem hatalommegosztás."]],0],[2,"R","Hatalommegosztás","A magyar rendszerben a kormány a legfőbb törvénykezdeményező, ezért a miniszterelnök szava a döntő.","A magyar államszervezetben a végrehajtó hatalom kiemelkedően erős, mögötte parlamenti többség áll.","A","Igaz: a kormány a fő törvénykezdeményező.","Igaz: a kormány a jogalkotásban és a közigazgatásban meghatározó.","A kiemelkedően erős végrehajtó hatalom és a mögötte álló többség magyarázza a miniszterelnök döntő szerepét."],[2,"C","Hatalommegosztás","Mely szereplők alkotják Magyarországon az erős végrehajtó hatalom ellensúlyát?",[["A törvényhozás ellenőrző jogkörei (interpelláció, kérdés, bizalmatlansági indítvány), az ombudsman, az ügyészség, az Alkotmánybíróság és a bíróságok","Helyes."],["Kizárólag a köztársasági elnök","Nem csak ő."],["Csak a sajtó","A tankönyv a jogi/intézményi ellensúlyokat sorolja."],["A helyi önkormányzatok kizárólag","Nem ez a felsorolás."]],0],[2,"T","Hatalommegosztás","Ha a magyar berendezkedést a checks and balances logikájával írjuk le, hibás választ adunk, mert nálunk nem elválasztás, hanem egyensúlyozás van, egy eleve erősebb szereplő mellett.",true,"Igaz. A törvényhozás és végrehajtás között szoros összefonódás van: az Országgyűlés választja és mozdíthatja el a miniszterelnököt, a kormány pedig a parlament bizalmából létezik."],[2,"C","Alapjogok","Mit jelent az alkotmányosság ötödik alapelve, az alapjogok tényleges érvényesülése?",[["Nem elég az alapjogok felsorolása, az is kell, hogy ténylegesen gyakorolhatók legyenek","Helyes. A kommunista alkotmány is felsorolta az alapjogokat (pl. vallásszabadság), de a gyakorlás hátránnyal járt."],["Elég, ha az alapjogok az alkotmányban szerepelnek","Ezt a példa éppen cáfolja."],["Csak a politikai jogokra vonatkozik","Nem csak azokra."],["Az alapjogok korlátozhatatlanok","Az alapjogok korlátozhatók, de a tényleges gyakorolhatóság a mérce."]],0],[3,"C","Államforma","Mire ad választ az államforma, és mi a monarchia és a köztársaság közötti elsődleges különbség Max Weber szerint?",[["Az államfői hatalom eredetére; a különbség elsősorban legitimációs","Helyes. A monarchia legitimációja a tradíció és a trónöröklés, a köztársaságé a választás (racionális-jogi legitimáció)."],["A végrehajtó hatalom felelősségére; a különbség elsősorban szervezeti","Ez a kormányforma kérdése."],["A szuverenitás megosztására; a különbség területi","Ez az államszerkezet kérdése."],["A választójogra; a különbség eljárási","Nem erről szól az államforma."]],0],[3,"T","Államforma","A monarchiában a megbízatás élethosszig tart, és az uralkodó kevésbé van kitéve a napi politikának, mint a köztársasági elnök.",true,"Igaz. A köztársasági elnök megbízatása meghatározott időre szól (újraválasztható), és a pártok támogatására szorul."],[3,"T","Államforma","A modern monarchiában a szuverenitás letéteményese a monarcha, nem a nép.",false,"Hamis. A modern államiságban a monarchia sem a monarcha korlátlan szuverenitásán alapul: hatásköre alkotmányosan körülhatárolt, a szuverenitás letéteményese – csakúgy, mint a köztársaságban – a nép."],[3,"C","Államforma","Melyik ország NEM monarchia az alábbiak közül?",[["Hollandia","Monarchia."],["Spanyolország","Monarchia."],["Németország","Helyes. Németország szövetségi köztársaság."],["Dánia","Monarchia."]],2],[3,"C","Kormányforma","Mire ad választ a kormányforma?",[["Arra, hogy a törvényhozás és a végrehajtás milyen viszonyban áll egymással (viseli-e a végrehajtás felelősséget a törvényhozás előtt, és ki gyakorolja a végrehajtó hatalmat)","Helyes. A kormányforma az államszervezet dinamikája."],["Arra, hogy az államfői hatalom honnan ered","Ez az államforma."],["Arra, hogy osztott-e a szuverenitás","Ez az államszerkezet."],["Arra, hogy hány pártja van az országnak","Nincs köze."]],0],[3,"C","Kormányforma","Mi a különbség a politikai és a jogi felelősség között?",[["Politikai: a kormány a parlament bizalmán múlva marad hivatalban, indokolás és bizonyítás nélkül megvonható; jogi: jogszabálysértés esetén, csak bizonyított törvénysértésnél vonható le a szankció","Helyes."],["Politikai: bizonyított jogsértéshez kötött; jogi: bizalomhoz kötött","Felcserélt."],["Mindkettő bizonyítást igényel","A politikai felelősséghez nem kell bizonyítás."],["Mindkettő indokolás nélkül megvonható","A jogi felelősséghez bizonyított törvénysértés kell."]],0],[3,"C","Kormányforma","Melyik a négy klasszikus kormányforma helyes felsorolása?",[["Prezidenciális, parlamentáris, félprezidenciális, kollegiális","Helyes."],["Prezidenciális, monarchikus, föderális, kollegiális","A monarchia és a föderáció nem kormányforma."],["Parlamentáris, unitárius, regionális, kollegiális","Az unitárius és a regionális államszerkezet."],["Prezidenciális, parlamentáris, konföderális, direktoriális","Nem ez a négy."]],0],[3,"C","Kormányforma","Mi jellemzi a prezidenciális kormányformát?",[["A végrehajtó hatalmat az elnök gyakorolja monokratikusan, nem felel politikailag a törvényhozásnak, csak jogilag; az elnök és a törvényhozás is közvetlenül a néptől nyeri megbízatását (kettős legitimáció)","Helyes. Klasszikus példa: USA, „tiszta” hatalommegosztás."],["A kormány politikailag felel a parlamentnek, és az el is mozdíthatja","Ez a parlamentáris."],["A végrehajtó testület összetétele a parlamenti erőviszonyokat tükrözi","Ez a kollegiális."],["Az elnököt a parlament választja, és a kormány az elnöknek felel","Nem ez a prezidenciális modell."]],0],[3,"R","Kormányforma","A parlamentáris kormányformában a kormány a parlament bizalmából létezik.","A kormány politikai felelősséggel tartozik a parlamentnek, amely bizalmatlansági indítvánnyal el is mozdíthatja.","A","Igaz.","Igaz.","A politikai felelősség és az elmozdíthatóság éppen azt jelenti, hogy a kormány a parlament bizalmából működik."],[3,"C","Kormányforma","Hogyan jellemzik a parlamentáris kormányformát, amelybe Nagy-Britannia, Németország és Magyarország is tartozik?",[["Erős parlament, közepesen erős kormány, gyenge köztársasági elnök","Helyes."],["Gyenge parlament, erős elnök","Ez nem a parlamentáris képlet."],["Erős elnök, gyenge kormány","A prezidenciális/félprezidenciális modellre hasonlít."],["Egyenlően erős hatalmi ágak, mint az USA-ban","Az USA a prezidenciális modell."]],0],[3,"C","Kormányforma","Mi a kancellárelv, és melyik határozatban fogalmazta meg az AB?",[["A kormányzati felelősség végső soron a miniszterelnök személyén át érvényesül, ez alapozza meg, hogy a miniszterelnök határozza meg a Kormány politikájának általános irányát; 122/2009. (XII. 17.) AB határozat","Helyes."],["A kancellár vétójoga a törvényekkel szemben","Nem erről szól."],["A kormány kinevezi a bírákat","Nem ez a kancellárelv."],["A miniszterelnököt közvetlenül választják","Magyarországon nem így van."]],0],[3,"C","Kormányforma","Mi jellemzi a félprezidenciális kormányformát?",[["Kétpólusú végrehajtó hatalom: közvetlenül választott elnök mellett a parlamentnek felelős kormány; az elnök nem felel a parlamentnek; „kettős vezetés”, esetenként cohabitation (Franciaország, V. Köztársaság, 1958)","Helyes."],["Egyetlen személy gyakorolja a végrehajtó hatalmat, a parlamentnek nem felel","Ez a prezidenciális."],["A testület nem felel politikailag a parlamentnek","Ez a kollegiális."],["A monarcha irányítja a kormányt","Nem ez a félprezidenciális."]],0],[3,"T","Kormányforma","A politikai társbérlet (cohabitation) akkor áll elő, amikor a közvetlenül választott elnök és a kormányfő eltérő politikai oldalhoz tartozik.",true,"Igaz. A félprezidenciális modell „kettős vezetése” járhat ezzel."],[3,"C","Kormányforma","Mi jellemzi a kollegiális kormányformát, és melyik a tiszta példa?",[["A végrehajtó testület összetétele a parlamenti erőviszonyokat tükrözi, a kisebbségi pártok is részt vesznek, nem felel politikailag a parlamentnek; svájci Szövetségi Tanács","Helyes."],["Az elnök egyszemélyi vezetése; USA","Az USA prezidenciális."],["A kormány bizalmatlansági indítvánnyal elmozdítható; Magyarország","Ez a parlamentáris."],["A kormányt a király nevezi ki; Spanyolország","Ez nem a kollegiális modell."]],0],[3,"C","Államszerkezet","Mi az államszerkezet szempontjából az unitárius állam lényege?",[["A szuverenitás osztatlan: kizárólag az államnak van szuverenitása, a kisebb egységek csak közigazgatási egységek, nincs önálló döntési joguk, nem szakadhatnak ki","Helyes. Magyarország is ide tartozik."],["A szuverenitás az állam és a tagállamok között megoszlik","Ez a föderáció."],["A régióknak saját alkotmányuk van","Ez a föderáció."],["Az államot nemzetközi szerződés hozta létre","Ez nem az unitárius állam jellemzője."]],0],[3,"C","Államszerkezet","Mi a különbség a centralizált és a decentralizált unitárius állam között?",[["Centralizáltban az állami feladatokat a központ egységesen szervezi (Magyarország); decentralizáltban egyes feladatokat az állam független, decentralizált egységekre bíz (Franciaország)","Helyes."],["Centralizáltban osztott a szuverenitás","Mindkét esetben osztatlan."],["Decentralizáltban az egységek saját állammá válhatnak","A decentralizáció nem szuverenitás."],["Nincs különbség","Van."]],0],[3,"T","Államszerkezet","A decentralizált unitárius állam helyi testületeinek hatásköre eredeti, és a központ nem vonhatja el.",false,"Hamis. A decentralizált unitárius államban a hatáskör a központi jogalkotótól származtatott, a központ bármikor elvonhatja vagy módosíthatja. A föderáció tagállamának vannak saját, le nem vezetett eredeti hatáskörei."],[3,"C","Államszerkezet","Mit jelent a szubszidiaritás?",[["A feladatellátás szintjét két szempont metszetében kell meghatározni: hol oldható meg leghatékonyabban, és hol van a legközelebb a problémához","Helyes. Példa: a kiömlött patak gátjának megépítése helyben."],["A feladatokat mindig a központ látja el","Ez az ellentéte."],["A tagállamok szuverenitását","Nem erről szól."],["A bíróságok függetlenségét","Nem erről szól."]],0],[3,"C","Államszerkezet","Mi a dekoncentráció?",[["A központilag ellátott feladat vertikális tagolása országos, területi és helyi szintre; a feladat központi marad, a végrehajtás több szinten szerveződik","Helyes. Példa a rendőrség: ORFK, vármegyei és fővárosi, városi kapitányságok, rendőrőrsök."],["A szuverenitás megosztása a tagállamokkal","Ez a föderáció."],["Az önkormányzatok önálló döntési joga","Ez a decentralizáció/szubszidiaritás kapcsolódik."],["A hatáskörök központosítása","Ez az ellentéte."]],0],[3,"R","Államszerkezet","A magyar helyi önkormányzatok létezése nem teszi decentralizálttá a magyar államot.","A központi feladatellátás a centralizált államban továbbra is a központban dől el.","A","Igaz: a szubszidiaritás miatt decentralizált egységek centralizált államban is létrejöhetnek.","Igaz.","A feladatellátás súlypontja a központban marad, ezért az önkormányzatok léte nem teszi decentralizálttá az államot."],[3,"C","Államszerkezet","Mi a föderatív állam fő jellemzője?",[["A szuverenitás osztott: a szövetségi államnak és a tagállamoknak is van önálló szuverenitása, a tagállamnak saját kormánya, törvényhozása és alkotmánya is lehet","Helyes."],["A szuverenitás osztatlan","Ez az unitárius és regionális állam."],["A tagállamok nem rendelkezhetnek saját alkotmánnyal","Rendelkezhetnek."],["Az állam nemzetközi szerződéssel jött létre, államiság nélkül","Ez a konföderáció."]],0],[3,"C","Államszerkezet","Mi a különbség az egyesítő és a szétválasztó föderáció között?",[["A keletkezés iránya: egyesítőnél a szuverén tagállamok hoznak létre közös államot (USA, Németország), szétválasztónál a közös állam ad át szuverenitást a kisebb egységeknek (Belgium); a működésben nincs különbség","Helyes."],["A működésükben alapvetően különböznek","A működés azonos."],["Az egyesítő nem föderáció","Az is föderáció."],["A szétválasztónál osztatlan a szuverenitás","Osztott."]],0],[3,"T","Államszerkezet","Elméletileg a föderáció tagállama kiléphetne a szövetségből, mert van szuverenitása; az amerikai alkotmány a gyakorlatban kifejezetten tiltja a kilépést.",true,"Igaz. Szuverenitási szempontból a lehetőség elvi szinten fennállna – ez különbözteti meg a föderációt a regionális államtól –, a gyakorlatban azonban a kilépés tilalma rögzített."],[3,"C","Államszerkezet","Mi a regionális állam?",[["Az unitárius és a föderatív állam közötti köztes megoldás: osztatlan szuverenitás, de a régióknak jelentős mozgásterük (saját kormány, esetleg törvényhozás) van, saját alkotmányuk nincs","Helyes. A mozgástér autonómián alapul, nem szuverenitáson."],["A szuverenitás osztott, a régióknak saját alkotmánya van","Ez a föderáció."],["A szuverenitás osztatlan, a régiók csak közigazgatási egységek","Ez az unitárius állam."],["Az EU tagállamainak szövetsége","Az EU nem állam."]],0],[3,"C","Államszerkezet","Mi az autonómia?",[["A központi, egyetlen szuverén hatalom által biztosított önrendelkezési jog az adott közösséget érintő kérdésekben; terjedelmét és fennállását a központi hatalom határozza meg","Helyes."],["A tagállam eredeti szuverenitása","Ez a föderáció sajátja."],["A kilépési jog","Autonómia nem foglalja magában a kiválást."],["A nemzetközi szervezet hatásköre","Nem ez a fogalom."]],0],[3,"C","Államszerkezet","Mit mutat a katalán függetlenségi népszavazás esete?",[["Hogy szuverenitás nélkül a mozgástér csak addig terjed, ameddig a központ engedi; a népszavazáshoz a központi kormányzat hozzájárulása kellene","Helyes. A katalán elnök ellen elfogatóparancsot adtak ki."],["Hogy a régió szuverén állam","Katalónia nem szuverén."],["Hogy a regionális államban a régió kiléphet","Nem léphet ki a központ hozzájárulása nélkül."],["Hogy az EU szuverenitást oszt meg","Nem erről szól."]],0],[3,"C","Államszerkezet","Melyik állítás igaz Magyarországra, Spanyolországra és az USA-ra?",[["Magyarország unitárius, Spanyolország regionális, az USA föderatív","Helyes."],["Magyarország föderatív, az USA unitárius","Fordítva igaz."],["Spanyolország föderatív, Magyarország regionális","Nem így van."],["Mindhárom unitárius","Nem mindhárom."]],0],[3,"C","Államszerkezet","Mi volt az Osztrák–Magyar Monarchia 1867–1918 között államszerkezeti szempontból?",[["Reálunió: közös államfő mellett közösen ellátott ügyek (külügy, hadügy)","Helyes."],["Perszonálunió: csak a közös uralkodó köti össze","A közös ügyek miatt reálunió."],["Konföderáció","A konföderáció nemzetközi szerződésen alapuló társulás."],["Unitárius állam","Két külön állam volt."]],0],[3,"R","Európai Unió","Az Európai Unió nem értelmezhető a klasszikus államszerkezeti felosztás (unitárius, regionális, föderatív) keretében.","Az EU nem állam, hanem nemzetközi szerződéssel létrehozott szupranacionális nemzetközi szervezet.","A","Igaz: aki az Uniót föderatív vagy regionális államnak sorolja, fogalmi hibát követ el.","Igaz.","Mivel az EU nem állam, az államszerkezeti kategóriák nem alkalmazhatók rá."],[3,"C","Európai Unió","Mi a kulcstétel az Unió és a szuverenitás viszonyáról?",[["Nem szuverenitásmegosztásról, hanem hatáskörmegosztásról van szó: az Unió nem önálló szuverenitása miatt dönt egyes kérdésekben, hanem mert a tagállamok úgy határoztak","Helyes. Pl. a közös vámpolitika."],["Az Unió szuverén állam","Az Unió nem állam."],["A tagállamok teljesen lemondtak szuverenitásukról","Nem."],["Az Unió és a tagállamok szuverenitása osztott, mint egy föderációban","Nem szuverenitás-, hanem hatáskörmegosztás van."]],0],[4,"C","I. Szuverenitás","Mit jelent alkotmányos értelemben a szuverenitás?",[["Népszuverenitást (a népre visszavezethető hatalom) és államszuverenitást (az állam önálló döntéshozatali képessége)","Helyes."],["Csak a népszuverenitást","Az államszuverenitás is a fogalom része."],["Csak az államszuverenitást","A népszuverenitás is a fogalom része."],["A bírói függetlenséget és a hatalommegosztást","Nem ezt jelenti."]],0],[4,"C","I. Szuverenitás","Mi a jellineki triász?",[["Az állam három ismérve: terület, népesség, főhatalom; ha bármelyik hiányzik, nem beszélhetünk államról","Helyes. Jellinek az államszuverenitás tanához kapcsolódik."],["A hatalommegosztás három ága","Ez Montesquieu nevéhez fűződik."],["A demokrácia három feltétele","Nem ez a triász."],["Az államforma három típusa","Nem ez a triász."]],0],[4,"C","I. Szuverenitás","A jellineki triász mely eleme hiányzik Palesztina és a kurdok esetében?",[["Palesztinánál a terület, a kurdoknál szintén a saját terület (van népesség és vezetés, de nincs saját terület)","Helyes. Palesztinának van kormányzata és népessége, de nincs olyan területe, amelyen az államiság ténylegesen megvalósulhatna."],["Palesztinánál a népesség, a kurdoknál a főhatalom","Palesztinának van népessége."],["Mindkettőnél a főhatalom","A kurdoknál van szervezett vezetés."],["Egyiknél sem hiányzik elem","Mindkettőnél a terület hiányzik."]],0],[4,"R","I. Szuverenitás","A jellineki triász szükséges, de nem mindig elégséges feltétele az államiságnak.","Koszovónak elvileg van területe, népessége és főhatalma, nemzetközi elismertsége mégis számos országban vitatott.","A","Igaz: a gyakorlatban a nemzetközi elismerés negyedik, íratlan feltételként szerepel.","Igaz: az alkotmánya nemzetközi szerződés melléklete, a rendet békefenntartók biztosítják.","A koszovói példa azt mutatja, hogy a triász teljesülése mellett is hiányozhat valami: a nemzetközi elismerés."],[4,"C","I. Szuverenitás","Mi az államszuverenitás önkorlátozásának tétele?",[["Az állam szuverenitását csak és kizárólag saját maga korlátozhatja","Helyes. A nemzetközi szerződéshez csatlakozás ezért nem szuverenitássértés."],["Az állam szuverenitását bármely másik állam korlátozhatja","Ha kívülről, más állam akaratából korlátozzák, a szuverenitás megszűnik."],["A szuverenitás korlátozhatatlan","Önkorlátozás lehetséges."],["A szuverenitást csak a nép korlátozhatja","Az állam maga korlátozza."]],0],[4,"T","I. Szuverenitás","Ha egy ország csatlakozik az Emberi Jogok Európai Egyezményéhez, és a strasbourgi bíróság kártérítésre kötelezi, ez sérti az állam szuverenitását.",false,"Hamis. Az állam maga tette lehetővé: aláírta a szerződést, belépett a szervezetbe, és ezzel maga korlátozta a szuverenitását. A szuverenitás akkor szűnik meg, ha a korlátozás kívülről, más állam akaratából érkezik."],[4,"C","I. Szuverenitás","Melyek a szuverenitás hagyományos állami jelképei Magyarországon?",[["A Himnusz, a zászló és a címer; az Alaptörvény rögzíti, sarkalatos törvény szabályozza a használatukat, büntetőjogi védelem övezi","Helyes. A nemzeti jelkép meggyalázása bűncselekmény."],["A Szent Korona és a koronázási palást","Az Alaptörvény nem ezeket sorolja."],["A Himnusz és a Szózat","Nem ez a felsorolás."],["Csak a zászló","Három jelkép van."]],0],[4,"C","II. Államterület","Hol húzódik a határ hajózható, illetve nem hajózható folyó esetén?",[["Hajózható folyón a sodorvonalon (nem feltétlenül a meder közepén), nem hajózhatón a folyó közepén","Helyes. A hajózhatóság a döntő szempont."],["Hajózhatón a folyó közepén, nem hajózhatón a sodorvonalon","Felcserélt."],["Mindkettőnél a part vonalán","Nem ez a szabály."],["Mindkettőnél a sodorvonalon","A nem hajózhatónál a folyó közepe."]],0],[4,"T","II. Államterület","A sodorvonal mindig azonos a meder felezővonalával.",false,"Hamis. A természetes sodorvonal nem feltétlenül a meder közepén húzódik. Ez a vizsgán gyakori tévedés."],[4,"C","II. Államterület","Mi a Kármán-vonal?",[["A világűr kezdete 100 km magasságban, az államterület légterének felső határa; Kármán Tódor nevéhez fűződik","Helyes. A világűrben és az égitesteken egyetlen államnak sincs területe."],["Az állam tengeri határa","Nem erről van szó."],["A földalatti terület határa","Nem erről van szó."],["A schengeni övezet határa","Nem erről van szó."]],0],[4,"C","II. Államterület","Mi az államterület „földalatti” része a tankönyv szerint?",[["Az a rész, amelyet a határvonalaknak a Föld középpontjával való összekötése zár be","Helyes. A Föld geoid alakja miatt nem függőlegesen lefelé haladunk. A föld méhének kincsei polgári jogi értelemben állami tulajdonban vannak."],["Függőlegesen lefelé a határvonalak alatt","A geoid alak miatt ez nem lehetséges."],["Az 1000 méter mély rész","Nincs ilyen szabály."],["A földalatti vizek","Nem ez a meghatározás."]],0],[4,"T","II. Államterület","A lajstromjelzés (pl. magyar lajstromú gép) csak a nemzetközi térben bír jelentőséggel: egy magyar lajstromjelzésű gépre Budapesten felszállva nem kerülünk másik állam területére.",true,"Igaz. Ha a gép egy állam légterében van, az adott állam területén vagyunk; nemzetközi vizek felett a lajstromjelzés szerinti állam területére kerülünk. Ugyanez a hajókra is érvényes."],[4,"C","II. Államterület","Mi igaz a nagykövetségek területi státuszára?",[["A nagykövetség a fogadó állam területének része; a küldő állam engedélyével lehet ott tartózkodni, a fogadó állam hatóságai nem léphetnek be (diplomáciai mentesség, bécsi egyezmény)","Helyes. Mindszenty József ezért tudott az amerikai nagykövetségre menekülni."],["A nagykövetség a küldő állam területe","Ez a leggyakoribb tévedés."],["A nagykövetség semleges, senki területe","Nem így van."],["A nagykövetségen a fogadó állam jogszabályai az irányadók","A küldő állam joghatósága és jogszabályai az irányadók."]],0],[4,"R","II. Államterület","A budapesti amerikai nagykövetség Magyarország területének része.","A bécsi egyezmény szerinti diplomáciai mentesség miatt a fogadó állam hatóságai nem léphetnek be.","B","Igaz: a nagykövetség nem „fehér folt”, a fogadó állam területe.","Igaz: a mentesség tényleg létezik.","Mindkét állítás igaz, de nincs közöttük ok-okozati összefüggés abban az értelemben, hogy a mentesség nem azért van, mert a terület a küldő államé; a terület továbbra is a fogadó államé, a mentesség pedig külön jogcímen (bécsi egyezmény) érvényesül."],[4,"T","Schengen","A schengeni övezet az Európai Unió jogán alapul, ezért minden uniós tagállam automatikusan schengeni tag.",false,"Hamis. A schengeni együttműködés külön nemzetközi egyezményen alapul, a részes államok maguk döntenek a felvételről. Aki uniós tag lesz, nem kerül automatikusan az övezetbe; schengeni tag csak uniós tagállam lehet, de nem minden uniós tagállam schengeni tag."],[4,"C","Schengen","Mi igaz a schengeni együttműködésről?",[["Egy állam egyoldalúan felfüggesztheti egy másikkal szemben, és visszaállíthatja a határellenőrzést","Helyes. Az uniós jog kötelező ereje és a schengeni együttműködés felmondhatósága eltérő jogi természetből fakad."],["Egyoldalúan nem függeszthető fel","Felfüggeszthető."],["Az uniós tagság automatikusan jár vele","Nem jár automatikusan."],["Harmadik állam is csatlakozhat bármikor uniós tagság nélkül az EU jogán","Külön egyezmény alapján, a részes államok döntése szerint."]],0],[4,"C","III. A nép","Mi a különbség a magyar alkotmányjog szerinti nép, politikai nemzet és kulturális nemzet között?",[["Nép: a közhatalom forrása (B cikk); politikai nemzet: közjogi kötelékkel kapcsolódók, vagyis az állampolgárok (azonos a néppel); kulturális nemzet: nyelv, származás, identitás köt össze, állampolgárságtól függetlenül","Helyes."],["A nép és a kulturális nemzet azonos","A politikai nemzet azonos a néppel."],["A politikai nemzet a kulturális nemzet része","A két halmaz metszi egymást, de egyik sem része a másiknak."],["A kulturális nemzet csak az állampolgárokat jelenti","Az állampolgárságtól független."]],0],[4,"T","III. A nép","A politikai és a kulturális nemzet két egymásba ágyazott halmaz, a kulturális nemzet a politikai része.",false,"Hamis. Két metsző halmaz: a metszetben a magyar identitású magyar állampolgárok állnak. A népbe olyan állampolgárok is tartoznak, akik kulturális értelemben nem részei a nemzetnek, a kulturális nemzetbe pedig olyanok, akiknek nincs magyar állampolgárságuk."],[4,"C","III. A nép","Mi az államcél, és mi a példa rá?",[["Olyan alkotmányi rendelkezés, amely nem kikényszeríthető kötelezettséget keletkeztet; az állam „törekszik”, „vállal”, „támogat”, de nem teljesítése esetén sem lehet bírósághoz fordulni; pl. a határon túli magyarokért viselt felelősség vagy a megfelelő lakhatás","Helyes."],["Kikényszeríthető alanyi jog","Az államcél nem alanyi jog."],["Az állam kötelezettsége bírói úton kikényszeríthető","Ez az államcél ellentéte."],["A kormány programja","Nem ez az államcél."]],0],[4,"T","III. A nép","A megfelelő lakhatás államcél: ha kikényszeríthető alanyi jog volna, minden hajléktalan bíróságon perelhetne ingyenes állami lakást.",true,"Igaz. Ez az államcél tankönyvi indoklása: az állam az ilyen kötelezettséget nyilvánvalóan nem tudná teljesíteni."],[4,"C","III. A nép","Mit biztosít az 2001 óta hatályos státusztörvény?",[["A határon túli magyarság számára a magyar igazolvány igénylését, állampolgárságtól függetlenül; ez jogosít fel a kedvezményekre","Helyes."],["Automatikus magyar állampolgárságot a határon túli magyaroknak","Nem ezt biztosítja."],["Szavazati jogot az Országgyűlési választáson","A státusztörvény nem a választójogról szól."],["Letelepedési engedélyt","Nem ezt biztosítja."]],0],[4,"C","IV. Nemzetiségek","Mi a nemzetiség fogalma?",[["Az országban élő közösség, amelyet a többségi társadalomhoz képest számbeli kisebbségi helyzet, valamint saját nyelv, kultúra és hagyomány jellemez","Helyes."],["Minden külföldi állampolgár","A nemzetiségi jogok a más identitású magyar állampolgárokat illetik."],["Az ország minden vallási közössége","Nem erről van szó."],["A határon túli magyarok","Ők a kulturális nemzet részei."]],0],[4,"T","IV. Nemzetiségek","A Kecskeméten élő német állampolgár házaspárnak nemzetiségi jogok járnak.",false,"Hamis. A nemzetiségi jogok azokat a magyar állampolgárokat illetik meg, akik más identitással rendelkeznek, nem az itt élő külföldieket. A magyar állampolgár sváb származású személyeknek viszont járnak."],[4,"C","IV. Nemzetiségek","Melyek a nemzetiségi elismerés együttes feltételei?",[["Legalább százéves magyarországi honosság és saját nyelv, kultúra, hagyomány; az utóbbiról az MTA ad állásfoglalást, végül az Országgyűlés dönt","Helyes."],["Legalább 10 000 fő és saját település","Nincs ilyen feltétel."],["Állami nyelvvizsga és külföldi anyaállam","Nincs ilyen feltétel."],["Százéves honosság vagy saját nyelv (elegendő az egyik)","A két feltétel együttes."]],0],[4,"C","IV. Nemzetiségek","Miért nem nemzetiség a székelység?",[["A kezdeményezést azzal utasították el, hogy a betelepítést követően asszimilálódtak, hagyományaik a magyar kultúra részévé váltak, így a magyar társadalométól való különbözőség feltétele nem teljesül","Helyes. A székelyek a magyarság részei."],["Mert nem élnek Magyarországon","Nem ez az indok."],["Mert nem száz éve honosak","Nem ez az indok."],["Mert nincs saját nyelvük, és ez az MTA véleménye volt","Az indok az asszimiláció."]],0],[4,"C","IV. Nemzetiségek","Hány elismert nemzetiség van Magyarországon, és melyik NEM tartozik közéjük?",[["13 elismert nemzetiség; az orosz nem tartozik közéjük","Helyes. A listán: bolgár, görög, horvát, lengyel, német, örmény, roma, román, ruszin, szerb, szlovák, szlovén, ukrán."],["13 elismert nemzetiség; a roma ne
